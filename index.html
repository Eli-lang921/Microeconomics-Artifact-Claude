U2_LESSONS.push({ id:'l10', unit:2, title:'Income and Cross-Price Elasticity', mins:35, src:'Modern States video 2.2c and Module 2 slides 91-99 · Course textbook (OpenStax) §5.4',
  sources:['MS2','OS54','OS32','CB','CED','ELD'],
  oneline:'The same elasticity recipe works for income and for the prices of other goods. Here the sign is the answer: it tells normal goods from inferior ones and substitutes from complements.',
  body:`
<h2>Elasticity beyond price</h2>
<!-- src: OS54 ("Elasticity can be measured for any determinant of supply and demand, not just the price"; general pattern; Table 5.4); MS2 (video 2.2c: quantify responses to income and related-good prices) -->
<p>Lesson 9 measured how quantity responds to a good's own price. But Lesson 6 listed other things that move demand: income and the prices of related goods. Your course textbook: "Elasticity can be measured for any determinant of supply and demand, not just the price."</p>
<p>The recipe never changes: <b>percentage change in the thing that responds ÷ percentage change in the thing that caused it</b>, each computed with the midpoint method. This lesson applies it twice:</p>
<div class="terms">
${term(dt('income-elasticity','Income elasticity of demand'),'%Δ quantity demanded ÷ %Δ <b>income</b>')}
${term(dt('cross-price-elasticity','Cross-price elasticity of demand'),'%Δ quantity demanded of good A ÷ %Δ <b>price of good B</b>')}
</div>
<p><b>One big difference from Lesson 9:</b> the price elasticity of demand is always negative, so you dropped the sign. Here the sign can go either way, and <b>the sign is the answer</b>.</p>
<div data-check="l10c-general"></div>

<h2>Income elasticity of demand</h2>
<!-- src: MS2 (video 2.2c: Magic Hat $45,000 → $50,000, 5 → 9, 0.571 ÷ 0.105 = 5.43; positive normal, negative inferior; ">1 elastic"; slides 92-94); OS54 (definition; positive = normal, negative = inferior; hamburgers/steak, cheap wine; larger elasticity → larger shift); OS32 (luxury cars, vacations in Europe, fine jewelry; generic groceries); ELD (urban mass transit inferior) -->
<p>Your course asks: "by how much does quantity demanded respond to a change in income?" Lesson 6 showed the direction: more income raises demand for a ${dt('normal-good','normal good')} and lowers it for an ${dt('inferior-good','inferior good')}. The income elasticity puts a number on it.</p>
<p><b>Worked example: your course's Magic Hat beer.</b> A 23-year-old's income rises from $45,000 to $50,000, and he goes from 5 to 9 Magic Hats a month.</p>
<div class="math">%Δ quantity = (9 − 5) ÷ [(9 + 5) ÷ 2] = 4 ÷ 7 = 0.571 = 57.1%<br>%Δ income = (50,000 − 45,000) ÷ [(50,000 + 45,000) ÷ 2] = 5,000 ÷ 47,500 = 0.105 = 10.5%<br>Income elasticity = 0.5714 ÷ 0.1053 = <b>5.43</b> (dividing the rounded percents, 57.1 ÷ 10.5, gives 5.44)</div>
<p>Check: his beer purchases grew more than five times as fast as his income, so a number above 5 fits.</p>
${FIG.l10incshift()}
<p><b>Reading the result:</b></p>
<div class="tbl-wrap"><table class="wrap-cells"><thead><tr><th>Income elasticity</th><th>Meaning</th><th>Example</th></tr></thead><tbody>
<tr><td><b>Negative</b></td><td>Inferior good: buy less as income rises</td><td>Ramen, gas-station coffee (your course); urban mass transit (Econlib)</td></tr>
<tr><td><b>Between 0 and 1</b></td><td>Normal good; purchases grow more slowly than income (necessity-like)</td><td>Bread, electricity</td></tr>
<tr><td><b>Above 1</b></td><td>Normal good; purchases grow faster than income (luxury-like, "income elastic")</td><td>Magic Hat for this buyer (5.43); "luxury cars, vacations in Europe, and fine jewelry" (your course textbook)</td></tr>
</tbody></table></div>
${FIG.l10incline()}
<p><b>Why the sign works:</b> for a normal good, income and quantity move together (both changes positive, or both negative), so the ratio is positive. For an inferior good they move apart, so the ratio is negative. The size tells you how far demand shifts: your course textbook says "A higher income elasticity means a larger shift."</p>
<p class="small muted">Your course video calls an income elasticity above 1 "an elastic good." On exams, "elastic" alone usually means <b>price</b> elasticity, so think "income elastic" here.</p>
<div data-check="l10c-ied,l10c-ied2"></div>

<h2>Cross-price elasticity of demand</h2>
<!-- src: MS2 (video 2.2c: pretzels $4 → $3, beer 100 → 120; 0.182 ÷ −0.286 = −0.636; negative = complements, positive = substitutes; slides 95-98); OS54 (definition; coffee/tea substitutes positive, coffee/sugar complements negative; plane and train tickets; bread and peanut butter); CED (MKT-3.E.11 "substitutes, complements, or not related"). Source problem: the video gives the denominator as 0.287; the price fell, so it is −0.286. -->
<p>Cross-price elasticity measures how demand for good A responds to the price of a <b>different</b> good, B. Your course: in the denominator "we are using ... the change in the price of Good B, whereas in the numerator, we're still looking at the response in the quantity of Good A."</p>
<p><b>Worked example: your course's beer and pretzels.</b> Pretzels fall from $4 to $3, and beer purchases rise from 100 to 120.</p>
<div class="math">%Δ quantity of beer = (120 − 100) ÷ [(120 + 100) ÷ 2] = 20 ÷ 110 = +0.182<br>%Δ price of pretzels = (3 − 4) ÷ [(3 + 4) ÷ 2] = −1 ÷ 3.5 = −0.286<br>Cross-price elasticity = 0.182 ÷ (−0.286) = <b>−0.64</b></div>
<p>Check: a price cut (negative) paired with more beer (positive) has to give a negative number. (Your course video writes the price change as 0.287 without the minus sign; its final answer, −0.636, is right.)</p>
<p><b>Reading the sign:</b></p>
<div class="terms">
${term('Positive','<b>'+dt('substitutes','Substitutes')+'</b>: B gets pricier, so people switch to A. Coffee and tea (your course textbook).')}
${term('Negative','<b>'+dt('complements','Complements')+'</b>: B gets pricier, so people use less of both. Beer and pretzels (−0.64).')}
${term('About zero','<b>Unrelated</b>: B\'s price barely affects A. The AP framework uses cross-price elasticity "to determine whether goods are substitutes, complements, or not related."')}
</div>
${FIG.l10crossline()}
<p><b>Why the sign works:</b> for substitutes, B's price and A's quantity move the same way (pricier tea, more coffee), so the ratio is positive. For complements they move in opposite ways (cheaper pretzels, more beer), so it is negative.</p>
<div data-check="l10c-xed"></div>

<h2>Reading the signs</h2>
<!-- src: OS54; MS2; CED. Summary table of the three demand elasticities. -->
<p>Three elasticities of demand, three different rules for the sign:</p>
<div class="tbl-wrap"><table class="wrap-cells"><thead><tr><th>Elasticity</th><th>Bottom of the fraction</th><th>Sign tells you</th><th>Size tells you</th></tr></thead><tbody>
<tr><td>Price (Lesson 9)</td><td>The good's own price</td><td>Nothing (always negative)</td><td>Elastic (above 1) or inelastic (below 1)</td></tr>
<tr><td>Income</td><td>Income</td><td>Normal (+) or inferior (−)</td><td>For normal goods: luxury-like (above 1) or necessity-like (below 1)</td></tr>
<tr><td>Cross-price</td><td>Another good's price</td><td>Substitutes (+) or complements (−)</td><td>How closely the goods are related</td></tr>
</tbody></table></div>
<p>Try your course's two examples, then your own numbers:</p>
<div data-widget="xclass"></div>
<div data-check="l10c-sign"></div>

<h2>Name the relationship</h2>
<!-- src: OS54; MS2; ELD. Exam skill: from data or a story to normal, inferior, substitutes, complements or unrelated. -->
<p>CLEP questions often describe what happened ("when incomes rose 5%, purchases fell 2%") and ask what kind of good it is. First ask which variable changed (income or another good's price), then read the direction of the response.</p>
<div data-widget="relsort"></div>
<div data-check="l10c-skill"></div>

<h2>Common mistakes</h2>
<!-- Entries in order are M1-M6 (see L10TAGS mis). -->
<div class="mistakes"><p class="eyebrow">Watch out for these</p><ul>
<li><span class="wrong">"An inferior good is a low-quality good."</span>Inferior means people buy less of it as income rises. It is about the income response, not quality.</li>
<li><span class="wrong">"A negative cross-price elasticity means substitutes."</span>Negative means complements (used together). Substitutes have a positive cross-price elasticity.</li>
<li><span class="wrong">"In the cross-price elasticity of beer, the price on the bottom is beer's price."</span>It's the other good's price (pretzels). Beer's own price gives beer's price elasticity.</li>
<li><span class="wrong">"Any good with a positive income elasticity is a luxury."</span>Positive means normal. Only above 1 is luxury-like; between 0 and 1 is necessity-like.</li>
<li><span class="wrong">"Drop the sign, as with price elasticity of demand."</span>For income and cross-price elasticities, the sign is the answer: normal vs. inferior, substitutes vs. complements.</li>
<li><span class="wrong">"A cross-price elasticity near zero means complements."</span>Near zero means unrelated: one good's price doesn't affect the other.</li>
</ul></div>

<h2>Recap</h2>
<div class="callout">
<ol>
<li>Any elasticity is %Δ in the response ÷ %Δ in the cause; income and cross-price elasticities use the same midpoint method as Lesson 9.</li>
<li><b>Income elasticity</b> = %Δ quantity demanded ÷ %Δ income. Positive: <b>normal</b>; negative: <b>inferior</b>; above 1: purchases grow faster than income.</li>
<li><b>Cross-price elasticity</b> = %Δ quantity of A ÷ %Δ price of B. Positive: <b>substitutes</b>; negative: <b>complements</b>; near zero: unrelated.</li>
<li>Unlike price elasticity of demand, <b>keep the sign</b>: it carries the answer.</li>
<li>To classify from data, find what changed (income or another price) and whether quantity moved with it or against it.</li>
</ol>
<p><b>How the CLEP tests this:</b> the outline lists "Price, income, and cross-price elasticities of demand" under Supply and Demand (15% to 20% of the exam). Expect a number to classify ("an income elasticity of −0.5 indicates..."), a short calculation from percentage changes, and stories about related goods.</p>
</div>`,
  deeper:`
<h3>Elasticity in labor and savings markets</h3>
<p>Your course textbook (§5.4) applies the same recipe beyond goods. The <b>wage elasticity of labor supply</b> (%Δ hours worked ÷ %Δ wage) is thought to be fairly elastic for teenagers and fairly inelastic for adults in their thirties and forties. The <b>elasticity of savings</b> (%Δ savings ÷ %Δ interest rate) decides whether tax breaks for saving raise savings much; the textbook says the evidence is "controversial" and savings appear fairly inelastic in the short run. Unit 6 returns to labor markets.</p>
<h3>Goods can change category</h3>
<p>Whether a good is normal or inferior can depend on who is buying and how much they earn. Made-up illustration: a cheap brand could be a normal good for someone on a very tight budget whose income rises a little (they buy more of it), and an inferior good for someone who can now afford the brand they prefer (they buy less). Elasticities are estimates for a group of buyers over a range of incomes and prices.</p>`,
  links:[ {k:'Textbook',t:'5.4 Elasticity in Areas Other Than Price',s:'OpenStax, Principles of Microeconomics 3e (free online)',u:'https://openstax.org/books/principles-microeconomics-3e/pages/5-4-elasticity-in-areas-other-than-price',w:'The newer edition of your course textbook\'s §5.4: income, cross-price, labor and savings elasticities.'},
          {k:'Article',t:'Demand',s:'David R. Henderson, Econlib',u:'https://www.econlib.org/library/Enc/Demand.html',w:'Real examples of inferior goods, substitutes and complements.'} ]
});

mc('l11-cs-def','l11','<b>Consumer surplus</b> is which of the following?',
  [`The difference between what buyers are willing to pay and what they actually pay`,`The total amount buyers spend on a good`,`The extra goods left over when quantity supplied exceeds quantity demanded`,`The price buyers pay minus the seller\'s cost`,`The amount buyers save by not buying the good`],0,
  `<p>Your course: consumer surplus is "the difference between the willingness to pay and the actual price paid." Your course textbook: "The amount that individuals would have been willing to pay, minus the amount that they actually paid, is called consumer surplus."</p><p>The tempting "extra goods left over" is a <b>surplus</b> in the Lesson 7 sense (excess supply), a different idea that shares the word. "Price minus the seller's cost" is producer surplus.</p>`);
mc('l11-water','l11','At a hot summer concert, you would pay up to $5.00 for a bottle of water. The vendor charges $2.50. What is your consumer surplus?',
  [`$2.50`,`$5.00`,`$7.50`,`$0`,`$1.50`],0,
  `<p>Willingness to pay − price paid = $5.00 − $2.50 = <b>$2.50</b> (your course's example). That is the value you get beyond what you paid.</p><p>The tempting $5.00 is your willingness to pay, not the surplus; $7.50 adds instead of subtracting.</p>`);
gen('l11-g-cs','l11',()=>{
  const wtp=[pick([9,8.5,8]),pick([7,6.5]),pick([5.5,5]),pick([4,3.5]),pick([2.5,2])]; const p=pick([3,4.5,6]);
  const buy=wtp.filter(v=>v>=p), ans=round(buy.reduce((a,v)=>a+v-p,0),2);
  return { type:'num', kind:'num', prompt:`Made-up numbers. Five fans would each buy one concert T-shirt and are willing to pay at most:${table(['Fan','A','B','C','D','E'],[['Willingness to pay',...wtp.map(money)]])}The shirts sell for <b>${money(p)}</b>. What is the total consumer surplus?`,
    answer:ans, unit:'dollars',
    explain:`<p>Only fans willing to pay at least ${money(p)} buy: ${buy.map(money).join(', ')}. Each one's surplus is willingness to pay − ${money(p)}: ${buy.map(v=>money(v-p)).join(' + ')} = <b>${money(ans)}</b>.</p><p>The common slip is including fans whose willingness to pay is below the price. They don't buy, so they get no surplus (not a negative one).</p>` };
});
mc('l11-ps-def','l11','<b>Producer surplus</b> is which of the following?',
  [`The price a seller receives minus the lowest price the seller would have accepted`,`The seller\'s total revenue`,`The price buyers pay minus what they were willing to pay`,`The goods left unsold at the current price`,`The seller\'s profit after all costs, including past investments`],0,
  `<p>Your course: producer surplus is "the difference between the price that the firm actually receives and the price that they are willing to accept to cover their costs." Your course textbook: "The amount that a seller is paid for a good minus the seller's actual cost."</p><p>The tempting "total revenue" counts the whole price, ignoring what it cost the seller to provide the good.</p>`);
mc('l11-vendors','l11','Your course\'s three water vendors will sell a bottle for no less than $3.00 (A), $2.75 (B) and $2.00 (C). If the price is $3.50, what is the total producer surplus?',
  [`$2.75`,`$0.25`,`$1.50`,`$3.50`,`$10.50`],0,
  `<p>All three sell at $3.50. Producer surplus: A $3.50 − $3.00 = $0.50; B $3.50 − $2.75 = $0.75; C $3.50 − $2.00 = $1.50. Total: <b>$2.75</b>.</p><p>Tempting wrong answers: $0.25 is C's surplus at the lower price of $2.25; $1.50 counts only vendor C; $10.50 is total revenue (3 × $3.50).</p>`);
tf('l11-tf-paid','l11','Consumer surplus is the amount buyers actually pay for a good.',false,
  `<p>False. What buyers pay is their spending. Consumer surplus is the <b>extra</b> value they get beyond what they paid: willingness to pay minus price. A buyer who would pay $5 and pays $2.50 spends $2.50 and gets $2.50 of surplus.</p>`);
lazy('l11-gr-areas','l11',()=>({ type:'mc', kind:'graph',
  prompt:`The market is in equilibrium at E.${sdg({xmax:10,ymax:10,xt:[0,5,10],yt:[0,5,10],areas:[{pts:[[0,10],[0,5],[5,5]],c:'var(--accent-soft)',label:[1.6,6.4,'A']},{pts:[[0,5],[0,0],[5,5]],c:'var(--surface-2)',label:[1.6,3.4,'B']}],lines:[{a:[0,10],b:[10,0],label:'D'},{a:[0,0],b:[10,10],label:'S',c:'var(--g1)',lx:-6,ly:14,anchor:'end'}],hl:[{p:5,label:'P*',c:'var(--muted)'}],dots:[{q:5,p:5,label:'E'}]})}Which area is consumer surplus?`,
  options:[`Area A`,`Area B`,`Areas A and B together`,`The area below the supply curve`,`The rectangle under the price line`], answer:0,
  explain:`<p>Consumer surplus is the area <b>below the demand curve and above the price</b> (your course), out to the quantity bought: area A. Each slice is a buyer whose willingness to pay (the demand curve) is above P*.</p><p>Area B is producer surplus (above the supply curve, below the price). A and B together are total surplus. The rectangle under the price line is what buyers spend.</p>` }));
mc('l11-total','l11','Your course says <b>total surplus</b> equals "the value to buyers minus the cost to sellers." Why does the price drop out?',
  [`The price is part of consumer surplus with a minus sign and part of producer surplus with a plus sign, so it cancels`,`Because the price is always zero in equilibrium`,`Because sellers keep the whole price as profit`,`Because total surplus only counts buyers`,`Because the price equals the cost at equilibrium`],0,
  `<p>Consumer surplus = willingness to pay − price. Producer surplus = price − seller's cost. Add them: willingness to pay − price + price − cost = <b>willingness to pay − cost</b>. The price is just a transfer from buyer to seller; it doesn't create or destroy value.</p><p>The tempting "price equals cost at equilibrium" is wrong: most sellers at equilibrium have costs below the price, which is why they have producer surplus.</p>`);
gen('l11-g-triangle','l11',()=>{
  const a=pick([10,12,15,20]), pe=pick([4,5,6]), qe=pick([20,30,40,50]); const ans=0.5*qe*(a-pe);
  return { type:'num', kind:'num', prompt:`Made-up numbers. A straight-line demand curve starts at a price of ${money(a)} (where quantity demanded is zero). The market is in equilibrium at a price of ${money(pe)} and a quantity of ${qe}. What is the consumer surplus?`,
    answer:ans, unit:'dollars',
    explain:`<p>Consumer surplus is the triangle below the demand curve and above the price. Its base is the quantity (${qe}) and its height is the gap between where demand starts and the price: ${money(a)} − ${money(pe)} = ${money(a-pe)}.</p><p>Area = ½ × base × height = ½ × ${qe} × ${money(a-pe)} = <b>${money(ans)}</b>. The common slip is forgetting the ½: base × height gives a rectangle, twice the triangle.</p>` };
});
mc('l11-efficient','l11','Why do economists say a competitive market at equilibrium is <b>efficient</b>?',
  [`Total surplus is as large as possible: every unit worth more to a buyer than it costs a seller is traded, and no unit worth less is`,`Buyers pay the lowest possible price`,`Sellers earn the highest possible price`,`Every buyer who wants the good gets it`,`Consumer surplus and producer surplus are each as large as possible`],0,
  `<p>Your course textbook: "Social surplus is larger at equilibrium quantity and price than it would be at any other quantity. This demonstrates the economic efficiency of the market equilibrium." Goods go to the buyers who value them most and are made by the sellers with the lowest costs.</p><p>The tempting last choice repeats a claim in your course video and slides ("maximizes both consumer and producer surplus"). It's the <b>sum</b> that is maximized; a lower price would give buyers more surplus and sellers less.</p>`);
tf('l11-tf-each','l11','At equilibrium, consumer surplus and producer surplus are each as large as they could possibly be.',false,
  `<p>False. Equilibrium maximizes <b>total</b> surplus. A binding price ceiling can raise consumer surplus (by moving surplus from sellers to buyers) and a floor can raise producer surplus, but both shrink the total. Your course textbook: "at the efficient level of output, it is impossible to produce greater consumer surplus without reducing producer surplus." (Your course's slides say equilibrium maximizes both; the slide that sums up the lesson says "maximized total surplus," which is the accurate version.)</p>`);
mc('l11-beyond','l11','Suppose a market produced <b>more</b> than the equilibrium quantity. What would happen to total surplus, and why?',
  [`It would fall, because the extra units cost sellers more to make than they are worth to buyers`,`It would rise, because more goods are always better`,`It would stay the same, because the extra units are free`,`It would rise, because consumer surplus grows`,`It would fall, because the price would be too high`],0,
  `<p>Beyond the equilibrium quantity, the supply curve (sellers' cost) is above the demand curve (buyers' value). Each extra unit uses up more in cost than it gives in value, so it subtracts from total surplus.</p><p>The tempting "more goods are always better" ignores cost. Resources used on a unit worth $2 that costs $3 to make could have produced something worth more elsewhere.</p>`);
/* L11 more */
mc('l11-wtp','l11','According to your course textbook, the demand curve can be read as which of the following?',
  [`Buyers\' willingness to pay for each unit`,`Sellers\' costs of each unit`,`The price set by the government`,`Total revenue at each price`,`The quantity supplied at each price`],0,
  `<p>Your course textbook: "the demand curve traces consumers' willingness to pay for different quantities." The height of the demand curve at each quantity is the most someone would pay for that unit, which is why the area between it and the price measures consumer surplus.</p><p>The tempting "sellers' costs" describes the supply curve.</p>`);
mc('l11-price-fall','l11','The price of a bottle of water at the concert falls from $2.50 to $1.50. What happens to consumer surplus?',
  [`It rises: existing buyers pay less, and new buyers who value water at $1.50 to $2.50 now buy`,`It falls, because sellers receive less`,`It stays the same, because the water is the same`,`It rises only for new buyers`,`It falls, because more people now buy`],0,
  `<p>Your course: the new consumer surplus includes "the gain in consumer surplus from the people that were already in the market ... plus the gain in consumer surplus for our new consumers." The $5 buyer's surplus rises from $2.50 to $3.50, and the $2 buyer, who didn't buy before, now gets $0.50.</p><p>The tempting "it falls, because sellers receive less" describes producer surplus.</p>`);
mc('l11-tablets','l11','In your course textbook\'s tablet market, the equilibrium price is $80. Point J on the demand curve shows that buyers of the first 20 million tablets would have paid $90. For a buyer who would have paid $90, what is the consumer surplus on a tablet?',
  [`$10`,`$80`,`$90`,`$170`,`$45`],0,
  `<p>$90 − $80 = <b>$10</b>. The textbook: these consumers "received a benefit beyond what they had to pay for."</p><p>$80 is what they pay and $90 is what they'd pay; the surplus is the gap.</p>`);
mc('l11-ps-rise','l11','When the price of water rises from $2.25 to $3.50, what happens to producer surplus in your course\'s vendor example?',
  [`It rises: vendor C gains more per bottle, and vendors A and B start selling`,`It falls, because buyers pay more`,`It stays at $0.25`,`It rises only for vendor C`,`It falls, because some buyers stop buying`],0,
  `<p>At $2.25 only C sells, with $0.25 of surplus. At $3.50 C's surplus grows to $1.50, and A ($0.50) and B ($0.75) join: total $2.75. Your course: producer surplus is "the gain for firms from receiving a price higher than the minimum that they're willing to accept."</p>`);
tf('l11-tf-ps-revenue','l11','Producer surplus is the same as a seller\'s revenue.',false,
  `<p>False. Revenue is the whole price times quantity. Producer surplus subtracts what the seller needed to cover costs: price − the lowest price the seller would accept. Vendor C sells at $2.25 for revenue of $2.25 but producer surplus of only $0.25.</p>`);
gen('l11-g-ps','l11',()=>{
  const cost=[pick([1,1.5]),pick([2,2.5]),pick([3,3.5]),pick([4.5,5]),pick([6,6.5])]; const p=pick([3,4,5.5]);
  const sell=cost.filter(c=>c<=p), ans=round(sell.reduce((a,c)=>a+p-c,0),2);
  return { type:'num', kind:'num', prompt:`Made-up numbers. Five bakers would each sell one cake for no less than:${table(['Baker','A','B','C','D','E'],[['Lowest acceptable price',...cost.map(money)]])}Cakes sell for <b>${money(p)}</b>. What is the total producer surplus?`,
    answer:ans, unit:'dollars',
    explain:`<p>Only bakers whose lowest acceptable price is at or below ${money(p)} sell: ${sell.map(money).join(', ')}. Each gets ${money(p)} − their minimum: ${sell.map(c=>money(p-c)).join(' + ')} = <b>${money(ans)}</b>.</p><p>The common slip is adding up the prices received (revenue) instead of the gaps.</p>` };
});

  prompt:`The market is in equilibrium at E.${sdg({xmax:10,ymax:10,xt:[0,6,10],yt:[0,4,10],areas:[{pts:[[0,10],[0,4],[6,4]],c:'var(--accent-soft)',label:[1.8,5.6,'X']},{pts:[[0,4],[0,1],[6,4]],c:'var(--surface-2)',label:[1.6,3.0,'Y']},{pts:[[6,4],[10,0],[10,6]],c:'var(--bad-soft)',label:[8.6,3.4,'Z']}],lines:[{a:[0,10],b:[10,0],label:'D'},{a:[0,1],b:[10,6],label:'S',c:'var(--g1)',lx:-6,ly:14,anchor:'end'}],hl:[{p:4,c:'var(--muted)'}],dots:[{q:6,p:4,label:'E'}]})}Which area is producer surplus?`,

mc('l11-who','l11','At the market equilibrium, which buyers and sellers end up trading, according to your course?',
  [`The buyers who value the good most and the sellers who can produce it at the lowest cost`,`The buyers who arrive first and the sellers with the most stock`,`Every buyer and every seller in the market`,`The buyers with the lowest willingness to pay`,`The sellers with the highest costs`],0,
  `<p>Your course's slide: goods are allocated to "buyers who value them most highly, as measured by their willingness to pay" and to "sellers who can produce them at the lowest cost." Buyers whose willingness to pay is below the price stay out, and so do sellers whose cost is above it.</p><p>That sorting is why total surplus is maximized: the most valuable uses are matched with the cheapest production.</p>`);
tf('l11-tf-words','l11','Consumer surplus means the same thing as a surplus in the market.',false,
  `<p>False. A <b>surplus</b> (Lesson 7) is excess supply: quantity supplied exceeds quantity demanded at the current price. <b>Consumer surplus</b> is the extra value buyers get beyond the price they pay. A market at equilibrium has no surplus but plenty of consumer surplus.</p>`);

mc('l11-ceiling','l11','A binding price ceiling lowers the price of a drug from $600 to $400, and the quantity sold falls from 20,000 to 15,000 (your course textbook\'s example). Which of the following is true?',
  [`Some surplus moves from producers to consumers, but total surplus falls`,`Consumer surplus and total surplus both rise`,`Producer surplus rises because fewer units are sold`,`Total surplus stays the same; it is only redistributed`,`Neither consumers nor producers are affected`],0,
  `<p>The textbook: "the price ceiling transfers the area of surplus (V) from producers to consumers," and "the total surplus of society is reduced," because 5,000 doses that buyers valued above their cost are no longer made. So consumer surplus can rise while total surplus falls, which is why equilibrium maximizes the <b>total</b>, not each part (Lesson 12 names the loss).</p><p>The tempting "only redistributed" misses the lost trades.</p>`);
mc('l11-short','l11','A market produces <b>less</b> than the equilibrium quantity. What happens to total surplus?',

  `<p>Up to the equilibrium quantity, each unit's value to a buyer (the demand curve) is above its cost to a seller (the supply curve). Leaving some of those units unmade throws away their surplus. Your course textbook calls total surplus "larger at equilibrium quantity ... than it would be at any other quantity," lower or higher.</p>`);
mc('l11-welfare','l11','<b>Welfare economics</b>, as your course uses the term, studies which of the following?',
  [`How the allocation of resources and market outcomes affect economic well-being`,`Government programs for low-income families`,`How firms maximize profit`,`How prices are set by the government`,`The welfare of workers in factories`],0,
  `<p>Your course's slide: welfare economics looks at "how the allocation of resources and market outcomes affect economic well-being," using consumer surplus, producer surplus and total surplus.</p><p>The tempting "government programs for low-income families" is the everyday meaning of "welfare." In economics the word means well-being.</p>`);

mc('l11-vendor-who','l11','Your course\'s water vendors accept no less than $3.00 (A), $2.75 (B) and $2.00 (C). If the price is $2.25, which of the following is true?',

mc('l11c-cs2','l11','On a supply and demand graph, consumer surplus is the area between which of the following?',

mc('l11c-total','l11','A buyer values a used bike at $150. The seller would part with it for $90. They agree on $120. What is the total surplus from the trade, and how is it split?',

mc('l11c-eff','l11','A market\'s equilibrium quantity is 500 units. Why would producing a 501st unit lower total surplus?',

mc('l11c-skill','l11','On a standard supply and demand graph in equilibrium, which area is <b>neither</b> consumer nor producer surplus?',

U2_LESSONS.push({ id:'l11', unit:2, title:'Consumer and Producer Surplus', mins:40, src:'Modern States video 2.3 and Module 2 slides 100-114 · Course textbook (OpenStax) §3.5',
  sources:['MS2','OS35','CB','CED'],
  oneline:'Buyers gain when they pay less than they would have; sellers gain when they get more than they needed. At equilibrium the total of those gains is as large as it can be, which is what economists mean by an efficient market.',
  body:`
<h2>Welfare economics and willingness to pay</h2>
<!-- src: MS2 (video 2.3: welfare economics, maximum price; slides 101-103); OS35 (demand curve traces willingness to pay; efficiency definition) -->
<p>Lessons 6 to 10 described <b>what</b> markets do. This lesson asks whether the result is <b>good</b> for the people in it. Your course calls this ${dt('welfare-economics','<b>welfare economics</b>')}: "how the allocation of resources and market outcomes affect economic well-being." Welfare here means well-being, not government aid.</p>
<p>It starts with an idea from Lesson 6: every buyer has a maximum price. That maximum is the buyer's ${dt('willingness-to-pay','<b>willingness to pay</b>')}. Your course textbook: "the demand curve traces consumers' willingness to pay for different quantities." The height of the demand curve at each unit is what someone would pay for it.</p>
<div class="analogy"><div class="eyebrow">Analogy</div><p>You walk into a store ready to pay $40 for a jacket and find it on the rack for $25. That little thrill of a good deal is the feeling this lesson measures: $15 you were willing to give up but didn't have to. Sellers feel the same when a buyer pays more than they needed.</p></div>
<div data-check="l11c-wtp"></div>

<h2>Consumer surplus</h2>
<!-- src: MS2 (video 2.3: water $2.50; max $5 → $2.50; max $2 → no; price $1.50 → $3.50 and $0.50; area below D above price; slides 104-105); OS35 (definition, tablets $80, J $90). Source problem: slide 105 shows $1 for the $2 buyer at $1.50; the video's $0.50 is correct. -->
<p>${dt('consumer-surplus','<b>Consumer surplus</b>')} is willingness to pay minus the price actually paid. On a graph, it is the area <b>below the demand curve and above the price</b>, out to the quantity bought.</p>
<p><b>Worked example: your course's water at a summer concert.</b> It's hot, you've been there all day, and a bottle costs $2.50.</p>
<div class="math">Fan willing to pay $5.00: buys; consumer surplus = $5.00 − $2.50 = <b>$2.50</b><br>Fan willing to pay $2.00: $2.00 &lt; $2.50, so doesn't buy; consumer surplus = $0</div>
<p>Now the price falls to $1.50:</p>
<div class="math">$5.00 fan: $5.00 − $1.50 = <b>$3.50</b> (up $1.00)<br>$2.00 fan: now buys; $2.00 − $1.50 = <b>$0.50</b></div>
${FIG.l11water()}
<p>Check: both changes point the same way. A lower price raises consumer surplus for buyers already in the market and brings in new buyers who now gain something. (Your course's slide shows $1 for the second fan; the video's $0.50 is right.)</p>
<p><b>Math refresher: triangle areas.</b> With a straight-line demand curve, consumer surplus is a triangle: area = ½ × base × height. <b>Made-up numbers:</b> demand starts at $10, the price is $6 and 40 units are bought. Base 40, height $10 − $6 = $4:</p>
<div class="math">Consumer surplus = ½ × 40 × $4 = <b>$80</b></div>
${FIG.l11triangle()}
<div data-check="l11c-cs,l11c-cs2"></div>

<h2>Producer surplus</h2>
<!-- src: MS2 (video 2.3: vendors A $3.00, B $2.75, C $2.00; price $2.25 → C $0.25; $3.50 → $0.50, $0.75, $1.50; area below price above supply; slides 106-110); OS35 (definition, point K $45) -->
<p>${dt('producer-surplus','<b>Producer surplus</b>')} is the price a seller receives minus the lowest price it would accept, which reflects its cost. On a graph, it is the area <b>above the supply curve and below the price</b>, out to the quantity sold.</p>
<p><b>Worked example: your course's three water vendors.</b></p>
${table(['Vendor','A','B','C'],[['Lowest price accepted','$3.00','$2.75','$2.00'],['Producer surplus at $2.25','does not sell','does not sell','$0.25'],['Producer surplus at $3.50','$0.50','$0.75','$1.50']])}
<div class="math">At $2.25: only C sells → total producer surplus = <b>$0.25</b><br>At $3.50: $0.50 + $0.75 + $1.50 = <b>$2.75</b></div>
${FIG.l11vendors()}
<p>Check: a higher price raises producer surplus two ways, just as a lower price raised consumer surplus: C gains more per bottle, and A and B, who couldn't cover costs at $2.25, now sell.</p>
<p>Notice what producer surplus is <b>not</b>: it isn't revenue. C's revenue at $2.25 is $2.25, but its surplus is only $0.25, because $2.00 of that was needed to cover costs.</p>
<div data-check="l11c-ps"></div>

<h2>Total surplus</h2>
<!-- src: MS2 (video 2.3: total surplus = CS + PS = value to buyers − cost to sellers, derivation; slide 111); OS35 (social surplus F + G, also economic or total surplus) -->
<p>${dt('total-surplus','<b>Total surplus</b>')} (your course textbook also calls it social or economic surplus) adds the two:</p>
<div class="math">Total surplus = consumer surplus + producer surplus<br>= (willingness to pay − price) + (price − seller's cost)<br>= <b>value to buyers − cost to sellers</b></div>
<p><b>Why the price drops out:</b> every dollar the buyer pays is a dollar the seller receives. The price decides how the gains are <b>split</b>, not how big they are. The gains themselves come from moving a good from someone who values it less (the seller, who'd part with it for its cost) to someone who values it more.</p>
<p>Try it with a small concert market. Buyers' values include your course's $5 and $2 fans and sellers' minimums include its vendors C, B and A; the other buyers and sellers are made-up. Move the price, then try selling a fourth bottle:</p>
<div data-widget="surplus"></div>
<p>Notice: total surplus is largest, $4.75, when exactly 3 bottles change hands, which happens at any price from $3.00 to $3.50. Within that range the price only moves surplus between buyers and sellers. At your course's $2.50, only one vendor will sell, so the ${dt('shortage','shortage')} lowers total surplus; forcing a fourth sale shrinks it too.</p>
<div data-check="l11c-total"></div>

<h2>Why equilibrium is efficient</h2>
<!-- src: MS2 (video 2.3 and slides 112-114: buyers who value most, sellers with lowest cost; "maximized total surplus"); OS35 ("Social surplus is larger at equilibrium quantity and price than it would be at any other quantity"; "impossible to produce greater consumer surplus without reducing producer surplus"; price controls transfer surplus); CED (MKT-4.A.5 "maximizes total economic surplus in the absence of market failures"). Source problem: video 2.3 and slide 112 say equilibrium maximizes both consumer and producer surplus; only the total is maximized. -->
<p>Your course textbook: "Social surplus is larger at equilibrium quantity and price than it would be at any other quantity. This demonstrates the economic efficiency of the market equilibrium."</p>
<p><b>The mechanism, unit by unit.</b></p>
<ul><li><b>Up to the ${dt('equilibrium','equilibrium')} quantity</b>, the ${dt('demand-curve','demand curve')} is above the supply curve: each unit is worth more to some buyer than it costs some seller. Trading it adds surplus. Your course: goods go to "buyers who value them most highly" and come from "sellers who can produce them at the lowest cost."</li>
<li><b>Beyond the equilibrium quantity</b>, the supply curve is above the demand curve: each extra unit costs more to make than anyone values it. Producing it would <b>subtract</b> from total surplus.</li></ul>
${FIG.l11efficient()}
<p>So the equilibrium quantity is exactly where adding units stops paying. This is Lesson 5's marginal rule, MB ≥ MC, applied to a whole market: the demand curve is the marginal benefit, the supply curve the marginal cost.</p>
<p class="small muted"><b>A correction to your course.</b> Slide 112 says equilibrium "maximizes both consumer and producer surplus," and the video says "we are maximizing consumer surplus and we are maximizing the area of producer surplus." Only the <b>total</b> is maximized. A ${dt('price-ceiling','price ceiling')} below equilibrium could hand buyers more surplus and a ${dt('price-floor','price floor')} above it could hand sellers more, but both would shrink the total. Your course textbook: "at the efficient level of output, it is impossible to produce greater consumer surplus without reducing producer surplus." The AP framework puts it the same way: equilibrium "maximizes total economic surplus in the absence of market failures." (Your course's own summary slide says "maximized total surplus," which is the accurate version.)</p>
<p>"In the absence of market failures" matters: Unit 7 covers cases, like pollution, where the market's equilibrium isn't efficient.</p>
<div data-check="l11c-eff"></div>

<h2>Read the surplus areas</h2>
<!-- src: MS2; OS35. Exam skill: identifying consumer surplus, producer surplus and total surplus on a graph. -->
<p>CLEP graph questions label areas with letters and ask which is which. Anchor on the price line: consumer surplus sits above it (up to demand), producer surplus below it (down to supply), and only to the <b>left</b> of the quantity actually traded.</p>
<div data-widget="areas"></div>
<div data-check="l11c-skill"></div>

<h2>Common mistakes</h2>
<!-- Entries in order are M1-M6 (see L11TAGS mis). -->
<div class="mistakes"><p class="eyebrow">Watch out for these</p><ul>
<li><span class="wrong">"Consumer surplus is what buyers pay."</span>What buyers pay is spending. Consumer surplus is the extra value beyond it: willingness to pay minus price.</li>
<li><span class="wrong">"Equilibrium gives buyers and sellers each their largest possible surplus."</span>Equilibrium maximizes the total. A different price could raise one side's surplus, but only by shrinking the other side's more.</li>
<li><span class="wrong">"Producer surplus is the seller's revenue."</span>It's the price minus the lowest price the seller would accept (its cost). Vendor C at $2.25 has $0.25 of surplus, not $2.25.</li>
<li><span class="wrong">"A lower price lowers consumer surplus."</span>It raises it: current buyers pay less, and new buyers join. It lowers producer surplus.</li>
<li><span class="wrong">"Producing more is always better."</span>Beyond the equilibrium quantity, extra units cost more than they're worth, so total surplus falls.</li>
<li><span class="wrong">"Consumer surplus is the same as a surplus in the market."</span>A market surplus is unsold goods (Lesson 7). Consumer surplus is buyers' gain from trading.</li>
</ul></div>

<h2>Recap</h2>
<div class="callout">
<ol>
<li>Welfare economics measures well-being with surplus. The demand curve shows buyers' <b>willingness to pay</b>.</li>
<li><b>Consumer surplus</b> = willingness to pay − price: the area below demand and above the price. A lower price raises it.</li>
<li><b>Producer surplus</b> = price − the lowest acceptable price: the area above supply and below the price. A higher price raises it.</li>
<li><b>Total surplus</b> = value to buyers − cost to sellers; the price only splits it.</li>
<li>At equilibrium, total surplus is as large as possible: every unit worth more than it costs is traded and none worth less. That is ${dt('efficiency','<b>efficiency</b>')}, and it's the total, not each part, that is maximized.</li>
<li>On graphs, find the price line and the traded quantity, then read consumer surplus above the price and producer surplus below it.</li>
</ol>
<p><b>How the CLEP tests this:</b> the outline lists "Consumer surplus, producer surplus, and market efficiency" under Supply and Demand (15% to 20% of the exam). Expect graphs with lettered areas, short calculations from willingness-to-pay tables, and questions on why equilibrium is efficient.</p>
</div>`,
  deeper:`
<h3>Efficiency is not fairness</h3>
<p>Your course textbook defines efficiency as a situation where "it is impossible to improve the situation of one party without imposing a cost on another." That is a statement about the size of the total, not about who gets it. A market can be efficient while some people can't afford what they need, which is why Unit 7 discusses income distribution separately. Efficiency and fairness are different questions, and people weigh them differently.</p>
<h3>Demand and supply as a social mechanism</h3>
<p>The textbook's example: when frost hits Brazil's coffee crop, the price rises; "some people ... continue to drink coffee and pay the higher price. Others switch to tea." No commission decides who drinks coffee. The surplus framework explains why that outcome uses the remaining coffee where it is valued most.</p>`,
  links:[ {k:'Textbook',t:'3.5 Demand, Supply, and Efficiency',s:'OpenStax, Principles of Microeconomics 3e (free online)',u:'https://openstax.org/books/principles-microeconomics-3e/pages/3-5-demand-supply-and-efficiency',w:'The newer edition of your course textbook\'s §3.5: surplus, efficiency and why price controls lose surplus.'},
          {k:'Video',t:'Consumer Surplus',s:'Marginal Revolution University',u:'https://learn.mru.org/lessons/consumer-surplus',w:'A short video explanation of consumer surplus and the demand curve as willingness to pay.'} ]
});

/* ===== Lesson 12: Taxes: Incidence and Deadweight Loss (Modern States video 2.4) =====
   Common mistakes: M1 whoever writes the check bears the tax · M2 a tax is always split equally
   M3 tax revenue is the deadweight loss · M4 the more inelastic side pays less · M5 a tax hurts only buyers
   M6 a price ceiling or floor that helps one side has no deadweight loss */
mc('l12-wedge','l12','A $1 tax per unit is placed on a market. Which of the following describes the <b>tax wedge</b>?',
  [`The price buyers pay minus the price sellers keep, which equals the $1 tax`,`The $1 added to the equilibrium price, all paid by buyers`,`The drop in quantity caused by the tax`,`The tax revenue the government collects`,`The difference between the old and new equilibrium price`],0,
  `<p>Your course: "the tax creates a wedge between the price paid by the buyer and the price received by the seller." Tax = P<sub>B</sub> − P<sub>S</sub>. The buyer's price rises above the old equilibrium and the seller's falls below it.</p><p>The tempting "all paid by buyers" assumes the price rises by the full tax. Usually it rises by only part of it.</p>`);
mc('l12-socks','l12','In your course\'s sock market, the equilibrium is $5 a pair and 300 pairs. A $1 tax is placed on sellers, and quantity falls to 200. Your course splits the burden equally. What do buyers pay and sellers keep per pair?',
  [`Buyers pay $5.50; sellers keep $4.50`,`Buyers pay $6.00; sellers keep $5.00`,`Buyers pay $5.00; sellers keep $4.00`,`Buyers pay $5.50; sellers keep $5.50`,`Buyers pay $6.00; sellers keep $4.00`],0,
  `<p>The wedge is $1: P<sub>B</sub> − P<sub>S</sub> = $5.50 − $4.50. Buyers pay $0.50 more than $5 and sellers keep $0.50 less. (An equal split happens when demand and supply are equally elastic; that's an assumption of this example, not a rule.)</p><p>The tempting "$6.00 / $5.00" assumes sellers pass the whole tax on; "$5.00 / $4.00" assumes sellers absorb it all because the tax is "on sellers."</p>`);
mc('l12-rev','l12','In your course\'s sock example ($1 tax; quantity falls from 300 to 200), how much tax revenue does the government collect?',
  [`$200`,`$300`,`$100`,`$1,100`,`$50`],0,
  `<p>Tax revenue = tax × quantity sold <b>with</b> the tax = $1 × 200 = <b>$200</b> (your course).</p><p>Tempting wrong answers: $300 uses the old quantity, which no longer sells; $100 is the drop in quantity; $1,100 is what buyers spend ($5.50 × 200); $50 is the deadweight loss in this lesson's made-up curves.</p>`);
tf('l12-tf-who','l12','If a tax is collected from sellers, sellers bear the whole burden of the tax.',false,
  `<p>False. Your course: "it doesn't matter who pays the tax, the buyer or the seller ... they will both share the burden." Sellers who hand $1 to the government raise their price, so part of the tax lands on buyers. How much depends on elasticity, not on who writes the check.</p>`);
gen('l12-g-burden','l12',()=>{
  const pe=pick([4,5,8,10]), t=pick([1,2,3]), bs=pick([0.25,0.5,0.75]); const pb=round(pe+t*bs,2), ps=round(pb-t,2);
  return { type:'num', kind:'num', prompt:`Made-up numbers. Before a tax, the equilibrium price is ${money(pe)}. After a ${money(t)} per-unit tax, buyers pay ${money(pb)} and sellers keep ${money(ps)}. How much of the tax, per unit, do <b>sellers</b> bear?`,
    answer:round(pe-ps,2), unit:'dollars',
    explain:`<p>Sellers' burden = old price − price they keep = ${money(pe)} − ${money(ps)} = <b>${money(pe-ps)}</b>. Buyers' burden = ${money(pb)} − ${money(pe)} = ${money(pb-pe)}. Check: ${money(pe-ps)} + ${money(pb-pe)} = ${money(t)}, the whole tax.</p><p>The common slip is answering ${money(t)} because the tax is "on sellers," or using the buyers' price instead of the old equilibrium price.</p>` };
});
mc('l12-inelastic','l12','Demand for a good is much more <b>inelastic</b> than supply. A per-unit tax is imposed. Who bears more of the tax?',
  [`Buyers, because they keep buying even at a higher price`,`Sellers, because they must send the tax to the government`,`Sellers, because inelastic demand means buyers refuse to pay more`,`They always split it equally`,`Neither; the government bears it`],0,
  `<p>Your course textbook: "If demand is more inelastic than supply, consumers bear most of the tax burden." Buyers who can't easily cut back can't escape the higher price, so sellers can pass most of the tax on. The textbook: "the tax burden falls on the most inelastic side of the market."</p><p>The tempting third choice flips the meaning of inelastic: inelastic buyers are the ones who <b>don't</b> respond much to a higher price.</p>`);
tf('l12-tf-equal','l12','A tax is always shared equally between buyers and sellers.',false,
  `<p>False. Your course's video says the tax "will be equally levied on both," and its sock example splits it 50/50, but later the same video explains that "the tax burden is going to depend on the elasticity." An equal split happens only when demand and supply are equally elastic. The more inelastic side bears more.</p>`);
mc('l12-dwl-def','l12','Which of the following is <b>deadweight loss</b>?',
  [`The total surplus lost because a market trades less than the efficient quantity`,`The tax revenue the government collects`,`The consumer surplus buyers lose from paying a higher price`,`The goods left unsold after a tax`,`The tax burden that falls on sellers`],0,
  `<p>Your course: deadweight loss is "the loss in surplus to society when there's a distortion in the market." Your course textbook: "The loss in social surplus that occurs when the economy produces at an inefficient quantity." It's the surplus from trades that would have happened but no longer do.</p><p>The tempting "tax revenue" is surplus moved to the government, not lost. Lost consumer surplus is partly revenue and partly deadweight loss.</p>`);
gen('l12-g-dwl','l12',()=>{
  const qe=pick([100,300,500]), drop=pick([20,40,50,100].filter(d=>d<qe)), t=pick([1,2,4]); const ans=0.5*t*drop;
  return { type:'num', kind:'num', prompt:`Made-up numbers, straight-line demand and supply. A ${money(t)} per-unit tax reduces the quantity sold from ${qe} to ${qe-drop}. What is the deadweight loss?`,
    answer:ans, unit:'dollars',
    explain:`<p>Deadweight loss is the triangle between the curves from the new quantity to the old one. Base: the lost units, ${qe} − ${qe-drop} = ${drop}. Height: the tax wedge, ${money(t)}.</p><p>DWL = ½ × ${drop} × ${money(t)} = <b>${money(ans)}</b>. The common slips: forgetting the ½ (${money(2*ans)}), or multiplying the tax by the new quantity, which gives tax revenue (${money(t*(qe-drop))}).</p>` };
});
lazy('l12-gr-areas','l12',()=>({ type:'mc', kind:'graph',
  prompt:`A per-unit tax of $4 opens a wedge between the price buyers pay ($7) and the price sellers keep ($3). The old equilibrium is E.${sdg({xmax:10,ymax:10,xt:[0,3,5,10],yt:[0,3,5,7,10],areas:[{pts:[[0,10],[0,7],[3,7]],c:'var(--accent-soft)',label:[0.9,7.8,'J']},{pts:[[0,7],[3,7],[3,3],[0,3]],c:'var(--surface-2)',label:[1.5,5,'K']},{pts:[[0,3],[3,3],[0,0]],c:'var(--ok-soft)',label:[0.9,2.0,'L']},{pts:[[3,7],[5,5],[3,3]],c:'var(--bad-soft)',label:[3.7,5,'M']}],lines:[{a:[0,10],b:[10,0],label:'D'},{a:[0,0],b:[10,10],label:'S',c:'var(--g1)',lx:-6,ly:14,anchor:'end'}],hl:[{p:7,c:'var(--muted)'},{p:3,c:'var(--muted)'}],dots:[{q:5,p:5,label:'E'}]})}Which area is the <b>deadweight loss</b>?`,
  options:[`Area M`,`Area K`,`Area J`,`Areas K and M`,`Area L`], answer:0,
  explain:`<p>Deadweight loss is the triangle between the curves from the taxed quantity (3) to the old equilibrium (5): area M. Those units were worth more to buyers than they cost sellers, but the tax stops them from being traded.</p><p>K is tax revenue (tax × quantity sold), surplus moved to the government, not lost. J is consumer surplus and L producer surplus after the tax.</p>` }));
tf('l12-tf-rev','l12','The tax revenue the government collects is part of the deadweight loss.',false,
  `<p>False. Revenue is surplus <b>transferred</b> from buyers and sellers to the government, which your course says pays for "public education, national defense, infrastructure." Deadweight loss is surplus that no one gets, from trades that no longer happen. Total surplus after the tax = consumer surplus + producer surplus + revenue, and deadweight loss is what's missing.</p>`);
mc('l12-cs-ps','l12','According to your course, what happens to consumer surplus and producer surplus when a tax is imposed?',
  [`Both fall`,`Consumer surplus falls; producer surplus is unchanged`,`Producer surplus falls; consumer surplus is unchanged`,`Both rise, because of the government\'s spending`,`Consumer surplus falls and producer surplus rises`],0,
  `<p>Your course: buyers and sellers "are both a little bit worse off because the price for buyers rises and the price for sellers falls." Consumer surplus shrinks (higher price, fewer units) and producer surplus shrinks (lower price kept, fewer units).</p><p>The tempting "only consumer surplus falls" treats the tax as if it only raised the buyers' price.</p>`);
/* L12 more */
mc('l12-why','l12','If taxes create deadweight loss, why does your course say we have them?',
  [`The revenue pays for public goods, such as national defense and roads, that the market on its own wouldn\'t provide`,`Taxes increase total surplus in every market`,`Taxes have no effect on quantity`,`Taxes raise producer surplus`,`Deadweight loss is a gain to the government`],0,
  `<p>Your course: "the benefit comes from the gain in government tax revenue," which provides "public goods, goods that the market if it was left up to its own devices wouldn't provide, such as public education, national defense, infrastructure." Whether a particular tax is worth its deadweight loss is a judgment the model can inform but not settle. Unit 7 covers public goods.</p>`);
mc('l12-cig','l12','Your course textbook reports that a 10% rise in cigarette prices cuts adult smoking by about 3% (elasticity about 0.3). Supply is more elastic. Who bears most of a cigarette tax?',
  [`Smokers (buyers), because their demand is inelastic`,`Cigarette companies, because the tax is collected from them`,`Smokers and companies split it equally`,`Cigarette companies, because demand is inelastic`,`The government`],0,
  `<p>Your course textbook: cigarette taxes "are mainly passed along to consumers in the form of higher prices," because "the tax burden falls on the most inelastic side of the market." Addicted smokers keep buying, so sellers can raise prices without losing many sales.</p>`);
mc('l12-beach','l12','Your course textbook\'s example: beachfront hotels can\'t easily move or be built elsewhere, while tourists have other vacation choices. A tax on hotel rooms there falls mostly on whom?',
  [`Hotel owners, because supply is more inelastic than demand`,`Tourists, because they pay the hotel bill`,`Tourists, because demand is elastic`,`Split equally`,`No one, because quantity doesn\'t change`],0,
  `<p>The textbook: when "sellers have no alternative than to accept lower prices for their business ... The tax burden is now passed on to the sellers." Elastic demand means tourists walk away from higher prices, so the price can't rise much; the inelastic hotels absorb the tax.</p>`);
gen('l12-g-rev','l12',()=>{
  const t=pick([0.5,1,2,3]), q=pick([150,400,1200]);
  return { type:'num', kind:'num', prompt:`Made-up numbers. A ${money(t)} per-unit tax is placed on a market. Before the tax, ${q+100} units sold; after it, ${q}. Buyers now pay ${money(10+t/2)}. How much tax revenue does the government collect?`,
    answer:t*q, unit:'dollars',
    explain:`<p>Revenue = tax × quantity sold with the tax = ${money(t)} × ${q} = <b>${money(t*q)}</b>.</p><p>The common slips are using the pre-tax quantity (${money(t*(q+100))}) or the buyers' price instead of the tax (${money((10+t/2)*q)}, which is what buyers spend).</p>` };
});
lazy('l12-gr-incidence','l12',()=>({ type:'mc', kind:'graph',
  prompt:`A $3 per-unit tax is placed on this market. Before the tax, the price was $6 (point E).${sdg({xmax:8,ymax:14,xt:[0,3,4,8],yt:[0,5,8,14],lines:[{a:[1,12],b:[7,0],label:'D'},{a:[0,2],b:[8,10],label:'S',c:'var(--g1)',lx:-6,ly:14,anchor:'end'}],hl:[{p:8,c:'var(--muted)'},{p:5,c:'var(--muted)'}],labels:[[0.15,8.4,'buyers $8','var(--muted)','start'],[7.9,5.5,'sellers $5','var(--muted)','end']],dots:[{q:4,p:6,label:'E'}]})}Which statement is correct?`,
  options:[`Buyers bear $2 of the tax and sellers $1, because demand is more inelastic than supply`,`Sellers bear $2 and buyers $1, because sellers send the tax to the government`,`Each side bears $1.50`,`Buyers bear the full $3`,`Sellers bear $2 and buyers $1, because demand is more inelastic`], answer:0,
  explain:`<p>Buyers: $8 − $6 = $2. Sellers: $6 − $5 = $1. The steep demand curve means quantity demanded barely responds to price, so most of the tax shows up as a higher price for buyers. Your course: "if the demand curve is relatively inelastic or more inelastic than supply then the buyer has the bigger tax burden."</p><p>The last choice has the right reason but the wrong side.</p>` }));
mc('l12-ceiling','l12','Your course textbook\'s drug example: a price ceiling of $400 (below the $600 equilibrium) cuts quantity from 20,000 to 15,000. Which of the following is true?',
  [`Some producer surplus moves to consumers, and there is also deadweight loss`,`Consumers gain and no surplus is lost`,`Producers gain at consumers\' expense`,`Quantity rises, so total surplus rises`,`There is deadweight loss but no transfer`],0,
  `<p>The textbook: "the price ceiling transfers the area of surplus (V) from producers to consumers," and the drop to 15,000 creates deadweight loss "like money thrown away that benefits no one." Buyers who still get the drug pay less, but 5,000 doses worth more than their cost are no longer made.</p>`);
tf('l12-tf-ceiling','l12','A price ceiling that helps the buyers who still get the good creates no deadweight loss.',false,
  `<p>False. Your course textbook: "both price floors and price ceilings block some transactions that buyers and sellers would have been willing to make, and creates deadweight loss." A transfer to some buyers doesn't make up for the trades that no longer happen.</p>`);
mc('l12-floor','l12','Your course textbook\'s movie theaters: the equilibrium is $8 a ticket and 1,800 tickets. A price floor of $12 is set, and quantity demanded falls to 1,400. Which is true?',
  [`Some consumer surplus moves to theaters, and 400 tickets worth more than they cost are no longer sold`,`Theaters gain and total surplus rises`,`Moviegoers gain because theaters stay open`,`There is no deadweight loss because the price is higher`,`Quantity supplied falls to 1,400 because the price is higher`],0,
  `<p>The textbook: "the price floor causes the area H to be transferred from consumer to producer surplus, but also causes a deadweight loss of J + K." The 400 lost tickets are the source of the deadweight loss.</p><p>The last choice gets the floor backwards: a higher price raises quantity <b>supplied</b>; it's quantity <b>demanded</b> that falls to 1,400.</p>`);
mc('l12-quota','l12','Lesson 8\'s made-up orange market (demand Qd = 60 − 10P, supply Qs = 10P) has an equilibrium of $3 and 30. A quota limits sales to 20; buyers then pay $4, while the 20th unit costs sellers only $2. What is the deadweight loss of the quota?',
  [`$10`,`$20`,`$40`,`$5`,`$80`],0,
  `<p>Deadweight loss = ½ × lost units × the gap between buyers' value and sellers' cost at the limit = ½ × (30 − 20) × ($4 − $2) = <b>$10</b>. Quotas, like taxes, open a wedge between what buyers pay and what it costs to supply.</p><p>The tempting $20 forgets the ½.</p>`);
mc('l12-revenue-el','l12','A government wants a tax that raises a lot of revenue with little deadweight loss. Based on your course textbook, which market is the better target?',
  [`One where demand and supply are both inelastic`,`One where demand and supply are both very elastic`,`One with elastic demand and elastic supply, because quantity responds`,`It doesn\'t matter; every $1 tax raises the same revenue`,`One where many close substitutes exist`],0,
  `<p>Your course textbook: "The more elastic the demand and supply curves are, the lower the tax revenue," because buyers and sellers escape the tax by trading less. When quantity barely falls, revenue stays high and few trades are lost, so deadweight loss is small.</p><p>Whether that makes the tax fair is a separate question: inelastic goods are often necessities.</p>`);
mc('l12-dwl-why','l12','Why does a tax create deadweight loss?',
  [`Some trades that are worth more to buyers than they cost sellers stop happening because of the tax wedge`,`The government wastes the revenue`,`Buyers pay more than sellers receive, and that difference disappears`,`Sellers stop producing completely`,`The price rises by more than the tax`],0,
  `<p>Your course: deadweight loss comes from "the fact that we can't reach the equilibrium point." Between the taxed quantity and the old equilibrium, buyers value each unit above its cost, but not by enough to cover the tax too, so those units aren't traded.</p><p>The tempting third choice describes tax revenue, which doesn't disappear; it goes to the government.</p>`);
mc('l12-statutory','l12','Version 1: a $1 tax on bicycles is collected from sellers. Version 2: the same $1 tax is collected from buyers at the register. Assume nothing else differs. How do the outcomes compare?',
  [`The same: buyers pay the same total, sellers keep the same amount, and the same quantity sells`,`Buyers bear more in version 2`,`Sellers bear more in version 1`,`Quantity falls only in version 1`,`Only version 2 creates deadweight loss`],0,
  `<p>Your course's slide: "Regardless of who pays the tax (sellers or buyers) both share the tax burden." The wedge is the same $1 either way, so the split depends only on the elasticities. In version 1 the posted price rises; in version 2 the posted price falls and buyers add the tax. Both end at the same buyer price, seller price and quantity.</p>`);
mc('l12-equal-why','l12','In your course\'s sock example, buyers and sellers each bear $0.50 of the $1 tax. What does that tell you?',
  [`In this example, demand and supply are about equally elastic`,`Every tax is split equally`,`The tax was collected from both sides`,`Demand is perfectly inelastic`,`Supply is perfectly elastic`],0,
  `<p>Your course: "If we have equal elasticities in demand and supply then we're going to have an equal sharing of the tax burden." The sock example assumes that case. Change the elasticities and the split changes.</p>`);
gen('l12-g-square','l12',()=>{
  const t=pick([0.5,1,1.5,2]); const ans=50*t*t;
  return { type:'num', kind:'num', prompt:`Made-up sock curves that match your course's example: demand Q = 1,300 − 200P and supply Q = 200P − 700 (equilibrium $5 and 300). A tax of ${money(t)} per pair lowers quantity by 100 pairs for each $1 of tax, to ${300-100*t}. What is the deadweight loss?`,
    answer:ans, unit:'dollars',
    explain:`<p>Lost units: 300 − ${300-100*t} = ${100*t}. Height: the tax, ${money(t)}. DWL = ½ × ${100*t} × ${money(t)} = <b>${money(ans)}</b>.</p><p>Notice the pattern: the tax shows up in both the base and the height, so deadweight loss grows with the <b>square</b> of the tax: $0.50 → $12.50, $1 → $50, $2 → $200. Doubling the tax quadruples the loss.</p>` };
});
mc('l12-double','l12','With straight-line demand and supply, a $1 tax causes $50 of deadweight loss. If the tax rises to $2, roughly what happens to deadweight loss?',
  [`It about quadruples, to $200`,`It doubles, to $100`,`It stays $50`,`It falls, because less is sold`,`It rises by $1`],0,
  `<p>A bigger tax both blocks more trades (a wider base) and opens a taller wedge, so the deadweight-loss triangle grows in both directions. Econlib's David Henderson shows that deadweight loss is proportional to the square of the tax rate. Twice the tax gives about four times the loss.</p><p>The tempting "doubles" treats deadweight loss like revenue. Revenue doesn't even double here, since less sells.</p>`);
mc('l12-total','l12','Using this lesson\'s made-up sock curves: before the $1 tax, consumer surplus is $225 and producer surplus is $225. After it, consumer surplus is $100, producer surplus is $100 and tax revenue is $200. What is the deadweight loss?',
  [`$50`,`$250`,`$450`,`$200`,`$0`],0,
  `<p>Before: $225 + $225 = $450. After: $100 + $100 + $200 = $400. Deadweight loss = $450 − $400 = <b>$50</b>, the same as ½ × 100 lost pairs × $1.</p><p>The tempting $250 forgets to count the $200 of revenue, which isn't lost; it goes to the government.</p>`);

/* ===== Lesson 12 quick checks ===== */
mc('l12c-wedge','l12','Before a tax, coffee sells for $3.00 a cup. After a $0.40 tax, buyers pay $3.30. What do sellers keep per cup?',
  [`$2.90`,`$2.60`,`$3.00`,`$3.30`,`$3.70`],0,
  `<p>Sellers keep the buyers' price minus the tax: $3.30 − $0.40 = <b>$2.90</b>. Buyers bear $0.30 of the tax and sellers $0.10.</p>`);
mc('l12c-rev','l12','A $2 tax per concert ticket cuts sales from 10,000 to 9,000. How much revenue does it raise?',
  [`$18,000`,`$20,000`,`$2,000`,`$1,000`,`$9,000`],0,
  `<p>Tax × quantity sold with the tax: $2 × 9,000 = <b>$18,000</b>. The 1,000 tickets that are no longer sold raise nothing.</p>`);
mc('l12c-surplus','l12','After a tax, which group ends up with surplus that buyers and sellers lost?',
  [`The government, through tax revenue; the rest is deadweight loss that no one gets`,`Sellers, through higher prices`,`Buyers, through lower prices`,`No one; all of it is deadweight loss`,`The government gets all of it`],0,
  `<p>Part of what buyers and sellers lose becomes tax revenue (a transfer). The rest, from trades that no longer happen, is deadweight loss.</p>`);
mc('l12c-elastic','l12','Demand for a city\'s parking spaces is elastic (drivers can take the bus), but the number of spaces is fixed. A parking tax falls mostly on whom?',
  [`Owners of the parking spaces, because supply is perfectly inelastic`,`Drivers, because they pay at the meter`,`Drivers, because demand is elastic`,`Split equally`,`No one`],0,
  `<p>The more inelastic side bears more. A fixed number of spaces can't respond to price, while drivers can switch to the bus, so owners absorb most of the tax, like your course textbook's beachfront hotels.</p>`);
mc('l12c-dwl','l12','A tax cuts the quantity of movie tickets from 1,000 to 900, and the tax is $3 per ticket. With straight-line curves, what is the deadweight loss?',
  [`$150`,`$300`,`$2,700`,`$3,000`,`$100`],0,
  `<p>½ × (1,000 − 900) × $3 = <b>$150</b>. $300 forgets the ½; $2,700 is revenue ($3 × 900).</p>`);
mc('l12c-controls','l12','Which of the following create deadweight loss in an otherwise competitive market?',
  [`A binding price ceiling, a binding price floor, a quota and a per-unit tax`,`Only taxes`,`Only price floors`,`Only policies that hurt consumers`,`None, because surplus is just transferred`],0,
  `<p>Each one keeps the quantity below the equilibrium, so trades worth more than they cost stop happening. Your course textbook: price floors and ceilings "block some transactions that buyers and sellers would have been willing to make, and creates deadweight loss."</p>`);
mc('l12c-skill','l12','A tax graph shows demand steep and supply flat. Without numbers, what can you predict?',
  [`Buyers bear more of the tax, and quantity falls only a little`,`Sellers bear more of the tax, and quantity falls a lot`,`The tax is split equally`,`There is no deadweight loss`,`Buyers bear more, and quantity falls a lot`],0,
  `<p>Steep demand means inelastic demand: buyers keep buying, so the buyers' price rises by most of the tax and quantity barely falls. The small drop in quantity also means a small deadweight loss.</p>`);

mc('l12c-why','l12','According to your course, what is the main benefit of a tax that offsets the losses it causes buyers and sellers?',
  [`The revenue, which can pay for public goods such as roads and national defense`,`Higher consumer surplus`,`Higher producer surplus`,`A larger quantity sold`,`The deadweight loss`],0,
  `<p>Your course: "the benefit comes from the gain in government tax revenue," used for public goods the market wouldn't provide on its own. A tax lowers consumer surplus, producer surplus and the quantity sold, and deadweight loss is a cost, not a benefit.</p>`);

U2_CARDS.l12 = [
  ['Tax wedge','What is the tax wedge?','The gap a per-unit tax opens between the price buyers pay (P<sub>B</sub>) and the price sellers keep (P<sub>S</sub>). Tax = P<sub>B</sub> − P<sub>S</sub>.','Socks: $5.50 − $4.50 = the $1 tax (your course).','The wedge equals the whole tax; buyers\' price rises by only part of it.'],
  ['Tax revenue','How do you calculate tax revenue?','Tax per unit × quantity sold <b>with</b> the tax.','$1 × 200 pairs of socks = $200 (your course).','Use the taxed quantity, not the old one.'],
  ['Tax incidence','What is tax incidence, and how do you measure each side\'s share?','How the burden of a tax is split. Buyers\' share = P<sub>B</sub> − old price; sellers\' share = old price − P<sub>S</sub>. The two add to the tax.','Socks: buyers $5.50 − $5 = $0.50; sellers $5 − $4.50 = $0.50.','Measure each side\'s share from the old equilibrium price, not from the other side\'s price.'],
  ['Who writes the check','Does it matter whether a tax is collected from buyers or sellers?','No. The wedge is the same either way, so the split of the burden is the same. Only elasticity decides it.','A $1 tax on bicycles gives the same prices and quantity whether the store or the shopper hands it over.','"The tax is on sellers" doesn\'t mean sellers bear it.'],
  ['Elasticity and incidence','Which side bears more of a tax?','The more inelastic side. If demand is more inelastic than supply, buyers bear more; if supply is more inelastic, sellers do. Equal elasticities split it equally.','Cigarettes (inelastic demand): mostly smokers. Beachfront hotels (inelastic supply): mostly owners (your course textbook).','Inelastic means unresponsive, so it can\'t dodge the tax.'],
  ['Effects of a tax on surplus','What happens to consumer surplus, producer surplus and total surplus when a tax is imposed?','Consumer surplus and producer surplus both fall. Part of the loss becomes tax revenue; the rest is deadweight loss, so total surplus falls.','Made-up socks: CS $225 → $100, PS $225 → $100, revenue $200, DWL $50.','Count the revenue before finding deadweight loss; revenue is moved, not lost.'],
  ['Deadweight loss','What is deadweight loss, and where is it on a graph?','The total surplus lost when a market trades less (or more) than the efficient quantity. On a tax graph: the triangle between demand and supply from the taxed quantity to the old equilibrium.','½ × 100 lost pairs × $1 tax = $50.','Tax revenue is not deadweight loss; it\'s a transfer.'],
  ['Calculating deadweight loss','How do you calculate deadweight loss with straight-line curves?','½ × (lost units) × (the wedge between buyers\' value and sellers\' cost at the new quantity, which equals the tax).','A $3 tax cuts tickets from 1,000 to 900: ½ × 100 × $3 = $150.','Don\'t forget the ½.'],
  ['Deadweight loss of controls','Do price ceilings, floors and quotas create deadweight loss?','Yes. Each blocks trades buyers and sellers would both have wanted. They also move surplus from one side to the other.','Drug ceiling $400 vs $600: surplus moves to buyers, and 5,000 lost doses create deadweight loss (your course textbook).','Helping one side doesn\'t mean no surplus is lost.'],
  ['Elasticity and tax revenue','How does elasticity affect a tax\'s revenue and deadweight loss?','The more elastic demand and supply are, the more quantity falls: less revenue and more deadweight loss. Inelastic markets raise more revenue with less deadweight loss.','Your course textbook: "The more elastic the demand and supply curves are, the lower the tax revenue."','Inelastic markets raise more revenue, but those goods are often necessities; that\'s a fairness question the model doesn\'t settle.'],
  ['Why tax?','Why do governments tax if taxes create deadweight loss?','The revenue funds public goods the market wouldn\'t provide on its own, such as national defense, roads and public education (your course). The model shows the cost; whether it\'s worth it is a judgment.','Your course: "the benefit comes from the gain in government tax revenue."','The model shows a tax\'s cost; whether the revenue is worth it is a judgment.']
];
