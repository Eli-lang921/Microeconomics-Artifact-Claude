  <div class="qset" id="qset"></div>
  <div class="qset" id="moreset"></div>
  <div class="more-bar" id="more-bar"></div>
  <h2>Writing <span class="muted" style="font-weight:500;font-size:.9rem">(optional)</span></h2>
  <p class="muted small">Explain an idea in your own words. Claude grades your answer against a checklist and tells you what to improve. Each grading needs an internet connection and uses a little of your Claude usage. The CLEP itself has no writing; this is for understanding.</p>
  <div class="qset" id="wset"></div>
  <div class="callout row" style="justify-content:space-between"><p style="margin:0"><b>${cardsFor(L.id).length} flashcards</b> for this lesson. Flip them, or type your answer and Claude checks it.</p><span class="row"><a class="btn ghost sm" href="#cards">Edit or add cards</a><button class="btn sm" id="fc-go">Study flashcards</button></span></div>
  <h2>Read or watch more</h2><ul class="links">${L.links.map(k=>`<li><span class="kind">${k.k}</span><a href="${k.u}" target="_blank" rel="noopener">${k.t}</a> <span class="small muted">· ${k.s}</span><div class="small">${k.w}</div></li>`).join('')}</ul>
  <div class="lrep-end" id="lrep-end"><span>Something wrong or confusing in this lesson?</span></div>
  <nav class="pager">${prev?`<a class="btn ghost" href="#${prev.id}">← Lesson ${i}: ${prev.title}</a>`:'<a class="btn ghost" href="#home">← Course</a>'}${next?`<a class="btn" href="#${next.id}">Lesson ${i+2}: ${next.title} →</a>`:`<a class="btn" href="${unitOf(L.unit).quiz}">Unit ${L.unit} quiz →</a>`}</nav>`;
  mountReport('lesson:'+L.id, $('#lrep'));
  mountReport('lesson:'+L.id, $('#lrep-end'));
  $$('[data-widget]', app).forEach(el => { el.classList.add('widget'); try{ W[el.dataset.widget](el); }catch(e){ el.innerHTML='<p class="muted">This graph failed to load. Reload the page to try again.</p>'; console.error(e); } });
  $$('[data-check]', app).forEach(el => { el.classList.add('qcheck'); el.innerHTML = '<p class="eyebrow">Quick check · not scheduled for review</p>'; el.dataset.check.split(',').forEach((qid,k,arr) => { if(Q[qid]) el.appendChild(qCard(qid, { ctx:'check', label: arr.length>1 ? `Quick check ${k+1} of ${arr.length}` : 'Quick check' })); }); });
  addSectionExplains($('article', app), L, 'h2');
  addSectionExplains($('.deeper-body', app), L, 'h3');
  $$('.widget', app).forEach(wg => {
    const name = ($('.widget-title', wg)||{}).textContent || wg.dataset.widget;
    const holder = document.createElement('div'); holder.className='xp-sec';
    const wCtx = () => `Interactive graph or tool in Lesson ${L.n} (${L.title}). Its current state, as the student sees it:\n${textOf(wg)}`;
    holder.appendChild(explainBox(`widget:${L.id}|${name}`, wCtx, () => 'full', 'Explain this graph'));
    const rs = document.createElement('span'); rs.className = 'rep-slot'; holder.appendChild(rs);
    mountReport(`widget:${L.id}|${name}`, rs, () => wCtx().slice(0,4000));
    wg.after(holder);
  });
  const status = q => rec[q] ? (rec[q].ok?' · answered ✓':' · answered, review pending') : '';
  const onAns = qid => ok => { recordPractice(qid, ok); const pp=lessonProgress(L); $('#pp').textContent=`${pp.done}/${pp.total} answered`; };
  L.core.forEach((qid,k) => $('#qset').appendChild(qCard(qid, { ctx:'practice', label:`Question ${k+1}${status(qid)}`, onAnswer: onAns(qid) })));
  let shown = 0; const bar = $('#more-bar');
  const drawBar = () => {
    const left = L.more.length - shown;
    bar.innerHTML = left>0 ? `<button class="btn ghost" id="more-go">More practice · ${Math.min(4,left)} more (${left} left)</button>` : `<p class="small muted">That's all ${L.more.length} extra questions for this lesson. For more, use Review: pick this lesson and practice any time.</p>`;
    const b=$('#more-go'); if(b) b.onclick = () => { L.more.slice(shown, shown+4).forEach((qid,k)=>$('#moreset').appendChild(qCard(qid, { ctx:'practice', label:`Extra ${shown+k+1}${status(qid)}`, onAnswer: onAns(qid) }))); shown = Math.min(L.more.length, shown+4); drawBar(); };
  };
  drawBar();

/* quiz */
let QZ = null;
function renderQuiz(){
  if(!QZ){
    const best=S.quiz.best, last=S.quiz.last;
    app.innerHTML = `<div class="lesson-head"><div class="eyebrow">Unit 1</div><h1 style="margin-top:.4rem">Unit 1 quiz</h1>
    ${quizSwitch(1)}
    <p class="oneline">20 exam-style questions across all five lessons, in random order, with five answer choices like the real CLEP. You see the explanation after each one.</p></div>
    ${best!==null?`<div class="readout"><div><b>${best}%</b><span>best score</span></div><div><b>${last}%</b><span>last score</span></div><div><b>${S.quiz.attempts}</b><span>attempts</span></div></div>`:''}
    <p class="muted">Missed questions come back in Review the next day. Target: 80% or higher.</p>
    <button class="btn" id="qstart">${best===null?'Start the quiz':'Take it again'}</button>
    <p class="small muted" style="margin-top:1.4rem">Want to see the real thing? College Board posts a few free <a href="https://clep.collegeboard.org/clep/pdf/principles-of-microeconomics-fact-sheet.pdf" target="_blank" rel="noopener">official sample questions</a> covering the whole exam.</p>`;
    $('#qstart').onclick = () => { QZ = { order: shuffle(QUIZ), i:0, right:0, missed:[] }; renderQuiz(); };
    return;
  }
  if(QZ.i >= QZ.order.length){
    const pct = Math.round(QZ.right/QZ.order.length*100);
    S.quiz.last = pct; S.quiz.best = Math.max(S.quiz.best??0, pct); S.quiz.attempts=(S.quiz.attempts||0)+1; save();
    const byL = {}; QZ.missed.forEach(q=>{ const l=Q[q].lesson; byL[l]=(byL[l]||0)+1; });
    const weak = Object.entries(byL).sort((a,b)=>b[1]-a[1]);
    app.innerHTML = `<div class="lesson-head"><div class="eyebrow">Unit quiz result</div><p class="score-big num">${pct}%</p><p>${QZ.right} of ${QZ.order.length} correct. ${pct>=80?'Solid. You\'re ready to move on.':pct>=60?'Close. Revisit the lessons below, then try again.':'Worth another pass through the lessons below before retrying.'}</p></div>
      ${weak.length?`<h2>Where you lost points</h2><ul class="links">${weak.map(([l,n])=>`<li><a href="#${l}">Lesson ${LBYID[l].n}: ${LBYID[l].title}</a> <span class="small muted">· ${n} missed</span></li>`).join('')}</ul><p class="muted small">${QZ.missed.length===1?'The missed question comes':`All ${QZ.missed.length} missed questions come`} back in Review tomorrow.</p>`:'<p>No misses.</p>'}
      <div class="row" style="margin-top:1.4rem"><button class="btn" id="qagain">Take it again</button><a class="btn ghost" href="#home">Back to course</a></div>`;
    $('#qagain').onclick=()=>{ QZ={ order: shuffle(QUIZ), i:0, right:0, missed:[] }; renderQuiz(); };
    QZ = null;
    return;
  }
  const qid = QZ.order[QZ.i];
  app.innerHTML = `<div class="quiz-top"><div class="eyebrow">Unit quiz · question ${QZ.i+1} of ${QZ.order.length}</div><span class="small muted num">${QZ.right} correct</span></div><div class="bar"><span style="width:${QZ.i/QZ.order.length*100}%"></span></div><div class="qset" id="qbox"></div>`;
  $('#qbox').appendChild(qCard(qid, { ctx:'quiz', label:`From Lesson ${LBYID[Q[qid].lesson].n}`, nextLabel: QZ.i===QZ.order.length-1?'See my score':'Next question',
    onAnswer: ok => { if(ok) QZ.right++; else QZ.missed.push(qid); QZ.i++; schedule(qid, ok, 'quiz'); save(); refreshChrome(); },
    onNext: () => { renderQuiz(); window.scrollTo(0,0); } }));
}

/* ===== Unit 2 quiz: submit-then-reveal =====
   Nothing on screen shows whether an answer is right until the whole quiz is submitted: no score counter, no colored options,
   and "Explain this" runs in hint mode (it never sees the answer or the explanation). Results are stored in S.quiz2,
   separate from Unit 1's S.quiz. An unfinished attempt is kept on this device only (localStorage), as a convenience. */
const QZ2_DRAFT_KEY = 'micro-quiz2-draft';
let QZ2 = null, QZ2R = null; // active attempt; results being shown
const qz2Load = () => { try{ const v=JSON.parse(localStorage.getItem(QZ2_DRAFT_KEY)); if(v && Array.isArray(v.order) && v.order.every(id=>Q[id] && Q[id].quiz)) return v; }catch(e){} return null; };
const qz2Save = () => { try{ if(QZ2) localStorage.setItem(QZ2_DRAFT_KEY, JSON.stringify(QZ2)); else localStorage.removeItem(QZ2_DRAFT_KEY); }catch(e){} };
function qz2New(){
  const order = shuffle(QUIZ2), opts = {};
  order.forEach(id => { const q = Q[id]; const idx = q.options.map((_,i)=>i); opts[id] = q.keepOrder ? idx : shuffle(idx); });
  return { order, opts, ans:{}, i:0, started:Date.now() };
}
const quizSwitch = u => `<div class="chips" role="group" aria-label="Which unit quiz" style="margin:.2rem 0 1rem"><a class="chipbtn" href="#quiz" aria-pressed="${u===1}" style="text-decoration:none">Unit 1 quiz</a><a class="chipbtn" href="#quiz2" aria-pressed="${u===2}" style="text-decoration:none">Unit 2 quiz</a></div>`;
function renderQuiz2(){
  if(QZ2R) return renderQuiz2Results();
  if(!QZ2){
    const d = qz2Load(), st = S.quiz2, n = QUIZ2.length;
    const answered = d ? Object.keys(d.ans).length : 0;
    app.innerHTML = `<div class="lesson-head"><div class="eyebrow">Unit 2 · Supply and Demand</div><h1 style="margin-top:.4rem">Unit 2 quiz</h1>
      ${quizSwitch(2)}
      <p class="oneline">${n} exam-style questions across Lessons 6 to 12, with five answer choices like the real CLEP. Like the real exam, you find out how you did only after you submit.</p></div>
      ${st.best!==null?`<div class="readout"><div><b>${st.best}%</b><span>best score</span></div><div><b>${st.last}%</b><span>last score</span></div><div><b>${st.attempts}</b><span>attempts</span></div></div>`:''}
      <ul class="small" style="margin-top:1rem"><li>Move back and forth and change any answer until you submit.</li><li>"Explain this" gives hints only during the quiz. Full explanations appear after you submit.</li><li>Missed questions come back in Review the next day. Target: 80% or higher.</li></ul>
      <div class="row" style="margin-top:1rem">${d?`<button class="btn" id="q2resume">Resume (${answered} of ${d.order.length} answered)</button><button class="btn ghost" id="q2new">Start over</button>`:`<button class="btn" id="q2new">${st.best===null?'Start the quiz':'Take it again'}</button>`}
      ${st.lastAttempt?`<button class="btn ghost" id="q2last">See my last results</button>`:''}</div>`;
    const r=$('#q2resume'); if(r) r.onclick=()=>{ QZ2=d; renderQuiz2(); };
    $('#q2new').onclick=()=>{ QZ2=qz2New(); qz2Save(); renderQuiz2(); window.scrollTo(0,0); };
    const l=$('#q2last'); if(l) l.onclick=()=>{ QZ2R=st.lastAttempt; renderQuiz2(); window.scrollTo(0,0); };
    return;
  }
  const n = QZ2.order.length, qid = QZ2.order[QZ2.i], q = Q[qid], L = LBYID[q.lesson];
  const answered = Object.keys(QZ2.ans).length, letters='ABCDE';
  app.innerHTML = `<div class="quiz-top"><div class="eyebrow">Unit 2 quiz · question ${QZ2.i+1} of ${n}</div><span class="small muted num">${answered} of ${n} answered</span></div>
    <div class="bar"><span style="width:${answered/n*100}%"></span></div>
    <div class="qset"><div class="q" id="q2card"><div class="q-meta"><span>From Lesson ${L.n}</span><span>Multiple choice</span></div>
      <div class="q-prompt">${q.prompt}</div>
      <div class="opts" role="radiogroup" aria-label="Answer choices">${QZ2.opts[qid].map((oi,k)=>`<button class="opt q2opt${QZ2.ans[qid]===oi?' sel':''}" role="radio" aria-checked="${QZ2.ans[qid]===oi}" data-k="${k}"><span class="ol">${letters[k]}</span><span>${q.options[oi]}</span></button>`).join('')}</div>
      <div class="q-tools"><span class="xp-slot"></span><span class="rep-slot"></span></div></div></div>
    <div class="row cf-nav" style="margin-top:12px"><button class="btn ghost sm" id="q2prev" ${QZ2.i===0?'disabled':''}>← Previous</button><button class="btn sm" id="q2next">${QZ2.i===n-1?'Review and submit':'Next →'}</button></div>
    <p class="small muted" style="margin:1.2rem 0 .4rem">Jump to a question (filled = answered):</p>
    <div class="qpal" role="group" aria-label="Questions">${QZ2.order.map((id,k)=>`<button type="button" data-k="${k}" class="${QZ2.ans[id]!==undefined?'done':''}${k===QZ2.i?' cur':''}" aria-label="Question ${k+1}${QZ2.ans[id]!==undefined?', answered':', not answered'}">${k+1}</button>`).join('')}</div>
    <div class="row" style="margin-top:1.2rem"><button class="btn" id="q2submit">Submit quiz</button><span class="small muted">You can still change answers before you submit.</span></div><div id="q2confirm"></div>`;
  const card = $('#q2card');
  /* option buttons carry their display position (data-k), not the source index, so the markup never hints at the answer.
     hint-only explanations: the context has the question and choices, never the answer or explanation */
  $('.xp-slot', card).appendChild(explainBox('question:'+qid, () => `Unit quiz question (the quiz is still in progress, so do not reveal or hint at the answer):\n${textOf($('.q-prompt', card))}\n\nChoices:\n` + QZ2.opts[qid].map((oi,k)=>`${letters[k]}. ${textOf(Object.assign(document.createElement('div'),{innerHTML:q.options[oi]}))}`).join('\n'), () => 'quizhint', 'Hint'));
  mountReport('question:'+qid, $('.rep-slot', card), () => `Unit 2 quiz question, reported during the quiz (no answer shown):\n${textOf($('.q-prompt', card))}`);
  $$('.q2opt', card).forEach(b => b.onclick = () => { QZ2.ans[qid] = QZ2.opts[qid][+b.dataset.k]; qz2Save();
    $$('.q2opt', card).forEach(x => { const on = x===b; x.classList.toggle('sel', on); x.setAttribute('aria-checked', on); });
    const a = Object.keys(QZ2.ans).length; $('.quiz-top .num').textContent = `${a} of ${n} answered`; $('.bar>span').style.width = `${a/n*100}%`;
    const pal = $(`.qpal button[data-k="${QZ2.i}"]`); if(pal){ pal.classList.add('done'); pal.setAttribute('aria-label',`Question ${QZ2.i+1}, answered`); } });
  const go = k => { QZ2.i = Math.max(0, Math.min(n-1, k)); qz2Save(); renderQuiz2(); window.scrollTo(0,0); };
  $('#q2prev').onclick = () => go(QZ2.i-1);
  $('#q2next').onclick = () => { if(QZ2.i===n-1){ $('#q2submit').scrollIntoView({block:'center'}); $('#q2submit').focus(); } else go(QZ2.i+1); };
  $$('.qpal button').forEach(b => b.onclick = () => go(+b.dataset.k));
  $('#q2submit').onclick = () => {
    const left = QZ2.order.filter(id => QZ2.ans[id]===undefined).length, box = $('#q2confirm');
    if(left && !box.firstChild){ box.innerHTML = `<div class="msg bad" style="margin-top:10px"><p style="margin:0 0 8px">${left} question${left===1?' is':'s are'} unanswered and will count as wrong. Submit anyway?</p><div class="row"><button class="btn sm" id="q2yes">Submit anyway</button><button class="btn ghost sm" id="q2no">Keep working</button></div></div>`;

function runSession(){

    $('input', slot).focus();
  };
  $$('[data-cf]', app).forEach(b => b.onclick = () => { CARDV.filter = b.dataset.cf; try{ localStorage.setItem('micro-cards-filter', CARDV.filter); }catch(e){} renderCards(); });
}
function cardRow(id){
  const c = CARDS[id], row = document.createElement('div'); row.className='cv-row';
  const snip = c.d.length>140 ? c.d.slice(0,137).trimEnd()+'…' : c.d;
  row.innerHTML = `<div class="cv-main"><b>${esc(c.t)}</b> ${c.custom?'<span class="pill st-open">Yours</span>':c.edited?'<span class="pill st-nochange">Edited</span>':''}<div class="small muted">${esc(snip)}</div><span class="rep-tag" data-rep="card:${id}"></span></div>
    <div class="cv-act"><a href="#fc-${id}">Open</a><button class="linkbtn" type="button">Edit</button></div>`;
  fillTag($('.rep-tag', row));
  $('button', row).onclick = () => {
    CARDV.editing = true; row.innerHTML = '';
    row.appendChild(cardEditor({ cid:id, onDone: () => { CARDV.editing=false; renderCards(); } }));
  };
  return row;
}
function renderOneCard(cid){
  const c = CARDS[cid], L = LBYID[c.lesson];
  app.innerHTML = `<div class="lesson-head"><div class="eyebrow">Lesson ${L.n} · ${esc(L.title)}</div><h1 style="margin-top:.4rem">Flashcard</h1>
    <p class="small"><a href="#cards">← All flashcards</a> · <a href="#reports">Reports</a></p></div>
    <div class="qset" id="fcbox"></div><h2>Your reports on this card</h2><div class="rep-list" id="fclist"></div>`;
  $('#fcbox').appendChild(flashCard(cid, { label:'Practice only · doesn\'t change your schedule', standalone:true }));
  const mine = allReports().filter(r=>r.where==='card:'+cid || r.where==='cardgrade:'+cid);
  if(mine.length) mine.forEach(r => $('#fclist').appendChild(repItem(r, { showLink:false })));
  else $('#fclist').innerHTML = '<div class="empty">No reports on this card.</div>';
}

/* ---------- tap-to-define popover (one shared popover, outside #app so "Explain this" never reads it) ---------- */
const TDEF = { pop:null, cur:null };
function tdefClose(){ if(!TDEF.pop) return; TDEF.pop.hidden = true; if(TDEF.cur) TDEF.cur.setAttribute('aria-expanded','false'); TDEF.cur = null; }
function tdefOpen(el){
  const g = GLOSS[el.dataset.term]; if(!g) return;
  if(!TDEF.pop){ TDEF.pop = document.createElement('div'); TDEF.pop.className = 'tdef-pop'; TDEF.pop.id = 'tdef-pop'; TDEF.pop.setAttribute('role','dialog'); TDEF.pop.setAttribute('aria-label','Definition'); document.body.appendChild(TDEF.pop); }
  if(TDEF.cur && TDEF.cur !== el) TDEF.cur.setAttribute('aria-expanded','false');
  const here = LBYID[view] ? LBYID[view].n : 0, H = LBYID[g.home];
  const where = H ? (H.n === here ? `Lesson ${H.n}` : H.n < here ? `From Lesson ${H.n}` : `More in Lesson ${H.n}`) : `More in ${g.home}`;
  TDEF.pop.innerHTML = `<p class="tp-t">${esc(g.t)}</p><p>${esc(g.d)}</p><p class="tp-meta">${where} · Source: ${esc(srcLabel(g.src||[]))}</p>`;
  TDEF.pop.hidden = false; TDEF.cur = el; el.setAttribute('aria-expanded','true'); el.setAttribute('aria-controls','tdef-pop');
  const r = el.getBoundingClientRect(), pw = TDEF.pop.offsetWidth, vw = document.documentElement.clientWidth;
  const left = Math.max(16, Math.min(r.left + window.scrollX, window.scrollX + vw - pw - 16));
  let top = r.bottom + window.scrollY + 6;
  if(r.bottom + TDEF.pop.offsetHeight + 12 > window.innerHeight && r.top > TDEF.pop.offsetHeight + 12) top = r.top + window.scrollY - TDEF.pop.offsetHeight - 6;
  TDEF.pop.style.left = left + 'px'; TDEF.pop.style.top = top + 'px';
}
document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('.tdef');
  if(t){ e.preventDefault(); if(TDEF.cur === t) tdefClose(); else tdefOpen(t); return; }
  if(TDEF.pop && !TDEF.pop.contains(e.target)) tdefClose();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && TDEF.cur){ const t = TDEF.cur; tdefClose(); t.focus(); return; }
  const t = e.target.closest && e.target.closest('.tdef');
  if(t && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); if(TDEF.cur === t) tdefClose(); else tdefOpen(t); }
});
window.addEventListener('hashchange', tdefClose);
window.addEventListener('resize', tdefClose);

/* boot */
render();
initStore();
</script>
