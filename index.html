W.elcalc = el => {
  const PRE = { salmon:{d:true,p1:11,p2:12.10,q1:40,q2:25,t:'Smoked salmon (your course)'}, bread:{d:true,p1:3,p2:3.30,q1:100,q2:98,t:'Bread (your course)'}, groc:{d:false,p1:5,p2:7,q1:1000,q2:1250,t:'Grocer\'s supply (your course)'} };
  let isD = true;
  el.innerHTML = `<p class="widget-title">Midpoint elasticity calculator</p><p class="hint">Start with your course's examples, then type your own numbers. Every step is shown.</p>
  <div class="seg pre" role="group" aria-label="Examples">${Object.entries(PRE).map(([k,v],i)=>`<button data-k="${k}" aria-pressed="${i===0}">${v.t}</button>`).join('')}<button data-k="own" aria-pressed="false">Your own</button></div>
  <div class="seg dside" role="group" aria-label="Demand or supply" style="margin-top:8px"><button data-d="1" aria-pressed="true">Demand</button><button data-d="0" aria-pressed="false">Supply</button></div>
  <div class="tbl-wrap"><table><thead><tr><th></th><th>Point A</th><th>Point B</th></tr></thead><tbody>
    <tr><td>Price ($)</td><td><input class="inline-num" id="ec-p1" type="number" step="0.01" min="0" aria-label="Price at A"></td><td><input class="inline-num" id="ec-p2" type="number" step="0.01" min="0" aria-label="Price at B"></td></tr>
    <tr><td>Quantity</td><td><input class="inline-num" id="ec-q1" type="number" step="1" min="0" aria-label="Quantity at A"></td><td><input class="inline-num" id="ec-q2" type="number" step="1" min="0" aria-label="Quantity at B"></td></tr></tbody></table></div>
  <div class="math ec-out"></div><div class="msg ec-msg"></div>`;
  const [P1,P2,Q1,Q2]=['#ec-p1','#ec-p2','#ec-q1','#ec-q2'].map(s=>$(s,el));
  const load = k => { const v=PRE[k]; isD=v.d; P1.value=v.p1; P2.value=v.p2.toFixed(2).replace(/\.00$/,''); Q1.value=v.q1; Q2.value=v.q2; $$('.dside button',el).forEach(b=>b.setAttribute('aria-pressed', (b.dataset.d==='1')===isD)); draw(); };
  const pct = x => (x*100).toFixed(2)+'%';
  const draw = () => {
    const p1=parseFloat(P1.value), p2=parseFloat(P2.value), q1=parseFloat(Q1.value), q2=parseFloat(Q2.value);
    const out=$('.ec-out',el), msg=$('.ec-msg',el);
    if([p1,p2,q1,q2].some(x=>!isFinite(x)) || p1<=0 || p2<=0 || q1<0 || q2<0 || (q1+q2)===0){ out.innerHTML='Enter two prices above zero and two quantities (zero or more).'; msg.className='msg ec-msg'; msg.textContent=''; return; }
    if(p1===p2){ out.innerHTML='The two prices are the same, so there is no price change to divide by. Change one of them.'; msg.className='msg ec-msg'; msg.textContent=''; return; }
    const dq=(q2-q1)/((q2+q1)/2), dp=(p2-p1)/((p2+p1)/2), e=dq/dp, a=Math.abs(e);
    out.innerHTML = `%Δ quantity = (${fmt(q2)} − ${fmt(q1)}) ÷ [(${fmt(q2)} + ${fmt(q1)}) ÷ 2] = ${fmt(q2-q1)} ÷ ${fmt((q1+q2)/2)} = <b>${pct(dq)}</b><br>%Δ price = (${fmt(p2)} − ${fmt(p1)}) ÷ [(${fmt(p2)} + ${fmt(p1)}) ÷ 2] = ${fmt(p2-p1)} ÷ ${fmt((p1+p2)/2)} = <b>${pct(dp)}</b><br>Elasticity = ${pct(dq)} ÷ ${pct(dp)} = <b>${e.toFixed(2)}</b>`;
    const cls = Math.abs(a-1)<0.005 ? 'unit elastic' : a>1 ? 'elastic' : 'inelastic';
    let s = isD ? `Read as ${a.toFixed(2)}: <b>${cls}</b> demand.` : `Price elasticity of supply ${e.toFixed(2)}: <b>${cls}</b> supply.`;
    if(isD && e>0) s += ' Note: quantity demanded moved the same way as price here, which breaks the law of demand. Check the numbers.';
    if(!isD && e<0) s += ' Note: quantity supplied moved opposite to price, which breaks the law of supply. Check the numbers.';
    if(isD){ const t1=p1*q1, t2=p2*q2; s += `<br>Total revenue: ${money(p1)} × ${fmt(q1)} = ${money(t1)} → ${money(p2)} × ${fmt(q2)} = ${money(t2)} (${t2-t1>=0?'+':'−'}${money(Math.abs(t2-t1))}). ` + (Math.abs(t2-t1)<0.005 ? 'Unchanged.' : ((t2>t1)===(p2>p1) ? 'Price and revenue moved the <b>same</b> way: the inelastic pattern.' : 'Price and revenue moved in <b>opposite</b> ways: the elastic pattern.')); }
    msg.className='msg ec-msg ' + (cls==='elastic'?'':'good'); msg.innerHTML=s;
  };
  $$('.pre button',el).forEach(b=>b.onclick=()=>{ $$('.pre button',el).forEach(x=>x.setAttribute('aria-pressed',x===b)); if(b.dataset.k==='own'){ P1.focus(); draw(); } else load(b.dataset.k); });
  $$('.dside button',el).forEach(b=>b.onclick=()=>{ isD = b.dataset.d==='1'; $$('.dside button',el).forEach(x=>x.setAttribute('aria-pressed',x===b)); draw(); });
  [P1,P2,Q1,Q2].forEach(i=>i.addEventListener('input',()=>{ $$('.pre button',el).forEach(x=>x.setAttribute('aria-pressed',x.dataset.k==='own')); draw(); }));
  load('salmon');
};

   Pretzels: price of B 4 → 3, beer 100 → 120: 18.18% ÷ −28.57% = −0.64, complements. Custom: equal causes or empty inputs show a message (no NaN);
   |value| < 0.05 is reported as about zero (unrelated / income doesn't matter). */
W.xclass = el => {
  const PRE = { magic:{m:'inc',a1:45000,a2:50000,q1:5,q2:9,t:'Magic Hat (your course)'}, pretz:{m:'cross',a1:4,a2:3,q1:100,q2:120,t:'Pretzels and beer (your course)'} };
  let mode='inc';
  el.innerHTML = `<p class="widget-title">Income or cross-price elasticity</p><p class="hint">Pick an example or type your own. The sign decides the kind of good.</p>
  <div class="seg pre" role="group" aria-label="Examples">${Object.entries(PRE).map(([k,v],i)=>`<button data-k="${k}" aria-pressed="${i===0}">${v.t}</button>`).join('')}</div>
  <div class="seg modes" role="group" aria-label="Which elasticity" style="margin-top:8px"><button data-m="inc" aria-pressed="true">Income</button><button data-m="cross" aria-pressed="false">Cross-price</button></div>
  <div class="tbl-wrap"><table><thead><tr><th></th><th>Before</th><th>After</th></tr></thead><tbody>
    <tr><td class="xl-a">Income ($)</td><td><input class="inline-num" id="xc-a1" type="number" step="any" aria-label="Cause before"></td><td><input class="inline-num" id="xc-a2" type="number" step="any" aria-label="Cause after"></td></tr>
    <tr><td class="xl-q">Quantity demanded</td><td><input class="inline-num" id="xc-q1" type="number" step="any" min="0" aria-label="Quantity before"></td><td><input class="inline-num" id="xc-q2" type="number" step="any" min="0" aria-label="Quantity after"></td></tr></tbody></table></div>
  <div class="math xc-out"></div><div class="msg xc-msg"></div>`;
  const [A1,A2,Q1,Q2]=['#xc-a1','#xc-a2','#xc-q1','#xc-q2'].map(s=>$(s,el));
  const setMode = m => { mode=m; $$('.modes button',el).forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m)); $('.xl-a',el).textContent = m==='inc' ? 'Income ($)' : 'Price of the other good, B ($)'; $('.xl-q',el).textContent = m==='inc' ? 'Quantity demanded' : 'Quantity of good A demanded'; draw(); };
  const load = k => { const v=PRE[k]; A1.value=v.a1; A2.value=v.a2; Q1.value=v.q1; Q2.value=v.q2; setMode(v.m); };
  const pc = x => (x*100).toFixed(2)+'%';
  const draw = () => {
    const a1=parseFloat(A1.value), a2=parseFloat(A2.value), q1=parseFloat(Q1.value), q2=parseFloat(Q2.value), out=$('.xc-out',el), msg=$('.xc-msg',el);
    if([a1,a2,q1,q2].some(x=>!isFinite(x)) || a1<=0 || a2<=0 || q1<0 || q2<0 || q1+q2===0){ out.textContent='Enter positive values for the cause and quantities of zero or more.'; msg.textContent=''; msg.className='msg xc-msg'; return; }
    if(a1===a2){ out.textContent=`The ${mode==='inc'?'income':'price of B'} didn't change, so there is nothing to divide by. Change one value.`; msg.textContent=''; msg.className='msg xc-msg'; return; }
    const dq=(q2-q1)/((q1+q2)/2), da=(a2-a1)/((a1+a2)/2), e=dq/da;
    out.innerHTML = `%Δ ${mode==='inc'?'quantity':'quantity of A'} = ${fmt(q2-q1)} ÷ ${fmt((q1+q2)/2)} = <b>${pc(dq)}</b><br>%Δ ${mode==='inc'?'income':'price of B'} = ${fmt(a2-a1)} ÷ ${fmt((a1+a2)/2)} = <b>${pc(da)}</b><br>${mode==='inc'?'Income':'Cross-price'} elasticity = <b>${e.toFixed(2)}</b>`;
    let s;
    if(Math.abs(e)<0.05) s = mode==='inc' ? 'About zero: demand barely responds to income.' : 'About zero: the goods are <b>unrelated</b>.';
    else if(mode==='inc') s = e<0 ? `Negative: an <b>inferior good</b>. Buyers purchase less as income rises.` : e>1 ? `Positive and above 1: a <b>normal good</b> whose purchases grow faster than income (luxury-like, "income elastic").` : `Positive and below 1: a <b>normal good</b> whose purchases grow more slowly than income (necessity-like).`;
    else s = e>0 ? `Positive: <b>substitutes</b>. When B's price moves, buyers switch toward or away from A in the same direction.` : `Negative: <b>complements</b>. A and B are used together, so A's quantity moves opposite to B's price.`;
    msg.className='msg xc-msg good'; msg.innerHTML = s;
  };
  $$('.pre button',el).forEach(b=>b.onclick=()=>{ $$('.pre button',el).forEach(x=>x.setAttribute('aria-pressed',x===b)); load(b.dataset.k); });
  $$('.modes button',el).forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  [A1,A2,Q1,Q2].forEach(i=>i.addEventListener('input',()=>{ $$('.pre button',el).forEach(x=>x.setAttribute('aria-pressed','false')); draw(); }));
  load('magic');
};

W.surplus = el => {

  <div class="svgbox"><svg viewBox="0 0 380 250" width="100%" role="img" aria-label="Step demand and supply curves with the price line and surplus bars"></svg></div>
  <div class="readout"><div><b class="su-q"></b><span>bottles sold</span></div><div><b class="su-cs"></b><span>consumer surplus</span></div><div><b class="su-ps"></b><span>producer surplus</span></div><div><b class="su-ts"></b><span>total surplus</span></div></div>

    const nb=B.filter(v=>v>=p).length, ns=C.filter(c=>c<=p).length, qm=Math.min(nb,ns), q=force?4:qm;
    let cs=0, ps=0; for(let i=0;i<q;i++){ cs+=B[i]-p; ps+=p-C[i]; } const ts=cs+ps;
    svg.innerHTML='';
    const x0=46,y0=210,w=310,h=180, X=v=>x0+w*v/5, Y=v=>y0-h*v/6;

    for(let i=0;i<q;i++){
      const bw=(X(1)-X(0))*0.42;

      const py1=Math.min(Y(C[i]),Y(p)), ph=Math.abs(Y(C[i])-Y(p)); if(ph>0.5) svgEl('rect',{x:X(i)+3+bw+2,y:py1,width:bw,height:ph,fill:C[i]<=p?'var(--surface-2)':'var(--bad-soft)',stroke:C[i]<=p?'var(--g1)':'var(--bad)','stroke-width':1},svg);
    }
    const step = arr => 'M'+arr.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)} L${X(i+1).toFixed(1)},${Y(v).toFixed(1)}`).join(' L');
    svgEl('path',{d:step(B),fill:'none',stroke:'var(--accent)','stroke-width':2.5},svg);
    svgEl('path',{d:step(C),fill:'none',stroke:'var(--g1)','stroke-width':2.5},svg);
    svgEl('line',{x1:X(0),x2:X(5),y1:Y(p),y2:Y(p),stroke:'var(--muted)','stroke-width':1.6,'stroke-dasharray':'5 4'},svg);
    wlabel(svg, X(5)-2, Y(B[4])+15, 'D (values)', 'var(--accent)', 'end');
    wlabel(svg, X(5)-2, Y(C[4])-6, 'S (costs)', 'var(--g1)', 'end');
    wlabel(svg, X(5)-2, p>=4.9 ? Y(p)+14 : Y(p)-5, `price ${money(p)}`, 'var(--muted)', 'end');
    $('.su-q',el).textContent=q; $('.su-cs',el).textContent=d2(cs); $('.su-ps',el).textContent=d2(ps); $('.su-ts',el).textContent=d2(ts);
    const rows=[]; for(let i=0;i<5;i++){ rows.push([d2(B[i])+([0,3].includes(i)?'*':''), `${CN[i]} ${d2(C[i])}`, i<q?d2(B[i]-p):'no sale', i<q?d2(p-C[i]):'no sale']); }
    $('.su-tbl',el).innerHTML = table(['Fan values','Vendor needs','CS','PS'], rows) + '<p class="small muted">* from your course; the rest are made-up.</p>';

    else if(q===3) m.innerHTML = `Equilibrium: 3 bottles, total surplus <b>${d2(ts)}</b>, the most possible. Every bottle worth more to a fan than it costs a vendor is sold. Move the price within $3.00 to $3.50: the total stays ${d2(ts)}; only the split changes.`;

    else m.innerHTML = `Excess supply: ${ns} vendors will sell but only ${nb} fan${nb===1?'':'s'} will buy at ${money(p)}. Total surplus is only ${d2(ts)}, below the $4.75 at equilibrium.`;

/* TEST NOTE (2026-10-22): all three cases pass through the course's sock equilibrium ($5, 300). Curves are made-up.
   Equal: D P = 6.5 − Q/200, S P = 3.5 + Q/200 → $1 tax: buyers $5.50, sellers $4.50, Q 200, revenue $200, CS $100, PS $100, DWL $50 (matches course + lesson table).
   Inelastic demand: D P = 11 − Q/50 → $1 tax: buyers $5.80, sellers $4.80, Q 260, revenue $260, DWL $20 (buyers bear 80%).
   Inelastic supply: S P = −1 + Q/50 (zero price below 50 pairs) → $1 tax: buyers $5.20, sellers $4.20, Q 260, revenue $260, DWL $20 (sellers bear 80%).
   Checked by hand: totals before = CS + PS + revenue + DWL after for each case. Tax $0 shows the equilibrium with no wedge. */
W.taxlab = el => {
  const CASES = {
    eq:{t:'Equal elasticity (your course)', a:6.5, b:1/200, c:3.5, d:1/200, ymax:8},
    id:{t:'Inelastic demand', a:11, b:1/50, c:3.5, d:1/200, ymax:12},
    is:{t:'Inelastic supply', a:6.5, b:1/200, c:-1, d:1/50, ymax:8}
  };
  let k='eq';
  el.innerHTML = `<p class="widget-title">Tax lab: the sock market</p><p class="hint">Made-up curves through your course's equilibrium ($5, 300 pairs). Pick the elasticity, then move the tax.</p>
  <div class="seg tx-c" role="group" aria-label="Elasticity">${Object.entries(CASES).map(([key,v])=>`<button data-k="${key}" aria-pressed="${key==='eq'}">${v.t}</button>`).join('')}</div>
  <div class="slider"><label for="tx-t">Tax per pair</label><input id="tx-t" type="range" min="0" max="2" step="0.25" value="1"><output></output></div>
  <div class="svgbox"><svg viewBox="0 0 380 250" width="100%" role="img" aria-label="Sock market with a tax wedge, consumer surplus, producer surplus, tax revenue and deadweight loss"></svg></div>
  <div class="readout"><div><b class="tx-pb"></b><span>buyers pay</span></div><div><b class="tx-ps"></b><span>sellers keep</span></div><div><b class="tx-q"></b><span>pairs sold</span></div></div>
  <div class="readout"><div><b class="tx-rev"></b><span>tax revenue</span></div><div><b class="tx-dwl"></b><span>deadweight loss</span></div><div><b class="tx-cs"></b><span>CS / PS</span></div></div>
  <p class="small muted">Shading: consumer surplus (top), tax revenue (middle band), producer surplus (bottom), deadweight loss (red triangle).</p>
  <div class="msg"></div>`;
  const svg=$('svg',el), T=$('#tx-t',el);
  const d2 = x => '$'+x.toFixed(2), d0 = x => '$'+Math.round(x).toLocaleString('en-US');
  const solve = (C,t) => {
    const Q=(C.a-C.c-t)/(C.b+C.d), pb=C.a-C.b*Q, ps=pb-t, q0=Math.max(0,-C.c/C.d);
    const supInt = q => q<=q0 ? 0 : 0.5*C.d*(q-q0)*(q-q0) + (C.c>0 ? C.c*q : 0);
    const cs=0.5*Q*(C.a-pb), psur=ps*Q-supInt(Q);
    return {Q,pb,ps,cs,psur,rev:t*Q,q0};
  };
  const draw = () => {
    const C=CASES[k], t=+T.value; T.nextElementSibling.textContent=d2(t);
    const e=solve(C,0), r=solve(C,t), dwl=(e.cs+e.psur)-(r.cs+r.psur+r.rev);
    svg.innerHTML='';
    const x0=46,y0=210,w=310,h=180, X=v=>x0+w*v/600, Y=v=>y0-h*v/C.ymax;
    axes(svg,{x0,y0,w,h,xmax:600,ymax:C.ymax,xlab:'Pairs of socks',ylab:'Price ($)',xt:[0,200,300,600],yt:C.ymax===12?[0,5,10]:[0,4,8]});
    const poly=(pts,fill,stroke)=>svgEl('polygon',{points:pts.map(([q,p])=>X(q).toFixed(1)+','+Y(p).toFixed(1)).join(' '),fill,stroke:stroke||'none','stroke-width':1,opacity:0.9},svg);
    if(t>0){
      poly([[0,C.a],[0,r.pb],[r.Q,r.pb]],'var(--accent-soft)');
      poly([[0,r.pb],[r.Q,r.pb],[r.Q,r.ps],[0,r.ps]],'var(--surface-2)','var(--muted)');
      const sQ=C.c+C.d*r.Q; poly(C.c<0?[[0,r.ps],[r.Q,r.ps],[r.Q,sQ],[r.q0,0],[0,0]]:[[0,r.ps],[r.Q,r.ps],[r.Q,sQ],[0,C.c]],'var(--ok-soft)');
      poly([[r.Q,r.pb],[e.Q,e.pb],[r.Q,r.ps]],'var(--bad-soft)','var(--bad)');
    } else {
      poly([[0,C.a],[0,e.pb],[e.Q,e.pb]],'var(--accent-soft)');
      poly(C.c<0?[[0,e.pb],[e.Q,e.pb],[e.q0,0],[0,0]]:[[0,e.pb],[e.Q,e.pb],[0,C.c]],'var(--ok-soft)');
    }
    const dq0=Math.max(0,(C.a-C.ymax)/C.b), dq1=Math.min(600,C.a/C.b);
    svgEl('line',{x1:X(dq0),y1:Y(C.a-C.b*dq0),x2:X(dq1),y2:Y(C.a-C.b*dq1),stroke:'var(--accent)','stroke-width':2.6},svg);
    const sq0=C.c<0?r.q0:0, sq1=Math.min(600,(C.ymax-C.c)/C.d);
    svgEl('line',{x1:X(sq0),y1:Y(Math.max(0,C.c+C.d*sq0)),x2:X(sq1),y2:Y(C.c+C.d*sq1),stroke:'var(--g1)','stroke-width':2.6},svg);
    if(C.c<0) svgEl('line',{x1:X(0),y1:Y(0),x2:X(r.q0),y2:Y(0),stroke:'var(--g1)','stroke-width':2.6},svg);
    wlabel(svg, X(dq1)-4, Y(C.a-C.b*dq1)-8, 'D', 'var(--accent)', 'end');
    wlabel(svg, X(sq1)-8, Y(C.c+C.d*sq1)+14, 'S', 'var(--g1)', 'end');
    svgEl('circle',{cx:X(e.Q),cy:Y(e.pb),r:4.5,fill:'var(--ink)'},svg);
    $('.tx-pb',el).textContent=d2(r.pb); $('.tx-ps',el).textContent=d2(r.ps); $('.tx-q',el).textContent=Math.round(r.Q);
    $('.tx-rev',el).textContent=d0(r.rev); $('.tx-dwl',el).textContent=d0(dwl); $('.tx-cs',el).textContent=`${d0(r.cs)} / ${d0(r.psur)}`;
    const m=$('.msg',el);
    if(t===0){ m.innerHTML=`No tax: buyers and sellers both face $5.00 and 300 pairs sell. Total surplus is ${d0(e.cs+e.psur)}, the most this market can produce.`; return; }
    const bb=r.pb-5, sb=5-r.ps, pct=Math.round(100*bb/t);
    const who = k==='eq' ? 'The two sides are equally elastic, so they split it evenly.' : k==='id' ? 'Demand is the inelastic side: buyers keep buying, so they bear most of it.' : 'Supply is the inelastic side: sellers can\'t cut back, so they bear most of it.';
    m.innerHTML = `Buyers bear <b>${d2(bb)}</b> (${pct}%) and sellers <b>${d2(sb)}</b> (${100-pct}%) of the ${d2(t)} tax. ${who} Total surplus falls from ${d0(e.cs+e.psur)} to ${d0(r.cs+r.psur+r.rev)} counting revenue; the ${d0(dwl)} gap is deadweight loss.`;
  };
  $$('.tx-c button',el).forEach(b=>b.onclick=()=>{ k=b.dataset.k; $$('.tx-c button',el).forEach(x=>x.setAttribute('aria-pressed',x===b)); draw(); });
  T.addEventListener('input',draw); draw();
};

{ id:'l1', title:'Scarcity and Opportunity Cost', mins:25, src:'Course video 1.1 · Textbook 1.1, 1.2, 2.1, 2.3',
  oneline:'You can\'t have everything, so every choice costs you the best thing you gave up.',
  body:`
<h2>The problem behind all of economics</h2>
<p>You have 24 hours in a day and a limited amount of money. You want more than they can cover. That gap is <b>scarcity</b>: wants are bigger than the resources to satisfy them.</p>
<p><b>Economics</b> is the study of how people and societies choose to use scarce resources. Every person, business and country faces scarcity, even very rich ones. A billionaire still has only 24 hours.</p>
<div class="terms">
${term('Scarcity','Wants are greater than the resources available. The basic economic problem.')}
${term('Resources for people','Mostly time and money.')}
${term('Resources for firms','The <b>factors of production</b>: <b>land</b> (natural resources), <b>labor</b> (human work), <b>capital</b> (tools, machines, buildings) and <b>entrepreneurship</b> (organizing the others and taking the risk).')}
${term('Trade-off','Choosing more of one thing means less of another.')}
</div>
<p>Watch out for <b>capital</b>. In everyday talk it means money. In economics it means things made to produce other things: an oven, a laptop, a delivery van.</p>

<h2>Opportunity cost</h2>
<div class="analogy"><div class="eyebrow">Analogy</div><p>You have one free Saturday night. You could go to a friend's party, pick up a paid shift, or study. You go to the party. If the shift was your next favorite option, the cost of the party is that shift, not "the shift plus studying plus everything else."</p></div>
<p><b>Opportunity cost</b> is the value of the <b>next best alternative</b> you give up when you make a choice. Only one option counts: the one you would have picked otherwise.</p>
<p>Your course's simplest example: you have $5, and a latte and a notebook each cost $5. You can only buy one. Buy the latte and the opportunity cost is the notebook.</p>
<div data-widget="snooze"></div>
<p>The snooze example shows two big points:</p>
<ul>
<li><b>Opportunity costs often grow</b> as you do more of something. The fourth press costs far more than the first. (Not always: on a straight budget line every burger costs the same 4 tickets.)</li>
<li><b>Opportunity costs are personal and situational.</b> The same press is costly on a workday and nearly free on a lazy Saturday.</li>
</ul>

<h2>Worked example: the $5 lunch</h2>
<p>From the textbook. Buying lunch costs $8 a day. Packing one costs $3. The opportunity cost of buying is the $5 difference.</p>
<div class="math">$8 − $3 = $5 a day<br>$5 × 250 workdays = <b>$1,250 a year</b></div>
<p>"$5 a day" sounds small. "A $1,250 vacation" might change your choice. Same cost, framed as the thing you actually give up.</p>

<h2>Opportunity cost isn't only money</h2>
<p>Many costs are time. The textbook estimates that if 800 million air passengers each spend an extra 30 minutes in security, and their time is worth $20 an hour, the opportunity cost is about <b>$8 billion a year</b>, even though nobody writes a check for it.</p>
<div class="math">800,000,000 × 0.5 hours × $20 = $8,000,000,000</div>
`,
  deeper:`
<h3>The full cost of college</h3>
<p>The cost of a year of college is the tuition and books <b>plus</b> the wages you don't earn while you're in class. With made-up but realistic numbers: $20,000 tuition + $30,000 of forgone wages = <b>$50,000</b> a year. Exams love this. If an answer only counts tuition, it's missing the biggest piece.</p>
<h3>A budget is a picture of opportunity cost</h3>
<div data-widget="budget"></div>
<p>The slope of the budget line equals −(price of the horizontal-axis good ÷ price of the vertical-axis good). With bus tickets across and burgers up, the slope is −$0.50 ÷ $2 = −0.25: each ticket costs ¼ burger. Flip it and each burger costs 4 tickets, whatever the budget. Lesson 2's PPF is the same idea for a whole economy.</p>
<h3>Micro vs. macro</h3>
<p>The textbook compares economics to studying a lake. One scientist studies particular fish and plants (<b>microeconomics</b>: individual households, workers, firms and markets). Another studies the whole lake's food chain (<b>macroeconomics</b>: unemployment, inflation, total output). Same lake, two views.</p>
<h3>Positive vs. normative</h3>
<div class="terms">
${term('Positive statement','Describes how things are. Testable. "A higher minimum wage reduces teen employment."')}
${term('Normative statement','Says how things should be. A value judgment. "The minimum wage should be higher." Look for <i>should</i>, <i>ought</i>, <i>fair</i>.')}
</div>
<p>A positive statement can be false and still be positive. What matters is whether data could check it.</p>`,
  practice:['l1-def','l1-shift','l1-capital','l1-g-budget','l1-g-lunch','l1-positive','l1-micro'],
  links:[ {k:'Article',t:'Opportunity Cost',s:'Econlib',u:'https://www.econlib.org/library/Topics/HighSchool/OpportunityCost.html',w:'Short, plain definition with everyday examples, including why the biggest cost of college is lost income.'} ] },

{ id:'l2', title:'The Production Possibilities Frontier', mins:30, src:'Course video 1.2 · Textbook 2.2',
  oneline:'A curve that shows every best-possible mix of two goods, and what each extra unit really costs.',
  body:`
<h2>From one person to a whole economy</h2>
<p>Lesson 1 was about one person's choices. A whole country faces the same problem: limited workers, land and machines, and many things it could make with them.</p>
<div class="analogy"><div class="eyebrow">Analogy</div><p>A pizzeria has one kitchen crew for the night. Every hour the crew spends on calzones is an hour not spent on pizzas. If you listed every best-possible combination (40 pizzas and 0 calzones, 30 and 12, and so on) and drew it, you'd have a production possibilities frontier.</p></div>
<p>The <b>production possibilities frontier (PPF)</b>, also called the production possibilities curve, shows the <b>maximum</b> combinations of two goods an economy can make when it uses all its resources and current technology.</p>
<p>It rests on simplifying assumptions:</p>
<ul>
<li>Only <b>two goods</b> (real economies make millions; two keeps the picture readable).</li>
<li><b>Fixed resources and technology</b> at this moment: it's a snapshot in time.</li>
<li>Resources <b>can be used for either good</b>, but some are better at one than the other.</li>
</ul>

<h2>Worked example: boots and jackets</h2>
<p>Your course's economy makes leather boots and leather jackets:</p>
${table(['Point','A','B','C','D','E'],[['Boots',0,20,40,60,80],['Jackets',100,90,70,40,0],['Change in boots','','+20','+20','+20','+20'],['Change in jackets','','−10','−20','−30','−40'],['Cost of 1 boot','','0.5 jacket','1 jacket','1.5 jackets','2 jackets']],[[4,1],[4,4]])}
<p>Each step adds the same 20 boots, but the jackets you give up grow: 10, 20, 30, then 40. This is the <b>law of increasing opportunity cost</b>.</p>
<ul>
<li>The cost is <b>low</b> while jackets are plentiful (A → B).</li>
<li>The cost is <b>high</b> when jackets are scarce (D → E): you're pulling your very best jacket makers into boots.</li>
</ul>
<p>That rising cost is why the curve <b>bows outward</b>.</p>
<div data-widget="ppf"></div>

<h2>Three kinds of points</h2>
<div class="terms">
${term('On the curve','<b>Efficient.</b> All resources are used. More of one good means less of the other.')}
${term('Inside the curve','<b>Inefficient.</b> Resources are idle or wasted (unemployment, unused factories). You could get more of both.')}
${term('Outside the curve','<b>Unattainable</b> with today\'s resources and technology.')}
</div>

<h2>What moves the curve</h2>
<p>Only two things shift the whole frontier: a change in <b>resources</b> or a change in <b>technology</b>.</p>
<ul>
<li><b>Equal shift:</b> the change hits both goods about the same (fewer workers, better general technology).</li>
<li><b>Biased shift:</b> the change hits one good more. Rubber is used heavily for boots and barely for jackets, so a cut in the rubber supply pulls in the boots end far more.</li>
</ul>
<p>Choosing a different mix is a <b>movement along</b> the curve, not a shift. Putting unemployed workers back to work is a move <b>toward</b> the curve, not a shift.</p>`,
  deeper:`
<h3>Why some PPFs are straight lines</h3>
<p>If every resource were equally good at both goods, each boot would always cost the same number of jackets. Constant opportunity cost = a straight-line PPF. You'll see straight lines in Lesson 3, because one person's single day of work is treated that way.</p>
<h3>Diminishing returns</h3>
<p>The textbook explains the bow with the <b>law of diminishing returns</b>: as you pour more resources into one area, each extra batch adds less. The first dollars into healthcare save many lives; the last few add little.</p>
<h3>Productive vs. allocative efficiency</h3>
<div class="terms">
${term('Productive efficiency','You can\'t make more of one good without making less of another. Every point on the curve has it.')}
${term('Allocative efficiency','The mix on the curve that society actually wants most. Only one point has it.')}
</div>
<h3>Today's choice shapes tomorrow's curve</h3>
<p>An economy that puts more resources into <b>capital goods</b> (machines, factories) and fewer into goods for consumption today tends to see its PPF shift out further in the future. Less fun now, more capacity later. This is a common exam question.</p>
<h3>Same diagram, different labels</h3>
<p>The textbook's tip: Lesson 1's budget line and this PPF work the same way. Both show <b>scarcity</b> (a limit), <b>trade-offs</b> (the slope) and <b>efficiency</b> (being on the line). One difference: a budget line is straight because prices stay fixed, while a PPF is usually bowed out because of diminishing returns. You'll meet this kind of diagram again with new labels.</p>`,
  practice:['l2-inside','l2-shift','l2-boots','l2-bowed','l2-rubber','l2-g-ppf','l2-straight'],
  links:[ {k:'Video',t:'The Production Possibilities Curve',s:'Economics for Everyone, University of Chicago',u:'https://econ4everyone.uchicago.edu/video/the-production-possibilities-curve/',w:'A second explanation of the same curve, if the lesson didn\'t fully click.'} ] },

{ id:'l3', title:'Comparative Advantage and Trade', mins:35, src:'Course video 1.3 · Textbook 1.1, 2.2',
  oneline:'Specialize in what costs you the least to make, trade for the rest, and both sides end up with more.',
  body:`
<h2>Two ways to get what you need</h2>
<ul>
<li><b>Self-sufficiency:</b> make everything you consume yourself.</li>
<li><b>Specialization and trade:</b> make one thing and trade it for the rest.</li>
</ul>
<p><b>Gains from trade</b> means you can <b>consume more while working the same amount</b>.</p>
<div class="analogy"><div class="eyebrow">Analogy</div><p>A lawyer types faster than her assistant. Should she do her own typing? No. An hour of her typing is an hour she isn't billing clients at $300. The assistant gives up much less to type. She's better at both jobs, but typing is relatively cheaper for the assistant.</p></div>

<h2>Two kinds of "better"</h2>
<div class="terms">
${term('Absolute advantage','Can produce <b>more</b> of a good with the same time and resources.')}
${term('Comparative advantage','Can produce a good at a <b>lower opportunity cost</b>. This is what decides who should make what.')}
</div>

<h2>Worked example: the seamstress and the baker</h2>
<p>Your course's example. Output in one 8-hour day:</p>
${table(['One day','Bread','Sweaters'],[['Seamstress','8','4'],['Baker','24','8']])}
<p>The baker makes more of <b>both</b>: absolute advantage in bread and sweaters. Does that mean he shouldn't trade? Look at opportunity costs.</p>
<p><b>Step 1: find each opportunity cost.</b> Same day of work, so divide.</p>
<div class="math">Seamstress: 8 bread = 4 sweaters → 1 bread = ½ sweater, 1 sweater = 2 bread<br>Baker: 24 bread = 8 sweaters → 1 bread = ⅓ sweater, 1 sweater = 3 bread</div>
${table(['Opportunity cost','1 bread costs','1 sweater costs'],[['Seamstress','½ sweater','2 bread'],['Baker','⅓ sweater','3 bread']],[[1,1],[0,2]])}
<p><b>Step 2: lower cost wins.</b> The baker gives up less to make bread (⅓ &lt; ½), so he has the comparative advantage in <b>bread</b>. The seamstress gives up less to make sweaters (2 &lt; 3), so she has it in <b>sweaters</b>.</p>
<p><b>Step 3: specialize and trade.</b> She makes 4 sweaters; he makes 24 bread. They trade 2 sweaters for 5 bread.</p>
${table(['','Without trade (split day)','With trade'],[['Seamstress','4 bread, 2 sweaters','<b>5 bread</b>, 2 sweaters'],['Baker','12 bread, 4 sweaters','19 bread, 2 sweaters']])}
<p>Is the baker better off with fewer sweaters? Check what he could make alone. If he made 2 sweaters, that takes 2 hours, leaving 6 hours for 18 bread. Trade gets him <b>19</b>. That point is outside his own PPF: impossible for him alone. Same for her: 2 sweaters take her 4 hours, leaving time for only 4 bread; trade gets her <b>5</b>.</p>
<div data-widget="trade"></div>

<h2>Rules to remember</h2>
<ul>
<li>You can have an absolute advantage in both goods, but <b>never a comparative advantage in both</b>. The two costs mirror each other: if yours is lower for one good, it is higher for the other.</li>
<li>As long as opportunity costs <b>differ</b>, both sides can gain from trade.</li>
<li>The trade price must fall <b>between</b> the two opportunity costs. Here 1 sweater must trade for between 2 and 3 bread (2 sweaters for 5 bread = 2.5 each).</li>
</ul>`,
  deeper:`
<h3>The exam trap: output vs. input problems</h3>
<p>Questions give numbers in one of two ways, and the division flips.</p>
<div class="terms">
${term('Output problem','"Makes 8 bread or 4 sweaters per day." Opportunity cost of bread = sweaters ÷ bread. <b>Other goes Over.</b>')}
${term('Input problem','"Takes 1 hour per bread, 2 hours per sweater." Opportunity cost of bread = bread hours ÷ sweater hours. <b>Other goes Under.</b>')}
</div>
<p>Check: the seamstress needs 1 hour per bread and 2 per sweater. Bread costs 1 ÷ 2 = ½ sweater. Same answer as the output method.</p>
<h3>Countries work the same way</h3>
<p>The textbook's example: Brazil can grow a lot of sugar cane per acre but not much wheat; the U.S. is the reverse. Brazil has the comparative advantage in sugar cane, the U.S. in wheat. On a graph with wheat on the horizontal axis, Brazil's PPF is steeper: each extra unit of wheat costs Brazil a lot of sugar cane.</p>
<h3>Where this idea came from</h3>
<p>Adam Smith showed in 1776 that dividing work into specialized tasks raises output (his pin factory). David Ricardo later showed that trade pays even when one side is better at everything. Paul Krugman's essay below explains why smart people still find that hard to accept.</p>`,
  practice:['l3-defs','l3-g-oc','l3-g-ca','l3-both','l3-input','l3-terms'],
  links:[ {k:'Video',t:'The Principle of Comparative Advantage (60 Second Adventures in Economics)',s:'OpenLearn, The Open University',u:'https://www.open.edu/openlearn/society/politics-policy-people/economics/60-second-adventures-economics-the-principle-comparative-advantage',w:'A short animated take on Ricardo\'s idea with countries instead of people.'},
          {k:'Article',t:'Ricardo\'s Difficult Idea',s:'Paul Krugman, MIT',u:'https://web.mit.edu/krugman/www/ricardo.htm',w:'Go deeper: why comparative advantage is so often misunderstood. Longer, more advanced read.'} ] },

{ id:'l4', title:'Economic Systems', mins:45, src:'Modern States video 1.4a and Module 1 slides 26-33 · Course textbook (OpenStax) §1.3, §1.4',
  sources:['MS','OS13','OS14','CB','FED','ELC','ELP','ELH','T2U'],
  oneline:'Every society must decide what to make, how much to make, and who gets it. Who owns resources and who allocates them shapes the answer, and the circular flow shows how a market economy decides without anyone in charge.',
  body:`
<h2>What an economic system is</h2>
<!-- src: MS (video 1.4a definition and three questions; slide 27); OS14 (who coordinates, "produced in the best way possible") -->
<p>Lesson 1 showed that resources are ${dt('scarcity','scarce')}. Because a society can't make everything, it needs a way to organize production. Your course defines an ${dt('econ-system','<b>economic system</b>')} as a system of <b>production, resource allocation, exchange and distribution</b> of goods and services.</p>
<p>Every economic system has to answer the same three questions, whether it means to or not:</p>
<ol><li><b>What</b> to produce? More phones or more laptops? More housing or more parks?</li><li><b>How much</b> to produce? A million phones or ten million?</li><li><b>Who receives the output?</b> Once the phones exist, who gets them? (Textbooks often call this "for whom.")</li></ol>
<p>Many textbooks add a fourth angle: <b>how</b> to produce, meaning with which methods. Your course textbook asks it this way: who makes sure televisions "are produced in the best way possible?" Treat it as a companion to the three: once a society decides what and how much, it still has to pick a method.</p>
<div class="analogy"><div class="eyebrow">Analogy</div><p>Think of a big family potluck. Someone has to decide which dishes come (what), how much of each (how much), and who takes the leftovers home (who receives). The menu could be the same as every year (<b>tradition</b>). One organizer could assign every dish (<b>command</b>). Everyone could bring what they think people will eat (<b>market</b>). Or the organizer sets a few rules and leaves the rest free (<b>mixed</b>). Same three questions every time; what changes is <i>who</i> answers them.</p></div>
<div data-check="l4c-howmuch"></div>

<h2>Property rights</h2>
<!-- src: MS (video 1.4a four components; slides 28-31: owners can be individuals, associations or government); ELP (bundle of rights, incentives); ELC (Hardin 1968, Lloyd 1832, remedies); fishing numbers are made up -->
<p>Your course puts property rights first for a reason: <b>who owns what shapes which system you get</b>. <b>Property rights</b> are the rules that say who owns a resource and who decides how it is used. The owner can be an individual, an association (like a club or co-op) or the government.</p>
<p>The course lists four parts (Econlib's readings describe the same bundle):</p>
<ol><li>The right to <b>use</b> the good</li><li>The right to <b>earn income</b> from it</li><li>The right to <b>transfer</b> it to someone else</li><li>The right to <b>enforce</b> those rights</li></ol>
<p><b>Why they matter: incentives.</b> An owner bears the cost of neglecting something and keeps the gain from improving it. That changes behavior, whatever the owner's character.</p>
<div class="analogy"><div class="eyebrow">Analogy</div><p>You change the oil in a car you own, because you'll still be driving it in five years. A rental car you return on Friday gets no such care. Same driver, different ownership, different incentive.</p></div>
<p>Property rights also make markets possible. A household can only sell its land, labor or savings if they are its own, and a store only stocks shelves if it knows it can keep what it earns and that contracts will be enforced.</p>
<p><b>When anyone can use it: the ${dt('commons','tragedy of the commons')}.</b> If a resource is <b>open access</b> (anyone can use it and no one limits use), each user keeps the full gain from using a little more but shares the cost with everyone else. Ecologist Garrett Hardin made this famous in 1968, building on an 1832 example of an English village pasture: each herder adds animals, and the pasture gets overgrazed.</p>
<p><b>Example (made-up numbers).</b> Ten people fish a lake anyone can fish, with no limits. Each extra fish is worth $5 to whoever catches it. But catching it shrinks next year's stock, costing the group $8, split ten ways: $0.80 each.</p>
<div class="math">One fisher's view: gain $5 vs. own share of the cost $0.80 → keep fishing<br>The group's view: gain $5 vs. total cost $8 → lose $3 on every extra fish</div>
<p>Every fisher acts sensibly for themselves, and the lake is fished out. The problem is the incentive, not carelessness: a fisher who holds back just leaves more fish for the others. Giving someone ownership, setting rules like catch limits or ${dt('quota','quotas')}, or letting the community manage the lake can put the full cost back on the decision. You'll see this again in Unit 7 (${dt('market-failure','market failure')}).</p>
<div data-check="l4c-commons,l4c-rights"></div>

<h2>Sorting systems: who owns, who allocates</h2>
<!-- src: MS (video 1.4a grid; slide 32). The grid is the course's framework; it is not in OpenStax §1.4 or the CLEP outline. -->
<p>Because property rights matter so much, your course sorts economic systems with two separate questions: who <b>owns</b> resources, and who <b>allocates</b> them (decides how they are used). Each answer is either private or planned (government).</p>
<div class="tbl-wrap"><table><thead><tr><th></th><th>Planned (government) ownership</th><th>Private ownership</th></tr></thead><tbody>
<tr><td><b>Planned allocation</b></td><td>Socialism (socially planned economy)</td><td>Command capitalism</td></tr>
<tr><td><b>Private (market) allocation</b></td><td>Market socialism</td><td>Capitalism</td></tr></tbody></table></div>
<p>The two corners are the extremes. <b>Capitalism</b> (private owners, private allocation) is the one the U.S. is closest to. <b>Socialism</b> (government owns and plans) is the opposite corner. The middle cells mix them: government-owned factories that let prices decide what they make are <b>market socialism</b>; private businesses that the government tells what to make are <b>command capitalism</b>.</p>
<p>To read it, answer the two questions separately. The common slip is answering only one: private ownership alone doesn't make it capitalism, and government decisions alone don't make it socialism.</p>
<div data-check="l4c-grid"></div>

<h2>The textbook's four systems</h2>
<!-- src: OS14 (all four definitions, healthcare and education free, Cuba and North Korea, U.S. position, China and Russia, "little economic progress or development"); MS (table rows) -->
<p>Your course textbook sorts systems a second way, by how decisions get made. You'll see these four names on most exams, so learn both lenses:</p>
<div class="terms">
${term('Traditional','Decisions follow custom. Jobs stay in the family, most families farm the crops they always have with traditional methods, and what you produce is what you consume. The textbook: "there is little economic progress or development."')}
${term('Command','A ruler or government decides what is made, how it is made, what prices are charged and what workers are paid. Many necessities, like health care and education, are provided free. The textbook names Cuba and North Korea as command economies today.')}
${term('Market','Decisions are spread across millions of buyers and sellers: they are '+dt('decentralized','decentralized')+'. Resources and businesses are privately owned, firms supply what people demand, and a '+dt('market','market')+' brings buyers and sellers together.')}
${term('Mixed','Elements of more than one. The textbook: "Most economies in the real world are mixed." The U.S. sits toward the market end; many European and Latin American countries are market-oriented with more government involvement; China and Russia remain closer to the command end.')}
</div>
<p>The two lenses line up roughly: a market economy looks like the capitalism corner of the grid, and a command economy like the socialism corner. Here is how each system answers the questions, and the trade-off each one makes:</p>
<div class="tbl-wrap"><table class="wrap-cells"><thead><tr><th></th><th>Traditional</th><th>Command</th><th>Market</th></tr></thead><tbody>
<tr><td><b>What and how much?</b></td><td>What was always made</td><td>Whatever planners choose, often with production targets</td><td>Whatever buyers are willing to pay for</td></tr>
<tr><td><b>Methods</b></td><td>Passed down</td><td>Set by planners</td><td>Each firm picks its own; competition pushes it toward cheaper, better ones</td></tr>
<tr><td><b>Who receives?</b></td><td>By custom and family role</td><td>Planners decide; some necessities, like health care and education, are provided free</td><td>People who can pay. Your income depends on what you earn selling your resources, such as your labor</td></tr>
<tr><td><b>Strength</b></td><td>Predictable: everyone knows their role</td><td>Can push resources toward the government's goals, such as more equal outcomes</td><td>Strong ${dt('incentive','incentives')} to work and innovate; wide variety; prices adjust on their own</td></tr>
<tr><td><b>Weakness</b></td><td>Little growth or change</td><td>Planners lack good information and few people are rewarded for new ideas, so waste and shortages are common; ${dt('black-market','black markets')} appear</td><td>Some people can't earn enough to buy what they need; some goods are under-provided (like national defense); costs that fall on others are ignored</td></tr>
</tbody></table></div>
<p>Read the table across a row and you see the mechanism. A command economy's weakness comes straight from its "who decides" answer: one planning office can't know what millions of people want, and workers gain little from finding better ways. A market's weakness also comes from its answer: goods go to people who can pay, so people with little income get little.</p>
<p>A mixed economy tries to keep the market's strengths and patch its weaknesses: mostly private businesses and market prices, plus government for things like schools, roads, help for people with low incomes, and rules against fraud. The textbook: "There is no such thing as an absolutely free market," and "even the most command-oriented economies operate using markets."</p>
<div data-widget="sort"></div>
<div data-check="l4c-forwhom,l4c-cmdweak"></div>

<h2>How prices coordinate a market</h2>
<!-- src: T2U (signal, incentive, rationing functions); ELH (invisible hand); OS14 ("market forces, not governments"). Beyond video 1.4a: added because the CLEP tests how market systems decide. Orange example is made up. -->
<p>The textbook says that in a market economy "economic decisions are determined by market forces, not governments." But with no central planner, what tells a farmer how much wheat to grow or a store how much to stock? <b>Prices.</b> A price does three jobs at once:</p>
<div class="terms">
${term('Signal','A price carries information. A rising price says "this is scarcer than before"; a falling price says "there is more than people want."')}
${term('Incentive','A higher price rewards sellers who produce more and nudges buyers to use less, or switch to something else.')}
${term('Rationing','When there isn\'t enough to go around, price decides who gets the good: the buyers willing and able to pay that price.')}
</div>
<p><b>Example (made-up numbers).</b> A frost destroys half of Florida's orange crop, and the price of orange juice jumps from $4 to $6 a carton. Nobody issued an order, yet:</p>
<ul><li><b>Signal:</b> growers in California and Brazil learn that oranges are scarce.</li><li><b>Incentive:</b> at $6 it pays them to ship more juice to Florida stores, and shoppers who only half-wanted juice buy milk instead.</li><li><b>Rationing:</b> the juice that is left goes to the people who value it most at $6.</li></ul>
<p>Notice the chain: one price change carries the news (signal), changes what people want to do (incentive), and settles who ends up with the juice (rationing). A planner would need all three pieces of information to get the same result. This is what Adam Smith meant by the ${dt('invisible-hand','<b>invisible hand</b>')} (see Go deeper): self-interested choices, steered by prices, end up coordinating a whole economy. You'll study exactly how prices are set in Unit 2, ${dt('supply-demand','Supply and Demand')}.</p>
<div data-check="l4c-signal"></div>

<h2>How a market economy flows</h2>
<!-- src: MS (video 1.4a: goods market and "market for inputs" such as land, labor and capital; slide 33 diagram); OS13 (circular flow, households and firms, two markets, "stripped down to the essentials"); FED (four factor payments) -->
<p>Your course ends video 1.4a with a picture of a market-based capitalist economy. Economists use a ${dt('model','<b>model</b>')} for this: a simplified picture that keeps only the parts you need. The <b>circular flow model</b> shrinks the whole economy down to two players, ${dt('household','households')} and ${dt('firm','firms')}, trading in two markets.</p>
<div class="tbl-wrap"><table class="wrap-cells"><thead><tr><th></th><th>Goods and services market (product market)</th><th>Factor market ("market for inputs")</th></tr></thead><tbody>
<tr><td><b>What is sold</b></td><td>Products: food, phones, haircuts, streaming</td><td>${dt('factors','Factors of production')}: ${dt('land','land')}, ${dt('labor','labor')}, ${dt('capital','capital')}, ${dt('entrepreneurship','entrepreneurship')}</td></tr>
<tr><td><b>Sellers</b></td><td>Firms</td><td>Households</td></tr>
<tr><td><b>Buyers</b></td><td>Households</td><td>Firms</td></tr>
<tr><td><b>Money flow</b></td><td>Household spending → firm ${dt('revenue','revenue')}</td><td>Wages, rent, interest, profit → household income</td></tr>
</tbody></table></div>
<p>Build the diagram one piece at a time:</p>
<div data-widget="circular"></div>
<p>Each factor of production earns its own kind of payment:</p>
${table(['Factor','Payment','Example'],[['Land (and other natural resources)','Rent','A family leases its field to a car dealership'],['Labor','Wages','A cashier\'s paycheck'],['Capital (tools, machines, buildings)','Interest','A saver lends a bakery money for an oven and is paid interest'],['Entrepreneurship','Profit','A shop owner keeps what is left after paying all costs']])}
<p>Two ideas make the model click:</p>
<ul><li><b>Money always moves opposite to the stuff.</b> Every blue arrow (goods or resources) is matched by a gold arrow (money) going the other way. That's because every arrow is half of a trade: you only hand over money in exchange for something.</li><li><b>Everyone plays two roles.</b> Households are buyers in the product market and sellers in the factor market. Firms are the reverse. A household can only spend what it earned by selling its resources, which is why the loop closes.</li></ul>
<p class="small muted">Your course textbook draws a simpler version with only labor in the bottom market (a "labor market" paying "wages, salaries and benefits"). The video and slides widen it to all inputs, as above. Same idea, more detail.</p>
<p><b>Why it matters for this course:</b> Units 2 to 5 study the product market (supply and demand, consumer choice, costs, market structures). Unit 6 studies the factor market (how wages and other factor payments are set). The CLEP outline is built the same way, so the circular flow is the map for the rest of the course.</p>
<div data-check="l4c-hhroles,l4c-entre"></div>

<h2>Worked example: one bakery's circle</h2>
<!-- src: FED (factor payments); numbers are made up -->
<p>Imagine an economy with one bakery and the households around it. In one week (made-up numbers):</p>
<ul><li>The bakery pays <b>$1,000 in wages</b> to its workers, <b>$200 rent</b> to the family that owns its land, and <b>$100 interest</b> to a neighbor who lent it money for the oven.</li><li>Households buy <b>$1,500</b> of bread. That is the bakery's revenue.</li></ul>
<div class="math">Profit = revenue − other factor payments<br>= $1,500 − $1,000 − $200 − $100 = <b>$200</b> to the owner<br><br>Household income = $1,000 + $200 + $100 + $200 = <b>$1,500</b></div>
<p>Check: income equals spending. The $1,500 households spent came back to households, split among the four factors. In this simple model, households spend it all again next week, and the circle keeps turning. Notice that profit isn't a fixed payment like wages; it is what's left over, so it can shrink or even turn into a loss.</p>
<div data-widget="bakery"></div>
<div data-check="l4c-profit"></div>

<h2>Which market is it?</h2>
<!-- src: OS13; FED -->
<p>Exam questions often describe a transaction and ask where it fits. Use one test: <b>is a household buying a product, or selling a resource?</b> Buying a product puts it in the goods and services market. Selling labor, land, capital or entrepreneurship puts it in the factor market. Then check the money: it always flows the opposite way to the thing sold.</p>
<div data-widget="cfsort"></div>
<div data-check="l4c-market"></div>

<h2>Common mistakes</h2>
<!-- Entries in order are M1-M6; each is used as a wrong choice in this lesson's questions (see L4TAGS mis). -->
<div class="mistakes"><p class="eyebrow">Watch out for these</p><ul>
<li><span class="wrong">"Money and goods go the same way."</span>They never do. Money always moves opposite to the goods or resources it pays for, because each arrow is one half of a trade.</li>
<li><span class="wrong">"Households only buy."</span>Households buy in the product market but <b>sell</b> in the factor market. Firms are the reverse.</li>
<li><span class="wrong">"Rent means paying a landlord, and profit is a fixed payment."</span>In the circular flow, each factor has its own payment: rent for land, wages for labor, interest for capital, profit for entrepreneurship. Profit is what's left over, so it can be zero or negative.</li>
<li><span class="wrong">"Market economies have no government, and command economies have no markets."</span>The textbook: "There is no such thing as an absolutely free market," and "even the most command-oriented economies operate using markets."</li>
<li><span class="wrong">"Systems differ in the questions they ask."</span>Every system answers the same three questions (what, how much, who receives). They differ in <b>who</b> answers them: custom, a planner, or buyers and sellers. On your course's grid, answer both questions (who owns, who allocates) before naming the system.</li>
<li><span class="wrong">"People care for what they own because they're responsible, and overuse shared things because they're careless."</span>It's the incentive, not character. Owners keep the gains and bear the costs; open-access users share the costs, so even careful people overuse. The fix is changing the incentive: ownership, limits or community rules.</li>
</ul></div>

<h2>Recap</h2>
<div class="callout">
<ol>
<li>An economic system organizes production, allocation, exchange and distribution. Every one answers <b>what, how much</b> and <b>who receives the output</b>; systems differ in who decides.</li>
<li><b>Property rights</b> (use, earn income, transfer, enforce) decide who owns and who decides. They give owners an incentive to care for resources; without them, open-access resources get overused (the tragedy of the commons).</li>
<li>Your course's grid sorts systems by <b>who owns</b> and <b>who allocates</b>: capitalism, socialism, command capitalism, market socialism.</li>
<li>The textbook's four names: <b>traditional, command, market, mixed</b>. Real economies are mixed; the U.S. sits toward the market end, Cuba and North Korea toward the command end.</li>
<li>In a market economy, <b>prices</b> signal, create incentives and ration, with no one in charge.</li>
<li>The <b>circular flow</b>: firms sell products to households; households sell land, labor, capital and entrepreneurship to firms for rent, wages, interest and profit. Money always moves opposite to the stuff, spending equals income, and you place a transaction by asking whether a household is <b>buying a product</b> or <b>selling a resource</b>.</li>
</ol>
<p><b>How the CLEP tests this:</b> the exam outline lists "Economic systems" and "Property rights and the role of incentives" under Basic Economic Concepts (10% to 16% of the exam). Expect short "Which of the following" questions that test terms (identify a system from a description), graphs (which flow an arrow shows) and simple models (which market households sell in, which way a payment flows).</p>
</div>`,
  deeper:`
<h3>Models simplify on purpose</h3>
<p>The basic circular flow leaves out government, banks and foreign trade. The textbook calls it "stripped down to the essentials." That's the point of a model: like an architect's tabletop model, it keeps only what you need to see. Economists add pieces back when a question needs them.</p>
<h3>Adding government to the circle</h3>
<p>Put government in the middle and three new kinds of flows appear (Federal Reserve Education's infographic, linked below, draws this version):</p>
<ul><li><b>Taxes</b> flow from households and firms to the government.</li><li><b>Government purchases</b>: the government buys in both markets, hiring workers (factor market) and buying things like paper and fuel (product market), to provide goods and services such as schools, bridges and defense. (A <b>pure public good</b> is a narrower idea you will meet in Unit 7: nonexcludable and nonrival, like national defense.)</li><li><b>Transfer payments</b> (to households, such as Social Security) and <b>subsidies</b> (to firms) are money with no good or service given back in return.</li></ul>
<p>Banks and foreign trade can be added the same way. You won't need them for this exam; macroeconomics uses them heavily.</p>
<h3>The invisible hand</h3>
<p>In <i>The Wealth of Nations</i> (1776), Adam Smith wrote that a person pursuing his own gain is "led by an invisible hand to promote an end which was no part of his intention." Nobody plans the whole economy, yet shelves get stocked. The essay "I, Pencil" below shows this with an ordinary pencil that no single person knows how to make.</p>
<h3>No market is completely free</h3>
<p>The textbook calls regulations "the rules of the game." Market-oriented economies keep them to a minimum: protecting private property, protecting people from violence, enforcing contracts, preventing fraud and collecting taxes. When rules are very heavy, <b>underground economies</b> appear: markets where buyers and sellers trade without the government's approval.</p>
<h3>Measuring economic freedom</h3>
<p>The textbook shows the Heritage Foundation's 2015 Index of Economic Freedom, which scored 178 countries. Hong Kong ranked 1st and the U.S. 12th; Cuba (177th) and North Korea (178th) were last, matching their place at the command end of the spectrum. Treat the rankings as rough estimates, as the textbook does.</p>
<h3>Globalization</h3>
<p>Textbook §1.4 ends with <b>globalization</b>: "the expanding cultural, political, and economic connections between people around the world." Cheaper shipping, better computing and telecommunications, and trade agreements have all pushed it along. One measure is <b>exports ÷ GDP</b>: the share of a country's total production (GDP, gross domestic product) sold abroad. This is a macroeconomics topic and isn't on the CLEP Microeconomics outline, so you won't be tested on it here.</p>`,
  practice:['l4-questions','l4-factor','l4-wages','l4-command','l4-grid','l4-rights','l4-us'],
  links:[ {k:'Diagram',t:'The Circular Flow (infographic, PDF)',s:'Federal Reserve Education',u:'https://www.federalreserveeducation.org/resources/infographics/infographic--circular-flow.pdf',w:'A one-page picture of the circular flow with government added, and which factor earns rent, wages, interest and profit.'},
          {k:'Textbook',t:'1.4 How to Organize Economies: An Overview of Economic Systems',s:'OpenStax, Principles of Microeconomics (newer 3rd edition, free online)',u:'https://openstax.org/books/principles-microeconomics-3e/pages/1-4-how-to-organize-economies-an-overview-of-economic-systems',w:'The same section as your course textbook\'s §1.4, in the current edition. Handy on a phone; wording differs in a few places.'},
          {k:'Article',t:'I, Pencil',s:'Leonard E. Read, via Econlib',u:'https://www.econlib.org/library/Essays/rdPncl.html',w:'A pencil tells its own story: thousands of strangers cooperate to make it with no one in charge. A classic picture of a market system.'} ] },

{ id:'l5', title:'Marginal Analysis and Incentives', mins:35, src:'Modern States video 1.4b and Module 1 slides 34-44 · Course textbook (OpenStax) §2.1',
  sources:['MS','OS21','OS7','CB','WAR','ELM'],
  oneline:'Good decisions compare the extra benefit of one more unit with its extra cost. Incentives change that comparison, and money already spent shouldn\'t.',
  body:`
<h2>What marginal analysis is</h2>
<!-- src: MS (video 1.4b definition, slides 36-38); OS21 (definition "on the margin", glossary) -->
<p>Lesson 4 showed markets coordinating millions of choices with no one in charge. This lesson zooms in on one choice and asks how a person or firm should make it.</p>
<p>Your course textbook defines ${dt('marginal-analysis','<b>marginal analysis</b>')} as the "examination of decisions on the margin, meaning a little more or a little less from the status quo." In economics, ${dt('marginal','<b>marginal</b>')} means <b>the next one</b>: the next slice, hour, worker or machine. Your course video applies it to business: firms look at how costs and benefits change when they change what they do.</p>
<div class="terms">
${term('Marginal benefit (MB)','The extra benefit from one more unit.')}
${term('Marginal cost (MC)','The extra cost of one more unit.')}
${term('The rule','Keep going while <b>MB ≥ MC</b>. Stop when the next unit\'s MB falls below its MC.')}
</div>
<p><b>Why look at the next unit instead of the whole?</b> Because the next unit is the only thing you are actually choosing. Everything you already have or already did stays the same either way, so it can't change the answer. Comparing totals can also hide a bad last step: a factory can be profitable overall while its newest shift loses money.</p>
<p class="small muted">Watch one phrase in video 1.4b: "cost per unit." The course means the cost of each <i>additional</i> unit. Total cost divided by the number of units is a different idea, ${dt('average-cost','average cost')}, which you'll meet in Unit 4.</p>
<div class="analogy"><div class="eyebrow">Analogy</div><p>The snooze button from Lesson 1 was marginal analysis. You never decided "how much sleep in total." You decided, press by press: are 10 more minutes worth what I'll give up this time?</p></div>
<div data-check="l5c-margin"></div>

<h2>Worked example: should the manufacturer expand?</h2>
<!-- src: MS (video 1.4b and slides 39-40: manufacturer's costs and benefits, "if the benefit outweighs the cost"); shift numbers are made up -->
<p>Your course's example is a manufacturer deciding whether to increase production. It lists what the expansion adds on each side:</p>
<ul><li><b>Extra costs:</b> new manufacturing equipment, more employees, larger or new facilities, and more materials for production.</li><li><b>Extra benefit:</b> more sales (${dt('revenue','revenue')}) from the added output.</li></ul>
<p>The course's rule: "If the benefit outweighs the cost for the firm, then it is a wise choice." Here it is with made-up numbers, one shift at a time:</p>
<div class="tbl-wrap"><table class="wrap-cells compact"><thead><tr><th>Per week</th><th>Extra cost</th><th>Extra revenue</th><th>Net</th></tr></thead><tbody>
<tr><td>Add a second shift</td><td>$9,000</td><td>$12,000 (1,200 units × $10)</td><td><b>+$3,000</b></td></tr>
<tr><td>Add a third shift</td><td>$11,000</td><td>$9,000 (900 units × $10)</td><td><b>−$2,000</b></td></tr></tbody></table></div>
<div class="math">Second shift: $12,000 − $9,000 = <b>+$3,000</b> → add it<br>Third shift: $9,000 − $11,000 = <b>−$2,000</b> → skip it<br>Both together: $21,000 − $20,000 = +$1,000, which looks fine but hides the losing third shift</div>
<p>In this made-up example, the third shift costs more (night pay, more wear on the machines) and sells less, because the easiest sales were already made by the first two. Marginal thinking judges each step on its own, so it catches that. Check: stopping after the second shift earns $3,000 a week, more than the $1,000 from running both.</p>
<div data-check="l5c-expand"></div>

<h2>People weigh costs and benefits too</h2>
<!-- src: MS (video 1.4b "not only firms but also consumers"; slide 41); OS21 (utility, diminishing marginal utility, Alphonso, ice cream) -->
<p>Your course: "All individuals weigh the costs and benefits of a choice and then make a decision." For people, the benefit is ${dt('utility','<b>utility</b>')}: the satisfaction or usefulness you get from a good.</p>
<p>Utility usually follows a pattern. Your course textbook's example: Alphonso's first few bus rides might get him to a job interview or a doctor's appointment, but later rides "may only serve to kill time on a rainy day." That is the ${dt('dmu','<b>law of diminishing marginal utility</b>')}: each extra unit tends to add less satisfaction than the one before. "The first slice of pizza brings more satisfaction than the sixth."</p>
<p>Try it with pizza (made-up values):</p>
<div data-widget="pizza"></div>
<p>Notice two things. The bars shrink, so the best stopping point is where the next bar drops below the price line. And total benefit keeps rising the whole time; only the <b>extra</b> benefit falls. This is also why people rarely make all-or-nothing choices: the textbook notes you wouldn't eat nothing but ice cream, because the last few servings would add very little.</p>
<div data-check="l5c-dmu"></div>

<h2>Incentives and disincentives</h2>
<!-- src: MS (video 1.4b definitions and examples; slides 41-43); WAR (UK sugar levy numbers) -->
<p>Your course: incentives and disincentives "work to change either the costs or the benefits of a specific decision." An ${dt('incentive','<b>incentive</b>')} makes a choice more beneficial (or cheaper), so people do more of it. A ${dt('disincentive','<b>disincentive</b>')} makes a choice more costly, so people do less of it.</p>
<p>Here are your course's examples:</p>
<div class="tbl-wrap"><table class="wrap-cells"><thead><tr><th>Incentives (raise benefit or lower cost)</th><th>Disincentives (raise cost)</th></tr></thead><tbody>
<tr><td>Buy-one-get-one sales</td><td>Taxes on cigarettes and alcohol</td></tr>
<tr><td>Bonus points for coming to class</td><td>Calorie counts at fast-food restaurants</td></tr>
<tr><td>A tax ${dt('subsidy','subsidy')} for new green technology</td><td>Pollution taxes</td></tr></tbody></table></div>
<p><b>The mechanism:</b> because people and firms stop where MB stops being at least MC, anything that moves MB or MC moves the stopping point. Lower the cost of a choice and more units pass the test; raise it and fewer do.</p>
<p><b>Real-world example.</b> The UK put a tax on high-sugar soft drinks in April 2018. It raised the cost of selling sugary drinks, so companies cut sugar to avoid it. University of Warwick researchers found that 52% of eligible drinks were liable for the tax before it was announced, and just 15% by February 2019.</p>
<p>Watch the trap: changing behavior doesn't make something an incentive. Both kinds change behavior; the test is whether the policy adds benefit or adds cost.</p>
<div data-check="l5c-classify,l5c-subsidy"></div>

<h2>Sunk costs: ignore them</h2>
<!-- src: OS21 (sunk costs, Selena, firms' new products, summary sentence) -->
<p>A ${dt('sunk-cost','<b>sunk cost</b>')} is a cost made in the past that can't be recovered. Your course textbook: "Because sunk costs occurred in the past and cannot be recovered, they should be disregarded in making current decisions."</p>
<p><b>Why ignore them?</b> A sunk cost is the same under every option you are choosing between. Something that doesn't change with the choice can't make one option better than another, so it drops out of the comparison.</p>
<p><b>The textbook's example.</b> Selena pays $8 for a movie, and after 30 minutes she knows it is terrible. The $8 is gone whether she stays or leaves. But "staying in the movie still means paying an ${dt('opp-cost','opportunity cost')} in time." Her real choice is 90 more minutes of a bad movie versus anything else. Staying "to get my money's worth" is the <b>sunk cost fallacy</b>.</p>
<p>Firms face the same pull. The textbook notes that many firms "find it hard to give up on a new product that is doing poorly because they spent so much money in creating and launching the product." The lesson is the same: decide on what happens next.</p>
<div data-check="l5c-sunk"></div>

<h2>Count it or ignore it?</h2>
<!-- src: OS21; MS. Exam skill: sorting future (marginal) costs and benefits from sunk ones. -->
<p>Exam questions often list several costs and ask what should affect a decision. Use one test: <b>would this number be different depending on what I choose next?</b> If yes, it counts. If it is the same either way, it is sunk: ignore it.</p>
<div data-widget="sunksort"></div>
<p>Notice the pattern: anything already paid is sunk, while anything that happens only if you pick an option (time, wages, extra revenue, costs still to come) counts. Time is the cost students forget most often.</p>
<div data-check="l5c-skill"></div>

<h2>Common mistakes</h2>
<!-- Entries in order are M1-M6; each is used as a wrong choice in this lesson's questions (see L5TAGS mis). -->
<div class="mistakes"><p class="eyebrow">Watch out for these</p><ul>
<li><span class="wrong">"Compare the totals to decide."</span>Compare the next unit's marginal benefit with its marginal cost. Totals can look fine while the last unit loses money, like the third shift.</li>
<li><span class="wrong">"Marginal cost is the cost per unit."</span>Total cost divided by quantity is <b>average</b> cost. Marginal cost is the extra cost of one more unit.</li>
<li><span class="wrong">"Diminishing marginal utility means total satisfaction falls."</span>Total satisfaction usually still rises. It is the extra satisfaction from each new unit that shrinks.</li>
<li><span class="wrong">"Money already spent has to count, or it's wasted."</span>A sunk cost is the same whatever you choose next, so it can't change which option is better.</li>
<li><span class="wrong">"Anything that changes behavior is an incentive."</span>Incentives make a choice more beneficial; disincentives make it more costly. Taxes, fines and calorie counts are disincentives; sales, bonuses and subsidies are incentives.</li>
<li><span class="wrong">"If one more is worth it, more is always worth it."</span>Marginal benefit usually falls and marginal cost can rise, so check each unit. Stop at the last one where MB ≥ MC.</li>
</ul></div>

<h2>Recap</h2>
<div class="callout">
<ol>
<li><b>Marginal analysis</b> compares the extra benefit and extra cost of a little more or a little less. Keep going while <b>MB ≥ MC</b>.</li>
<li>Firms use it to decide whether to expand: add a step only if its extra revenue beats its extra cost. Judge each step on its own, not the totals.</li>
<li>People do it too. Because of <b>diminishing marginal utility</b>, each extra unit adds less satisfaction, so people stop before "all of it."</li>
<li><b>Incentives</b> make a choice more beneficial; <b>disincentives</b> make it more costly. Either can move where MB ≥ MC stops.</li>
<li><b>Sunk costs</b> are already spent and can't be recovered, so they should not affect the next decision.</li>
<li>To sort a list of costs, ask whether each one <b>changes with the choice</b>. If it doesn't, it is sunk.</li>
</ol>
<p><b>How the CLEP tests this:</b> the exam outline lists "Marginal analysis" and "Property rights and the role of incentives" under Basic Economic Concepts (10% to 16% of the exam). Expect questions that give a table of marginal benefits or costs and ask for the best quantity, ask whether a cost should affect a decision, or ask you to classify a policy as an incentive or a disincentive.</p>
</div>`,
  deeper:`
<h3>Why water is cheap and diamonds are expensive</h3>
<p>Water keeps you alive, yet it's cheap. Diamonds are mostly decoration, yet they're expensive. Adam Smith puzzled over this. Econlib's entry on marginalism explains that Smith "had failed to distinguish between 'total' utility and 'marginal' utility." Water is so plentiful that one <b>more</b> gallon is worth very little to you; diamonds are rare, so one more is worth a lot. Price follows the value of the next unit, not total usefulness.</p>
<h3>Where this goes next</h3>
<p>MB vs. MC is the engine of the whole course. In Unit 3 it explains how consumers choose; in Units 4 and 5 it decides how much a firm produces (where marginal revenue = marginal cost).</p>`,

  { n:2, title:'Supply and Demand', quiz:'#quiz2', qkey:'quiz2', blurb:'How markets set prices: demand and supply, equilibrium, price controls, elasticity, surplus and taxes.',
    cover:[['Determinants of supply and demand','Lesson 6'],['Market equilibrium','Lesson 7'],['Price and quantity controls','Lessons 8 and 12'],['Elasticity: price elasticity of demand, its determinants and total revenue; price elasticity of supply','Lesson 9'],['Elasticity: income and cross-price elasticity of demand','Lesson 10'],['Consumer surplus, producer surplus, and market efficiency','Lesson 11'],['Tax incidence and deadweight loss','Lesson 12']] }
];
const unitOf = n => UNITS.find(u=>u.n===n);
/* ---------- views ---------- */
let view='home';
const app = $('#app');
const tabOf = v => LBYID[v] ? 'home' : v==='quiz2' ? 'quiz' : v.startsWith('q-') ? 'reports' : (v==='cards' || v.startsWith('fc-')) ? 'review' : v;
const newlyResolved = () => allReports().filter(r => RESOLVED(r.status) && (r.fixedAt||0) > (S.repSeen||0));
function refreshChrome(){
  const n = dueList().length, b=$('#due-badge'); b.textContent=n; b.hidden = n===0;
  const nr = view==='reports' ? 0 : newlyResolved().length, rb=$('#rep-badge'); rb.textContent=nr; rb.hidden = nr===0; rb.title = nr ? `${nr} newly handled` : '';
  $$('.tab').forEach(t=>t.setAttribute('aria-current', t.dataset.tab===tabOf(view) ? 'page':'false'));
}
function render(){
  const h = (location.hash||'#home').slice(1);
  view = LBYID[h] ? h : (['quiz','quiz2','review','reports','cards'].includes(h) ? h : (h.startsWith('q-') && Q[h.slice(2)]) ? h : (h.startsWith('fc-') && CARDS[h.slice(3)]) ? h : 'home');
  app.innerHTML='';
  if(view==='home') renderHome(); else if(view==='quiz') renderQuiz(); else if(view==='quiz2') renderQuiz2(); else if(view==='review') renderReview();
  else if(view==='reports'){ REPV.prevSeen = S.repSeen||0; REPV.busy=false; renderReports(); } else if(view==='cards') renderCards(); else if(view.startsWith('fc-')) renderOneCard(view.slice(3)); else if(view.startsWith('q-')) renderOneQuestion(view.slice(2)); else renderLesson(LBYID[view]);
  refreshChrome();
}
window.addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); });

function renderHome(){
  const prog = LESSONS.map(lessonProgress);
  const answered = prog.reduce((a,p)=>a+p.done,0);
  const next = LESSONS.find((l,i)=>!prog[i].complete) || null;
  const due = dueList().length;
  const curUnit = next ? next.unit : UNITS[UNITS.length-1].n, CU = unitOf(curUnit);
  const unitCard = U => {
    const ls = LESSONS.filter(l=>l.unit===U.n), pr = ls.map(lessonProgress);
    const doneCount = pr.filter(p=>p.complete).length, ans = pr.reduce((a,p)=>a+p.done,0), total = pr.reduce((a,p)=>a+p.total,0);
    const best = S[U.qkey].best, nq = U.n===1 ? QUIZ.length : QUIZ2.length;
    return `<section class="unit">
    <div class="unit-head"><h2 style="margin:0;font-size:1.15rem">Unit ${U.n}: ${U.title}</h2><span class="small muted num">${doneCount} of ${ls.length} done · ${ans}/${total} core practice</span></div>
    <p class="small muted" style="margin:.3rem 0 0">${U.blurb}</p>
    ${U.cover?`<details class="small" style="margin-top:.5rem"><summary>What the CLEP outline lists for this unit, and where it's taught</summary><ul style="margin:.4rem 0 0">${U.cover.map(([t,w])=>`<li>${t}: <span class="muted">${w}</span></li>`).join('')}</ul><p class="muted" style="margin:.3rem 0 0">Supply and demand is about 15% to 20% of the exam (College Board outline).</p></details>`:''}
    <div class="bar" style="margin-top:10px"><span style="width:${total?ans/total*100:0}%"></span></div>
    <ol class="lesson-list">${ls.map(l=>{ const p=lessonProgress(l); return `<li><a class="lesson-row" href="#${l.id}"><span class="lnum">${LBYID[l.id].n}</span><span class="lt">${l.title}<br><span class="small muted" style="font-weight:400">${l.oneline}</span></span><span class="ls ${p.complete?'done':''}">${p.complete?'Done':p.done?`${p.done}/${p.total}`:`~${l.mins} min`}${p.more?`<br><span class="muted" style="font-weight:400">+${p.more} extra</span>`:''}</span></a></li>`; }).join('')}
      <li><a class="lesson-row" href="${U.quiz}"><span class="lnum">✓</span><span class="lt">Unit ${U.n} quiz<br><span class="small muted" style="font-weight:400">${nq} exam-style questions across all ${ls.length} lessons${U.n===2?'; results after you submit':''}</span></span><span class="ls ${best!==null&&best>=80?'done':''}">${best===null?'Not taken':`Best ${best}%`}</span></a></li></ol>
  </section>`; };
  app.innerHTML = `
  <section class="hero">
    <div class="eyebrow">Principles of Microeconomics · CLEP prep</div>
    <h1 style="margin-top:.4rem">Unit ${CU.n}: ${CU.title}</h1>
    <p>Each lesson has interactive graphs, 12 practice questions with 16 more on demand, optional writing prompts and flashcards. Everything you answer comes back in Review on a spaced schedule.</p>
    <div class="row" style="margin-top:1rem">${next?`<a class="btn" href="#${next.id}">${answered?'Continue':'Start'}: Lesson ${LBYID[next.id].n}</a>`:`<a class="btn" href="${CU.quiz}">Take the Unit ${CU.n} quiz</a>`}<a class="btn ghost" href="#review">Review${due?` (${due} due)`:''}</a></div>
  </section>
  ${UNITS.map(unitCard).join('')}
  <div class="callout"><p><b>About the free CLEP voucher.</b> Modern States gives you a voucher for the real CLEP exam once you score 75% or higher on their course's final exam (<a href="https://modernstates.org/blog/how-requests-work/" target="_blank" rel="noopener">how it works</a>). Aim for 80%+ on each unit quiz here so you have margin.</p></div>
  <section class="later"><h2 style="font-size:1.05rem">Later units</h2><p class="small muted">Not built yet. They'll be added to this page one unit at a time, and your progress here will carry over.</p><ol start="${UNITS.length+1}">${LATER.map(t=>`<li>${t}</li>`).join('')}</ol></section>`;
}

let PENDING = null; // a review session to start when the Review tab opens (from a lesson's flashcard button)
function renderLesson(L){
  const p = lessonProgress(L), i = L.n-1;
  const prev = LESSONS[i-1], next = LESSONS[i+1] && LESSONS[i+1].unit===L.unit ? LESSONS[i+1] : null;
  const rec = (S.lessons[L.id]||{}).practice||{};
  app.innerHTML = `
  <div class="lesson-head"><div class="eyebrow">Unit ${L.unit} · Lesson ${L.n} (${LESSONS.filter(x=>x.unit===L.unit).indexOf(LESSONS[i])+1} of ${LESSONS.filter(x=>x.unit===L.unit).length}) · about ${L.mins} min</div>
  <h1 style="margin-top:.4rem">${L.title}</h1>
  <p class="oneline">${L.oneline}</p><p class="src">From your course: ${L.src}</p>${L.sources?`<p class="srcs">Sources: ${L.sources.map(k=>`<a href="${SOURCES[k].u}" target="_blank" rel="noopener">${esc(srcLabel([k]))}</a>`).join(' · ')}</p>`:''}<div id="lrep"></div></div>
  <article>${L.body}</article>
