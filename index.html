      save(); renderResult({...clean, at});
    }catch(e){
      const code = e && e.code;
      const msg = code==='cancelled' ? 'Stopped.' :
        ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code) ? 'Claude grading is turned off for this page. Compare your answer with the model answer below.' :
        code==='rate_limited' ? 'Too many requests right now, or you\'ve hit a usage limit. Try again in a little while.' :

/* PPF: monotone cubic through the course's boots/jackets table */
const PPF_X=[0,20,40,60,80], PPF_Y=[100,90,70,40,0];
function monotone(xs,ys){
  const n=xs.length, d=[], m=[];
  for(let i=0;i<n-1;i++) d.push((ys[i+1]-ys[i])/(xs[i+1]-xs[i]));
  m[0]=d[0]; m[n-1]=d[n-2];
  for(let i=1;i<n-1;i++) m[i] = d[i-1]*d[i]<=0 ? 0 : (d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){ if(d[i]===0){m[i]=m[i+1]=0;continue;} const a=m[i]/d[i], b=m[i+1]/d[i], s=a*a+b*b; if(s>9){ const t=3/Math.sqrt(s); m[i]=t*a*d[i]; m[i+1]=t*b*d[i]; } }
  return x => { if(x<=xs[0]) return ys[0]; if(x>=xs[n-1]) return ys[n-1]; let i=0; while(x>xs[i+1]) i++; const hh=xs[i+1]-xs[i], t=(x-xs[i])/hh, t2=t*t, t3=t2*t;
    return (2*t3-3*t2+1)*ys[i]+(t3-2*t2+t)*hh*m[i]+(-2*t3+3*t2)*ys[i+1]+(t3-t2)*hh*m[i+1]; };
}
const ppfBase = monotone(PPF_X, PPF_Y);

{ id:'l1', title:'Scarcity and Opportunity Cost', mins:25, src:'Course video 1.1 · Textbook 1.1, 1.2, 2.1, 2.3',
  oneline:'You can\'t have everything, so every choice costs you the best thing you gave up.',
  body:`
<h2>The problem behind all of economics</h2>
<p>You have 24 hours in a day and a limited amount of money. You want more than they can cover. That gap is <b>scarcity</b>: wants are bigger than the resources to satisfy them.</p>
<p><b>Economics</b> is the study of how people and societies choose to use scarce resources. Every person, business and country faces scarcity, even very rich ones. A billionaire still has only 24 hours.</p>
<div class="terms">
${term('Scarcity','Wants are greater than the resources available. The basic economic problem.')}
${term('Resources for people','Mostly time and money.')}
${term('Resources for firms','The <b>factors of production</b>: <b>land</b> (natural resources), <b>labor</b> (human work) and <b>capital</b> (tools, machines, buildings). Many textbooks add <b>entrepreneurship</b> as a fourth.')}
${term('Trade-off','Choosing more of one thing means less of another.')}
</div>
<p>Watch out for <b>capital</b>. In everyday talk it means money. In economics it means things made to produce other things: an oven, a laptop, a delivery van.</p>

<h2>Opportunity cost</h2>
<div class="analogy"><div class="eyebrow">Analogy</div><p>You have one free Saturday night. You could go to a friend's party, pick up a paid shift, or study. You go to the party. If the shift was your next favorite option, the cost of the party is that shift, not "the shift plus studying plus everything else."</p></div>
<p><b>Opportunity cost</b> is the value of the <b>next best alternative</b> you give up when you make a choice. Only one option counts: the one you would have picked otherwise.</p>
<p>Your course's simplest example: you have $5 and want a latte and a notebook. Buy the latte and the opportunity cost is the notebook.</p>
<div data-widget="snooze"></div>
<p>The snooze example shows two big points:</p>
<ul>
<li><b>Opportunity costs often grow</b> as you do more of something. The fourth press costs far more than the first. (Not always: on a straight budget line every burger costs the same 4 tickets.)</li>
<li><b>Opportunity costs are personal and situational.</b> The same press is costly on a workday and nearly free on a lazy Saturday.</li>
</ul>

<h2>Worked example: the $5 lunch</h2>
<p>From the textbook. Buying lunch costs $8 a day. Packing one costs $3. The opportunity cost of buying is the $5 difference.</p>
<div class="math">$8 − $3 = $5 a day<br>$5 × 250 workdays = <b>$1,250 a year</b></div>
<p>"$5 a day" sounds small. "A $1,250 vacation" might change your choice. Same cost, framed as the thing you actually give up.</p>

<h2>Opportunity cost isn't only money</h2>
<p>Many costs are time. The textbook estimates that if 800 million air passengers each spend an extra 30 minutes in security, and their time is worth $20 an hour, the opportunity cost is about <b>$8 billion a year</b>, even though nobody writes a check for it.</p>
<div class="math">800,000,000 × 0.5 hours × $20 = $8,000,000,000</div>
`,
  deeper:`
<h3>The full cost of college</h3>
<p>The cost of a year of college is the tuition and books <b>plus</b> the wages you don't earn while you're in class. With made-up but realistic numbers: $20,000 tuition + $30,000 of forgone wages = <b>$50,000</b> a year. Exams love this. If an answer only counts tuition, it's missing the biggest piece.</p>
<h3>A budget is a picture of opportunity cost</h3>
<div data-widget="budget"></div>
<p>The slope of the budget line equals −(price of the horizontal-axis good ÷ price of the vertical-axis good). With bus tickets across and burgers up, the slope is −$0.50 ÷ $2 = −0.25: each ticket costs ¼ burger. Flip it and each burger costs 4 tickets, whatever the budget. Lesson 2's PPF is the same idea for a whole economy.</p>
<h3>Micro vs. macro</h3>
<p>The textbook compares economics to studying a lake. One scientist studies particular fish and plants (<b>microeconomics</b>: individual households, workers, firms and markets). Another studies the whole lake's food chain (<b>macroeconomics</b>: unemployment, inflation, total output). Same lake, two views.</p>
<h3>Positive vs. normative</h3>
<div class="terms">
${term('Positive statement','Describes how things are. Testable. "A higher minimum wage reduces teen employment."')}
${term('Normative statement','Says how things should be. A value judgment. "The minimum wage should be higher." Look for <i>should</i>, <i>ought</i>, <i>fair</i>.')}
</div>
<p>A positive statement can be false and still be positive. What matters is whether data could check it.</p>`,
  practice:['l1-def','l1-shift','l1-capital','l1-g-budget','l1-g-lunch','l1-positive','l1-micro'],
  links:[ {k:'Article',t:'Opportunity Cost',s:'Econlib',u:'https://www.econlib.org/library/Topics/HighSchool/OpportunityCost.html',w:'Short, plain definition with everyday examples, including why the biggest cost of college is lost income.'} ] },

{ id:'l2', title:'The Production Possibilities Frontier', mins:30, src:'Course video 1.2 · Textbook 2.2',
  oneline:'A curve that shows every best-possible mix of two goods, and what each extra unit really costs.',
  body:`
<h2>From one person to a whole economy</h2>
<p>Lesson 1 was about one person's choices. A whole country faces the same problem: limited workers, land and machines, and many things it could make with them.</p>
<div class="analogy"><div class="eyebrow">Analogy</div><p>A pizzeria has one kitchen crew for the night. Every hour the crew spends on calzones is an hour not spent on pizzas. If you listed every best-possible combination (40 pizzas and 0 calzones, 30 and 12, and so on) and drew it, you'd have a production possibilities frontier.</p></div>
<p>The <b>production possibilities frontier (PPF)</b>, also called the production possibilities curve, shows the <b>maximum</b> combinations of two goods an economy can make when it uses all its resources and current technology.</p>
<p>It rests on simplifying assumptions:</p>
<ul>
<li>Only <b>two goods</b> (real economies make millions; two keeps the picture readable).</li>
<li><b>Fixed resources and technology</b> at this moment: it's a snapshot in time.</li>
<li>Resources <b>can be used for either good</b>, but some are better at one than the other.</li>
</ul>

<h2>Worked example: boots and jackets</h2>
<p>Your course's economy makes leather boots and leather jackets:</p>
${table(['Point','A','B','C','D','E'],[['Boots',0,20,40,60,80],['Jackets',100,90,70,40,0],['Change in boots','','+20','+20','+20','+20'],['Change in jackets','','−10','−20','−30','−40'],['Cost of 1 boot','','0.5 jacket','1 jacket','1.5 jackets','2 jackets']],[[4,1],[4,4]])}
<p>Each step adds the same 20 boots, but the jackets you give up grow: 10, 20, 30, then 40. This is the <b>law of increasing opportunity cost</b>.</p>
<ul>
<li>The cost is <b>low</b> while jackets are plentiful (A → B).</li>
<li>The cost is <b>high</b> when jackets are scarce (D → E): you're pulling your very best jacket makers into boots.</li>
</ul>
<p>That rising cost is why the curve <b>bows outward</b>.</p>
<div data-widget="ppf"></div>

<h2>Three kinds of points</h2>
<div class="terms">
${term('On the curve','<b>Efficient.</b> All resources are used. More of one good means less of the other.')}
${term('Inside the curve','<b>Inefficient.</b> Resources are idle or wasted (unemployment, unused factories). You could get more of both.')}
${term('Outside the curve','<b>Unattainable</b> with today\'s resources and technology.')}
</div>

<h2>What moves the curve</h2>
<p>Only two things shift the whole frontier: a change in <b>resources</b> or a change in <b>technology</b>.</p>
<ul>
<li><b>Equal shift:</b> the change hits both goods about the same (fewer workers, better general technology).</li>
<li><b>Biased shift:</b> the change hits one good more. Rubber is used heavily for boots and barely for jackets, so a rubber shortage pulls in the boots end far more.</li>
</ul>
<p>Choosing a different mix is a <b>movement along</b> the curve, not a shift. Putting unemployed workers back to work is a move <b>toward</b> the curve, not a shift.</p>`,
  deeper:`
<h3>Why some PPFs are straight lines</h3>
<p>If every resource were equally good at both goods, each boot would always cost the same number of jackets. Constant opportunity cost = a straight-line PPF. You'll see straight lines in Lesson 3, because one person's single day of work is treated that way.</p>
<h3>Diminishing returns</h3>
<p>The textbook explains the bow with the <b>law of diminishing returns</b>: as you pour more resources into one area, each extra batch adds less. The first dollars into healthcare save many lives; the last few add little.</p>
<h3>Productive vs. allocative efficiency</h3>
<div class="terms">
${term('Productive efficiency','You can\'t make more of one good without making less of another. Every point on the curve has it.')}
${term('Allocative efficiency','The mix on the curve that society actually wants most. Only one point has it.')}
</div>
<h3>Today's choice shapes tomorrow's curve</h3>
<p>An economy that puts more resources into <b>capital goods</b> (machines, factories) and fewer into goods for consumption today tends to see its PPF shift out further in the future. Less fun now, more capacity later. This is a common exam question.</p>
<h3>Same diagram, different labels</h3>
<p>The textbook's tip: Lesson 1's budget line and this PPF work the same way. Both show <b>scarcity</b> (a limit), <b>trade-offs</b> (the slope) and <b>efficiency</b> (being on the line). One difference: a budget line is straight because prices stay fixed, while a PPF is usually bowed out because of diminishing returns. You'll meet this kind of diagram again with new labels.</p>`,
  practice:['l2-inside','l2-shift','l2-boots','l2-bowed','l2-rubber','l2-g-ppf','l2-straight'],
  links:[ {k:'Video',t:'The Production Possibilities Curve',s:'Economics for Everyone, University of Chicago',u:'https://econ4everyone.uchicago.edu/video/the-production-possibilities-curve/',w:'A second explanation of the same curve, if the lesson didn\'t fully click.'} ] },

{ id:'l3', title:'Comparative Advantage and Trade', mins:35, src:'Course video 1.3 · Textbook 1.1, 2.2',
  oneline:'Specialize in what costs you the least to make, trade for the rest, and both sides end up with more.',
  body:`
<h2>Two ways to get what you need</h2>
<ul>
<li><b>Self-sufficiency:</b> make everything you consume yourself.</li>
<li><b>Specialization and trade:</b> make one thing and trade it for the rest.</li>
</ul>
<p><b>Gains from trade</b> means you can <b>consume more while working the same amount</b>.</p>
<div class="analogy"><div class="eyebrow">Analogy</div><p>A lawyer types faster than her assistant. Should she do her own typing? No. An hour of her typing is an hour she isn't billing clients at $300. The assistant gives up much less to type. She's better at both jobs, but typing is relatively cheaper for the assistant.</p></div>

<h2>Two kinds of "better"</h2>
<div class="terms">
${term('Absolute advantage','Can produce <b>more</b> of a good with the same time and resources.')}
${term('Comparative advantage','Can produce a good at a <b>lower opportunity cost</b>. This is what decides who should make what.')}
</div>

<h2>Worked example: the seamstress and the baker</h2>
<p>Your course's example. Output in one 8-hour day:</p>
${table(['One day','Bread','Sweaters'],[['Seamstress','8','4'],['Baker','24','8']])}
<p>The baker makes more of <b>both</b>: absolute advantage in bread and sweaters. Does that mean he shouldn't trade? Look at opportunity costs.</p>
<p><b>Step 1: find each opportunity cost.</b> Same day of work, so divide.</p>
<div class="math">Seamstress: 8 bread = 4 sweaters → 1 bread = ½ sweater, 1 sweater = 2 bread<br>Baker: 24 bread = 8 sweaters → 1 bread = ⅓ sweater, 1 sweater = 3 bread</div>
${table(['Opportunity cost','1 bread costs','1 sweater costs'],[['Seamstress','½ sweater','2 bread'],['Baker','⅓ sweater','3 bread']],[[1,1],[0,2]])}
<p><b>Step 2: lower cost wins.</b> The baker gives up less to make bread (⅓ &lt; ½), so he has the comparative advantage in <b>bread</b>. The seamstress gives up less to make sweaters (2 &lt; 3), so she has it in <b>sweaters</b>.</p>
<p><b>Step 3: specialize and trade.</b> She makes 4 sweaters; he makes 24 bread. They trade 2 sweaters for 5 bread.</p>
${table(['','Without trade (split day)','With trade'],[['Seamstress','4 bread, 2 sweaters','<b>5 bread</b>, 2 sweaters'],['Baker','12 bread, 4 sweaters','19 bread, 2 sweaters']])}
<p>Is the baker better off with fewer sweaters? Check what he could make alone. If he made 2 sweaters, that takes 2 hours, leaving 6 hours for 18 bread. Trade gets him <b>19</b>. That point is outside his own PPF: impossible for him alone. Same for her: 2 sweaters take her 4 hours, leaving time for only 4 bread; trade gets her <b>5</b>.</p>
<div data-widget="trade"></div>

<h2>Rules to remember</h2>
<ul>
<li>You can have an absolute advantage in both goods, but <b>never a comparative advantage in both</b>. The two costs mirror each other: if yours is lower for one good, it is higher for the other.</li>
<li>As long as opportunity costs <b>differ</b>, both sides can gain from trade.</li>
<li>The trade price must fall <b>between</b> the two opportunity costs. Here 1 sweater must trade for between 2 and 3 bread (2 sweaters for 5 bread = 2.5 each).</li>
</ul>`,
  deeper:`
<h3>The exam trap: output vs. input problems</h3>
<p>Questions give numbers in one of two ways, and the division flips.</p>
<div class="terms">
${term('Output problem','"Makes 8 bread or 4 sweaters per day." Opportunity cost of bread = sweaters ÷ bread. <b>Other goes Over.</b>')}
${term('Input problem','"Takes 1 hour per bread, 2 hours per sweater." Opportunity cost of bread = bread hours ÷ sweater hours. <b>Other goes Under.</b>')}
</div>
<p>Check: the seamstress needs 1 hour per bread and 2 per sweater. Bread costs 1 ÷ 2 = ½ sweater. Same answer as the output method.</p>
<h3>Countries work the same way</h3>
<p>The textbook's example: Brazil can grow a lot of sugar cane per acre but not much wheat; the U.S. is the reverse. Brazil has the comparative advantage in sugar cane, the U.S. in wheat. On a graph, Brazil's PPF is steeper.</p>
<h3>Where this idea came from</h3>
<p>Adam Smith showed in 1776 that dividing work into specialized tasks raises output (his pin factory). David Ricardo later showed that trade pays even when one side is better at everything. Paul Krugman's essay below explains why smart people still find that hard to accept.</p>`,
  practice:['l3-defs','l3-g-oc','l3-g-ca','l3-both','l3-input','l3-terms'],
  links:[ {k:'Video',t:'The Principle of Comparative Advantage (60 Second Adventures in Economics)',s:'OpenLearn, The Open University',u:'https://www.open.edu/openlearn/society/politics-policy-people/economics/60-second-adventures-economics-the-principle-comparative-advantage',w:'A short animated take on Ricardo\'s idea with countries instead of people.'},
          {k:'Article',t:'Ricardo\'s Difficult Idea',s:'Paul Krugman, MIT',u:'https://web.mit.edu/krugman/www/ricardo.htm',w:'Go deeper: why comparative advantage is so often misunderstood. Longer, more advanced read.'} ] },

{ id:'l4', title:'Economic Systems', mins:20, src:'Course video 1.4a · Textbook 1.3, 1.4',
  oneline:'Every society must decide what to make, how much, and who gets it. Systems differ in who decides.',
  body:`
<h2>Three questions every economy must answer</h2>
<ol><li><b>What</b> to produce?</li><li><b>How</b> to produce it (and how much)?</li><li><b>Who</b> receives the output?</li></ol>
<div class="analogy"><div class="eyebrow">Analogy</div><p>Think of a big family potluck. The menu could be the same dishes as every year (<b>tradition</b>). One organizer could assign every dish (<b>command</b>). Everyone could bring what they think people will eat, and popular dishes get copied next year (<b>market</b>). Or the organizer sets a few rules, like "someone brings plates," and leaves the rest free (<b>mixed</b>).</p></div>

<h2>The main systems</h2>
<div class="terms">
${term('Traditional','Decisions follow custom. Jobs pass down through families; you consume what you produce. Little change or growth.')}
${term('Command','A central authority, usually the government, decides what is made and sets prices and wages. The textbook lists Cuba and North Korea.')}
${term('Market','Decisions are spread across buyers and sellers. Resources and businesses are privately owned; firms supply what people demand.')}
${term('Mixed','Elements of more than one. Almost every real economy. The U.S. is mixed but leans strongly toward market.')}
</div>
<div data-widget="sort"></div>

<h2>Property rights</h2>
<p><b>Property rights</b> decide who owns a resource and who decides how it is used. Your course lists four parts:</p>
<ol><li>The right to <b>use</b> the good</li><li>The right to <b>earn income</b> from it</li><li>The right to <b>transfer</b> it to someone else</li><li>The right to <b>enforce</b> those rights</li></ol>

<h2>Your course's grid: ownership vs. allocation</h2>
<p>Your course sorts systems by two questions: who <b>owns</b> resources, and who <b>allocates</b> them.</p>
<div class="tbl-wrap"><table><thead><tr><th></th><th>Planned (government) ownership</th><th>Private ownership</th></tr></thead><tbody>
<tr><td><b>Planned allocation</b></td><td>Socialism (socially planned)</td><td>Command capitalism</td></tr>
<tr><td><b>Market allocation</b></td><td>Market socialism</td><td>Capitalism</td></tr></tbody></table></div>

<h2>How a market economy flows</h2>
<p>The <b>circular flow</b> is a simple model of a market economy with two players, households and firms, meeting in two markets.</p>
<div data-widget="circular"></div>
<ul>
<li><b>Goods and services market</b> (product market): firms sell, households buy.</li>
<li><b>Factor market</b> (resource market): households sell labor, land and capital; firms buy them.</li>
</ul>`,
  deeper:`
<h3>Models simplify on purpose</h3>
<p>The circular flow leaves out government, banks and foreign trade. That's the point of a model: like an architect's tabletop model, it keeps only what you need to see. Economists add pieces back when a question needs them.</p>
<h3>The invisible hand</h3>
<p>Adam Smith argued that people pursuing their own interest in markets often end up serving everyone's, "led by an invisible hand." Nobody plans the whole economy, yet shelves get stocked. The essay "I, Pencil" below shows this with an ordinary pencil that no single person knows how to make.</p>
<h3>No market is completely free</h3>
<p>Markets always run on rules: protecting property, enforcing contracts, preventing fraud, collecting taxes. Even command economies have markets. When rules are very heavy, <b>underground economies</b> appear: trades made without the government's approval.</p>`,
  practice:['l4-questions','l4-factor','l4-wages','l4-command','l4-grid','l4-rights','l4-us'],
  links:[ {k:'Article',t:'I, Pencil',s:'Leonard E. Read, via Econlib',u:'https://www.econlib.org/library/Essays/rdPncl.html',w:'A pencil tells its own story: thousands of strangers cooperate to make it with no one in charge. A classic picture of a market system.'} ] },

{ id:'l5', title:'Marginal Analysis and Incentives', mins:25, src:'Course video 1.4b · Textbook 2.1',
  oneline:'Good decisions compare the extra benefit of one more unit with its extra cost, and ignore what\'s already spent.',
  body:`
<h2>Thinking at the margin</h2>
<p>Most choices aren't all-or-nothing. You don't decide "pizza or no pizza for the rest of my life." You decide "one more slice?" In economics, <b>marginal</b> means <b>the next one</b>: the next slice, hour, worker or machine.</p>
<div class="terms">
${term('Marginal benefit (MB)','The extra benefit from one more unit.')}
${term('Marginal cost (MC)','The extra cost of one more unit.')}
${term('The rule','Keep going while <b>MB ≥ MC</b>. Stop when the next unit\'s MB falls below its MC.')}
</div>
<div class="analogy"><div class="eyebrow">Analogy</div><p>The snooze button from Lesson 1 was marginal analysis. You never decided "how much sleep in total." You decided, press by press: are 10 more minutes worth what I'll give up this time?</p></div>
<div data-widget="pizza"></div>
<p>Notice the bars shrink. That's the <b>law of diminishing marginal utility</b>: each extra unit of something tends to add less satisfaction than the one before. The first slice is great; the eighth, not so much. It's why people spread their money across many things.</p>

<h2>Worked example: should the factory add a shift?</h2>
<p>Your course's example is a manufacturer deciding whether to expand. It lists the extra costs (new equipment, more workers, more materials) and the extra benefit (more sales). With numbers:</p>
${table(['Decision','Extra cost per week','Extra revenue per week','Net'],[['Add a second shift','$9,000','1,200 units × $10 = $12,000','<b>+$3,000</b>'],['Add a third shift','$11,000','900 units × $10 = $9,000','<b>−$2,000</b>']])}
<p>Add the second shift; skip the third. The third shift costs more (night pay, tired machines) and sells less. Marginal thinking catches that; looking at the factory's total profit would hide it.</p>

<h2>Incentives change the math</h2>
<p>An <b>incentive</b> raises the benefit of a choice. A <b>disincentive</b> raises its cost. Either one can flip an MB vs. MC decision.</p>
${table(['Incentives (raise the benefit)','Disincentives (raise the cost)'],[['Buy-one-get-one sales','Taxes on cigarettes and alcohol'],['Bonus points for attending class','Calorie counts on fast-food menus'],['Tax credits for new green technology','Pollution taxes']])}
<p><b>Real-world example.</b> In 2018 the UK put a tax on high-sugar soft drinks. Companies cut sugar to avoid it: researchers found the share of drinks that would owe the tax fell from 52% when it was announced to 15% by February 2019.</p>

<h2>Sunk costs: ignore them</h2>
<p>A <b>sunk cost</b> is money or time already spent that you can't get back. Because it's gone whatever you choose next, it shouldn't affect the choice.</p>
<p>The textbook's example: Selena pays $8 for a movie and it's terrible after 30 minutes. The $8 is gone either way. Her real choice is 90 more minutes of a bad movie vs. anything else. Staying "to get my money's worth" is the <b>sunk cost fallacy</b>.</p>`,
  deeper:`
<h3>Why water is cheap and diamonds are expensive</h3>
<p>Water keeps you alive, yet it's cheap. Diamonds are mostly decoration, yet they're expensive. Marginal thinking solves it: water is so plentiful that one <b>more</b> gallon is worth very little to you; diamonds are rare, so one more is worth a lot. Price follows the value of the next unit, not total usefulness.</p>
<h3>Sunk costs at national scale</h3>
<p>The Concorde supersonic jet is the classic case: governments kept funding it partly because so much had already been spent, even as the outlook worsened. Psychologists call it the "Concorde fallacy." Businesses face the same pull with failing products.</p>
<h3>Where this goes next</h3>
<p>MB vs. MC is the engine of the whole course. In Unit 3 it explains how consumers choose; in Units 4 and 5 it decides how much a firm produces (where marginal revenue = marginal cost).</p>`,
  practice:['l5-def','l5-g-mb','l5-sunk','l5-dis','l5-g-firm','l5-dmu'],
  links:[ {k:'Real world',t:'Sugar levels in UK soft drinks lowered, research finds',s:'University of Warwick, Feb 2020',u:'https://warwick.ac.uk/news/pressreleases/sugar_levels_in/',w:'The study behind the sugar-tax numbers in this lesson: a disincentive changing what firms make.'},
          {k:'Article',t:'Marginalism',s:'Econlib',u:'https://www.econlib.org/library/Enc/Marginalism.html',w:'Short encyclopedia entry on thinking at the margin, including the water and diamonds puzzle.'},
          {k:'Article',t:'The Sunk Cost Fallacy',s:'The Decision Lab',u:'https://thedecisionlab.com/biases/the-sunk-cost-fallacy',w:'Why people stick with bad investments, with the Concorde example.'} ] }
];

    const left = L.more.length - shown;
    bar.innerHTML = left>0 ? `<button class="btn ghost" id="more-go">More practice · ${Math.min(4,left)} more (${left} left)</button>` : `<p class="small muted">That's all ${L.more.length} extra questions for this lesson. For more, use Review: pick this lesson and practice any time.</p>`;
    const b=$('#more-go'); if(b) b.onclick = () => { L.more.slice(shown, shown+4).forEach((qid,k)=>$('#moreset').appendChild(qCard(qid, { ctx:'practice', label:`Extra ${shown+k+1}${status(qid)}`, onAnswer: onAns(qid) }))); shown = Math.min(L.more.length, shown+4); drawBar(); };
  };
  drawBar();
  L.writing.forEach(w => $('#wset').appendChild(writeCard(w)));
  $('#fc-go').onclick = () => { PENDING = { title:`Lesson ${L.n} flashcards`, items: shuffle(cardsFor(L.id)), mode:'free' }; location.hash = '#review'; };
}

/* quiz */
let QZ = null;
function renderQuiz(){
  if(!QZ){
    const best=S.quiz.best, last=S.quiz.last;
    app.innerHTML = `<div class="lesson-head"><div class="eyebrow">Unit 1</div><h1 style="margin-top:.4rem">Unit quiz</h1>
    <p class="oneline">20 exam-style questions across all five lessons, in random order, with five answer choices like the real CLEP. You see the explanation after each one.</p></div>
    ${best!==null?`<div class="readout"><div><b>${best}%</b><span>best score</span></div><div><b>${last}%</b><span>last score</span></div><div><b>${S.quiz.attempts}</b><span>attempts</span></div></div>`:''}
    <p class="muted">Missed questions come back in Review the next day. Target: 80% or higher.</p>
    <button class="btn" id="qstart">${best===null?'Start the quiz':'Take it again'}</button>
    <p class="small muted" style="margin-top:1.4rem">Want to see the real thing? College Board posts a few free <a href="https://clep.collegeboard.org/clep/pdf/principles-of-microeconomics-fact-sheet.pdf" target="_blank" rel="noopener">official sample questions</a> covering the whole exam.</p>`;
    $('#qstart').onclick = () => { QZ = { order: shuffle(QUIZ), i:0, right:0, missed:[] }; renderQuiz(); };
    return;
  }
  if(QZ.i >= QZ.order.length){
    const pct = Math.round(QZ.right/QZ.order.length*100);
    S.quiz.last = pct; S.quiz.best = Math.max(S.quiz.best??0, pct); S.quiz.attempts=(S.quiz.attempts||0)+1; save();
    const byL = {}; QZ.missed.forEach(q=>{ const l=Q[q].lesson; byL[l]=(byL[l]||0)+1; });
    const weak = Object.entries(byL).sort((a,b)=>b[1]-a[1]);
    app.innerHTML = `<div class="lesson-head"><div class="eyebrow">Unit quiz result</div><p class="score-big num">${pct}%</p><p>${QZ.right} of ${QZ.order.length} correct. ${pct>=80?'Solid. You\'re ready to move on.':pct>=60?'Close. Revisit the lessons below, then try again.':'Worth another pass through the lessons below before retrying.'}</p></div>
      ${weak.length?`<h2>Where you lost points</h2><ul class="links">${weak.map(([l,n])=>`<li><a href="#${l}">Lesson ${LBYID[l].n}: ${LBYID[l].title}</a> <span class="small muted">· ${n} missed</span></li>`).join('')}</ul><p class="muted small">${QZ.missed.length===1?'The missed question comes':`All ${QZ.missed.length} missed questions come`} back in Review tomorrow.</p>`:'<p>No misses.</p>'}
      <div class="row" style="margin-top:1.4rem"><button class="btn" id="qagain">Take it again</button><a class="btn ghost" href="#home">Back to course</a></div>`;
    $('#qagain').onclick=()=>{ QZ={ order: shuffle(QUIZ), i:0, right:0, missed:[] }; renderQuiz(); };
    QZ = null;
    return;
  }
  const qid = QZ.order[QZ.i];
  app.innerHTML = `<div class="quiz-top"><div class="eyebrow">Unit quiz · question ${QZ.i+1} of ${QZ.order.length}</div><span class="small muted num">${QZ.right} correct</span></div><div class="bar"><span style="width:${QZ.i/QZ.order.length*100}%"></span></div><div class="qset" id="qbox"></div>`;
  $('#qbox').appendChild(qCard(qid, { ctx:'quiz', label:`From Lesson ${LBYID[Q[qid].lesson].n}`, nextLabel: QZ.i===QZ.order.length-1?'See my score':'Next question',
    onAnswer: ok => { if(ok) QZ.right++; else QZ.missed.push(qid); QZ.i++; schedule(qid, ok, 'quiz'); save(); refreshChrome(); },
    onNext: () => { renderQuiz(); window.scrollTo(0,0); } }));
}

/* review */
let RV = null;
const ALLQ = () => Object.keys(Q).filter(k => LBYID[Q[k].lesson] && !Q[k].quiz);
const RVSEL_KEY = 'micro-rv-sel';
function getSel(){ try{ const v=JSON.parse(localStorage.getItem(RVSEL_KEY)); if(Array.isArray(v) && v.length) return v.filter(x=>LBYID[x]); }catch(e){} return LESSONS.map(l=>l.id); }
function setSel(v){ try{ localStorage.setItem(RVSEL_KEY, JSON.stringify(v)); }catch(e){} }
const fmtDay = t => new Date(t).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
function startSession(s, go){ RV = { ...s, i:0, right:0 }; if(go && location.hash!=='#review'){ location.hash='#review'; return; } renderReview(); window.scrollTo(0,0); }
function renderReview(){
  if(!RV && PENDING){ const p=PENDING; PENDING=null; RV = { ...p, i:0, right:0 }; }
  if(RV) return runSession();
  const due = dueList();
  const sched = Object.keys(S.review).filter(reviewable);
  const later = sched.filter(k=>!due.includes(k)).sort((a,b)=>S.review[a].due-S.review[b].due);
  const mastered = Object.keys(S.mastered||{}).length;
  const sel = getSel();
  const qPool = ALLQ().filter(k=>sel.includes(Q[k].lesson));
  const cPool = Object.keys(CARDS).filter(k=>sel.includes(CARDS[k].lesson));
  const lessonOf = k => (Q[k]||CARDS[k]).lesson;
  app.innerHTML = `<div class="lesson-head"><div class="eyebrow">Unit 1</div><h1 style="margin-top:.4rem">Review</h1>
    <p class="oneline">Two ways in: what's due today on your spaced schedule, or anything you want, any time.</p></div>
    <h2 style="margin-top:1rem">Due today</h2>
    <div class="readout"><div><b class="num">${due.length}</b><span>due now</span></div><div><b class="num">${later.length}</b><span>scheduled later</span></div><div><b class="num">${mastered}</b><span>mastered</span></div></div>
    <div class="row" style="margin-top:12px">${due.length?`<button class="btn" id="rv-due">Start review (${Math.min(25,due.length)}${due.length>25?` of ${due.length}`:''})</button>`:`<div class="empty" style="flex:1 1 100%">${later.length?`Nothing due today. Next item comes back <b>${fmtDay(S.review[later[0]].due)}</b>.`:'Nothing scheduled yet. Answer practice questions, quiz questions or flashcards and they\'ll be scheduled here.'}</div>`}
      ${later.length?`<button class="btn ghost" id="rv-ahead">Review ahead (${Math.min(20,later.length)})</button>`:''}</div>
    <details class="deeper" style="margin-top:1rem"><summary>How the schedule works</summary><div class="deeper-body small">
      <p>Every question and flashcard you answer is scheduled. <b>Miss it</b> and it comes back tomorrow. <b>Get it right</b> the first time and it comes back in a week.</p>
      <p>Each time you get a due item right, the gap grows: 1 → 3 → 7 → 21 → 60 days. Get it right at 60 days and it's mastered. Miss it at any step and it starts over at 1 day.</p>
      <p>Practicing ahead or by lesson never pushes items further out, but misses always count, so anything you miss comes back tomorrow.</p></div></details>

    <h2>Practice any time</h2>
    <p class="muted small">Pick lessons, then choose questions or flashcards. Select all five for a mixed set across the unit.</p>
    <div class="chips" id="sel" role="group" aria-label="Lessons to include">${LESSONS.map(l=>`<button class="chipbtn" data-l="${l.id}" aria-pressed="${sel.includes(l.id)}">Lesson ${LBYID[l.id].n}</button>`).join('')}<button class="chipbtn all" data-l="all">All</button></div>
    <p class="small muted" style="margin:8px 0 4px">${qPool.length} questions and ${cPool.length} flashcards in your selection</p>
    <div class="row"><button class="btn sm" data-n="10">10 questions</button><button class="btn sm" data-n="20">20 questions</button><button class="btn ghost sm" data-n="all">All ${qPool.length}</button><button class="btn ghost sm" id="rv-cards">Flashcards (${cPool.length})</button></div>
    <p class="small" style="margin-top:8px"><a href="#cards">Browse, edit and add flashcards</a> · On each card, choose <b>Show answer</b> to flip it or <b>Type my answer</b> and Claude checks it.</p>
    ${sched.length?`<details class="deeper" style="margin-top:1.4rem"><summary>What's scheduled</summary><div class="deeper-body"><div class="tbl-wrap"><table><thead><tr><th>Lesson</th><th>Due now</th><th>Later</th></tr></thead><tbody>${LESSONS.map(l=>`<tr><td>${LBYID[l.id].n}. ${l.title}</td><td>${due.filter(k=>lessonOf(k)===l.id).length}</td><td>${later.filter(k=>lessonOf(k)===l.id).length}</td></tr>`).join('')}</tbody></table></div></div></details>`:''}`;
  const d=$('#rv-due'); if(d) d.onclick=()=>startSession({ title:'Due review', items: due.slice(0,25), mode:'due' });
  const a=$('#rv-ahead'); if(a) a.onclick=()=>startSession({ title:'Review ahead', items: later.slice(0,20), mode:'free' });
  $$('#sel .chipbtn').forEach(b=>b.onclick=()=>{ let s=getSel(); if(b.dataset.l==='all') s=LESSONS.map(l=>l.id); else { s = s.includes(b.dataset.l) ? s.filter(x=>x!==b.dataset.l) : [...s, b.dataset.l]; if(!s.length) s=[b.dataset.l]; } setSel(s); renderReview(); });
  $$('[data-n]').forEach(b=>b.onclick=()=>{ const n=b.dataset.n==='all'?qPool.length:+b.dataset.n; startSession({ title: sel.length===LESSONS.length?'Mixed practice':'Practice: '+sel.map(x=>'Lesson '+LBYID[x].n).join(', '), items: shuffle(qPool).slice(0,n), mode:'free' }); });
  $('#rv-cards').onclick=()=>startSession({ title:'Flashcards', items: shuffle(cPool), mode:'free' });
}
function runSession(){
  if(RV.i >= RV.items.length){
    const msg = RV.mode==='due' ? 'Right answers moved to a longer gap; misses come back tomorrow.' : 'Done. Anything you missed comes back in Review tomorrow; your other schedule dates didn\'t change.';
    app.innerHTML = `<div class="lesson-head"><div class="eyebrow">${RV.title} · finished</div><p class="score-big num">${RV.right}/${RV.items.length}</p><p>${msg}</p></div><div class="row"><button class="btn" id="rv-back">Back to Review</button><a class="btn ghost" href="#home">Course</a></div>`;
    $('#rv-back').onclick=()=>{ RV=null; renderReview(); window.scrollTo(0,0); };
    RV=null; refreshChrome(); return;
  }
  const id = RV.items[RV.i];
  if(!Q[id] && !CARDS[id]){ RV.items.splice(RV.i,1); return runSession(); }
  app.innerHTML = `<div class="quiz-top"><div class="eyebrow">${RV.title} · ${RV.i+1} of ${RV.items.length}</div><button class="btn ghost sm" id="rv-quit">End session</button></div><div class="bar"><span style="width:${RV.i/RV.items.length*100}%"></span></div><div class="qset" id="rbox"></div>`;
  $('#rv-quit').onclick=()=>{ RV.items = RV.items.slice(0, RV.i); runSession(); };
  const label = `From Lesson ${LBYID[(Q[id]||CARDS[id]).lesson].n}${S.review[id]?` · step ${S.review[id].box+1} of 5`:''}`;
  const advance = () => { runSession(); window.scrollTo(0,0); };
  const onAnswer = ok => { if(ok) RV.right++; RV.i++; schedule(id, ok, RV.mode); save(); refreshChrome(); };
  if(CARDS[id]) $('#rbox').appendChild(flashCard(id, { label, onAnswer, onNext: advance }));
  else $('#rbox').appendChild(qCard(id, { ctx:'review', label, nextLabel: RV.i===RV.items.length-1?'Finish':'Next', onAnswer, onNext: advance }));
}

/* reports */
const REPV = { busy:false, prevSeen:0, filter:(()=>{ try{ return localStorage.getItem(REP_FILTER_KEY)||'all'; }catch(e){ return 'all'; } })() };
function repItem(r, { showLink=true, isNew=false }={}){
  const d = describeWhere(r.where);
  const el = document.createElement('div'); el.className='rep-item';
  el.innerHTML = `<div class="rep-top"><span class="rep-where">${esc(d.title)}</span><span class="row" style="gap:6px">${isNew?'<span class="pill new">New</span>':''}<span class="pill st-${esc(r.status)}">${STATUS_LABEL[r.status]||esc(r.status)}</span></span></div>
    ${d.snip?`<p class="rep-snip">${esc(d.snip)}</p>`:''}
    <p class="rep-note">${esc(r.note||'')}</p>
    ${r.ctx?`<details class="rep-ctx"><summary>What was sent with this report</summary><pre>${esc(r.ctx)}</pre></details>`:''}
    ${r.reply?`<div class="rep-reply"><div class="eyebrow">Claude · ${shortDay(r.fixedAt||r.at)}</div><p>${esc(r.reply)}</p></div>`:''}
    <div class="rep-foot"><span class="muted">Reported ${shortDay(r.at)}</span>${showLink&&d.href?`<a href="${d.href}">Open it</a>`:''}<button type="button" class="linkbtn danger rm">Remove</button></div>`;
  const rm = $('.rm', el);
  rm.onclick = () => {
    if(rm.dataset.armed){ REPV.busy=false; rm.disabled=true; removeReport(r).then(()=>{ if(view==='reports') renderReports(); else el.remove(); }); return; }
    rm.dataset.armed='1'; rm.textContent='Tap again to remove'; REPV.busy=true;
    setTimeout(()=>{ if(rm.isConnected && !rm.disabled){ delete rm.dataset.armed; rm.textContent='Remove'; } REPV.busy=false; }, 4000);
  };
  return el;
}
function renderReports(){
  const all = allReports();
  const latest = Math.max(0, ...all.filter(r=>RESOLVED(r.status)).map(r=>r.fixedAt||0));
  if(latest > (S.repSeen||0)){ S.repSeen = latest; save(); }
  const open = all.filter(r=>!RESOLVED(r.status)), done = all.filter(r=>RESOLVED(r.status));
  const f = REPV.filter, shown = f==='open' ? open : f==='done' ? done : all;
  const signedOut = !REP.col;
  app.innerHTML = `<div class="lesson-head"><div class="eyebrow">Your feedback</div><h1 style="margin-top:.4rem">My reports</h1>
    <p class="oneline">Every problem you've reported in this workbook, and what Claude did about it.</p></div>
    <div class="readout"><div><b class="num">${open.length}</b><span>open</span></div><div><b class="num">${done.filter(r=>r.status==='fixed').length}</b><span>fixed</span></div><div><b class="num">${done.filter(r=>r.status==='nochange').length}</b><span>no change needed</span></div></div>
    <div class="callout"><p><b>How fixes happen.</b> Claude isn't alerted when you report. When you want fixes, ask Claude in a chat in this project: <i>"fix my workbook reports."</i> It works through the open ones, updates the page, and leaves a note on each report here.</p>${signedOut?'<p class="small">You\'re not connected to your Claude account right now, so reports stay on this device until you are.</p>':''}</div>
    ${all.length ? `<div class="chips" role="group" aria-label="Show">${[['all',`All (${all.length})`],['open',`Open (${open.length})`],['done',`Handled (${done.length})`]].map(([k,t])=>`<button class="chipbtn" data-f="${k}" aria-pressed="${f===k}">${t}</button>`).join('')}</div>` : ''}
    <div class="rep-list" id="replist"></div>`;
  const list = $('#replist');
  if(!all.length) list.innerHTML = `<div class="empty"><b>No reports yet.</b><br>See a wrong answer, a typo or something confusing? Tap <b>Report a problem</b> under any question or at the top of a lesson. It shows up here.</div>`;
  else if(!shown.length) list.innerHTML = `<div class="empty">${f==='open'?'Nothing open. Everything you reported has been handled.':'Nothing handled yet.'}</div>`;
  else shown.forEach(r => list.appendChild(repItem(r, { isNew: RESOLVED(r.status) && (r.fixedAt||0) > REPV.prevSeen })));
  $$('[data-f]', app).forEach(b => b.onclick = () => { REPV.filter=b.dataset.f; try{ localStorage.setItem(REP_FILTER_KEY, REPV.filter); }catch(e){} renderReports(); });
}
function renderOneQuestion(qid){
  const q = Q[qid], L = LBYID[q.lesson], d = describeWhere('question:'+qid);
  app.innerHTML = `<div class="lesson-head"><div class="eyebrow">${esc(d.title)}</div><h1 style="margin-top:.4rem">Reported question</h1>
    <p class="small"><a href="#reports">← Back to Reports</a> · <a href="#${L.id}">Lesson ${L.n}: ${L.title}</a></p></div>
    <div class="qset" id="onebox"></div><h2>Your reports on this question</h2><div class="rep-list" id="onelist"></div>`;
  $('#onebox').appendChild(qCard(qid, { ctx:'single', label: q.quiz ? 'Unit quiz question · not scored here' : 'Counts as practice for this lesson',
    onAnswer: ok => { if(!q.quiz) recordPractice(qid, ok); } }));
  const mine = allReports().filter(r=>r.where==='question:'+qid);
  if(mine.length) mine.forEach(r => $('#onelist').appendChild(repItem(r, { showLink:false })));
  else $('#onelist').innerHTML = '<div class="empty">No reports on this question.</div>';
}

/* flashcard library: browse, edit, add */
const CARDV = { editing:false, filter:(()=>{ try{ return localStorage.getItem('micro-cards-filter')||'all'; }catch(e){ return 'all'; } })() };
function renderCards(){
  CARDV.editing = false;
  const f = CARDV.filter, lessons = f==='all' ? LESSONS : LESSONS.filter(l=>l.id===f);
  const total = Object.keys(CARDS).length, mine = Object.values(CARDS).filter(c=>c.custom).length, edited = Object.values(CARDS).filter(c=>c.edited).length;
  app.innerHTML = `<div class="lesson-head"><div class="eyebrow">Unit 1</div><h1 style="margin-top:.4rem">Flashcards</h1>
    <p class="oneline">All ${total} cards in one place. Fix any card that's unclear, or add your own.</p>
    <p class="small muted">${mine} made by you · ${edited} edited by you${CARDSTORE.col?'':' · Not signed in: changes stay on this device until you are'}</p></div>
    <div class="row"><button class="btn sm" id="cv-new" type="button">New flashcard</button><a class="btn ghost sm" href="#review">Back to Review</a></div>
    <div id="cv-newslot"></div>
    <div class="chips" style="margin-top:1rem" role="group" aria-label="Show lesson">${[['all','All lessons'],...LESSONS.map(l=>[l.id,'Lesson '+LBYID[l.id].n])].map(([k,t])=>`<button class="chipbtn" data-cf="${k}" aria-pressed="${f===k}">${t}</button>`).join('')}</div>
    <div id="cv-list"></div>`;
  const list = $('#cv-list');
  lessons.forEach(l => {
    const ids = cardsFor(l.id);
    const sec = document.createElement('section');
    sec.innerHTML = `<div class="cv-head"><h2>Lesson ${LBYID[l.id].n}: ${l.title}</h2><button class="btn ghost sm" type="button">Study these ${ids.length}</button></div><div class="cv-rows"></div>`;
    $('button', sec).onclick = () => startSession({ title:`Lesson ${LBYID[l.id].n} flashcards`, items: shuffle(ids), mode:'free' }, true);
    const rows = $('.cv-rows', sec);
    ids.forEach(id => rows.appendChild(cardRow(id)));
    list.appendChild(sec);
  });
  $('#cv-new').onclick = () => {
    const slot = $('#cv-newslot'); if(slot.firstChild) return;
    CARDV.editing = true;
    slot.appendChild(cardEditor({ lesson: f==='all' ? LESSONS[0].id : f, onDone: (id) => { CARDV.editing=false; slot.innerHTML=''; if(id) renderCards(); } }));
    $('input', slot).focus();
  };
  $$('[data-cf]', app).forEach(b => b.onclick = () => { CARDV.filter = b.dataset.cf; try{ localStorage.setItem('micro-cards-filter', CARDV.filter); }catch(e){} renderCards(); });
}
function cardRow(id){
  const c = CARDS[id], row = document.createElement('div'); row.className='cv-row';
  const snip = c.d.length>140 ? c.d.slice(0,137).trimEnd()+'…' : c.d;
  row.innerHTML = `<div class="cv-main"><b>${esc(c.t)}</b> ${c.custom?'<span class="pill st-open">Yours</span>':c.edited?'<span class="pill st-nochange">Edited</span>':''}<div class="small muted">${esc(snip)}</div><span class="rep-tag" data-rep="card:${id}"></span></div>
    <div class="cv-act"><a href="#fc-${id}">Open</a><button class="linkbtn" type="button">Edit</button></div>`;
  fillTag($('.rep-tag', row));
  $('button', row).onclick = () => {
    CARDV.editing = true; row.innerHTML = '';
    row.appendChild(cardEditor({ cid:id, onDone: () => { CARDV.editing=false; renderCards(); } }));
  };
  return row;
}
function renderOneCard(cid){
  const c = CARDS[cid], L = LBYID[c.lesson];
  app.innerHTML = `<div class="lesson-head"><div class="eyebrow">Lesson ${L.n} · ${esc(L.title)}</div><h1 style="margin-top:.4rem">Flashcard</h1>
    <p class="small"><a href="#cards">← All flashcards</a> · <a href="#reports">Reports</a></p></div>
    <div class="qset" id="fcbox"></div><h2>Your reports on this card</h2><div class="rep-list" id="fclist"></div>`;
  $('#fcbox').appendChild(flashCard(cid, { label:'Practice only · doesn\'t change your schedule', standalone:true }));
  const mine = allReports().filter(r=>r.where==='card:'+cid || r.where==='cardgrade:'+cid);
  if(mine.length) mine.forEach(r => $('#fclist').appendChild(repItem(r, { showLink:false })));
  else $('#fclist').innerHTML = '<div class="empty">No reports on this card.</div>';
}

/* boot */
render();
initStore();
</script>

</body></html>
