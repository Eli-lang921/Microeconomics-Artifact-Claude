<h2>The tax wedge</h2>
<!-- Order follows video 2.4: wedge and "doesn't matter who pays", revenue, why tax (public goods), surplus and deadweight loss, then elasticity and the burden. The price-control section (course textbook §3.5) and the graph-reading skill are additions placed after the course's material. -->
<!-- src: MS2 (video 2.4: wedge, Pb − Ps, socks $5/300, $1 tax on sellers, $5.50/$4.50, 200; slides 116-122); OS53 (excise tax wedge between Pc and Pp). Source problem: slide 122 labels the seller price "Pb = $4.50"; it should read Ps. -->
<p>Lesson 11 showed that ${dt('equilibrium','equilibrium')} makes ${dt('total-surplus','total surplus')} as large as possible. Lesson 8's price controls pushed the market away from it. A tax does the same thing in a different way: it makes the price buyers pay differ from the price sellers keep.</p>
<p>Your course: "the tax creates a wedge between the price paid by the buyer and the price received by the seller." That gap is the ${dt('tax-wedge','<b>tax wedge</b>')}:</p>
<div class="math">Tax = P<sub>B</sub> − P<sub>S</sub> &nbsp;(P<sub>B</sub> = price buyers pay, P<sub>S</sub> = price sellers keep)</div>
<div class="analogy"><div class="eyebrow">Analogy</div><p>Picture a toll booth on the only bridge between a farm town and a city. Farmers must now get a higher price in the city to make the trip worth it, and city buyers pay more than before. Some trips that used to be worth making no longer are. The toll is the wedge; the trips not taken are the loss.</p></div>
<p><b>Worked example: your course's sock market.</b> Before the tax: $5 a pair, 300 pairs. The government imposes a $1 tax, collected from sellers, and the quantity sold falls to 200.</p>
<div class="math">Buyers pay P<sub>B</sub> = <b>$5.50</b> (up $0.50)<br>Sellers keep P<sub>S</sub> = <b>$4.50</b> (down $0.50)<br>Wedge: $5.50 − $4.50 = <b>$1</b>, the tax</div>
${FIG.l12wedge()}
<p>Check: buyers' change plus sellers' change, $0.50 + $0.50, equals the $1 tax. (Your course's slide labels the sellers' price "P<sub>b</sub> = $4.50"; it should read P<sub>s</sub>.)</p>
<p>Your course adds right away: "it doesn't matter who pays the tax, the buyer or the seller." Here the sellers hand the $1 to the government, yet buyers still pay $0.50 of it through the higher price. Who bears how much is the last part of this lesson.</p>
<p>Why does quantity fall? At $5.50 buyers want fewer than 300 pairs (law of demand) and at $4.50 sellers offer fewer (law of supply). The market settles where they agree: 200.</p>
<div data-check="l12c-wedge"></div>

<h2>Tax revenue</h2>
<!-- src: MS2 (video 2.4: "we take the size of the tax and we multiply this by the quantity ... once we have the tax"; $200; slide 123) -->
<div class="math">Tax revenue = tax × quantity sold with the tax = $1 × 200 = <b>$200</b></div>
<p>On a graph, revenue is the rectangle between P<sub>B</sub> and P<sub>S</sub>, out to the taxed quantity. Use the <b>new</b> quantity: the 100 pairs that are no longer sold raise nothing.</p>
${FIG.l12revenue()}
<div data-check="l12c-rev"></div>

<h2>Why tax at all?</h2>
<!-- src: MS2 (video 2.4 and slide 130: revenue funds public goods: public education, national defense, roads; "Since taxes cause distortions ... they yield inefficient market outcomes. Why do we have them?"). -->
<p>Buyers now pay more and sellers keep less, so both are worse off; the next section measures by how much. Your course pauses here to ask why we tax at all: "the benefit comes from the gain in government tax revenue," which pays for ${dt('public-goods','public goods')}, "goods that the market if it was left up to its own devices wouldn't provide, such as public education, national defense, infrastructure." The supply and demand model measures a tax's cost; whether a given tax is worth that cost depends on what the revenue buys, which is a judgment the model alone can't make. Unit 7 returns to public goods.</p>
<div data-check="l12c-why"></div>

<h2>Deadweight loss</h2>
<!-- src: MS2 (video 2.4: CS falls, PS falls, revenue, "Deadweight loss is going to be the loss in surplus to society when there's a distortion in the market"; slides 124-128, 130); OS35 (deadweight loss definition, "like money thrown away that benefits no one"); ELDW (DWL proportional to t²). Made-up sock curves: D: Q = 1,300 − 200P; S: Q = 200P − 700. -->
<p>Now the cost. Your course compares the market before and after the tax: ${dt('consumer-surplus','consumer surplus')} falls, ${dt('producer-surplus','producer surplus')} falls, and the government gains revenue. What's missing is ${dt('deadweight-loss','<b>deadweight loss</b>')}: "the loss in surplus to society when there's a distortion in the market." Your course textbook calls it "like money thrown away that benefits no one."</p>
<p><b>Worked example: socks with made-up straight-line curves</b> that match your course's numbers (demand Q = 1,300 − 200P, supply Q = 200P − 700; demand reaches zero at $6.50, supply at $3.50).</p>
${table(['','Before the tax','After the $1 tax'],[['Consumer surplus','½ × 300 × ($6.50 − $5) = $225','½ × 200 × ($6.50 − $5.50) = $100'],['Producer surplus','½ × 300 × ($5 − $3.50) = $225','½ × 200 × ($4.50 − $3.50) = $100'],['Tax revenue','$0','$1 × 200 = $200'],['Total','<b>$450</b>','<b>$400</b>']])}
<div class="math">Deadweight loss = $450 − $400 = <b>$50</b><br>Check with the triangle: ½ × (300 − 200) × $1 = $50</div>
${FIG.l12areas()}
<p>Where does the $50 come from? Pairs 201 to 300 were worth more to buyers than they cost sellers, but not by more than the $1 tax, so they stop being traded. The revenue isn't lost; it moves to the government. The deadweight loss is surplus nobody gets.</p>
<div data-check="l12c-surplus,l12c-dwl"></div>

<h2>Who bears the tax</h2>
<!-- src: MS2 (video 2.4: "it doesn't matter who pays the tax"; "the tax burden is going to depend on the elasticity"; equal / demand more inelastic → buyer / supply more inelastic → seller; slide 119); OS53 ("tax incidence"; "the tax burden falls on the most inelastic side of the market"; cigarettes 0.3; beachfront hotels; "The more elastic the demand and supply curves are, the lower the tax revenue"). Source problem: the video says the tax "will be equally levied on both of them"; the burden is equal only when elasticities are equal, as the video itself explains later. -->
<p>${dt('tax-incidence','<b>Tax incidence</b>')} is how the burden of a tax is split between buyers and sellers. Two rules:</p>
<ol><li><b>Who writes the check doesn't matter.</b> Your course: "it doesn't matter who pays the tax, the buyer or the seller." A tax collected from sellers or from buyers opens the same $1 wedge, so prices and quantity end up the same.</li>
<li><b>Elasticity decides the split.</b> Your course textbook: "the tax burden falls on the most inelastic side of the market."</li></ol>
<div class="math">Buyers' burden = P<sub>B</sub> − old price &nbsp;&nbsp; Sellers' burden = old price − P<sub>S</sub></div>
<p><b>The mechanism.</b> A side that can't easily change how much it buys or sells (${dt('inelastic','inelastic')}) can't dodge the tax by trading less, so the price moves against it. A side with good alternatives (${dt('elastic','elastic')}) walks away instead, and the price can't move much against it.</p>
<ul><li><b>Inelastic demand → buyers bear more.</b> Your course textbook: a 10% rise in cigarette prices cuts adult smoking by only about 3%, so cigarette taxes "are mainly passed along to consumers in the form of higher prices."</li>
<li><b>Inelastic supply → sellers bear more.</b> The textbook's beachfront hotels can't move, while tourists have other vacation choices, so "the tax burden is now passed on to the sellers."</li>
<li><b>Equal elasticities → an equal split</b>, which is what your course's sock example assumes.</li></ul>
<p class="small muted"><b>A note on your course's wording.</b> The video first says "The tax will be equally levied on both of them so they will both share the burden of the tax," and its sock example splits the tax 50/50. Both sides usually share it, but equally only when the elasticities match; later the same video says "the tax burden is going to depend on the elasticity." On the exam, use the elasticity rule.</p>
<p>Try it. The default is your course's sock market (with made-up curves that match its numbers); switch the elasticity and move the tax:</p>
<div data-widget="taxlab"></div>
<p>Notice: with either inelastic side, quantity falls less, so the same $1 tax raises more revenue ($260 instead of $200) and causes less deadweight loss ($20 instead of $50). Your course textbook: "The more elastic the demand and supply curves are, the lower the tax revenue."</p>
<div data-check="l12c-elastic"></div>

<h2>Deadweight loss from price controls</h2>
<!-- src: OS35 (Figure 3.24: drug ceiling $600/20,000 → $400/15,000, transfer V, DWL U + W; theater floor $8/1,800 → $12/1,400, transfer H, DWL J + K; "both price floors and price ceilings block some transactions"); CED (POL-1.A: price controls and quotas create deadweight loss); Lesson 8 quota numbers. -->
<p>Any policy that holds quantity below the equilibrium creates deadweight loss, even one that helps one side.</p>
<ul><li><b>${dt('price-ceiling','Price ceiling')}.</b> Your course textbook's drug: a $400 ceiling (equilibrium $600) cuts quantity from 20,000 to 15,000. Some producer surplus moves to the buyers who still get the drug, and the 5,000 lost doses are deadweight loss.</li>
<li><b>${dt('price-floor','Price floor')}.</b> The textbook's movie theaters: a $12 floor (equilibrium $8) cuts tickets from 1,800 to 1,400. Some consumer surplus moves to theaters, and the 400 lost tickets are deadweight loss.</li>
<li><b>Quota.</b> Lesson 8's orange quota of 20 (equilibrium 30): buyers pay $4 while the 20th unit costs sellers $2. Deadweight loss = ½ × 10 × ($4 − $2) = <b>$10</b>.</li></ul>
${FIG.l12controls()}
<p>Your course textbook: price floors and ceilings "block some transactions that buyers and sellers would have been willing to make, and creates deadweight loss." That's why each side favors the control that transfers surplus to it, and why economists count the cost to everyone.</p>
<div data-check="l12c-controls"></div>

<h2>Read a tax graph</h2>
<!-- src: MS2; OS53. Exam skill: predict incidence from the slopes (steeper = more inelastic) and the facts of a market. -->
<p>CLEP questions often show a tax graph or describe a market and ask who bears more. On a graph, compare slopes at the equilibrium: the <b>steeper</b> curve is the more inelastic side and bears more. In words, ask which side has fewer alternatives.</p>
${FIG.l12incidence()}
<div data-widget="burden"></div>
<div data-check="l12c-skill"></div>

<h2>Common mistakes</h2>
<!-- Entries in order are M1-M6 (see L12TAGS mis). -->
<div class="mistakes"><p class="eyebrow">Watch out for these</p><ul>
<li><span class="wrong">"Whoever pays the tax to the government bears it."</span>The wedge is the same whoever writes the check. Elasticity decides who bears it.</li>
<li><span class="wrong">"A tax is always split equally."</span>Only when demand and supply are equally elastic, as in your course's sock example.</li>
<li><span class="wrong">"Tax revenue is the deadweight loss."</span>Revenue is a transfer to the government. Deadweight loss is surplus nobody gets, from trades that stop happening.</li>
<li><span class="wrong">"The more inelastic side pays less, because it doesn't respond."</span>Backwards: not responding means it can't escape, so it bears more.</li>
<li><span class="wrong">"A tax only hurts buyers."</span>Buyers pay more and sellers keep less, so consumer surplus and producer surplus both fall.</li>
<li><span class="wrong">"A ceiling that helps buyers has no deadweight loss."</span>Ceilings, floors and quotas all block trades worth more than they cost; the transfer to one side doesn't make up for that.</li>
</ul></div>

<h2>Recap</h2>
<div class="callout">
<ol>
<li>A per-unit tax opens a <b>wedge</b>: tax = P<sub>B</sub> − P<sub>S</sub>. Buyers pay more, sellers keep less and quantity falls.</li>
<li><b>Tax revenue</b> = tax × quantity sold with the tax.</li>
<li><b>Tax incidence</b>: who writes the check doesn't matter; the more inelastic side bears more. Equal elasticities split it equally.</li>
<li>Consumer and producer surplus both fall. Part becomes revenue; the rest is <b>deadweight loss</b>, from trades that no longer happen. With straight lines, DWL = ½ × lost units × tax.</li>
<li>Price ceilings, floors and quotas also create deadweight loss, while moving surplus from one side to the other.</li>
<li>More elastic markets: less revenue and more deadweight loss for the same tax.</li>
</ol>
<p><b>How the CLEP tests this:</b> the outline lists "Tax incidence and deadweight loss" under Supply and Demand (15% to 20% of the exam). Expect graphs with a tax wedge and lettered areas, questions on who bears a tax given elasticities, and short calculations of revenue and deadweight loss.</p>
</div>`,
  deeper:`
<h3>Deadweight loss grows with the square of the tax</h3>
<p>In the sock model, a tax of t dollars cuts quantity by 100t pairs, so deadweight loss = ½ × 100t × t = 50t²: $12.50 at $0.50, $50 at $1, $200 at $2. Econlib's David Henderson makes the same point about income taxes: deadweight loss is proportional to the square of the tax rate. That's one reason economists often prefer several small taxes on a broad base to one large tax on a narrow one.</p>
<h3>Taxing a good with an elastic side</h3>
<p>Your course textbook notes a trade-off in cigarette taxes: an inelastic demand means a tax raises a lot of revenue but doesn't cut smoking much, while a tax that "discourages consumption by quite a lot" raises little revenue. A government can't get the most revenue and the biggest drop in use from the same tax; which goal matters more is a policy choice.</p>`,
  links:[ {k:'Textbook',t:'5.3 Elasticity and Pricing',s:'OpenStax, Principles of Microeconomics 3e (free online)',u:'https://openstax.org/books/principles-microeconomics-3e/pages/5-3-elasticity-and-pricing',w:'The newer edition of your course textbook\'s §5.3, with the section "Elasticity and Tax Incidence" and its two-panel graph.'},
          {k:'Video',t:'Who Pays the Tax?',s:'Marginal Revolution University',u:'https://learn.mru.org/lessons/tax-burden-elasticity-affordable-care-act-health-insurance-mandate',w:'A short video on how elasticity decides who bears a tax.'},
          {k:'Article',t:'Deadweight Loss Computations',s:'David R. Henderson, Econlib',u:'https://www.econlib.org/deadweight-loss-computations/',w:'A brief worked example of why deadweight loss rises faster than the tax rate.'} ]
});

qz('u1-factorflow','In the circular flow model, which of the following flows from households to firms through the factor market?',['Land, labor, capital and entrepreneurship','Wages, rent, interest and profit payments','Goods and services','Spending on goods and services','Taxes'],0,'<p>In the factor market households <b>sell</b> resources (labor, land, capital, entrepreneurship) to firms, and the money (wages, rent, interest, profit) flows the other way. Goods flow from firms to households in the product market, paid for by household spending there. Taxes are not part of the simple two-sector model.</p>','l4');

/* ===== Unit 2 quiz: 20 items (blueprint in unit2-notes.md) =====
   Blueprint by CLEP outline topic: Equilibrium 3 · Determinants 3 · Price and quantity controls 3 · PED and its determinants 2
   PED and total revenue 2 · PES 1 · Income elasticity 1 · Cross-price elasticity 1 · Surplus and efficiency 2 · Tax incidence 1 · Deadweight loss 1.
   Graph or data items: q2-eq-1, q2-ctl-2, q2-ped-1, q2-tr-2, q2-inc, q2-xpe, q2-cs-1, q2-dwl (8).

   Answers, correctness and explanations appear only after the whole quiz is submitted (quiz2.render.js). */

qz2('q2-eq-1','l7',`Use the graph.${sdg({xmax:10,ymax:10,xt:[0,2,4,6,10],yt:[0,6,8,10],lines:[{a:[0,10],b:[10,0],label:'D'},{a:[0,2],b:[8,10],label:'S',c:'var(--g1)',lx:-6,ly:14,anchor:'end'}],hl:[{p:8,c:'var(--muted)'}],dots:[{q:4,p:6,label:'E'}]})}If the price is $8, which of the following describes the market?`,
  [`A surplus of 4 units, so the price will tend to fall`,`A shortage of 4 units, so the price will tend to rise`,`A surplus of 6 units, so the price will tend to fall`,`A shortage of 2 units, so the price will tend to fall`,`The market is in equilibrium`],0,
  `<p>At $8, read across to each curve: quantity demanded is 2 and quantity supplied is 6. Supply exceeds demand by 4, a <b>surplus</b> (excess supply), and sellers cut prices toward the $6 equilibrium.</p><p>The tempting "shortage" is Lesson 7's M1: above the equilibrium price there's too much, not too little. "A surplus of 6" reads only the supply curve.</p>`);
qz2('q2-eq-2','l7','A popular new phone model raises demand for phone cases. At the same time, cheaper plastic lowers the cost of making them. What happens in the market for phone cases?',
  [`Quantity rises; the effect on price can\'t be determined without knowing the sizes of the shifts`,`Price and quantity both rise`,`Price falls and quantity rises`,`Price rises; the effect on quantity can\'t be determined`,`Price and quantity both stay the same, because the shifts cancel`],0,
  `<p>Demand shifts right (pushes price up, quantity up). Supply shifts right (pushes price down, quantity up). Both push quantity up, so it rises. They push price in opposite directions, so the price change is <b>indeterminate</b> without the sizes.</p><p>The tempting "both rise" ignores the supply shift (Lesson 7's M4). "The shifts cancel" assumes equal sizes.</p>`);
qz2('q2-eq-3','l7','A drought cuts the wheat harvest. What happens in the market for bread, other things equal?',
  [`Supply of bread decreases: price rises and quantity falls`,`Demand for bread decreases because bread costs more: price and quantity fall`,`Supply of bread decreases: price and quantity both fall`,`Demand for bread increases: price and quantity rise`,`Nothing, because the drought affects wheat, not bread`],0,
  `<p>Wheat is an input to bread. A higher input price raises the cost of making bread, so supply shifts left: a higher price and a smaller quantity.</p><p>The tempting "demand decreases because bread costs more" is Lesson 7's M2: the higher price moves buyers <b>along</b> the demand curve; it doesn't shift it.</p>`);

qz2('q2-det-1','l6','Which of the following would cause a <b>movement along</b> the demand curve for movie tickets, rather than a shift of it?',
  [`A rise in the price of movie tickets`,`A rise in consumers\' incomes`,`A fall in the price of streaming subscriptions`,`A popular actor starring in a new release`,`An increase in the town\'s population`],0,
  `<p>Only a change in the good's <b>own price</b> moves buyers along its demand curve (a change in quantity demanded). Every other choice is a determinant of demand (income, a related good, tastes, number of buyers) and shifts the whole curve.</p><p>This is Lesson 6's M1 and M2: own price changes quantity demanded, not demand.</p>`);
qz2('q2-det-2','l6','Incomes in a city rise. Store-brand pasta is an inferior good there. What happens to the demand for store-brand pasta?',
  [`It decreases: the demand curve shifts left`,`It increases: the demand curve shifts right`,`Quantity demanded falls, but demand doesn\'t change`,`It doesn\'t change, because pasta prices didn\'t change`,`Supply decreases`],0,
  `<p>For an <b>inferior good</b>, higher income lowers demand: people switch to brands they now prefer. The whole curve shifts left.</p><p>The tempting "it increases" is Lesson 6's M3 (more income always means more demand), which is true only for normal goods. "Quantity demanded falls" confuses a shift with a movement (M2).</p>`);
qz2('q2-det-3','l6','Rideshare companies raise their prices sharply. What happens in the market for taxi rides?',
  [`Demand for taxi rides increases, because rideshares and taxis are substitutes`,`Demand for taxi rides decreases, because rideshares and taxis are complements`,`The quantity of taxi rides demanded rises, but the demand curve for taxis doesn\'t shift`,`Demand for taxi rides doesn\'t change, because taxi fares didn\'t change`,`The supply of taxi rides decreases`],0,
  `<p>Rideshares and taxis do the same job: they're <b>substitutes</b>. When one gets pricier, some riders switch to the other, so demand for taxi rides shifts right.</p><p>"Complements" is Lesson 6's M4: related goods don't all move the same way. Because it's another good's price that changed, the taxi demand curve shifts; it isn't a movement along it (M1).</p>`);

qz2('q2-ctl-1','l8','A city sets the maximum rent for apartments below the market equilibrium rent. What is the most likely result?',
  [`A shortage: more people want apartments than landlords offer at the capped rent`,`A surplus of empty apartments`,`No change, because rents were already at equilibrium`,`The supply curve of apartments shifts right`,`Every renter in the city is better off`],0,
  `<p>A <b>binding price ceiling</b> holds the price below equilibrium: quantity demanded rises and quantity supplied falls, so there's a shortage.</p><p>Distractors: a surplus comes from a floor above equilibrium (Lesson 8's M2); controls move the market along the curves rather than shifting them (M3); and renters who can't find an apartment aren't helped (M4).</p>`);
qz2('q2-ctl-2','l8',`Made-up market for a crop:${table(['Price','$4','$5','$6','$7','$8'],[['Quantity demanded','60','50','40','30','20'],['Quantity supplied','20','30','40','50','60']])}The government sets a price floor of $7. What happens?`,
  [`A surplus of 20 units`,`A shortage of 20 units`,`A surplus of 10 units`,`A surplus of 50 units`,`Nothing, because the floor is above the equilibrium price`],0,
  `<p>Equilibrium is $6 (40 demanded, 40 supplied). The $7 floor is above it, so it binds: quantity demanded falls to 30, quantity supplied rises to 50, leaving a surplus of 50 − 30 = <b>20</b>.</p><p>"A shortage" is Lesson 8's M2. "Nothing" has the binding rule backwards: a floor binds when it's <b>above</b> equilibrium. 50 is quantity supplied, not the surplus.</p>`);
qz2('q2-ctl-3','l8','The equilibrium wage for lifeguards in a town is $18 an hour. The state sets a minimum wage of $15 an hour. What happens in the lifeguard market?',
  [`Nothing: the floor is below the equilibrium wage, so it doesn\'t bind`,`A surplus of lifeguards (unemployment) appears`,`A shortage of lifeguards appears`,`The wage falls to $15`,`Demand for lifeguards shifts left`],0,
  `<p>A price floor only matters if it's above the equilibrium. At $15, employers already pay more ($18), so the floor is <b>non-binding</b>.</p><p>The tempting "surplus of lifeguards" assumes every minimum wage causes unemployment in every job (Lesson 8's M5). "A shortage" mixes up floors and ceilings.</p>`);

qz2('q2-ped-1','l9','The price of a concert poster rises from $8 to $12, and the quantity demanded falls from 110 to 90. Using the midpoint method, what is the price elasticity of demand (absolute value), and how is demand described?',
  [`0.5, inelastic`,`2.0, elastic`,`0.36, inelastic`,`0.5, elastic`,`1.0, unit elastic`],0,
  `<p>%Δ quantity = (90 − 110) ÷ 100 = −20%. %Δ price = (12 − 8) ÷ 10 = 40%. Elasticity = 20% ÷ 40% = <b>0.5</b>, below 1, so demand is <b>inelastic</b>.</p><p>Tempting wrong answers: 2.0 divides price by quantity (upside down); 0.36 uses the starting values instead of midpoints (18.2% ÷ 50%); "0.5, elastic" is Lesson 9's M5 (elastic means above 1, not below).</p>`);
qz2('q2-ped-2','l9','Which of the following changes would make the demand for a good <b>more elastic</b>?',
  [`A close substitute becomes available at a similar price`,`The good becomes more of a necessity for buyers`,`Buyers have less time to adjust to a price change`,`The good takes up a smaller share of buyers\' budgets`,`The supply curve becomes flatter`],0,
  `<p>More and closer substitutes give buyers somewhere to go when the price rises, so quantity demanded responds more: demand becomes <b>more elastic</b>.</p><p>The other demand-side choices push the opposite way: necessities (Lesson 9's M4), less time to adjust (M6) and a smaller budget share all make demand <b>less</b> elastic. The supply curve's slope doesn't change the elasticity of demand.</p>`);

qz2('q2-tr-1','l9','A ski resort cuts its lift-ticket price by 10%, and its total ticket revenue falls. What does this tell you about demand for its tickets in this price range?',
  [`Demand is inelastic: tickets sold rose by less than 10%`,`Demand is elastic: tickets sold rose by more than 10%`,`Demand is unit elastic`,`The demand curve shifted left`,`A lower price always lowers revenue, so it tells you nothing`],0,
  `<p>Revenue = price × quantity. If a 10% price cut <b>lowers</b> revenue, the quantity sold must have risen by less than 10%: demand is <b>inelastic</b>. (With elastic demand the price cut would have raised revenue; with unit elastic demand revenue wouldn't change.)</p><p>"A lower price always lowers revenue" is Lesson 9's M3 run backwards: the direction depends on elasticity.</p>`);
qz2('q2-tr-2','l9','Made-up demand for a game download: quantity = 200 − 20 × price. The seller cuts the price from $8 to $7. What happens to total revenue, and what does that show?',
  [`It rises from $320 to $420, so demand is elastic in this price range`,`It falls from $420 to $320, so demand is inelastic in this range`,`It rises from $320 to $420, so demand is inelastic in this range`,`It stays at $320, so demand is unit elastic`,`It falls, because the price fell`],0,
  `<p>At $8: quantity 200 − 160 = 40, revenue $8 × 40 = $320. At $7: quantity 60, revenue $7 × 60 = $420. A price cut that <b>raises</b> revenue means demand is <b>elastic</b> here (high prices sit on the elastic upper part of a straight demand line).</p><p>"It falls, because the price fell" ignores the 50% jump in quantity (Lesson 9's M3).</p>`);

qz2('q2-pes','l9','Which of the following best explains why the supply of fresh strawberries is more elastic over two years than over two weeks?',
  [`Over two years, farmers can plant more fields and new growers can enter; in two weeks they can only sell what is already growing`,`Over two years, buyers find more substitutes for strawberries`,`Strawberries are a luxury in the long run`,`The supply curve gets steeper over time`,`Elasticity of supply is the same in the short run and the long run`],0,
  `<p>Price elasticity of supply depends on how easily sellers can change production. Given time, farmers expand acreage and new growers enter, so quantity supplied responds much more to price.</p><p>"Buyers find substitutes" describes demand, not supply. "The same in short and long run" is Lesson 9's M6; the curve gets <b>flatter</b> (more elastic) over time, not steeper.</p>`);

qz2('q2-inc','l10','When average incomes rise 10%, purchases of used cars fall 5%. What is the income elasticity of demand for used cars, and what kind of good are they here?',
  [`−0.5; an inferior good`,`0.5; a normal good`,`−2.0; an inferior good`,`−0.5; a low-quality good, so a normal good`,`0.5; an inferior good, because the elasticity is below 1`],0,
  `<p>Income elasticity = %Δ quantity ÷ %Δ income = −5% ÷ 10% = <b>−0.5</b>. A negative sign means buyers purchase less as income rises: an <b>inferior good</b>.</p><p>"Inferior" is about the sign, not quality (Lesson 10's M1). −2.0 divides upside down. "Below 1 means inferior" mixes up the size and the sign (M4, M5).</p>`);
qz2('q2-xpe','l10','The price of butter rises 20%, and the quantity of margarine demanded rises 10%. What is the cross-price elasticity, and how are the goods related?',
  [`+0.5; substitutes`,`−0.5; complements`,`+0.5; complements`,`+2.0; substitutes`,`About zero; unrelated`],0,
  `<p>Cross-price elasticity = %Δ quantity of margarine ÷ %Δ price of butter = 10% ÷ 20% = <b>+0.5</b>. Positive: when one gets pricier, buyers switch to the other, so they're <b>substitutes</b>.</p><p>"+0.5; complements" is Lesson 10's M2 reversed: complements have a <b>negative</b> sign. +2.0 puts the price on the top (M3).</p>`);

qz2('q2-cs-1','l11',`Use the graph. The market is in equilibrium at E.${sdg({xmax:10,ymax:10,xt:[0,4,10],yt:[0,4,6,10],lines:[{a:[0,10],b:[10,0],label:'D'},{a:[0,4],b:[10,9],label:'S',c:'var(--g1)',lx:-6,ly:14,anchor:'end'}],hl:[{p:6,c:'var(--muted)'}],dots:[{q:4,p:6,label:'E'}]})}What is the producer surplus?`,
  [`$4`,`$8`,`$12`,`$24`,`$16`],0,
  `<p>Producer surplus is the triangle above the supply curve and below the $6 price, out to the quantity of 4. Supply starts at $4, so the height is $6 − $4 = $2. Area = ½ × 4 × $2 = <b>$4</b>.</p><p>Tempting wrong answers: $8 is consumer surplus (½ × 4 × $4); $12 is total surplus; $24 is revenue ($6 × 4), Lesson 11's M3 (producer surplus = revenue); $16 forgets the ½ on consumer surplus.</p>`);
qz2('q2-cs-2','l11','Which statement about a competitive market at equilibrium, with no market failures, is correct?',
  [`Total surplus is as large as possible`,`Consumer surplus and producer surplus are each as large as possible`,`Every buyer who wants the good gets it`,`Producing more than the equilibrium quantity would raise total surplus`,`Consumer surplus equals what buyers pay`],0,
  `<p>Equilibrium maximizes <b>total</b> surplus: every unit worth more to a buyer than it costs a seller is traded, and no unit worth less.</p><p>"Each as large as possible" is Lesson 11's M2: a ceiling could raise consumer surplus, but total surplus would fall. Buyers who value the good below the price don't buy it (Lesson 7's M5). Producing more lowers total surplus (M5).</p>`);

qz2('q2-tax','l12','A city puts a tax on apartment rentals, collected from tenants with their rent. In the short run the number of apartments is fixed, while tenants can move to nearby towns. Who bears most of the tax?',
  [`Landlords, because supply is the more inelastic side`,`Tenants, because they hand the tax to the city`,`Tenants, because demand is elastic`,`They split it equally`,`Neither, because the tax is passed on to the city`],0,
  `<p>The more <b>inelastic</b> side bears more. A fixed number of apartments can't respond to price, while tenants can leave, so rents (before tax) fall and landlords absorb most of the tax.</p><p>"Tenants, because they hand the tax over" is Lesson 12's M1: who writes the check doesn't decide the burden. "Split equally" is M2.</p>`);
qz2('q2-dwl','l12','A $2 per-unit tax reduces the quantity sold in a market from 500 to 400 (straight-line demand and supply). What are the tax revenue and the deadweight loss?',
  [`Revenue $800; deadweight loss $100`,`Revenue $1,000; deadweight loss $100`,`Revenue $800; deadweight loss $200`,`Revenue $800; no deadweight loss, because the revenue funds public goods`,`Revenue $200; deadweight loss $800`],0,
  `<p>Revenue = tax × quantity with the tax = $2 × 400 = <b>$800</b>. Deadweight loss = ½ × lost units × tax = ½ × 100 × $2 = <b>$100</b>.</p><p>Tempting wrong answers: $1,000 uses the old quantity; $200 forgets the ½; "no deadweight loss" treats the revenue as making up for lost trades (Lesson 12's M3); the last choice swaps revenue and deadweight loss.</p>`);

/* Number choices listed smallest to largest (workbook convention, as in Unit 1 and Lesson 8).
   Applies to Unit 2 fixed multiple-choice questions whose five choices all start with a number or dollar amount
   (e.g. "$2.75", "0.5, inelastic", "−0.5; an inferior good"). Re-maps the answer index and fixes the order. */
(function u2SortNumeric(){
  const U2L = new Set(['l6','l7','l8','l9','l10','l11','l12']);
  const lead = t => { const m = String(t).replace(/<[^>]+>/g,'').replace(/−/g,'-').replace(/,(?=\d{3}\b)/g,'').match(/^\s*([+-]?)\$?\s*([+-]?\d+(?:\.\d+)?)/); return m ? parseFloat((m[1]||'')+m[2]) : null; };
  Object.entries(Q).forEach(([id,q]) => {
    if(!U2L.has(q.lesson) || q.type!=='mc' || q.kind==='tf' || !Array.isArray(q.options) || q.gen || q.build) return;
    const v = q.options.map(lead); if(v.some(x => x===null)) return;
    const idx = q.options.map((t,i)=>i).sort((a,b)=> v[a]-v[b] || String(q.options[a]).localeCompare(String(q.options[b])));
    const ans = q.answer; q.options = idx.map(i=>q.options[i]); q.answer = idx.indexOf(ans); q.keepOrder = true;
  });
})();

const CARDS = {}, BASE_CARDS = {};
Object.entries(CARD_LIST).forEach(([lid,list])=>list.forEach(([t,q,d,ex,tip],i)=>{ BASE_CARDS[`c-${lid}-${i}`] = { lesson:lid, t, q, d, ex, tip }; }));

/* Your own cards and your edits to built-in cards, kept per person:
     data/users/<id>/micro-workbook/cards/<cardId>  { lesson, t, q, d, ex, tip, custom: true|false, at }
   custom:true = a card you made (id "u-..."); custom:false = your edit of a built-in card (same id as the built-in).
   While signed out, changes wait in this device's localStorage and upload when the account connects. */
const CARDSTORE = { col:null, docs:{} };
const LOCAL_CARDS_KEY = 'micro-cards-local';
function loadLocalCards(){ try{ const v=JSON.parse(localStorage.getItem(LOCAL_CARDS_KEY)); return v && typeof v==='object' ? v : {}; }catch(e){ return {}; } }
function saveLocalCards(v){ try{ localStorage.setItem(LOCAL_CARDS_KEY, JSON.stringify(v)); }catch(e){} }
function rebuildCards(){
  Object.keys(CARDS).forEach(k=>delete CARDS[k]);
  const mine = { ...CARDSTORE.docs, ...loadLocalCards() };
  Object.entries(BASE_CARDS).forEach(([id,c])=>{ const o = mine[id]; CARDS[id] = (o && !o.custom && !o.deleted) ? { ...c, ...pickCard(o), lesson:c.lesson, edited:true } : { ...c }; });
  Object.entries(mine).sort((a,b)=>(a[1].at||0)-(b[1].at||0)).forEach(([id,o])=>{ if(o && o.custom && !o.deleted && LBYID_SAFE(o.lesson) && o.t && o.d) CARDS[id] = { ...pickCard(o), lesson:o.lesson, custom:true }; });
}
const LBYID_SAFE = lid => !!CARD_LIST[lid];
const pickCard = o => ({ t:String(o.t||'').slice(0,200), q:String(o.q||'').slice(0,400), d:String(o.d||'').slice(0,2000), ex:String(o.ex||'').slice(0,1000), tip:String(o.tip||'').slice(0,600) });
const cardsFor = lid => Object.keys(CARDS).filter(k=>CARDS[k].lesson===lid);
async function saveCard(id, data){
  const body = { ...pickCard(data), lesson:data.lesson, custom:!!data.custom, at:Date.now() };
  if(CARDSTORE.col){
    CARDSTORE.docs[id] = body; rebuildCards();
    try{ await CARDSTORE.col.doc(id).set(body); return 'saved'; }catch(e){ delete CARDSTORE.docs[id]; }
  }
  const loc = loadLocalCards(); loc[id] = body; saveLocalCards(loc); rebuildCards(); return 'local';
}
async function removeCardDoc(id){
  /* removing your record deletes a card you made, or resets a built-in card to the original */
  const loc = loadLocalCards();
  if(loc[id]){ delete loc[id]; saveLocalCards(loc); }
  if(CARDSTORE.col){ delete CARDSTORE.docs[id]; rebuildCards(); try{ await CARDSTORE.col.doc(id).delete(); }catch(e){} }
  rebuildCards();
}
function startCards(){
  if(CARDSTORE.col || !Store.ref) return;
  CARDSTORE.col = Store.ref.collection('cards');
  CARDSTORE.col.onSnapshot(snap => {
    const docs = {}; snap.docs.forEach(d => { docs[d.id] = d.data(); }); CARDSTORE.docs = docs;
    rebuildCards(); onCardsChanged();
  }, () => {});
  (async () => {
    const loc = loadLocalCards(), left = {};
    for(const [id,o] of Object.entries(loc)){
      try{ if(o.deleted) await CARDSTORE.col.doc(id).delete(); else await CARDSTORE.col.doc(id).set(o); }catch(e){ left[id]=o; }
    }
    saveLocalCards(left);
  })();
}

    model:'Marginal benefit is the extra benefit of one more unit and marginal cost is the extra cost. Say I\'m studying for an exam. The first hour helps a lot; by the fourth hour I\'m tired and learn less, so the marginal benefit falls. The marginal cost of each hour is what I give up, like sleep or work. I should keep studying while the next hour is worth at least what it costs me and stop once it\'s worth less. Looking at the total hours wouldn\'t tell me when to stop; looking at the next hour does.',

/* ---------- report a problem ----------
   Each report is its own document, separate from progress, so a progress sync can never erase it:
     data/users/<id>/micro-workbook/reports/<reportId>
     { where: "question:<qid>" | "lesson:<lid>", note, at (ms), status: "open" | "fixed" | "nochange", reply: "", fixedAt: 0 }
   Claude reads open reports with ArtifactData, fixes the page, then sets status, reply (one line on what changed) and fixedAt.
   Reports made while signed out or offline wait on this device (localStorage) and are sent once the account connects. */
const REP = { col:null, list:[], live:false };
const REP_PENDING_KEY = 'micro-reports-pending', REP_FILTER_KEY = 'micro-rep-filter';
const RESOLVED = s => s==='fixed' || s==='nochange';
function loadPending(){ try{ const v=JSON.parse(localStorage.getItem(REP_PENDING_KEY)); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function savePending(v){ try{ localStorage.setItem(REP_PENDING_KEY, JSON.stringify(v)); }catch(e){} }
const newRepId = at => 'r' + at + '-' + Math.random().toString(36).slice(2,6);
function allReports(){
  const sent = new Set(REP.list.map(r=>r.id));
  const pend = loadPending().filter(r=>!sent.has(r.id)).map(r=>({ ...r, status:'unsent', reply:'', fixedAt:0 }));
  return [...pend, ...REP.list].sort((a,b)=>(b.at||0)-(a.at||0));
}
const repBody = r => ({ where:String(r.where), note:String(r.note).slice(0,1000), ctx:String(r.ctx||'').slice(0,4000), at:r.at, status:'open', reply:'', fixedAt:0 });
async function addReport(where, note, ctx){
  const r = { id:newRepId(Date.now()), where, note:note.slice(0,1000), ctx:String(ctx||'').slice(0,4000), at:Date.now() };
  if(REP.col){
    try{ await REP.col.doc(r.id).set(repBody(r)); return 'sent'; }
    catch(e){ if(e && e.code==='quota_exceeded'){ /* fall through to local */ } }
  }
  const p = loadPending(); p.push(r); savePending(p.slice(-100)); updateRepUI(); return 'local';
}
async function flushPending(){
  if(!REP.col) return;
  const legacy = (S.reports||[]).map(r=>({ id:'r'+(r.at||0)+'-old', where:r.where, note:r.note, at:r.at||Date.now() }));
  const queue = [...loadPending(), ...legacy]; if(!queue.length) return;
  const left = [];
  for(const r of queue){ try{ await REP.col.doc(r.id).set(repBody(r)); }catch(e){ left.push(r); } }
  savePending(left.filter(r=>!String(r.id).endsWith('-old')));
  if(legacy.length && !left.some(r=>String(r.id).endsWith('-old'))){ S.reports = []; save(); }
  updateRepUI();
}
function startReports(){
  if(REP.col || !Store.ref) return;
  REP.col = Store.ref.collection('reports');
  REP.col.onSnapshot(snap => {
    REP.list = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    REP.live = true; updateRepUI();
  }, () => { REP.live = false; });
  flushPending();
}
async function removeReport(r){
  if(r.status==='unsent'){ savePending(loadPending().filter(x=>x.id!==r.id)); updateRepUI(); return; }
  if(REP.col){ try{ await REP.col.doc(r.id).delete(); }catch(e){} }
}
function describeWhere(where){
  where = String(where);
  if(where.startsWith('general:')){ const k = where.slice(8); return { title: GENERAL_TOPICS[k] || 'General report', snip:'', href: GENERAL_HREF[k] || null }; }
  if(where.startsWith('explain:')){ const inner = describeWhere(where.slice(8)); return { title: inner.title + ' · Claude\'s explanation', snip: inner.snip, href: inner.href }; }
  const ci = where.indexOf(':'), kind = where.slice(0, ci), id = where.slice(ci+1);
  if(kind==='section' || kind==='widget'){ const [lid, name] = id.split('|'); const L = LBYID[lid];
    if(L) return { title: kind==='section' ? `Lesson ${L.n} · "${name}" section` : `Lesson ${L.n} · interactive: ${name}`, snip:'', href:'#'+lid }; }
  if(kind==='writing' && WRITE[id]){ const w = WRITE[id]; return { title:`Lesson ${LBYID[w.lesson].n} · Writing prompt`, snip:w.prompt, href:'#'+w.lesson }; }
  if(kind==='lesson' && LBYID[id]) return { title:`Lesson ${LBYID[id].n} · lesson page`, snip:LBYID[id].title, href:'#'+id };
  if((kind==='card' || kind==='cardgrade')){
    const c = CARDS[id]; if(!c) return { title:'Flashcard (since deleted)', snip:'', href:null };
    return { title:`Lesson ${LBYID[c.lesson].n} · ${kind==='card'?'Flashcard':'Claude\'s check of your flashcard answer'}${c.custom?' (yours)':''}`, snip:c.t, href:'#fc-'+id };
  }
  if(kind==='grade' && WRITE[id]){ const w = WRITE[id]; return { title:`Lesson ${LBYID[w.lesson].n} · Claude's grading of your writing`, snip:w.prompt, href:'#'+w.lesson }; }
  if(kind==='question' && Q[id]){
    const q = Q[id], L = LBYID[q.lesson];
    const place = q.quiz ? 'Unit quiz question' : L.core.includes(id) ? `Practice question ${L.core.indexOf(id)+1}` : L.more.includes(id) ? `Extra question ${L.more.indexOf(id)+1}` : 'Question';
    let snip = '';
    try{ const tmp=document.createElement('div'); tmp.innerHTML = instance(id).prompt; tmp.querySelectorAll('svg,.tbl-wrap,.qg').forEach(n=>n.replaceWith(' … ')); snip = tmp.textContent.replace(/\s+/g,' ').trim(); }catch(e){}
    if(snip.length>120) snip = snip.slice(0,117).trimEnd()+'…';
    return { title: q.quiz ? `Unit ${L.unit||1} quiz · from Lesson ${L.n}` : `Lesson ${L.n} · ${place}`, snip, href:'#q-'+id };
  }
  return { title:String(where), snip:'', href:null };
}
const GENERAL_TOPICS = { workbook:'General · the workbook overall', idea:'Idea or feature request', review:'Review tab', quiz:'Unit 1 quiz', quiz2:'Unit 2 quiz', cards:'Flashcards page', other:'Something else' };
const GENERAL_HREF = { review:'#review', quiz:'#quiz', quiz2:'#quiz2', cards:'#cards' };
const shortDay = t => new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const STATUS_LABEL = { open:'Open', unsent:'Not sent yet', fixed:'Fixed', nochange:'No change needed' };
function fillTag(tag){
  const mine = allReports().filter(r=>r.where===tag.dataset.rep);
  const r = mine[0]; tag.className = 'rep-tag'; tag.innerHTML = '';
  if(!r) return;
  tag.classList.add('st-'+r.status);
  if(RESOLVED(r.status)){
    const note = r.reply ? (r.reply.length>140 ? r.reply.slice(0,137)+'…' : r.reply) : '';
    tag.innerHTML = `${r.status==='fixed'?'Fixed':'Checked'} ${shortDay(r.fixedAt||r.at)}${note?` <span class="rt-note">· ${esc(note)}</span>`:''}`;
  } else tag.textContent = r.status==='unsent' ? 'Reported (not sent yet)' : `Reported ${shortDay(r.at)} · open`;
}
function updateRepUI(){
  $$('.rep-tag[data-rep]').forEach(fillTag);
  refreshChrome();
  if(view==='reports' && !REPV.busy) renderReports();
}
function mountReport(where, host, ctxFn){
  host.appendChild(reportLink(where, host, ctxFn));
  const tag = document.createElement('span'); tag.dataset.rep = where; host.appendChild(tag); fillTag(tag);
}
function reportLink(where, host, ctxFn){
  const b = document.createElement('button'); b.type='button'; b.className='rep-link'; b.textContent='Report a problem';
  b.onclick = () => {
    if(host.querySelector('.rep-box')) return;
    const box = document.createElement('div'); box.className='rep-box';
    box.innerHTML = `<label class="small muted" for="rep-${esc(where)}">What's wrong? (wrong answer, typo, confusing, broken...)</label><textarea id="rep-${esc(where)}" rows="3" maxlength="1000"></textarea><div class="row" style="margin-top:6px"><button class="btn sm" type="button">Send</button><button class="btn ghost sm" type="button">Cancel</button></div>`;
    const [send, cancel] = box.querySelectorAll('button'), ta = box.querySelector('textarea');
    cancel.onclick = () => box.remove();
    send.onclick = async () => {
      const note = ta.value.trim(); if(!note){ ta.focus(); return; }
      send.disabled = true; cancel.disabled = true;
      let ctx=''; try{ ctx = ctxFn ? ctxFn() : ''; }catch(e){}
      const how = await addReport(where, note, ctx);
      box.innerHTML = how==='sent'
        ? '<p class="small" style="margin:0">Sent. Track it under <a href="#reports">Reports</a>; Claude adds a note there when it\'s handled.</p>'
        : '<p class="small" style="margin:0">Saved on this device. It will be sent when you\'re signed in to Claude and online.</p>';
      setTimeout(()=>box.remove(), 4000);
    };
    host.appendChild(box); ta.focus();
  };
  return b;
}

/* ---------- question card ---------- */
function instance(qid){ const b = Q[qid]; return b.gen ? b.gen() : b.build ? b.build() : b; }
const qSrcLine = qid => { const q = Q[qid]; if(!q || !q.src) return ''; return `<p class="qsrc">Source: ${esc(srcLabel(q.src))}${q.clep?` · CLEP topic: ${esc(q.clep)}`:''}${q.skill&&SKILL_LABEL[q.skill]?` · Skill: ${SKILL_LABEL[q.skill]}`:''}</p>`; };
const KIND_LABEL = { mc:'Multiple choice', tf:'True or false', graph:'Graph', num:'Worked problem', text:'Typed answer' };
function qCard(qid, { ctx, label, onAnswer, onNext, nextLabel }){
  const el = document.createElement('div'); el.className='q';
  let inst = instance(qid), chosen = null, shown = null;
  const draw = () => {
    const kind = inst.kind || Q[qid].kind || (inst.type==='num'?'num':'mc');
    const opts = inst.type==='mc' ? (inst.keepOrder ? inst.options.map((t,i)=>({t,i})) : shuffle(inst.options.map((t,i)=>({t,i})))) : null;
    const letters = 'ABCDE';
    el.innerHTML = `<div class="q-meta"><span>${label||''}</span><span>${KIND_LABEL[kind]||'Question'}${Q[qid].gen?' · new numbers each time':''}</span></div>
      <div class="q-prompt">${inst.prompt}</div>
      ${opts ? `<div class="opts${kind==='tf'?' tf':''}">${opts.map((o,k)=>`<button class="opt" data-i="${o.i}">${kind==='tf'?'':`<span class="ol">${letters[k]}</span>`}<span>${o.t}</span></button>`).join('')}</div>`
             : inst.type==='text' ? `<form class="txtq"><textarea rows="3" class="fc-ta" aria-label="Your answer" placeholder="Type your answer in your own words"></textarea><div class="row" style="margin-top:8px"><button class="btn sm" type="submit">Check with Claude</button><button class="btn ghost sm stop" type="button" hidden>Stop</button></div></form>` : `<form class="numrow"><input id="in-${qid}-${ctx}" aria-label="Your answer" inputmode="decimal" autocomplete="off" placeholder="Your answer"><span class="muted small">${inst.unit||''}</span><button class="btn sm" type="submit">Check</button></form>`}
      <div class="fb" aria-live="polite"></div><div class="q-tools"><span class="xp-slot"></span><span class="rep-slot"></span></div>`;
    chosen = null; shown = opts;
    $('.xp-slot', el).appendChild(explainBox('question:'+qid, () => {
      let s = `${Q[qid].quiz?'Unit quiz question':'Practice question'} (${KIND_LABEL[kind]||'question'}):\n${textOf($('.q-prompt', el))}`;
      if(shown) s += '\n\nChoices:\n' + shown.map((o,k)=>`${kind==='tf'?'':letters[k]+'. '}${textOf(Object.assign(document.createElement('div'),{innerHTML:o.t}))}`).join('\n');
      else if(inst.type==='text') s += '\n\n(The student types a short answer in their own words.)';
      else s += `\n\n(The student types a number${inst.unit?' in '+inst.unit:''}.)`;
      if(chosen){
        const pickTxt = shown ? (()=>{ const k=shown.findIndex(o=>o.i===chosen.i); return `${kind==='tf'?'':letters[k]+'. '}${textOf(Object.assign(document.createElement('div'),{innerHTML:shown[k].t}))}`; })() : chosen.v;
        const right = shown ? (()=>{ const k=shown.findIndex(o=>o.i===inst.answer); return `${kind==='tf'?'':letters[k]+'. '}${textOf(Object.assign(document.createElement('div'),{innerHTML:shown[k].t}))}`; })() : inst.type==='text' ? inst.model : `${inst.unit==='dollars'?money(inst.answer):fmt(inst.answer)} ${inst.unit||''}`;
        s += `\n\nThe student answered: ${pickTxt} (${chosen.ok?'correct':'incorrect'}).\nCorrect answer: ${right}\nExplanation shown in the workbook: ${textOf($('.explain', el))}`;
      }
      return s;
    }, () => chosen ? 'full' : 'hint', 'Explain this'));
    mountReport('question:'+qid, $('.q-tools > .rep-slot', el));
    if(opts){
      $$('.opt', el).forEach(b => b.addEventListener('click', () => {
        const i = +b.dataset.i, ok = i === inst.answer;
        $$('.opt', el).forEach(x => { x.disabled = true; if(+x.dataset.i===inst.answer) x.classList.add('right'); });
        if(!ok) b.classList.add('wrong');
        chosen = { i, ok };
        finish(ok);
      }));
    } else if(inst.type==='text'){
      const form = $('form', el), ta = $('textarea', el), go = $('button[type=submit]', el), stop = $('.stop', el); let ctl2 = null;
      const lock = () => { ta.disabled = true; go.disabled = true; stop.hidden = true; };
      const selfRate = (typed, msg) => { const fb = $('.fb', el); fb.innerHTML = `<p class="msg">${esc(msg)}</p><p class="muted small">Model answer: ${inst.model}</p><div class="row"><button class="btn sm" data-ok="1">I got it</button><button class="btn ghost sm" data-ok="0">I missed it</button></div>`;
        $$('button[data-ok]', fb).forEach(b => b.onclick = () => { chosen = { v: typed, ok: b.dataset.ok==='1' }; finish(chosen.ok); }); };
      stop.onclick = () => ctl2 && ctl2.abort();
      form.addEventListener('submit', async e => {
        e.preventDefault(); const fb = $('.fb', el), typed = ta.value.trim(); inst._grade = null;
        if(typed.length < 2){ fb.innerHTML = '<p class="verdict bad">Type an answer first.</p>'; ta.focus(); return; }
        const sample = await getSample();
        if(!sample){ lock(); selfRate(typed, 'Claude checking isn\'t available in this view. Compare with the model answer, then mark yourself.'); return; }
        go.disabled = true; stop.hidden = false; ctl2 = new AbortController(); fb.innerHTML = '<p class="msg">Claude is checking your answer…</p>';
        try{
          const r = await sample.json(qTextGradePrompt(inst, typed), { signal: ctl2.signal, modelTier:'quick' });
          if(!r || !VERDICT[r.verdict]) throw { code:'invalid_json' };
          inst._grade = { verdict:r.verdict, got:String(r.got||'').slice(0,400), missing:String(r.missing||'').slice(0,500), error:String(r.error||'').slice(0,300) };
          lock(); chosen = { v: typed, ok: r.verdict==='correct' }; finish(chosen.ok);
        }catch(err){
          if(err && err.code==='cancelled'){ fb.innerHTML = '<p class="msg">Stopped.</p>'; go.disabled = false; stop.hidden = true; }
          else { lock(); selfRate(typed, sampleErrorMsg(err && err.code)); }
        }finally{ ctl2 = null; }
      });
      ta.addEventListener('keydown', e => { if(e.key==='Enter' && (e.ctrlKey||e.metaKey)) go.click(); });
    } else {
      const form = $('form', el), input = $('input', el);
      form.addEventListener('submit', e => {
        e.preventDefault();
        const v = fracParse(input.value);
        const fb = $('.fb', el);
        if(isNaN(v)){ fb.innerHTML = '<p class="verdict bad">Enter a number, like 1.5 or 1/3.</p>'; return; }
        const ok = Math.abs(v - inst.answer) <= (inst.unit==='dollars' ? 0.011 : Math.max(0.011, Math.abs(inst.answer)*0.005));
        input.disabled = true; $('button', form).disabled = true;
        chosen = { v: input.value.trim(), ok };
        finish(ok, v);
      });
    }
  };
  const finish = (ok) => {
    const fb = $('.fb', el);
    const ansTxt = inst.type==='num' ? `<p class="muted small">Answer: ${inst.unit==='dollars'?money(inst.answer):fmt(inst.answer)+' '+(inst.unit||'')}</p>` : '';
    fb.innerHTML = `<p class="verdict ${ok?'good':'bad'}">${ok?pick(['Correct.','Right.','Yes, that\'s it.']):(inst._grade && inst._grade.verdict==='partial' ? 'Partly right. Here\'s how it works:' : 'Not quite. Here\'s how it works:')}</p>${inst.type==='text' ? textFb(inst) : ok?'':ansTxt}<div class="explain">${inst.explain}</div>${qSrcLine(qid)}<div class="q-foot row"></div>`;
    const foot = $('.q-foot', fb);

    if(onNext){ const b=document.createElement('button'); b.className='btn sm'; b.textContent=nextLabel||'Next'; b.onclick=onNext; foot.appendChild(b); b.focus({preventScroll:true}); }
    onAnswer && onAnswer(ok);
  };
  draw();
  return el;
}

function cardGradePrompt(c, text){
  return `You are checking a beginner's flashcard answer for an introductory microeconomics course (preparing for the CLEP Principles of Microeconomics exam). Judge the meaning, not the wording: accept paraphrases and everyday language when the economics is right. The student does not need to repeat the example.

Term: ${c.t}
Question on the card: ${c.q || 'Define or explain this term.'}
Reference answer: ${c.d}
${c.ex ? 'Reference example: ' + c.ex : ''}
${c.tip ? 'Common mistake to watch for: ' + c.tip : ''}

Student's answer:
"""
${text}
"""

Reply with only JSON in this shape:
{"verdict":"correct","got":"one sentence on what the answer gets right, or an empty string","missing":"one or two specific sentences on the most important thing missing or wrong, or an empty string","error":"one sentence naming any factually wrong economics, or an empty string"}
verdict must be "correct" (covers the key idea with no real errors), "partial" (part of the key idea, or too vague to be sure the student knows it) or "incorrect" (wrong, off-topic or blank).`;
}
const VERDICT = { correct:['Correct','good'], partial:['Partly right','part'], incorrect:['Not yet','bad'] };

function flashCard(cid, { label, onAnswer, onNext, standalone }){
  const el = document.createElement('div'); el.className='q fc';
  let state = getFcMode()==='type' ? 'typing' : 'front', graded = null, typed = '', ctl = null;
  const uid = 'fc' + Math.random().toString(36).slice(2,7);
  const head = c => `<div class="q-meta"><span>${label||''}</span><span>${c.custom?'Your flashcard':c.edited?'Flashcard · edited by you':'Flashcard'}</span></div>
    <p class="fc-term">${esc(c.t)}</p>${c.q?`<p class="fc-q">${esc(c.q)}</p>`:''}`;
  const backHTML = c => `<div class="fc-back"><p class="fc-def">${esc(c.d)}</p>
    ${c.ex?`<p class="fc-ex"><span class="fc-lab">Example</span>${esc(c.ex)}</p>`:''}
    ${c.tip?`<p class="fc-tip"><span class="fc-lab">Watch out</span>${esc(c.tip)}</p>`:''}</div>`;
  const gradeHTML = () => {
    if(!graded) return '';
    if(graded.err) return `<p class="msg ${graded.cancelled?'':'bad'}">${esc(graded.err)}</p>`;
    const [lab, cls] = VERDICT[graded.verdict] || VERDICT.partial;
    return `<div class="fc-grade"><p class="verdict ${cls==='good'?'good':cls==='bad'?'bad':'part'}">${lab}</p>
      <p class="small muted" style="margin:.2rem 0">Your answer: <i>${esc(typed)}</i></p>
      ${graded.got?`<p class="small"><b>What you got:</b> ${esc(graded.got)}</p>`:''}
      ${graded.missing?`<p class="small"><b>Missing:</b> ${esc(graded.missing)}</p>`:''}
      ${graded.error?`<p class="small" style="color:var(--bad)"><b>Check this:</b> ${esc(graded.error)}</p>`:''}
      <div class="rep-slot gslot"></div></div>`;
  };
  const draw = () => {
    const c = CARDS[cid];
    if(!c){ el.innerHTML = '<p class="muted">This flashcard was deleted.</p>'; return; }
    if(state==='edit'){
      el.innerHTML = head(c);
      el.appendChild(cardEditor({ cid, onDone: () => { state = 'back'; draw(); } }));
      return;
    }
    let body = '';
    if(state==='front') body = `<div class="row fc-actions"><button class="btn reveal" type="button">Show answer</button><button class="btn ghost typeit" type="button">Type my answer</button></div>`;
    else if(state==='typing') body = `<label class="small muted" for="${uid}-ta">Your answer, in your own words</label>
      <textarea id="${uid}-ta" class="fc-ta" rows="4" maxlength="1500" placeholder="Explain it as if to a friend. A sentence or two is enough.">${esc(typed)}</textarea>
      <div class="row fc-actions"><button class="btn sm go" type="button">Check my answer</button><button class="btn ghost sm stop" type="button" hidden>Stop</button><button class="btn ghost sm reveal" type="button">Just show the answer</button></div>
      <div class="fc-out" aria-live="polite"></div>`;
    else {
      const rec = graded && !graded.err ? (graded.verdict==='correct') : null;
      body = gradeHTML() + backHTML(c) +
        (onAnswer && !standalone ? `<div class="row fc-actions"><span class="small muted">${rec===null?'Did you know it?':'Count this one as:'}</span>
          <button class="btn ${rec===false?'':'ghost'} sm no" type="button">Didn't know</button><button class="btn ${rec===false?'ghost':''} sm yes" type="button">Knew it</button></div>` : '');
    }
    el.innerHTML = head(c) + body + `<div class="fc-foot"><span class="xp-slot"></span>${state==='back'?'<button class="linkbtn edit" type="button">Edit this card</button>':''}<span class="rep-slot cslot"></span></div>`;
    const back = state==='back';
    $('.xp-slot', el).appendChild(explainBox('card:'+cid, () => {
      const x = CARDS[cid]; let s = `Flashcard\nFront: ${x.t}\nQuestion: ${x.q||'Define or explain this term.'}`;
      if(back) s += `\nAnswer on the card: ${x.d}${x.ex?'\nExample: '+x.ex:''}${x.tip?'\nWatch out: '+x.tip:''}`;
      if(back && graded && !graded.err) s += `\n\nThe student typed: ${typed}\nClaude's check: ${graded.verdict}. Got: ${graded.got} Missing: ${graded.missing}${graded.error?' Error: '+graded.error:''}`;
      return s;
    }, () => back ? 'full' : 'hint', back ? 'Explain this card' : 'Explain the question'));
    mountReport('card:'+cid, $('.cslot', el), () => { const x = CARDS[cid]; return x ? `Card as shown:\nFront: ${x.t}\nQuestion: ${x.q}\nAnswer: ${x.d}\nExample: ${x.ex}\nWatch out: ${x.tip}` : ''; });
    const reveal = $('.reveal', el); if(reveal) reveal.onclick = () => { if(state==='front') setFcMode('flip'); if(ctl) ctl.abort(); state='back'; draw(); };
    const typeit = $('.typeit', el); if(typeit) typeit.onclick = () => { setFcMode('type'); state='typing'; draw(); const t=$('textarea',el); t && t.focus(); };
    const ed = $('.edit', el); if(ed) ed.onclick = () => { state='edit'; draw(); };
    if(state==='typing'){
      const ta=$('textarea',el), go=$('.go',el), stop=$('.stop',el), out=$('.fc-out',el);
      ta.oninput = () => { typed = ta.value; out.innerHTML=''; };
      stop.onclick = () => ctl && ctl.abort();
      go.onclick = async () => {
        typed = ta.value.trim();
        if(typed.length < 3){ out.innerHTML = '<p class="verdict bad">Type an answer first, or tap "Just show the answer".</p>'; ta.focus(); return; }
        const sample = await getSample();
        if(!sample){ graded = { err:'Claude checking isn\'t available in this view. Compare your answer with the card below.' }; state='back'; draw(); return; }
        go.disabled = true; stop.hidden = false; ctl = new AbortController();
        out.innerHTML = '<p class="msg">Claude is checking your answer…</p>';
        try{
          const r = await sample.json(cardGradePrompt(c, typed), { signal: ctl.signal, modelTier:'quick' });
          if(!r || !VERDICT[r.verdict]) throw { code:'invalid_json' };
          graded = { verdict:r.verdict, got:String(r.got||'').slice(0,400), missing:String(r.missing||'').slice(0,500), error:String(r.error||'').slice(0,300) };
          state = 'back'; draw();
        }catch(e){
          const code = e && e.code;
          if(code==='cancelled'){ out.innerHTML = '<p class="msg">Stopped.</p>'; }
          else { graded = { err: sampleErrorMsg(code) }; state='back'; draw(); }
        }finally{ ctl = null; if(go.isConnected){ go.disabled=false; stop.hidden=true; } }
      };
      ta.addEventListener('keydown', e => { if(e.key==='Enter' && (e.ctrlKey||e.metaKey)) go.click(); });
    }
    if(state==='back'){
      const gs = $('.gslot', el);
      if(gs) mountReport('cardgrade:'+cid, gs, () => `Card: ${CARDS[cid]?CARDS[cid].t:cid}\nQuestion: ${CARDS[cid]?CARDS[cid].q:''}\nMy answer: ${typed}\nClaude's verdict: ${graded.verdict}\nWhat you got: ${graded.got}\nMissing: ${graded.missing}${graded.error?`\nCheck this: ${graded.error}`:''}`);
      const done = ok => { $$('.fc-actions button', el).forEach(b=>b.disabled=true); onAnswer && onAnswer(ok); if(onNext) onNext(); };
      const no=$('.no',el), yes=$('.yes',el);
      if(no){ no.onclick = () => done(false); yes.onclick = () => done(true); (graded && !graded.err && graded.verdict!=='correct' ? no : yes).focus({preventScroll:true}); }
    }
  };
  draw();
  return el;
}

/* ---------- "Explain this": Claude explains any part of the page in plain language ----------
   explainBox(key, getCtx, mode) → a button + panel. getCtx() returns the text the student is looking at;
   mode() returns 'full', 'hint' (unanswered question: never reveal the answer) or 'feedback' (explain a grade).
   Each tap uses a little of the viewer's Claude usage; answers are reused while the page stays open. */
const XP_CACHE = new Map();
function textOf(node){
  if(!node) return '';
  const c = node.cloneNode(true);
  c.querySelectorAll('.xp,.rep-slot,.rep-box,script,style,.q-foot').forEach(n=>n.remove());
  c.querySelectorAll('svg').forEach(s=>{ const t=[...s.querySelectorAll('text')].map(x=>x.textContent.trim()).filter(Boolean).join(' · '); s.replaceWith(document.createTextNode(` [graph${t?': '+t.slice(0,400):''}] `)); });
  c.querySelectorAll('input').forEach(i=>{ if(i.type==='range'||i.type==='number'||i.type==='text'||!i.type) i.replaceWith(document.createTextNode(i.value?` ${i.value} `:' ')); else i.remove(); });
  c.querySelectorAll('select').forEach(s=>{ const o=s.options[s.selectedIndex]; s.replaceWith(document.createTextNode(o?` ${o.text} `:' ')); });
  c.querySelectorAll('textarea').forEach(t=>t.remove());
  c.querySelectorAll('[aria-pressed="true"]').forEach(b=>b.replaceWith(document.createTextNode(` [selected: ${b.textContent.trim()}] `)));
  c.querySelectorAll('button').forEach(b=>b.remove());
  c.querySelectorAll('p,li,div,h1,h2,h3,tr,br,summary').forEach(n=>n.after(document.createTextNode('\n')));
  c.querySelectorAll('td,th').forEach(n=>n.after(document.createTextNode(' | ')));
  return c.textContent.replace(/[ \t ]+/g,' ').replace(/ *\n[ \n]*/g,'\n').trim();
}
function mdLite(s){
  const lines = esc(s).split('\n'); let html='', list=false, para=[];
  const flushP = () => { if(para.length){ html += `<p>${para.join(' ')}</p>`; para=[]; } };
  for(const ln of lines){
    const t = ln.trim();
    if(/^[-*•] /.test(t)){ flushP(); if(!list){ html+='<ul>'; list=true; } html += `<li>${t.slice(2)}</li>`; continue; }
    if(list){ html+='</ul>'; list=false; }
    if(!t){ flushP(); continue; }
    if(/^\d+[.)] /.test(t)){ flushP(); html += `<p>${t}</p>`; continue; }
    para.push(t.replace(/^#+\s*/,''));
  }
  flushP(); if(list) html += '</ul>';
  return html.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}
function xpPrompt(ctx, mode){
  const rule = mode==='quizhint'
    ? 'IMPORTANT: This is a question on a unit quiz the student is taking right now. Explain what is being asked and the idea or method they need, but never reveal, eliminate or hint at which choice is correct, and never work out the final number, even if they ask in a follow-up or say they have already answered. If they ask for the answer, say kindly that answers and full explanations appear after they submit the quiz.'
    : mode==='hint'
    ? 'IMPORTANT: The student has NOT answered this yet. Explain what is being asked and the idea or method they need, but do not reveal, eliminate or hint at which choice is correct, and do not work out the final number or write their answer for them. If they ask for the answer in a follow-up, encourage them to try first, then explain.'
    : mode==='feedback'
    ? 'The student wrote an answer and got the grade shown. Explain the feedback: what each missed point means, why it matters, and a short example sentence showing how they could add it. Be encouraging and specific.'
    : '';
  return `You are a patient, encouraging tutor for a beginner studying for the CLEP Principles of Microeconomics exam. The student is using a study workbook and tapped "Explain this" because they don't fully understand the part shown below.

Explain it in plain language:
- Start with the core idea in one or two sentences.
- Then give one concrete, everyday example or analogy, with real numbers when it helps.
- If there is a calculation, walk through it step by step.
- If they got something wrong, explain why their choice was tempting and where the reasoning breaks.
- End with one sentence on how this shows up on the exam or why it matters.
Define any economics term the first time you use it. Keep it under about 200 words. Use short paragraphs; you may use **bold** for key terms and lines starting with "- " for lists. No headings, emojis or tables. ${rule}

What the student is looking at:
"""
${String(ctx).slice(0,6000)}
"""`;
}
/* Explanations and writing grades run on Opus with low thinking (Eli's choice). If Opus can't answer, the platform falls back to the complex tier. */
const OPUS_LOW = { model:'claude-opus-5-5', modelTier:'complex', effort:'low' };
function explainBox(key, getCtx, mode=()=>'full', label='Explain this'){
  const wrap = document.createElement('div'); wrap.className='xp';
  const u = 'xp' + Math.random().toString(36).slice(2,7);
  wrap.innerHTML = `<button type="button" class="xp-btn" aria-expanded="false" aria-controls="${u}"><span class="xp-ic" aria-hidden="true">?</span><span class="xp-lab">${label}</span></button>
    <div class="xp-panel" id="${u}" hidden><div class="xp-thread" aria-live="polite"></div>
      <div class="xp-ctl" hidden>
        <div class="row"><button type="button" class="chipbtn xp-q" data-q="Explain that more simply, as if I'm completely new to economics.">Simpler, please</button><button type="button" class="chipbtn xp-q" data-q="Give me a different example, with different numbers.">Another example</button></div>
        <form class="xp-ask"><label class="sr" for="${u}-in">Ask Claude a follow-up</label><input id="${u}-in" maxlength="500" placeholder="Ask a follow-up question…" autocomplete="off"><button class="btn sm" type="submit">Ask</button></form>
        <div class="row xp-foot"><button type="button" class="linkbtn xp-stop" hidden>Stop</button><span class="rep-slot xslot"></span></div>
      </div></div>`;
  const btn=$('.xp-btn',wrap), lab=$('.xp-lab',wrap), panel=$('.xp-panel',wrap), thread=$('.xp-thread',wrap), ctl=$('.xp-ctl',wrap), stop=$('.xp-stop',wrap), form=$('.xp-ask',wrap), input=$('input',form);
  let T = null, ac = null, busy = false;  // T = { sig, msgs }
  const drawThread = (live) => {
    if(!T) return;
    thread.innerHTML = T.msgs.map((m,i) => i===0 ? '' : m.role==='user' ? `<p class="xp-you">You asked: ${esc(m.content)}</p>` : `<div class="xp-ans">${mdLite(m.content)}</div>`).join('') + (live!==undefined ? `<div class="xp-ans">${live ? mdLite(live) : '<p class="muted">Claude is thinking…</p>'}</div>` : '');
  };
  const run = async () => {
    const sample = await getSample();
    if(!sample){ thread.insertAdjacentHTML('beforeend', '<p class="msg">Explanations need Claude, which isn\'t available in this view. Open the workbook on claude.ai while signed in.</p>'); return; }
    busy = true; ac = new AbortController(); stop.hidden = false; $$('button,input', ctl).forEach(x=>{ if(x!==stop) x.disabled=true; });
    drawThread('');
    try{
      const r = await sample(T.msgs, { ...OPUS_LOW, signal: ac.signal, onText: ({text}) => drawThread(text) });
      T.msgs.push({ role:'assistant', content: r.text || '' });
      XP_CACHE.set(T.sig, T);
    }catch(e){
      const code = e && e.code;
      if(code==='cancelled' && e.text){ T.msgs.push({ role:'assistant', content: e.text + ' …' }); }
      else T.msgs.pop();
      drawThread();
      thread.insertAdjacentHTML('beforeend', `<p class="msg ${code==='cancelled'?'':'bad'}">${code==='cancelled'?'Stopped.':esc(sampleErrorMsg(code).replace('Compare your answer with the card below.','Try again in a moment.'))}</p>`);
    }finally{
      busy = false; ac = null; stop.hidden = true; ctl.hidden = false; $$('button,input', ctl).forEach(x=>x.disabled=false);
      drawThread();
    }
  };
  const open = () => {
    const m = mode(), ctx = getCtx(), sig = key + '|' + m + '|' + ctx;
    panel.hidden = false; btn.setAttribute('aria-expanded','true'); lab.textContent = 'Hide explanation';
    if(T && T.sig === sig) return;
    if(XP_CACHE.has(sig)){ T = XP_CACHE.get(sig); drawThread(); ctl.hidden = false; return; }
    T = { sig, msgs: [{ role:'user', content: xpPrompt(ctx, m) }] }; thread.innerHTML=''; ctl.hidden = true;
    run();
  };
  btn.onclick = () => {
    if(!panel.hidden){ panel.hidden = true; btn.setAttribute('aria-expanded','false'); lab.textContent = label; if(ac) ac.abort(); return; }
    open();
  };
  const follow = q => { if(busy || !T || !q.trim()) return; T.msgs.push({ role:'user', content:q.trim().slice(0,500) }); run(); };
  $$('.xp-q', wrap).forEach(b => b.onclick = () => follow(b.dataset.q));
  form.addEventListener('submit', e => { e.preventDefault(); const q = input.value; input.value=''; follow(q); });
  stop.onclick = () => ac && ac.abort();
  mountReport('explain:'+key, $('.xslot', wrap), () => T ? `What I was looking at:\n${T.msgs[0].content.split('"""')[1]||''}\n\nClaude's explanation:\n${T.msgs.slice(1).map(m=>(m.role==='user'?'Me: ':'Claude: ')+m.content).join('\n\n')}` : '');
  return wrap;
}
/* explain buttons under each section of lesson text (split at h2 in the body, h3 in "Go deeper") */
function addSectionExplains(container, L, tag){
  if(!container) return;
  const kids = [...container.children]; const sections = [];
  kids.forEach(n => { if(n.tagName===tag.toUpperCase()) sections.push({ h:n, nodes:[n] }); else if(sections.length) sections[sections.length-1].nodes.push(n); });
  sections.forEach(s => {
    const last = s.nodes[s.nodes.length-1], heading = s.h.textContent.trim();
    const holder = document.createElement('div'); holder.className = 'xp-sec';
    const secCtx = () => `Lesson ${L.n}: ${L.title}\nSection: ${heading}\n\n` + s.nodes.filter(n=>!n.classList.contains('widget') && !n.classList.contains('qcheck')).map(textOf).join('\n');
    holder.appendChild(explainBox(`section:${L.id}|${heading}`, secCtx, () => 'full', 'Explain this section'));
    const rs = document.createElement('span'); rs.className = 'rep-slot'; holder.appendChild(rs);
    mountReport(`section:${L.id}|${heading}`, rs, () => secCtx().slice(0,4000));
    last.after(holder);
  });
}

/* ---------- written answers, graded by Claude ---------- */
let SAMPLE = undefined;
async function getSample(){
  if(SAMPLE !== undefined) return SAMPLE;
  if(!(window.claude && typeof window.claude.use==='function')) return (SAMPLE = null);
  try{ SAMPLE = await window.claude.use('sample'); }catch(e){ SAMPLE = null; }
  return SAMPLE;
}
function gradePrompt(w, text){
  return `You are grading a beginner's short written answer for an introductory microeconomics course (preparing for the CLEP Principles of Microeconomics exam). Be fair, specific and encouraging, but honest: do not give credit for a point the answer doesn't actually make.

Question:
${w.prompt}

Model answer (for your reference; the student hasn't seen it):
${w.model}

Checklist (one point each):
${w.checklist.map((c,i)=>`${i+1}. ${c}`).join('\n')}

Student's answer:
"""
${text}
"""

Reply with only JSON in this shape:
{"points":[{"met":true,"note":"one short sentence"}],"strength":"one sentence on what the answer does well","fix":"one or two sentences on the single most important improvement","error":"one sentence naming any factually wrong economics in the answer, or an empty string"}
The "points" array must have exactly ${w.checklist.length} items, in checklist order. If the answer is blank or off-topic, mark every point false.`;
}
function writeCard(wid){
  const w = WRITE[wid]; const prev = S.writing[wid];
  const el = document.createElement('div'); el.className='q wq';
  el.innerHTML = `<div class="q-meta"><span>Writing · optional</span><span>Graded by Claude</span></div>
    <div class="q-prompt"><b>${w.prompt}</b></div>
    <label class="small muted" for="ta-${wid}">Your answer (a few sentences is enough)</label>

      save(); renderResult({...clean, at});
    }catch(e){
      const code = e && e.code;
      const msg = code==='cancelled' ? 'Stopped.' :
        ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code) ? 'Claude grading is turned off for this page. Compare your answer with the model answer below.' :
        code==='rate_limited' ? 'Too many requests right now, or you\'ve hit a usage limit. Try again in a little while.' :
        code==='session_expired' ? 'Your Claude session expired. Sign in again, then retry.' :

      out.innerHTML = `<p class="msg ${code==='cancelled'?'':'bad'}">${msg}</p>`;

    }finally{ go.disabled=false; stop.hidden=true; ctl=null; }
  };

}

/* PPF: monotone cubic through the course's boots/jackets table */
const PPF_X=[0,20,40,60,80], PPF_Y=[100,90,70,40,0];
function monotone(xs,ys){
  const n=xs.length, d=[], m=[];
  for(let i=0;i<n-1;i++) d.push((ys[i+1]-ys[i])/(xs[i+1]-xs[i]));
  m[0]=d[0]; m[n-1]=d[n-2];
  for(let i=1;i<n-1;i++) m[i] = d[i-1]*d[i]<=0 ? 0 : (d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){ if(d[i]===0){m[i]=m[i+1]=0;continue;} const a=m[i]/d[i], b=m[i+1]/d[i], s=a*a+b*b; if(s>9){ const t=3/Math.sqrt(s); m[i]=t*a*d[i]; m[i+1]=t*b*d[i]; } }
  return x => { if(x<=xs[0]) return ys[0]; if(x>=xs[n-1]) return ys[n-1]; let i=0; while(x>xs[i+1]) i++; const hh=xs[i+1]-xs[i], t=(x-xs[i])/hh, t2=t*t, t3=t2*t;
    return (2*t3-3*t2+1)*ys[i]+(t3-2*t2+t)*hh*m[i]+(-2*t3+3*t2)*ys[i+1]+(t3-t2)*hh*m[i+1]; };
}
const ppfBase = monotone(PPF_X, PPF_Y);

    const absW = P.s.w===P.k.w ? 'Neither' : (P.s.w>P.k.w?'Seamstress':'Baker');
    const same = Math.abs(ocW(P.s)-ocW(P.k))<1e-9;
    const wSpec = ocW(P.s) < ocW(P.k) ? 's' : 'k', bSpec = wSpec==='s'?'k':'s';
    const lo=Math.min(ocW(P.s),ocW(P.k)), hi=Math.max(ocW(P.s),ocW(P.k));
    $('.oc',el).innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>Opportunity cost</th><th>1 bread costs</th><th>1 sweater costs</th></tr></thead><tbody>
      <tr><td>Seamstress</td><td class="${!same&&bSpec==='s'?'hi':''}">${fmt(ocB(P.s))} sweater</td><td class="${!same&&wSpec==='s'?'hi':''}">${fmt(ocW(P.s))} bread</td></tr>
      <tr><td>Baker</td><td class="${!same&&bSpec==='k'?'hi':''}">${fmt(ocB(P.k))} sweater</td><td class="${!same&&wSpec==='k'?'hi':''}">${fmt(ocW(P.k))} bread</td></tr></tbody></table></div>
      <p class="small"><b>Absolute advantage:</b> bread: ${absB}; sweaters: ${absW}.<br><b>Comparative advantage</b> (shaded, lower cost): ${same?'nobody. Their opportunity costs are identical, so there is nothing to gain from trade.':`${P[bSpec].name} in bread, ${P[wSpec].name} in sweaters.`}</p>`;
    $('.tradepart',el).hidden = same; if(same) return;
    const ws=P[wSpec], bs=P[bSpec];
    Qs.max = ws.w; if(+Qs.value>ws.w) Qs.value=ws.w;
    Pr.max = Math.max(5, Math.ceil(hi+2));
    const q=+Qs.value, p=+Pr.value, breadPaid=q*p;
    Qs.nextElementSibling.textContent=q; Pr.nextElementSibling.textContent=fmt(p);
    const feasible = breadPaid <= bs.b + 1e-9;
    const cW = {b:breadPaid, w:ws.w-q}, cB = {b:bs.b-breadPaid, w:q};
    const score = (person, c) => c.b/person.b + c.w/person.w;
    const verdict = (person,c) => { const s=score(person,c); return s>1+1e-9 ? 'better' : s>1-1e-9 ? 'same' : 'worse'; };
    const vW=verdict(ws,cW), vB=verdict(bs,cB);
    svg.innerHTML='';
    [[ws,cW,vW,10],[bs,cB,vB,200]].forEach(([person,c,vd,ox])=>{
      const x0=ox+34,y0=160,wd=130,ht=120; const xm=Math.max(person.w, c.w, 1)*1.25, ym=Math.max(person.b, c.b, 1)*1.25;
      const X=v=>x0+wd*v/xm, Y=v=>y0-ht*v/ym;
      svgEl('line',{x1:x0,y1:y0,x2:x0+wd,y2:y0,class:'ax'},svg); svgEl('line',{x1:x0,y1:y0,x2:x0,y2:y0-ht,class:'ax'},svg);
      svgEl('polygon',{points:`${X(0)},${Y(0)} ${X(0)},${Y(person.b)} ${X(person.w)},${Y(0)}`,fill:'var(--accent-soft)',opacity:.7},svg);
      svgEl('line',{x1:X(0),y1:Y(person.b),x2:X(person.w),y2:Y(0),stroke:'var(--accent)','stroke-width':2.5},svg);
      svgEl('circle',{cx:X(person.w/2),cy:Y(person.b/2),r:5,fill:'var(--muted)'},svg);
      if(feasible) svgEl('circle',{cx:X(c.w),cy:Y(c.b),r:6.5,fill:vd==='better'?'var(--ok)':vd==='same'?'var(--g2)':'var(--bad)',stroke:'var(--surface)','stroke-width':2},svg);
      const t=svgEl('text',{x:x0+wd/2,y:y0+16,'text-anchor':'middle',class:'lbl'},svg); t.textContent='Sweaters';
      const t2=svgEl('text',{x:x0-8,y:y0-ht-6,'text-anchor':'start',class:'lbl'},svg); t2.textContent='Bread';
      const t3=svgEl('text',{x:x0+wd/2,y:y0+34,'text-anchor':'middle',class:'lbl-ink'},svg); t3.textContent=person.name;
    });
    const line = (person,c,vd,role) => `<p><b>${person.name}</b> makes only ${role}. After trading: <b>${fmt(c.b)} bread and ${fmt(c.w)} sweaters</b>. ${vd==='better'?'That is <b>outside</b> their own frontier: more than they could ever make alone. Better off.':vd==='same'?'That is exactly on their own frontier: no gain, no loss.':'That is <b>inside</b> their own frontier: they would do better alone. Worse off.'}</p>`;
    $('.cons',el).innerHTML = !feasible ? `<div class="msg bad">The ${bs.name.toLowerCase()} only makes ${bs.b} bread, so they can't pay ${fmt(breadPaid)} bread. Lower the price or the amount.</div>` :
      `<div class="wbox" style="margin-top:8px">${line(ws,cW,vW,`sweaters (${ws.w})`)}${line(bs,cB,vB,`bread (${bs.b})`)}<p class="small muted">Gray dot: what each could have if they split their day evenly and did not trade. Colored dot: what they get with trade.</p></div>
       <div class="msg ${vW==='better'&&vB==='better'?'good':''}">Both gain whenever 1 sweater trades for <b>more than ${fmt(lo)}</b> bread (the ${ws.name.toLowerCase()}'s cost) and <b>less than ${fmt(hi)}</b> bread (the ${bs.name.toLowerCase()}'s cost).${vW==='better'&&vB==='better'?' This price is in that range, so both win.':' Move the price into that range to make both better off.'}</div>`;
  };
  [...ids,Qs,Pr].forEach(i=>i.addEventListener('input',draw)); draw();
};

    <div class="slider"><label for="bk-r">Rent (land)</label><input type="range" id="bk-r" min="100" max="400" step="25" value="200"><output></output></div>
    <div class="slider"><label for="bk-i">Interest (capital)</label><input type="range" id="bk-i" min="0" max="300" step="25" value="100"><output></output></div>
  </div>
  <div class="readout"><div><b class="bk-rev"></b><span>Bakery revenue</span></div><div><b class="bk-pro"></b><span>Profit (entrepreneurship)</span></div><div><b class="bk-inc"></b><span>Total household income</span></div></div>
  <div class="math bk-math"></div><div class="msg"></div>`;
  const ins = ['s','w','r','i'].map(k=>$('#bk-'+k,el));

    const [s,w,r,i] = ins.map(x=>+x.value);
    ins.forEach(x=>x.nextElementSibling.textContent = money(+x.value));
    const p = s - w - r - i, inc = w + r + i + p;

    $('.bk-inc',el).textContent = money(inc);

  };

};

    d.innerHTML=`<p>${txt}</p><div class="seg" role="group" aria-label="${esc(aria||title)}">${kinds.map(([k,lab])=>`<button data-k="${k}" aria-pressed="false">${lab}</button>`).join('')}</div><p class="small why" hidden></p>`;
    $$('button',d).forEach(b=>b.onclick=()=>{
      if(d.dataset.done) return; d.dataset.done=1; answered++;
      const ok=b.dataset.k===ans; if(ok) right++;
      b.classList.add(ok?'right':'wrong'); if(!ok) $(`button[data-k="${ans}"]`,d).classList.add('right');
      $$('button',d).forEach(x=>x.disabled=true);
      const w=$('.why',d); w.hidden=false; w.innerHTML=(ok?'<b>Right.</b> ':`<b>Not quite: ${labelOf(ans)}.</b> `)+why;
      $('.score',el).textContent = answered<items.length ? `${right} right out of ${answered} so far` : `${right} of ${items.length} right. ${right===items.length?'Perfect.':'Read the note under any you missed.'}`;
    });
    box.appendChild(d);
  });
}

function warrow(svg, x1, y1, x2, y2, color){
