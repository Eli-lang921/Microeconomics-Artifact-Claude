<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Microeconomics Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one calm reading column (max ~46rem) with sticky tabs; widgets sit on graph-paper panels. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --surface-2:#e9efec; --ink:#16201c; --muted:#56635d; --line:#d3ddd8;
  --accent:#1b6a55; --accent-ink:#ffffff; --accent-soft:#dbece4;
  --g1:#2d5f8f; --g2:#a8660f; --ok:#22744a; --ok-soft:#ddf0e5; --bad:#ad3c32; --bad-soft:#f7e2de; --grid:#e1e9e5;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#17201d; --surface-2:#1e2925; --ink:#e4ebe8; --muted:#9aa9a2; --line:#2b3833;
  --accent:#5dbd9c; --accent-ink:#0d1714; --accent-soft:#1c3129;
  --g1:#7eaad8; --g2:#e2a84c; --ok:#61c58c; --ok-soft:#173326; --bad:#ec8277; --bad-soft:#3a1e1b; --grid:#1f2a26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#17201d; --surface-2:#1e2925; --ink:#e4ebe8; --muted:#9aa9a2; --line:#2b3833;
  --accent:#5dbd9c; --accent-ink:#0d1714; --accent-soft:#1c3129;
  --g1:#7eaad8; --g2:#e2a84c; --ok:#61c58c; --ok-soft:#173326; --bad:#ec8277; --bad-soft:#3a1e1b; --grid:#1f2a26; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700;margin-top:2.2rem}
h3{font-size:1.08rem;font-weight:700;margin-top:1.4rem}
p{margin:.7rem 0}
ul,ol{padding-left:1.25rem;margin:.6rem 0}
li{margin:.25rem 0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:46rem;margin:0 auto;padding-inline:16px;padding-block:0 4rem}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:46rem;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.02rem;margin-right:auto;text-decoration:none;color:var(--ink)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:999px}
.tab{border:0;background:transparent;padding:5px 13px;border-radius:999px;font-weight:600;font-size:.92rem;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:.72rem;padding:0 7px;line-height:1.5;font-weight:700}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;width:100%}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="cloud"] .dot{background:var(--ok)}
.sync[data-s="saving"] .dot{background:var(--g2)}
.sync[data-s="none"] .dot{background:var(--bad)}

/* Home */
.hero{padding-block:2rem 1rem}
.hero p{max-width:38rem;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:1.2rem}
.unit-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.lesson-list{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:2px}
.lesson-row{display:grid;grid-template-columns:2rem 1fr auto;gap:10px;align-items:center;padding:10px 8px;border-radius:8px;text-decoration:none;color:var(--ink)}
.lesson-row:hover{background:var(--surface-2)}
.lnum{font-family:var(--f-display);font-weight:700;color:var(--muted);text-align:center}
.lt{font-weight:600;min-width:0}
.ls{font-size:.82rem;color:var(--muted);white-space:nowrap}
.ls.done{color:var(--ok);font-weight:600}
.later{margin-top:1.4rem}
.later ol{color:var(--muted);columns:2;column-gap:2rem;font-size:.95rem}
@media (max-width:520px){.later ol{columns:1}}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:8px;font-weight:600;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 11px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.callout{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin:1rem 0}
.callout p{margin:.3rem 0}

/* Lesson */
.lesson-head{padding-block:1.6rem .4rem}
.oneline{font-size:1.12rem;border-left:3px solid var(--accent);padding-left:14px;margin:1rem 0}
.src{font-size:.85rem;color:var(--muted)}
.terms{display:grid;gap:8px;margin:1rem 0}
.term{display:grid;grid-template-columns:minmax(7rem,11rem) 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.term b{font-weight:700}
@media (max-width:520px){.term{grid-template-columns:1fr;gap:2px}}
.analogy{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin:1rem 0}
.analogy .eyebrow{color:var(--g2)}
.tbl-wrap{overflow-x:auto;margin:1rem 0}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:100%;font-size:.95rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.hi{background:var(--accent-soft);font-weight:700}
.math{font-variant-numeric:tabular-nums;background:var(--surface-2);border-radius:8px;padding:10px 14px;margin:.8rem 0}
details.deeper{margin-top:2.4rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.deeper>summary{cursor:pointer;padding:14px 16px;font-family:var(--f-display);font-weight:700;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.deeper>summary::-webkit-details-marker{display:none}
details.deeper>summary::after{content:"+";font-size:1.4rem;color:var(--accent)}
details.deeper[open]>summary::after{content:"\2212"}
.deeper-body{padding:0 16px 16px}
.deeper-body h3:first-child{margin-top:.2rem}
.links{list-style:none;padding:0;display:grid;gap:10px}
.links li{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;background:var(--surface)}
.links a{font-weight:600}
.kind{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--g2);margin-right:8px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:2.5rem;flex-wrap:wrap}

/* Widget panel: graph paper */
.widget{margin:1.3rem 0;border:1px solid var(--line);border-radius:var(--r);background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;padding:14px}
.widget-title{font-family:var(--f-display);font-weight:700;margin:0 0 2px}
.widget .hint{font-size:.88rem;color:var(--muted);margin:0 0 10px}
.wbox{background:var(--surface);border-radius:8px;padding:10px 12px;border:1px solid var(--line)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.chip{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:.88rem;margin:3px 4px 3px 0}
.chip.lost{background:var(--bad-soft);border-color:transparent;color:var(--bad);text-decoration:line-through}
.svgbox{width:100%;overflow-x:auto}
svg text{font-family:var(--f-body)}
.ax{stroke:var(--muted);stroke-width:1.2}
.gl{stroke:var(--line);stroke-width:1}
.lbl{fill:var(--muted);font-size:11px}
.lbl-ink{fill:var(--ink);font-size:12px;font-weight:600}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.slider{display:grid;grid-template-columns:minmax(8rem,12rem) 1fr 4.5rem;gap:10px;align-items:center;margin:6px 0;font-size:.92rem}
.slider output{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
@media (max-width:520px){.slider{grid-template-columns:1fr 4rem}.slider label{grid-column:1/-1}}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5rem,1fr));gap:8px;margin-top:10px}
.readout div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.readout b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums;font-family:var(--f-display)}
.readout span{font-size:.8rem;color:var(--muted)}
.msg{margin-top:10px;padding:9px 12px;border-radius:8px;background:var(--surface-2);font-size:.95rem}
.msg.good{background:var(--ok-soft)}
.msg.bad{background:var(--bad-soft)}
.inline-num{width:4.5rem;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;text-align:right}
.sort-item{padding:10px 0;border-bottom:1px solid var(--line)}
.sort-item p{margin:0 0 6px}
.sort-item .seg button.right{background:var(--ok-soft);color:var(--ok)}
.sort-item .seg button.wrong{background:var(--bad-soft);color:var(--bad)}

/* Questions */
.qset{display:grid;gap:14px;margin-top:1rem}
.qset>*,.term>*,.readout>*,.opts>*{min-width:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.q-meta{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.q-prompt{margin:.4rem 0 .8rem}
.q-prompt table{font-size:.9rem}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input{width:9rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
.verdict{font-weight:700;margin-top:12px}
.verdict.good{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.explain{margin-top:4px}
.explain p{margin:.35rem 0}
.q-foot{margin-top:10px}

.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:1rem 0 .6rem}
.score-big{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}

.opt{display:flex;gap:10px;align-items:flex-start}
.ol{flex:none;width:1.5rem;height:1.5rem;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--muted);margin-top:1px}
.opt.right .ol{border-color:var(--ok);color:var(--ok)}
.opt.wrong .ol{border-color:var(--bad);color:var(--bad)}
.opts.tf{grid-template-columns:1fr 1fr}
.opts.tf .opt{justify-content:center;font-weight:600}
.qg{max-width:360px;margin:.6rem 0}
.qg svg{width:100%;height:auto;display:block}
.fc-term{font-family:var(--f-display);font-size:1.5rem;font-weight:700;margin:.6rem 0}
.fc-def{font-size:1.08rem;background:var(--accent-soft);border-radius:8px;padding:12px 14px;margin:.4rem 0 .8rem}
.wq textarea{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;line-height:1.5;resize:vertical}
.checks{list-style:none;padding:0;display:grid;gap:8px;margin:.6rem 0}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.checks li.met{background:var(--ok-soft)}
.checks .ck{font-weight:700;width:1.2rem;flex:none}
.checks li.met .ck{color:var(--ok)}
.checks li.miss .ck{color:var(--bad)}
.more-bar{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-weight:600;font-size:.9rem;color:var(--muted)}
.chipbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chipbtn.all{border-style:dashed}
.rep-link{border:0;background:none;padding:2px 0;font-size:.78rem;color:var(--muted);text-decoration:underline;text-underline-offset:2px;text-transform:none;letter-spacing:0;font-weight:500}
.rep-box{flex-basis:100%;margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2)}
.rep-slot,#lrep{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.rep-tag{font-size:.78rem;text-transform:none;letter-spacing:0;font-weight:600}
.rep-tag:empty{display:none}
.rep-tag.st-open,.rep-tag.st-unsent{color:var(--g2)}
.rep-tag.st-fixed,.rep-tag.st-nochange{color:var(--ok)}
.rep-tag .rt-note{font-weight:400;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.st-open{background:var(--accent-soft);color:var(--g2)}
.pill.st-unsent{background:var(--bad-soft);color:var(--bad)}
.pill.st-fixed{background:var(--ok-soft);color:var(--ok)}
.pill.st-nochange{background:var(--surface-2);color:var(--muted)}
.pill.new{background:var(--accent);color:var(--accent-ink)}
.rep-list{display:grid;gap:12px;margin-top:1rem}
.rep-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.rep-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.rep-where{font-weight:700}
.rep-snip{margin:.3rem 0 .5rem;color:var(--muted);font-size:.9rem}
.rep-note{margin:.4rem 0;white-space:pre-wrap;overflow-wrap:anywhere}
.rep-reply{border-left:3px solid var(--ok);padding:4px 0 4px 12px;margin:.6rem 0}
.rep-reply p{margin:.2rem 0;white-space:pre-wrap;overflow-wrap:anywhere}
.rep-foot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.88rem;margin-top:.4rem}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.linkbtn.danger{color:var(--bad)}
.nr-box{margin-top:1rem;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.nr-box label{display:block;font-weight:600;font-size:.92rem;margin:.6rem 0 4px}
.nr-box label:first-child{margin-top:0}
.nr-box select,.nr-box textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:.98rem;resize:vertical}
.rep-box textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:.95rem;resize:vertical}
.fc-q{color:var(--muted);margin:-.2rem 0 .9rem;font-size:1.02rem}
.fc-back{margin-top:.4rem}
.fc-ex,.fc-tip{margin:.55rem 0;line-height:1.5}
.fc-lab{display:inline-block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;margin-right:8px;color:var(--g2)}
.fc-tip .fc-lab{color:var(--bad)}
.fc-ta{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;line-height:1.5;resize:vertical}
.fc-actions{margin-top:10px}
.fc-grade{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:.6rem 0;background:var(--surface-2)}
.fc-grade .verdict{margin-top:0}
.verdict.part{color:var(--g2)}
.fc-foot{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-top:12px;font-size:.88rem}
.rep-ctx{margin:.4rem 0;font-size:.88rem}
.rep-ctx summary{cursor:pointer;color:var(--muted)}
.rep-ctx pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:var(--surface-2);border-radius:8px;padding:8px 10px;margin:.4rem 0 0}
.ce{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.ce-title{font-family:var(--f-display);font-weight:700;margin:0 0 .4rem}
.ce-grid{display:grid;gap:4px}
.ce-grid label{font-size:.88rem;font-weight:600;margin-top:8px}
.ce-grid input,.ce-grid select,.ce-grid textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:.98rem;resize:vertical}
.req,.opt-l{font-weight:400;font-size:.78rem;color:var(--muted);margin-left:4px}
.ce-err{color:var(--bad);margin:.5rem 0;min-height:1em}
.cv-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cv-head h2{font-size:1.1rem}
.cv-rows{display:grid;gap:0;margin-top:.6rem;border-top:1px solid var(--line)}
.cv-row{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.cv-row>.ce{flex:1;min-width:0}
.cv-main{min-width:0}
.cv-act{display:flex;gap:12px;flex:none;font-size:.92rem;align-items:baseline}
.q-tools{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;margin-top:8px}
.q-tools>.xp-slot,.q-tools>.rep-slot,.fc-foot>.xp-slot{display:contents}
.xp{display:contents}
.xp-btn{border:0;background:none;padding:2px 0;color:var(--accent);font-weight:600;font-size:.86rem;display:inline-flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0}
.xp-btn:hover .xp-lab{text-decoration:underline;text-underline-offset:2px}
.xp-ic{width:1.15rem;height:1.15rem;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;line-height:1}

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const round = (x,d=2) => Math.round(x*10**d)/10**d;
const fmt = x => { const r = round(x,2); return Number.isInteger(r) ? String(r) : r.toFixed(2).replace(/0$/,''); };
const money = x => (x<0?'-':'') + '$' + Math.abs(x).toLocaleString('en-US',{minimumFractionDigits: Number.isInteger(round(x,2))?0:2, maximumFractionDigits:2});
const DAY = 86400000;
const startOfDay = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const daysFromToday = n => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+n); return d.getTime(); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs={}, parent){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }
function fracParse(s){
  s = String(s).trim().replace(/[\u2212\u2013]/g,'-').replace(/[$,\s]/g,'');
  if(!s) return NaN;
  const m = s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if(m) return parseFloat(m[1])/parseFloat(m[2]);
  return /^-?(\d+\.?\d*|\.\d+)$/.test(s) ? parseFloat(s) : NaN;
}
const term = (t,d) => `<div class="term"><b>${t}</b><span>${d}</span></div>`;

/* ---------- sources (golden-standard rubric: every fact and question carries a source tag) ----------
   Keys are used in question tags (Q[id].src), section comments (<!-- src: ... -->) and glossary entries. */
const SOURCES = {
  MS:  { t:'Modern States, Principles of Microeconomics (course videos and slides)', u:'https://modernstates.org/course/principles-of-microeconomics/' },
  OS13:{ t:'OpenStax, Principles of Microeconomics (your course textbook), §1.3', u:'https://openstax.org/books/principles-microeconomics/pages/1-3-how-economists-use-theories-and-models-to-understand-economic-issues' },
  OS14:{ t:'OpenStax, Principles of Microeconomics (your course textbook), §1.4', u:'https://openstax.org/books/principles-microeconomics-3e/pages/1-4-how-to-organize-economies-an-overview-of-economic-systems' },
  CB:  { t:'College Board, CLEP Principles of Microeconomics outline', u:'https://clep.collegeboard.org/exam/microeconomics' },
  FED: { t:'Federal Reserve Education, The Circular Flow (infographic)', u:'https://www.federalreserveeducation.org/resources/infographics/infographic--circular-flow.pdf' },
  ELC: { t:'Econlib, "Tragedy of the Commons" (Garrett Hardin)', u:'https://www.econlib.org/library/Enc/TragedyoftheCommons.html' },
  ELP: { t:'Econlib, Property Rights', u:'https://www.econlib.org/library/Topics/College/propertyrights.html' },
  ELH: { t:'Econlib, Invisible Hand', u:'https://www.econlib.org/library/Topics/Details/invisiblehand.html' },
  OS21:{ t:'OpenStax, Principles of Microeconomics (your course textbook), §2.1', u:'https://openstax.org/books/principles-economics-3e/pages/2-1-how-individuals-make-choices-based-on-their-budget-constraint' },
  OS7: { t:'OpenStax, Principles of Microeconomics (your course textbook), Chapter 7', u:'https://openstax.org/books/principles-microeconomics/pages/preface' },
  WAR: { t:'University of Warwick, sugar levy study (press release, Feb 2020)', u:'https://warwick.ac.uk/news/pressreleases/sugar_levels_in/' },
  ELM: { t:'Econlib, Marginalism (Steven E. Rhoads)', u:'https://www.econlib.org/library/Enc/Marginalism.html' },
  T2U: { t:'tutor2u, Functions of the price mechanism', u:'https://www.tutor2u.net/economics/reference/functions-of-the-price-mechanism' }
};
const srcLabel = keys => keys.map(k => SOURCES[k] ? SOURCES[k].t.replace(/^OpenStax, Principles of Microeconomics \(your course textbook\), /,'Course textbook ').replace(/^Modern States, Principles of Microeconomics \(course videos and slides\)/,'Modern States course') : k).join(' · ');

/* ---------- shared glossary for tap-to-define ----------
   home = lesson id where the term is taught (or a later unit's name). Add new terms once; later lessons reuse them. */
const GLOSS = {
  scarcity:{ t:'Scarcity', d:'Wants are greater than the resources available to satisfy them, so every society has to choose.', home:'l1', src:['MS'] },
  'econ-system':{ t:'Economic system', d:'A system of production, resource allocation, exchange and distribution of goods and services: how a society decides what to produce, how much, and who receives it.', home:'l4', src:['MS'] },
  market:{ t:'Market', d:'An institution that brings together buyers and sellers of goods or services, who may be individuals or businesses.', home:'l4', src:['OS14'] },
  decentralized:{ t:'Decentralized', d:'Decisions are spread across many people instead of made by one central authority. Market economies are decentralized.', home:'l4', src:['OS14'] },
  incentive:{ t:'Incentive', d:'Something that raises the benefit of a choice or lowers its cost, so people do more of it. A disincentive does the reverse.', home:'l5', src:['MS'] },
  'black-market':{ t:'Black market (underground economy)', d:'Buying and selling that happens without the government\'s approval. Heavily regulated economies often have them.', home:'l4', src:['OS14'] },
  'invisible-hand':{ t:'Invisible hand', d:'Adam Smith\'s idea (1776) that people pursuing their own interest in markets can end up serving society, without anyone planning it.', home:'l4', src:['ELH'] },
  'supply-demand':{ t:'Supply and demand', d:'The model of how buyers (demand) and sellers (supply) together set a market price. Unit 2 covers it in depth.', home:'Unit 2', src:['CB'] },
  model:{ t:'Model', d:'A simplified picture of the economy that keeps only the parts needed to answer a question.', home:'l4', src:['OS13'] },
  household:{ t:'Household', d:'A person or family. In the circular flow, households own the factors of production and buy goods and services.', home:'l4', src:['OS13','FED'] },
  firm:{ t:'Firm', d:'A business. In the circular flow, firms buy factors of production and sell goods and services.', home:'l4', src:['OS13','FED'] },
  factors:{ t:'Factors of production', d:'The resources used to make goods and services: land, labor, capital and entrepreneurship.', home:'l1', src:['MS','FED'] },
  land:{ t:'Land', d:'All natural resources used in production: soil, oil, water, forests. Its payment is rent.', home:'l1', src:['FED'] },
  labor:{ t:'Labor', d:'The work people put into production, physical or mental. Its payment is wages.', home:'l1', src:['FED'] },
  capital:{ t:'Capital', d:'Human-made tools, machines and buildings used to produce other goods. Not money. Its payment is interest.', home:'l1', src:['FED'] },
  entrepreneurship:{ t:'Entrepreneurship', d:'Combining the other factors to run a business and taking the risk that it fails. Its payment is profit.', home:'l1', src:['FED'] },
  revenue:{ t:'Revenue', d:'The money a firm takes in from selling its goods or services, before paying any costs.', home:'l4', src:['OS13'] },
  commons:{ t:'Tragedy of the commons', d:'When anyone can use a resource and no one limits use, each user keeps the full gain but shares the cost, so the resource gets overused.', home:'l4', src:['ELC'] },
  quota:{ t:'Quota', d:'A limit on how much of something each person or firm may take or produce, such as a fishing catch limit.', home:'l4', src:['ELC'] },
  'opp-cost':{ t:'Opportunity cost', d:'The value of the next best alternative you give up when you make a choice. It can be time as well as money.', home:'l1', src:['OS21'] },
  marginal:{ t:'Marginal', d:'The next unit, or a small change from where you are now: one more slice, hour, worker or machine.', home:'l5', src:['OS21'] },
  'marginal-analysis':{ t:'Marginal analysis', d:'Examining decisions on the margin: comparing the extra benefit and extra cost of a little more or a little less.', home:'l5', src:['OS21','MS'] },
  'average-cost':{ t:'Average cost', d:'Total cost divided by the quantity produced. Not the same as marginal cost, the cost of one more unit.', home:'Unit 4', src:['OS7'] },
  utility:{ t:'Utility', d:'The satisfaction, usefulness or value a person gets from consuming a good or service.', home:'l5', src:['OS21'] },
  dmu:{ t:'Diminishing marginal utility', d:'As you consume more of a good, each extra unit tends to add less satisfaction than the one before. Total satisfaction usually still rises.', home:'l5', src:['OS21'] },
  disincentive:{ t:'Disincentive', d:'Something that makes a choice more costly, so people do less of it, like a tax on cigarettes.', home:'l5', src:['MS'] },
  subsidy:{ t:'Subsidy', d:'A government payment that covers part of the cost of something, which lowers the cost of choosing it.', home:'l5', src:['MS'] },
  'sunk-cost':{ t:'Sunk cost', d:'A cost made in the past that cannot be recovered. It should not affect your next decision.', home:'l5', src:['OS21'] },
  'market-failure':{ t:'Market failure', d:'A situation where a market on its own produces too much or too little of something compared with what is best for society. Unit 7 covers it.', home:'Unit 7', src:['CB'] }
};
/* dt(key, text): a tap-to-define term. A span (not a button) so lesson text still reaches "Explain this". */
const dt = (k, text) => GLOSS[k] ? `<span class="tdef" role="button" tabindex="0" aria-expanded="false" data-term="${k}">${text || GLOSS[k].t}</span>` : (text || k);
function table(head, rows, hi=[]){
  return `<div class="tbl-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${
    rows.map((r,ri)=>`<tr>${r.map((c,ci)=>`<td${hi.some(([a,b])=>a===ri&&b===ci)?' class="hi"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/* ---------- progress state + storage ---------- */
const LS_KEY = 'micro-workbook-v1';
function blankState(){ return { v:1, updated:0, lessons:{}, quiz:{best:null,last:null,attempts:0}, quiz2:{best:null,last:null,attempts:0,history:[]}, review:{}, mastered:{}, writing:{}, reports:[] }; }
let S = blankState();
const Store = { mode:'local', ref:null, writing:false, again:false, timer:null };
function setSync(mode, text){ const el=$('#sync'); el.dataset.s=mode; $('#sync-text').textContent=text; }
function loadLocal(){ try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const d=JSON.parse(raw); if(d && d.v===1) return d; } }catch(e){} return null; }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function save(){
  S.updated = Date.now();
  saveLocal();
  if(Store.mode!=='cloud') return;
  setSync('saving','Saving…');
  clearTimeout(Store.timer);
  Store.timer = setTimeout(flush, 700);
}
async function flush(){
  if(!Store.ref) return;
  if(Store.writing){ Store.again = true; return; }
  Store.writing = true;
  try{ await Store.ref.set(JSON.parse(JSON.stringify(S))); setSync('cloud','Progress syncs to your Claude account (phone and computer)'); }
  catch(e){
    if(e && e.code==='unavailable'){ setTimeout(flush, 1500 + Math.random()*1000); }
    else if(e && e.code==='quota_exceeded'){ setSync('none','Progress storage is full. Your latest answers are kept on this device only.'); Store.mode='local'; }
    else { setSync('local','Could not reach your account. Progress is saved on this device for now.'); }
  }
  finally{ Store.writing=false; if(Store.again){ Store.again=false; flush(); } }
}
async function initStore(){
  const local = loadLocal(); if(local) S = normalize(local);
  setSync('local', 'Progress is saved on this device only');
  if(!(window.claude && typeof window.claude.use==='function')){ refreshChrome(); return; }
  try{
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const uid = user ? await user.id() : null;
    if(!db || !uid){ setSync(uid===null && user ? 'none':'local', uid===null && user ? 'Sign in to claude.ai to keep progress across devices. For now it stays on this device.' : 'Progress is saved on this device only'); return; }
    Store.ref = db.collection('data/users/' + uid).doc('micro-workbook');
    const snap = await Store.ref.get();
    const remote = snap.exists ? snap.data() : null;
    Store.mode = 'cloud';
    if(remote && remote.v===1 && (remote.updated||0) >= (S.updated||0)){ S = normalize(JSON.parse(JSON.stringify(remote))); saveLocal(); render(); }
    else if(S.updated){ await flush(); }
    setSync('cloud','Progress syncs to your Claude account (phone and computer)');
    startReports(); startCards();
    Store.ref.onSnapshot(s => {
      if(s.metadata && s.metadata.hasPendingWrites) return;
      const d = s.exists ? s.data() : null;
      if(d && d.v===1 && (d.updated||0) > (S.updated||0)){ S = normalize(JSON.parse(JSON.stringify(d))); saveLocal(); refreshChrome(); if(view==='home'||view==='review') render(); }
    }, () => { setSync('local','Live sync paused. Progress is still saved on this device.'); });
  }catch(e){
    setSync('local','Could not reach your account. Progress is saved on this device for now.');
  }
  refreshChrome();
}

/* spaced review for everything: misses come back after 1 day; right answers after 7.
   Each correct "due" review moves an item up the ladder: 1 → 3 → 7 → 21 → 60 days, then it's mastered. */
const LADDER = [1,3,7,21,60];
function normalize(st){ st.lessons=st.lessons||{}; st.quiz=st.quiz||{best:null,last:null,attempts:0}; st.quiz2=st.quiz2||{best:null,last:null,attempts:0,history:[]}; st.review=st.review||{}; st.mastered=st.mastered||{}; st.writing=st.writing||{}; st.reports=st.reports||[]; return st; }
function schedule(id, ok, mode){
  const today = startOfDay(Date.now()), r = S.review[id];
  if(!ok){ S.review[id] = { box:0, due: daysFromToday(1), t: Date.now() }; delete S.mastered[id]; return 'missed'; }
  if(mode==='due'){
    if(!r) return 'none';
    if(r.box >= LADDER.length-1){ delete S.review[id]; S.mastered[id] = Date.now(); return 'mastered'; }
    r.box += 1; r.due = daysFromToday(LADDER[r.box]); r.t = Date.now(); return 'moved';
  }
  if(!r && !S.mastered[id]){ S.review[id] = { box:2, due: daysFromToday(LADDER[2]), t: Date.now() }; return 'added'; }
  return 'kept';
}
const reviewable = id => !!(Q[id] || CARDS[id]);
function dueList(){ const now = Date.now(); return Object.keys(S.review).filter(k => reviewable(k) && S.review[k].due <= now).sort((a,b)=>S.review[a].due-S.review[b].due); }
function lessonProgress(L){
  const rec = (S.lessons[L.id]||{}).practice || {};
  const done = L.core.filter(q => rec[q]).length, more = L.more.filter(q => rec[q]).length;
  return { done, total: L.core.length, complete: done === L.core.length, more, moreTotal: L.more.length };
}
function recordPractice(qid, ok){
  const lid = Q[qid].lesson;
  const L = S.lessons[lid] || (S.lessons[lid] = { practice:{} });
  L.practice = L.practice || {};
  const prev = L.practice[qid];
  L.practice[qid] = { ok: ok || !!(prev && prev.ok) };
  schedule(qid, ok, 'practice');
  save(); refreshChrome();
}

/* ---------- questions ---------- */
/* Style follows College Board's official CLEP samples: five choices (A-E), short "Which of the following" stems,
   some paired or reason-giving choices, and a mix of terms, graphs, data tables and simple models. All questions are original. */
const Q = {};
function mc(id, lesson, prompt, options, answer, explain, kind){ Q[id] = { lesson, type:'mc', kind: kind||'mc', prompt, options, answer, explain }; }
function tf(id, lesson, statement, truth, explain){ Q[id] = { lesson, type:'mc', kind:'tf', keepOrder:true, prompt:`True or false: ${statement}`, options:['True','False'], answer: truth?0:1, explain }; }
function gen(id, lesson, fn, kind){ Q[id] = { lesson, gen: fn, kind: kind||'num' }; }
function lazy(id, lesson, fn, kind){ Q[id] = { lesson, build: fn, kind: kind||'graph' }; }

/* graph helpers: return SVG markup strings for question prompts */
function gchart({xmax,ymax,xlab,ylab,xt=[],yt=[],body}){
  const x0=46,y0=176,pw=236,ph=156; const X=v=>x0+pw*v/xmax, Y=v=>y0-ph*v/ymax;
  let s='';
  yt.forEach(t=>{ const y=Y(t); s+=`<line x1="${x0}" x2="${x0+pw}" y1="${y}" y2="${y}" class="gl"/><text x="${x0-6}" y="${y+4}" text-anchor="end" class="lbl">${t}</text>`; });
  xt.forEach(t=>{ const x=X(t); s+=`<line x1="${x}" x2="${x}" y1="${y0}" y2="${y0-ph}" class="gl"/><text x="${x}" y="${y0+15}" text-anchor="middle" class="lbl">${t}</text>`; });
  s+=`<line x1="${x0}" x2="${x0+pw}" y1="${y0}" y2="${y0}" class="ax"/><line x1="${x0}" x2="${x0}" y1="${y0}" y2="${y0-ph}" class="ax"/>`;
  s+=`<text x="${x0+pw/2}" y="${y0+32}" text-anchor="middle" class="lbl-ink">${xlab}</text><text x="14" y="${y0-ph/2}" text-anchor="middle" class="lbl-ink" transform="rotate(-90 14 ${y0-ph/2})">${ylab}</text>`;
  s+=body(X,Y);
  return `<div class="qg"><svg viewBox="0 0 300 215" role="img" aria-label="Graph: ${esc(ylab)} on the vertical axis, ${esc(xlab)} on the horizontal axis">${s}</svg></div>`;
}
const gline = (pts,X,Y,stroke='var(--accent)',dash='',w=2.6) => `<path d="M${pts.map(([x,y])=>X(x).toFixed(1)+','+Y(y).toFixed(1)).join('L')}" fill="none" stroke="${stroke}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:''}/>`;
const bowedPts = (xi,yi,n=40) => Array.from({length:n+1},(_,i)=>{ const x=xi*i/n; return [x, yi*Math.sqrt(Math.max(0,1-(x/xi)**2))]; });
const onBowed = (xi,yi,x) => yi*Math.sqrt(Math.max(0,1-(x/xi)**2));
const gdot = (X,Y,x,y,label,fill='var(--accent)') => `<circle cx="${X(x).toFixed(1)}" cy="${Y(y).toFixed(1)}" r="5" fill="${fill}"/><text x="${(X(x)+8).toFixed(1)}" y="${(Y(y)-8).toFixed(1)}" class="lbl-ink halo">${label}</text>`;
const gtext = (x,y,t,fill='var(--ink)',anchor='start') => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" class="lbl-ink halo" style="fill:${fill}">${t}</text>`;
function mbBars(mb, price){
  const ym = Math.ceil(Math.max(...mb, price)+1);
  return gchart({xmax:mb.length, ymax:ym, xlab:'Unit', ylab:'Dollars', yt:[0,Math.round(ym/2),ym], body:(X,Y)=>{
    let s=''; const bw=(X(1)-X(0));
    mb.forEach((v,i)=>{ const x=X(i)+bw*0.15, w=bw*0.7; s+=`<rect x="${x.toFixed(1)}" y="${Y(v).toFixed(1)}" width="${w.toFixed(1)}" height="${(Y(0)-Y(v)).toFixed(1)}" rx="2" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="${(x+w/2).toFixed(1)}" y="${(Y(0)+14).toFixed(1)}" text-anchor="middle" class="lbl">${i+1}</text><text x="${(x+w/2).toFixed(1)}" y="${(Y(v)-4).toFixed(1)}" text-anchor="middle" class="lbl halo">${money(v)}</text>`; });
    s+=`<line x1="${X(0)}" x2="${X(mb.length)}" y1="${Y(price)}" y2="${Y(price)}" stroke="var(--g2)" stroke-width="2.4" stroke-dasharray="6 4"/>`+gtext(X(mb.length)-2,Y(price)-6,'price '+money(price),'var(--g2)','end');
    return s; }});
}
function cfMini(hi){

    ['M318 128 C318 70 300 46 268 42','real'],['M112 42 C80 46 62 70 62 128','real'],['M62 176 C62 230 80 254 112 258','real'],['M268 258 C300 254 318 230 318 176','real'],
    ['M92 128 C96 92 110 74 132 64','money'],['M248 64 C270 74 284 92 288 128','money'],['M288 176 C284 208 270 226 248 236','money'],['M132 236 C110 226 96 208 92 176','money']];
  const lab={0:[338,84],1:[42,84],2:[42,224],3:[338,224],4:[112,104],5:[268,104],6:[268,204],7:[112,204]};

  let s=`<defs><marker id="${mid}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--g2)"/></marker><marker id="${mid}g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs><g transform="translate(30,0)">`;
  s+=`<ellipse cx="190" cy="42" rx="84" ry="26" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="190" y="41" text-anchor="middle" class="lbl-ink">Goods &amp; services market</text>`;
  s+=`<ellipse cx="190" cy="258" rx="84" ry="26" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="190" y="262" text-anchor="middle" class="lbl-ink">Factor market</text>`;
  s+=`<rect x="22" y="128" width="100" height="48" rx="8" fill="var(--surface)" stroke="var(--ink)"/><text x="72" y="157" text-anchor="middle" class="lbl-ink">Households</text>`;

}

  const {ax,ay,bx,by,svg}=twoLines(); const ans = ay>by?0:1;
  return { type:'mc', kind:'graph', prompt:`Ana\'s and Ben\'s production possibilities for one day:${svg}Who has the <b>absolute advantage in hats</b>?`,
    options:['Ana','Ben','Both of them','Neither of them','You can\'t tell from a graph'], answer:ans, keepOrder:true,
    explain:`<p>Absolute advantage = can make more. If each spends the whole day on hats, Ana makes ${ay} and Ben makes ${by} (the vertical intercepts). <b>${ans===0?'Ana':'Ben'}</b> makes more.</p><p>Comparative advantage would need the slopes instead.</p>` };
},'graph');
tf('l3-tf-gains-both','l3','When two producers specialize by comparative advantage and trade at a price between their opportunity costs, both can consume more than they could alone.',true,
  '<p>True. That\'s the core result of this lesson: the seamstress and baker both ended up outside their own frontiers.</p>');

/* ===== Lesson 4: Economic systems =====
   Golden-standard rules (see rubric): five choices, distractors drawn from the Common mistakes box (M1-M6),
   explanations say why the right answer is right AND why the most tempting wrong answer is wrong.
   Tags are attached below in L4TAGS: src (SOURCES keys), clep (outline topic), skill (CLEP skill), mis (mistakes used). */
mc('l4-questions','l4','Every economic system must answer three basic questions. Which of the following is that set?',
  ['What to produce, how much to produce, and who receives the output','Who sets prices, who sets wages, and who owns the firms','There is no common set; each system asks its own questions','How to tax, how to spend, and how to borrow','What to buy, where to sell, and when to save'],0,
  '<p>Your course (video 1.4a and slide 27): every system answers <b>what</b> to produce, <b>how much</b> to produce, and <b>who receives</b> the output. Systems differ only in <i>who</i> answers: custom, a central planner, or many buyers and sellers.</p><p>The tempting wrong answer is "who sets prices, who sets wages, and who owns the firms." Those describe <i>who does the deciding</i>, which is how systems differ, not the questions themselves.</p>');
mc('l4-factor','l4','In the circular flow model, households are <b>sellers</b> in which market?',
  ['The factor (resource) market','The goods and services market','The stock market','The government bond market','Neither market; households only buy'],0,
  '<p>Households own land, labor, capital and entrepreneurship, so they <b>sell</b> them to firms in the factor market and earn wages, rent, interest and profit.</p><p>The tempting wrong answer is the goods and services market. That is where households <b>buy</b>. Their role flips between the two markets, so "households only buy" is also wrong.</p>');
mc('l4-wages','l4','In the circular flow model, wages flow in which direction?',
  ['From firms to households, through the factor market','From households to firms, through the goods and services market','From households to firms, through the factor market','From firms to other firms','From households to government'],0,
  '<p>Labor flows from households to firms in the factor market. Money always moves the opposite way to what it pays for, so wages flow from <b>firms to households</b>.</p><p>The tempting wrong answer is "households to firms, through the factor market." That is the direction the <i>labor</i> moves, not the money paying for it.</p>');
tf('l4-tf-market','l4','In a market economy, the government sets most prices.',false,
  '<p>False. In a market economy, prices come from buyers and sellers interacting. A government that sets most prices describes a command economy.</p><p>Watch the opposite trap too: market economies still have some government rules. "Few prices set by government" is not the same as "no government."</p>');
mc('l4-command','l4','Which of the following describes a <b>command</b> economy?',
  ['The government decides what is produced and what prices are charged','Private buyers and sellers set prices through supply and demand','People produce what their families have always produced','Most businesses are private, with some government rules','Prices are set by custom and tradition'],0,
  '<p>In a command economy, a central authority sets production goals and prices. Your course textbook names Cuba and North Korea as command economies today.</p><p>Each wrong choice names a different decider: buyers and sellers (market), family custom (traditional), private firms plus rules (mixed). The tempting one is "most businesses are private, with some government rules," but that is a mixed economy, because private firms still make most choices.</p>');
lazy('l4-gr-cf1','l4',()=>({ type:'mc', kind:'graph',
  prompt:`${cfMini(6)}In this circular flow diagram, what flows along the arrow marked "?"`,
  options:['Wages, rent, interest and profit','Goods and services','Spending on goods and services','Land, labor, capital and entrepreneurship','Taxes'], answer:0,
  explain:'<p>The arrow runs from firms into the factor market on the inner loop. Firms are paying for the resources they buy: <b>wages, rent, interest and profit</b>, which become households\' income.</p><p>The tempting wrong answer is "land, labor, capital and entrepreneurship." Those are on the outer loop, moving the other way, from households to firms. Money always runs opposite to the stuff.</p>' }));
mc('l4-traditional','l4','Which of the following best describes a <b>traditional</b> economy?',
  ['People do what earlier generations did, and jobs pass down through families','A central government plans production','Prices coordinate millions of decisions','Private firms compete for customers','The economy changes quickly with new technology'],0,
  '<p>In a traditional economy, custom answers what, how much and who receives. Your course textbook: "Because things are driven by tradition, there is little economic progress or development."</p><p>The tempting wrong answer is "a central government plans production." Both systems can look rigid, but the decider differs: custom versus a planner.</p>');
mc('l4-firms-buyers','l4','In the factor market, firms are which of the following?',
  ['Buyers of land, labor, capital and entrepreneurship','Sellers of goods and services','Sellers of labor','Not involved, since only households trade there','Lenders to the government'],0,
  '<p>Firms need resources to produce, so they <b>buy</b> them from households in the factor market.</p><p>The tempting wrong answer is "sellers of goods and services." That is true, but in the <i>other</i> market. Firms sell products and buy factors; households do the reverse.</p>');
mc('l4-grid','l4','Economic systems can be classified by who owns resources and how resources are allocated. An economy that combines <b>private ownership</b> with <b>planned (government) allocation</b> is called which of the following?',
  ['Command capitalism','Market socialism','Capitalism','Socialism','A traditional economy'],0,
  '<p>Answer the two questions separately. Owners: private (the capitalism side). Allocation: planned (the command side). Together: <b>command capitalism</b>.</p><p>The tempting wrong answer is "capitalism," which answers only the ownership question. Capitalism needs private ownership <i>and</i> market allocation. Market socialism is the reverse mix: government ownership with market allocation.</p>');
mc('l4-rights','l4','A city lets a farmer <b>use</b> a field, but she may not sell it, rent it out, or keep the money from crops she sells. Compared with an owner who has full property rights, she is most likely to do which of the following?',
  ['Invest less in improving the field, because she cannot keep the gains from improving it','Take better care of the field, because people who farm are responsible','Take exactly the same care, because incentives do not depend on ownership','Earn more income from the field than a full owner would','Sell the field to a neighbor who will farm it better'],0,
  '<p>Of the four parts of property rights (use, earn income, transfer, enforce), she has only <b>use</b>. Without the right to earn income or transfer, improving the field gains her nothing she can keep, so she has little reason to invest in it.</p><p>The tempting wrong answer is "take better care, because farmers are responsible." Character doesn\'t change the math: incentives come from who keeps the gains and bears the costs. She can\'t sell the field either, since transfer is one of the rights she lacks.</p>');
tf('l4-tf-transfer','l4','One part of property rights is the right to transfer the good to someone else.',true,
  '<p>True. Selling it, giving it away or leaving it to someone are all transfers. Without that right, nobody could sell anything, and markets couldn\'t work.</p>');
mc('l4-us','l4','The U.S. economy is best described as which of the following?',
  ['A mixed economy that leans toward the market end','A pure market economy with no government role','A command economy','A traditional economy','A command economy with some markets'],0,
  '<p>Your course textbook: "The U.S. economy is positioned toward the market-oriented end of the spectrum." Most decisions are made in markets, but government still sets rules, collects taxes, runs public schools and enforces contracts.</p><p>The tempting wrong answer is "a pure market economy with no government role." The textbook: "There is no such thing as an absolutely free market."</p>');
/* L4 more */
mc('l4-mktsoc','l4','Economic systems can be classified by who owns resources and how resources are allocated. An economy that combines <b>government ownership</b> of resources with <b>market allocation</b> is called which of the following?',
  ['Market socialism','Command capitalism','Capitalism','Socialism','A traditional economy'],0,
  '<p>Government owns (the socialism side), markets allocate (the market side): <b>market socialism</b>.</p><p>The tempting wrong answer is "socialism," which answers only the ownership question. In your course\'s grid, socialism means government ownership <i>and</i> planned allocation.</p>');
tf('l4-tf-mixed','l4','Nearly every real-world economy is mixed.',true,
  '<p>True. The textbook: "Most economies in the real world are mixed." Even very market-oriented economies have rules and public services, and "even the most command-oriented economies operate using markets."</p>');
mc('l4-who','l4','In a market economy, which of the following mainly decides which goods get produced?',
  ['What buyers want and are willing to pay for','A central plan','Tradition','The largest firm in each industry','An annual public vote'],0,
  '<p>Firms make what people will buy, because that is where the revenue is. The textbook: "Businesses supply goods and services based on demand."</p><p>The tempting wrong answer is "the largest firm in each industry." Big firms still have to sell what customers will pay for, or they lose money.</p>');
lazy('l4-gr-cf2','l4',()=>({ type:'mc', kind:'graph',
  prompt:`${cfMini(4)}In this circular flow diagram, what flows along the arrow marked "?"`,
  options:['Spending on goods and services','Wages','Goods and services','Labor','Profits paid to owners'], answer:0,
  explain:'<p>The arrow runs from households toward the goods and services market on the inner (money) loop. Households pay for what they buy: <b>spending</b>, which becomes firms\' revenue.</p><p>The tempting wrong answer is "goods and services." They travel the same path between households and that market, but on the outer loop and in the opposite direction, toward households.</p>' }));
mc('l4-underground','l4','An <b>underground economy</b> is which of the following?',
  ['Buying and selling that happens without the government\'s approval','Mining and drilling industries','Any market that has government rules, since true markets have none','Nothing; it cannot exist, because command economies have no markets at all','Government-owned businesses'],0,
  '<p>Your course textbook: "Heavily regulated economies often have underground economies, which are markets where the buyers and sellers make transactions without the government\'s approval."</p><p>The tempting wrong answer is "mining and drilling": "underground" here means hidden from the government, not below the ground. The "no rules" and "no markets" choices are both myths: every market has some rules, and even command economies use markets.</p>');
mc('l4-invisible','l4','Adam Smith\'s "invisible hand" describes which of the following?',
  ['People pursuing their own interest in markets can end up benefiting society','Governments secretly controlling prices','Firms hiding their profits','Tradition guiding production','Charity replacing markets'],0,
  '<p>In <i>The Wealth of Nations</i> (1776), Smith wrote that a person seeking his own gain is "led by an invisible hand to promote an end which was no part of his intention." No one plans the whole economy, yet shelves get stocked.</p><p>The tempting wrong answer is "governments secretly controlling prices." The hand is invisible because <i>no one</i> is steering; prices do the coordinating.</p>');
tf('l4-tf-cfgov','l4','The simplest circular flow model includes government and foreign trade.',false,
  '<p>False. The textbook calls the basic model "stripped down to the essentials": only households and firms in two markets. Government, financial markets and trade can be added later.</p>');
mc('l4-labor','l4','Which of the following do households most commonly sell in the factor market?',
  ['Labor','Groceries','Cars','Government bonds','Electricity'],0,
  '<p>Most households earn their income by selling their work.</p><p>Groceries, cars and electricity are tempting because households deal in them every day, but households <b>buy</b> those, in the goods and services market. In the factor market their role flips to seller.</p>');
mc('l4-nk','l4','Your course textbook names Cuba and North Korea as examples of one type of economy today. Which type?',
  ['Command economies','Market economies with no government role','Traditional economies, because jobs follow custom','Mixed economies that lean toward the market end','Capitalist economies, because firms are privately owned'],0,
  '<p>The textbook: "Currently, Cuba and North Korea have command economies." A central authority sets production and prices.</p><p>The tempting wrong answer is "mixed economies." Every real economy has some mix, but these sit at the command end of the spectrum, the opposite of the U.S.</p>');
mc('l4-revenue','l4','In the circular flow model, firms\' revenue comes from which of the following?',
  ['Household spending in the goods and services market','Wages paid by households','The factor market','Taxes','Other firms only'],0,
  '<p>When households buy goods and services, their spending becomes firms\' revenue. Firms then use it to pay for resources.</p><p>The tempting wrong answer is "the factor market." That is where firms <b>spend</b> money (on wages, rent, interest and profit), not where they earn it. And wages flow from firms to households, not the other way.</p>');
tf('l4-tf-cmdmkts','l4','A command economy has no markets at all.',false,
  '<p>False. The textbook: "even the most command-oriented economies operate using markets. How else would buying and selling occur?" What differs is how heavily the government controls what is produced and what prices are charged.</p>');
mc('l4-forwhom','l4','In a <b>command</b> economy, the question "who receives the output?" is answered mainly by which of the following?',
  ['The government\'s plan, which may provide some necessities free','People\'s incomes from selling their resources in markets','Custom and family roles','No one, because command economies ask different questions than market economies','Whatever each firm\'s private owner decides'],0,
  '<p>In a command economy, the government decides distribution along with everything else. Your course textbook adds that "many necessities like healthcare and education are provided for free."</p><p>The tempting wrong answer is "people\'s incomes from selling their resources." That is how a <b>market</b> economy answers the question. Every system answers the same question; what changes is who decides.</p>');
mc('l4-capitalism','l4','Private ownership plus market (private) allocation is which of the following?',
  ['Capitalism','Command capitalism','Market socialism','Socialism','A traditional economy'],0,
  '<p>Private + market = capitalism, the box closest to the U.S.</p><p>The tempting wrong answer is "command capitalism," which keeps private ownership but swaps in planned allocation. Check both questions: who owns, and who allocates.</p>');
mc('l4-regs','l4','Even mostly market economies have rules that do which of the following?',
  ['Protect property, enforce contracts and prevent fraud','Set the price of every good','Assign workers to jobs','Decide what each factory makes','None; a true market economy has no government rules'],0,
  '<p>The textbook: "There is no such thing as an absolutely free market." At a minimum, its rules safeguard private property, enforce contracts, prevent fraud and collect taxes. Those rules are what let markets work at all. The last choice is the myth this question tests.</p><p>The other choices (setting every price, assigning workers, deciding output) are tempting because they are real government actions, but they describe a <b>command</b> economy.</p>');
tf('l4-tf-direction','l4','In the circular flow model, money and goods move in the same direction.',false,
  '<p>False. Every flow of goods or resources is matched by money going the opposite way: goods to households, spending to firms; labor to firms, wages to households.</p>');
mc('l4-decentral','l4','Which of the following is an example of <b>decentralized</b> decision-making?',
  ['Millions of shoppers and stores deciding what to buy and sell','A planning board setting tractor output','A king assigning land to vassals','A government setting all wages','Families farming as their ancestors did'],0,
  '<p>Decentralized means spread across many people. The textbook: "In a market economy, decision-making is decentralized."</p><p>The tempting wrong answer is "families farming as their ancestors did," since many families are involved. But custom, not each family\'s own choice, decides there: that is a traditional economy.</p>');

/* ===== Lesson 4 quick checks (inline in the lesson; not scheduled from the lesson page, but available in free practice) =====
   One or two per teaching section, on that section only. */
mc('l4c-howmuch','l4','A country\'s planning board raises this year\'s car target from 1.5 million to 2 million cars. This decision answers which of your course\'s three basic economic questions?',
  ['How much to produce','What to produce','Who receives the output','None, because only market economies answer this question','It depends on the system, because planners ask different questions than markets do'],0,
  '<p>Cars were already on the list (what). Changing the number from 1.5 million to 2 million answers <b>how much</b>.</p><p>The tempting wrong answer is "what to produce," because cars are a thing being made. But the choice here is the amount. And every system, planned or market, answers all three questions; only the decider changes.</p>');
mc('l4c-forwhom','l4','In a market economy, which of the following mainly decides <b>who receives</b> the goods that are produced?',
  ['People\'s incomes, earned by selling their resources, together with prices','A central planning board','Custom and family roles','A law giving every household an equal share','The firms\' owners, who choose who may buy'],0,
  '<p>In a market economy, "who receives the output" is answered by who is willing and able to pay. Your course textbook: "A person\'s income is based on his or her ability to convert resources (especially labor) into something that society values."</p><p>The tempting wrong answer is "the firms\' owners, who choose who may buy." Firms sell to anyone who pays the price; they do not hand out goods. Planners decide in a command economy; custom in a traditional one.</p>');
mc('l4c-cmdweak','l4','Which of the following is a common criticism of command economies?',
  ['Planners lack the information prices provide and people have few rewards for new ideas, so waste and shortages are common','Prices change too often for families to plan','Nothing can be bought or sold, because command economies have no markets','The government plays too small a role','Custom prevents any change in what is produced'],0,
  '<p>Without market prices, planners must guess what people want and what things really cost, and workers and managers gain little from finding better ways. That leads to waste, shortages and black markets.</p><p>The tempting wrong answer is "custom prevents any change." Command economies can change quickly when the plan changes; being stuck in custom is the weakness of a <b>traditional</b> economy. And "no markets at all" is a myth: even command economies use markets.</p>');
mc('l4c-signal','l4','A frost destroys half of one region\'s orange crop, and the price of oranges rises sharply. For orange growers in other regions, the higher price does which of the following?',
  ['It signals that oranges are scarcer and gives them an incentive to sell more there','It guarantees that every buyer still gets the same amount of oranges','Nothing happens until a government agency orders more oranges shipped there','Nothing changes until the government approves the higher price','It has no effect, because prices only matter to buyers'],0,
  '<p>Prices <b>signal</b> scarcity and create an <b>incentive</b> to respond: other growers can earn more by shipping oranges to the region. No one has to order it.</p><p>The tempting wrong answer is "every buyer still gets the same amount." The opposite happens: the higher price <b>rations</b> the smaller supply, so buyers who value oranges less buy fewer. The two "wait for the government" choices miss the point of a market: no agency has to order or approve anything.</p>');
tf('l4c-hhroles','l4','In the circular flow model, households are buyers in both the goods and services market and the factor market.',false,
  '<p>False. Households are <b>buyers</b> in the goods and services market but <b>sellers</b> in the factor market, where they sell land, labor, capital and entrepreneurship. Firms play the opposite roles.</p>');
mc('l4c-entre','l4','In the circular flow model, profit is the payment for which factor of production?',
  ['Entrepreneurship','Land','Labor','Capital','Government services'],0,
  '<p>Each factor has its own payment: land earns <b>rent</b>, labor earns <b>wages</b>, capital earns <b>interest</b>, and entrepreneurship earns <b>profit</b> (Federal Reserve Education\'s circular flow lists the same four).</p><p>The tempting wrong answer is "capital," because in everyday talk profit is "the return on money invested." In this model, the payment for capital is interest; profit is what is left for the person who organized the business and took the risk.</p>');
mc('l4c-profit','l4','A firm collects $2,000 in revenue in a week. It pays $1,200 in wages, $300 in rent and $200 in interest. What is the owner\'s profit?',
  ['$100','$300','$500','$1,700','$2,000'],1,
  '<p>Profit is what is left after the other factor payments: $2,000 − $1,200 − $300 − $200 = <b>$300</b>.</p><p>The tempting wrong answers treat profit like a fixed amount instead of a leftover: $2,000 counts all revenue as the owner\'s, and $1,700 is the total of the <i>other</i> payments. $500 forgets the interest.</p>');
Q['l4c-profit'].keepOrder = true;
mc('l4c-market','l4','A retired couple leases the empty lot next to their house to a food-truck owner for $150 a month. In the circular flow model, which of the following is true?',
  ['It happens in the factor market, and the couple\'s household is the seller','It happens in the goods and services market, and the couple\'s household is the buyer','It happens in the factor market, and the food-truck owner is the seller','It happens in the goods and services market, because rent is a payment for a service','The $150 flows from the couple to the food-truck owner'],0,
  '<p>The couple is selling the use of <b>land</b>, a factor of production, so this is the factor market with the household as seller. The $150 is <b>rent</b> in the economic sense, and it flows from the firm to the household.</p><p>The tempting wrong answer is the goods and services market "because rent is a payment for a service." In the circular flow, rent is the payment for land, one of the four factor payments.</p>');
mc('l4c-commons','l4','A lake that anyone may fish in, and that no one owns, is quickly overfished. Which of the following best explains why?',
  ['Each fisher keeps the full gain from an extra fish but shares the cost of a smaller fish stock with everyone','Fish are free goods, so they are not scarce','The fishers are selfish; more generous people would fish less','The fishers are careless and do not think about the future','The price of fish is too low for anyone to want them'],0,
  '<p>This is the <b>tragedy of the commons</b>. Without property rights, each user compares their own full gain with only their small share of the cost, so everyone uses too much.</p><p>The tempting wrong answers blame character ("careless," "selfish"). Each fisher may think about the future carefully, but holding back only leaves more fish for others to catch. The problem is the incentives, not the people. Fish in an open lake are clearly scarce; that is why overuse hurts.</p>');
mc('l4c-rights','l4','Which of the following best explains why secure property rights encourage people to maintain and improve what they own?',
  ['Owners keep the gains from improving a resource and bear the cost of neglecting it','Owners are required by law to improve their property','People who own things are more responsible than people who rent','Renters are careless people, so they neglect what they use','Owners cannot sell what they own, so they must keep it in good shape'],0,
  '<p>Property rights tie the costs and benefits of a choice to the person making it. An owner who fixes up a house can sell it for more; one who neglects it loses value.</p><p>The tempting wrong answers credit a law or the owner\'s character. Neither is needed: the incentive does the work, and the same person treats an owned car better than a rented one. The last choice is backwards, since the right to <b>transfer</b> is one of the four parts of property rights.</p>');
mc('l4c-grid','l4','Private companies own every factory, but a government board tells each factory what to make and what to charge. On your course\'s ownership-and-allocation grid, this is which of the following?',
  ['Command capitalism','Capitalism, because the factories are privately owned','Socialism, because the government makes the decisions','Market socialism','A traditional economy'],0,
  '<p>Ownership: private. Allocation: planned by the government. Private ownership + planned allocation = <b>command capitalism</b>.</p><p>The two tempting wrong answers each answer only one of the two questions: "capitalism" looks only at who owns, and "socialism" looks only at who decides. The grid needs both.</p>');

/* ===== Lesson 5: Marginal analysis and incentives =====
   Golden-standard rules (see rubric): five choices, distractors drawn from the Common mistakes box (M1-M6),

  '<p>Your course textbook defines marginal analysis as "examination of decisions on the margin, meaning a little more or a little less from the status quo." Good decisions ask: is the <b>next</b> slice, hour or machine worth more than it costs?</p><p>The tempting wrong answer is "total benefit and total cost." Totals can still look good after the last unit stopped being worth it. Average cost and money already spent don\'t answer the question either.</p>');
gen('l5-g-mb','l5',()=>{

  const idx = Math.max(1, Math.min(mb.length-1, Math.floor(Math.random()*(mb.length-1))+1));

});

gen('l5-g-sunk','l5',()=>{

    answer:ans, unit:'dollars', explain:`<p>Ignore the ${money(Sx)}: it\'s sunk. Looking ahead: ${money(R)} − ${money(C)} = <b>${money(ans)}</b>. ${ans>0?'Finish it.':'Stop, even though so much has been spent.'}</p><p>The common slip is subtracting the ${money(Sx)} too. It is the same whether the company finishes or stops, so it can't change which choice is better.</p>` };

/* ---------- supply-and-demand graph for question prompts (static SVG markup, built on gchart) ----------
   lines: [{a:[q,p], b:[q,p], label, c (color var), dash}]  hl: horizontal lines [{p, label, c}]  dots: [{q,p,label,c}]
   areas: [{pts:[[q,p],...], c, label:[q,p,text]}] */
/* sdg: supply-and-demand chart (SVG string). Optional extras used by the lesson figures:
   lines[].pts (a polyline instead of a/b); vls: dashed vertical guides {q, p, c};
   arrows: {a:[q,p], b:[q,p], c}; spans: two-headed brackets, horizontal {p, q1, q2} or vertical {q, p1, p2}, with label/c/lx/ly/anchor. */
let SDGN = 0;
/* gchart2: gchart with an optional non-zero origin (xmin/ymin, shown with a small axis-break mark) and a clip region,
   so zoomed figures keep their lines inside the plot. Same size and styling as gchart. */
function gchart2({xmin=0,xmax,ymin=0,ymax,xlab,ylab,xt=[],yt=[],body,aria}){
  const x0=46,y0=176,pw=236,ph=156; const X=v=>x0+pw*(v-xmin)/(xmax-xmin), Y=v=>y0-ph*(v-ymin)/(ymax-ymin);
  const cid='sc'+(++SDGN);
  let s=`<defs><clipPath id="${cid}"><rect x="${x0-1}" y="${y0-ph-1}" width="${pw+2}" height="${ph+2}"/></clipPath></defs>`;
  yt.forEach(t=>{ const y=Y(t); s+=`<line x1="${x0}" x2="${x0+pw}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="gl"/><text x="${x0-6}" y="${(y+4).toFixed(1)}" text-anchor="end" class="lbl">${t}</text>`; });
  xt.forEach(t=>{ const x=X(t); s+=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${y0}" y2="${y0-ph}" class="gl"/><text x="${x.toFixed(1)}" y="${y0+15}" text-anchor="middle" class="lbl">${t}</text>`; });
  s+=`<line x1="${x0}" x2="${x0+pw}" y1="${y0}" y2="${y0}" class="ax"/><line x1="${x0}" x2="${x0}" y1="${y0}" y2="${y0-ph}" class="ax"/>`;
  if(ymin>0) s+=`<path d="M${x0-5},${y0-8} l10,-4 M${x0-5},${y0-3} l10,-4" stroke="var(--muted)" stroke-width="1.2"/>`;
  if(xmin>0) s+=`<path d="M${x0+6},${y0+5} l4,-10 M${x0+11},${y0+5} l4,-10" stroke="var(--muted)" stroke-width="1.2"/>`;
  s+=`<text x="${x0+pw/2}" y="${y0+32}" text-anchor="middle" class="lbl-ink">${xlab}</text><text x="14" y="${y0-ph/2}" text-anchor="middle" class="lbl-ink" transform="rotate(-90 14 ${y0-ph/2})">${ylab}</text>`;
  const b = body(X,Y);
  s += `<g clip-path="url(#${cid})">${b.under}</g>${b.over}`;
  return `<div class="qg"><svg viewBox="0 0 300 215" role="img" aria-label="${esc(aria||`Graph: ${ylab} on the vertical axis, ${xlab} on the horizontal axis`)}">${s}</svg></div>`;
}
/* clip segment a-b (data units) to the box; returns null if outside */
function clipSeg([x1,y1],[x2,y2],xa,xb,ya,yb){
  let t0=0,t1=1; const dx=x2-x1, dy=y2-y1;
  for(const [p,q] of [[-dx,x1-xa],[dx,xb-x1],[-dy,y1-ya],[dy,yb-y1]]){
    if(p===0){ if(q<0) return null; continue; }
    const r=q/p; if(p<0){ if(r>t1) return null; if(r>t0) t0=r; } else { if(r<t0) return null; if(r<t1) t1=r; }
  }
  return [[x1+t0*dx,y1+t0*dy],[x1+t1*dx,y1+t1*dy]];
}
/* sdg: supply-and-demand chart (SVG string). Optional extras used by the lesson figures:
   xmin/ymin (zoomed origin); lines[].pts (a polyline instead of a/b); vls: dashed vertical guides {q, p, c};
   arrows: {a:[q,p], b:[q,p], c}; spans: two-headed brackets, horizontal {p, q1, q2} or vertical {q, p1, p2}, with label/c/lx/ly/anchor;
   dots[].lx/ly/anchor move a dot's label. */
function sdg({xmin=0, xmax=10, ymin=0, ymax=10, xlab='Quantity', ylab='Price', xt=[], yt=[], lines=[], hl=[], dots=[], areas=[], labels=[], vls=[], arrows=[], spans=[], aria}){
  return gchart2({ xmin, xmax, ymin, ymax, xlab, ylab, xt, yt, aria, body:(X,Y)=>{
    let u='', o='';
    const mk = c => { const id='sa'+(++SDGN); o += `<defs><marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker></defs>`; return id; };
    areas.forEach(a => { u += `<polygon points="${a.pts.map(([q,p])=>X(q).toFixed(1)+','+Y(p).toFixed(1)).join(' ')}" fill="${a.c||'var(--accent-soft)'}" opacity="${a.o||0.8}"${a.stroke?` stroke="${a.stroke}" stroke-width="1"`:''}/>`; if(a.label) o += gtext(X(a.label[0]), Y(a.label[1]), a.label[2], a.lc||'var(--ink)', 'middle'); });
    vls.forEach(v => { u += `<line x1="${X(v.q).toFixed(1)}" x2="${X(v.q).toFixed(1)}" y1="${Y(ymin)}" y2="${Y(v.p===undefined?ymax:v.p).toFixed(1)}" stroke="${v.c||'var(--muted)'}" stroke-width="1.6" stroke-dasharray="4 4"/>`; });
    hl.forEach(h => { const qe = h.q===undefined?xmax:h.q; u += `<line x1="${X(xmin)}" x2="${X(qe).toFixed(1)}" y1="${Y(h.p).toFixed(1)}" y2="${Y(h.p).toFixed(1)}" stroke="${h.c||'var(--g2)'}" stroke-width="2" stroke-dasharray="6 4"/>`; if(h.label) o += gtext(X(qe)-2, Y(h.p)+(h.ly||-5), h.label, h.c||'var(--g2)', 'end'); });
    lines.forEach(l => {
      let pts = l.pts ? l.pts.filter(([q,p])=>q>=xmin&&q<=xmax&&p>=ymin&&p<=ymax) : (clipSeg(l.a,l.b,xmin,xmax,ymin,ymax)||[]);
      if(pts.length<2) return; const end = pts[pts.length-1];
      u += gline(pts, X, Y, l.c||'var(--accent)', l.dash||'', l.w||2.6);
      if(l.label) o += gtext(X(end[0])+(l.lx||4), Y(end[1])+(l.ly||4), l.label, l.c||'var(--accent)', l.anchor||'start'); });
    arrows.forEach(a => { const c=a.c||'var(--g2)', id=mk(c); o += `<line x1="${X(a.a[0]).toFixed(1)}" y1="${Y(a.a[1]).toFixed(1)}" x2="${X(a.b[0]).toFixed(1)}" y2="${Y(a.b[1]).toFixed(1)}" stroke="${c}" stroke-width="2.2" marker-end="url(#${id})"/>`; });
    spans.forEach(sp => { const c=sp.c||'var(--g2)', id=mk(c);
      const [x1,y1,x2,y2] = sp.q===undefined ? [X(sp.q1),Y(sp.p),X(sp.q2),Y(sp.p)] : [X(sp.q),Y(sp.p1),X(sp.q),Y(sp.p2)];
      o += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c}" stroke-width="2" marker-start="url(#${id})" marker-end="url(#${id})"/>`;
      if(sp.label) o += gtext((x1+x2)/2+(sp.lx||0), (y1+y2)/2+(sp.ly===undefined?-7:sp.ly), sp.label, c, sp.anchor||'middle'); });
    dots.forEach(d => { if(d.lx===undefined && d.ly===undefined && !d.anchor){ o += gdot(X, Y, d.q, d.p, d.label||'', d.c||'var(--ink)'); return; }
      o += `<circle cx="${X(d.q).toFixed(1)}" cy="${Y(d.p).toFixed(1)}" r="5" fill="${d.c||'var(--ink)'}"/>` + (d.label ? gtext(X(d.q)+(d.lx||8), Y(d.p)+(d.ly===undefined?-8:d.ly), d.label, 'var(--ink)', d.anchor||'start') : ''); });
    labels.forEach(([q,p,t,c,anchor]) => { o += gtext(X(q), Y(p), t, c||'var(--ink)', anchor||'middle'); });
    return { under:u, over:o }; } });

/* horizontal bar chart (own SVG, not a supply-and-demand grid) */
function hbars(rows, {max, ref, refLabel, w=440, left=170, fmt=v=>v}){
  const rh=24, top=8, right=w-60, X=v=>left+(right-left)*v/max, yb=top+rows.length*rh+4, H=yb+30;
  let s=`<svg class="u2bars" viewBox="0 0 ${w} ${H}" role="img" aria-label="Bar chart">`;
  if(ref!==undefined) s+=`<line x1="${X(ref)}" x2="${X(ref)}" y1="${top}" y2="${yb}" stroke="${CH}" stroke-width="2" stroke-dasharray="5 4"/><text x="${X(ref)}" y="${yb+18}" text-anchor="middle" class="lbl-ink" style="fill:${CH}">${refLabel}</text>`;
  rows.forEach(([lab,v,c],i)=>{ const y=top+i*rh; s+=`<text x="${left-8}" y="${y+15}" text-anchor="end" class="lbl-ink" style="font-weight:500">${lab}</text><rect x="${left}" y="${y+4}" width="${(X(v)-left).toFixed(1)}" height="${rh-9}" rx="3" fill="${c||'var(--accent-soft)'}" stroke="${c?'none':'var(--accent)'}"/><text x="${(X(v)+5).toFixed(1)}" y="${y+15}" class="lbl-ink halo">${fmt(v)}</text>`; });
  s+=`<line x1="${left}" x2="${right}" y1="${yb}" y2="${yb}" class="ax"/>`;
  return s+'</svg>';
}
/* number line with shaded regions and marked points; tick values print under the region labels */
function numline({min, max, regions, points, ticks=[0,1], w=440}){
  const L=20, R=w-20, X=v=>L+(R-L)*(v-min)/(max-min), y=50;
  let s=`<svg class="u2bars" viewBox="0 0 ${w} 122" role="img" aria-label="Number line">`;
  regions.forEach(([a,b,lab,c])=>{ s+=`<rect x="${X(a).toFixed(1)}" y="${y-16}" width="${(X(b)-X(a)).toFixed(1)}" height="32" fill="${c}" opacity=".9"/>${lab?`<text x="${((X(a)+X(b))/2).toFixed(1)}" y="${y+34}" text-anchor="middle" class="lbl-ink">${lab}</text>`:''}`; });
  s+=`<line x1="${L}" x2="${R}" y1="${y}" y2="${y}" class="ax"/>`;
  ticks.forEach(t=>{ s+=`<line x1="${X(t)}" x2="${X(t)}" y1="${y-18}" y2="${y+18}" stroke="var(--ink)" stroke-width="1.5"/><text x="${X(t)}" y="${y+56}" text-anchor="middle" class="lbl">${t}</text>`; });
  points.forEach(([v,lab])=>{ s+=`<circle cx="${X(v).toFixed(1)}" cy="${y}" r="6" fill="${CH}"/><text x="${X(v).toFixed(1)}" y="${y-24}" text-anchor="middle" class="lbl-ink halo" style="fill:${CH}">${lab}</text>`; });
  return s+'</svg>';
}
