<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Microeconomics Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one calm reading column (max ~46rem) with sticky tabs; widgets sit on graph-paper panels. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --surface-2:#e9efec; --ink:#16201c; --muted:#56635d; --line:#d3ddd8;
  --accent:#1b6a55; --accent-ink:#ffffff; --accent-soft:#dbece4;
  --g1:#2d5f8f; --g2:#a8660f; --ok:#22744a; --ok-soft:#ddf0e5; --bad:#ad3c32; --bad-soft:#f7e2de; --grid:#e1e9e5;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#17201d; --surface-2:#1e2925; --ink:#e4ebe8; --muted:#9aa9a2; --line:#2b3833;
  --accent:#5dbd9c; --accent-ink:#0d1714; --accent-soft:#1c3129;
  --g1:#7eaad8; --g2:#e2a84c; --ok:#61c58c; --ok-soft:#173326; --bad:#ec8277; --bad-soft:#3a1e1b; --grid:#1f2a26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#17201d; --surface-2:#1e2925; --ink:#e4ebe8; --muted:#9aa9a2; --line:#2b3833;
  --accent:#5dbd9c; --accent-ink:#0d1714; --accent-soft:#1c3129;
  --g1:#7eaad8; --g2:#e2a84c; --ok:#61c58c; --ok-soft:#173326; --bad:#ec8277; --bad-soft:#3a1e1b; --grid:#1f2a26; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700;margin-top:2.2rem}
h3{font-size:1.08rem;font-weight:700;margin-top:1.4rem}
p{margin:.7rem 0}
ul,ol{padding-left:1.25rem;margin:.6rem 0}
li{margin:.25rem 0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:46rem;margin:0 auto;padding-inline:16px;padding-block:0 4rem}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:46rem;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.02rem;margin-right:auto;text-decoration:none;color:var(--ink)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:999px}
.tab{border:0;background:transparent;padding:5px 13px;border-radius:999px;font-weight:600;font-size:.92rem;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:.72rem;padding:0 7px;line-height:1.5;font-weight:700}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;width:100%}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="cloud"] .dot{background:var(--ok)}
.sync[data-s="saving"] .dot{background:var(--g2)}
.sync[data-s="none"] .dot{background:var(--bad)}

/* Home */
.hero{padding-block:2rem 1rem}
.hero p{max-width:38rem;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:1.2rem}
.unit-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.lesson-list{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:2px}
.lesson-row{display:grid;grid-template-columns:2rem 1fr auto;gap:10px;align-items:center;padding:10px 8px;border-radius:8px;text-decoration:none;color:var(--ink)}
.lesson-row:hover{background:var(--surface-2)}
.lnum{font-family:var(--f-display);font-weight:700;color:var(--muted);text-align:center}
.lt{font-weight:600;min-width:0}
.ls{font-size:.82rem;color:var(--muted);white-space:nowrap}
.ls.done{color:var(--ok);font-weight:600}
.later{margin-top:1.4rem}
.later ol{color:var(--muted);columns:2;column-gap:2rem;font-size:.95rem}
@media (max-width:520px){.later ol{columns:1}}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:8px;font-weight:600;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 11px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.callout{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin:1rem 0}
.callout p{margin:.3rem 0}

/* Lesson */
.lesson-head{padding-block:1.6rem .4rem}
.oneline{font-size:1.12rem;border-left:3px solid var(--accent);padding-left:14px;margin:1rem 0}
.src{font-size:.85rem;color:var(--muted)}
.terms{display:grid;gap:8px;margin:1rem 0}
.term{display:grid;grid-template-columns:minmax(7rem,11rem) 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.term b{font-weight:700}
@media (max-width:520px){.term{grid-template-columns:1fr;gap:2px}}
.analogy{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin:1rem 0}
.analogy .eyebrow{color:var(--g2)}
.tbl-wrap{overflow-x:auto;margin:1rem 0}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:100%;font-size:.95rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.hi{background:var(--accent-soft);font-weight:700}
.math{font-variant-numeric:tabular-nums;background:var(--surface-2);border-radius:8px;padding:10px 14px;margin:.8rem 0}
details.deeper{margin-top:2.4rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.deeper>summary{cursor:pointer;padding:14px 16px;font-family:var(--f-display);font-weight:700;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.deeper>summary::-webkit-details-marker{display:none}
details.deeper>summary::after{content:"+";font-size:1.4rem;color:var(--accent)}
details.deeper[open]>summary::after{content:"\2212"}
.deeper-body{padding:0 16px 16px}
.deeper-body h3:first-child{margin-top:.2rem}
.links{list-style:none;padding:0;display:grid;gap:10px}
.links li{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;background:var(--surface)}
.links a{font-weight:600}
.kind{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--g2);margin-right:8px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:2.5rem;flex-wrap:wrap}

/* Widget panel: graph paper */
.widget{margin:1.3rem 0;border:1px solid var(--line);border-radius:var(--r);background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;padding:14px}
.widget-title{font-family:var(--f-display);font-weight:700;margin:0 0 2px}
.widget .hint{font-size:.88rem;color:var(--muted);margin:0 0 10px}
.wbox{background:var(--surface);border-radius:8px;padding:10px 12px;border:1px solid var(--line)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.chip{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:.88rem;margin:3px 4px 3px 0}
.chip.lost{background:var(--bad-soft);border-color:transparent;color:var(--bad);text-decoration:line-through}
.svgbox{width:100%;overflow-x:auto}
svg text{font-family:var(--f-body)}
.ax{stroke:var(--muted);stroke-width:1.2}
.gl{stroke:var(--line);stroke-width:1}
.lbl{fill:var(--muted);font-size:11px}
.lbl-ink{fill:var(--ink);font-size:12px;font-weight:600}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.slider{display:grid;grid-template-columns:minmax(8rem,12rem) 1fr 4.5rem;gap:10px;align-items:center;margin:6px 0;font-size:.92rem}
.slider output{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
@media (max-width:520px){.slider{grid-template-columns:1fr 4rem}.slider label{grid-column:1/-1}}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5rem,1fr));gap:8px;margin-top:10px}
.readout div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.readout b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums;font-family:var(--f-display)}
.readout span{font-size:.8rem;color:var(--muted)}
.msg{margin-top:10px;padding:9px 12px;border-radius:8px;background:var(--surface-2);font-size:.95rem}
.msg.good{background:var(--ok-soft)}
.msg.bad{background:var(--bad-soft)}
.inline-num{width:4.5rem;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;text-align:right}
.sort-item{padding:10px 0;border-bottom:1px solid var(--line)}
.sort-item p{margin:0 0 6px}
.sort-item .seg button.right{background:var(--ok-soft);color:var(--ok)}
.sort-item .seg button.wrong{background:var(--bad-soft);color:var(--bad)}

/* Questions */
.qset{display:grid;gap:14px;margin-top:1rem}
.qset>*,.term>*,.readout>*,.opts>*{min-width:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.q-meta{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.q-prompt{margin:.4rem 0 .8rem}
.q-prompt table{font-size:.9rem}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input{width:9rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
.verdict{font-weight:700;margin-top:12px}
.verdict.good{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.explain{margin-top:4px}
.explain p{margin:.35rem 0}
.q-foot{margin-top:10px}

.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:1rem 0 .6rem}
.score-big{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}

.opt{display:flex;gap:10px;align-items:flex-start}
.ol{flex:none;width:1.5rem;height:1.5rem;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--muted);margin-top:1px}
.opt.right .ol{border-color:var(--ok);color:var(--ok)}
.opt.wrong .ol{border-color:var(--bad);color:var(--bad)}
.opts.tf{grid-template-columns:1fr 1fr}
.opts.tf .opt{justify-content:center;font-weight:600}
.qg{max-width:360px;margin:.6rem 0}
.qg svg{width:100%;height:auto;display:block}
.fc-term{font-family:var(--f-display);font-size:1.5rem;font-weight:700;margin:.6rem 0}
.fc-def{font-size:1.08rem;background:var(--accent-soft);border-radius:8px;padding:12px 14px;margin:.4rem 0 .8rem}
.wq textarea{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;line-height:1.5;resize:vertical}
.checks{list-style:none;padding:0;display:grid;gap:8px;margin:.6rem 0}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.checks li.met{background:var(--ok-soft)}
.checks .ck{font-weight:700;width:1.2rem;flex:none}
.checks li.met .ck{color:var(--ok)}
.checks li.miss .ck{color:var(--bad)}
.more-bar{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-weight:600;font-size:.9rem;color:var(--muted)}
.chipbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chipbtn.all{border-style:dashed}
.rep-link{border:0;background:none;padding:2px 0;font-size:.78rem;color:var(--muted);text-decoration:underline;text-underline-offset:2px;text-transform:none;letter-spacing:0;font-weight:500}
.rep-box{flex-basis:100%;margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2)}
.rep-slot,#lrep{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.rep-tag{font-size:.78rem;text-transform:none;letter-spacing:0;font-weight:600}
.rep-tag:empty{display:none}
.rep-tag.st-open,.rep-tag.st-unsent{color:var(--g2)}
.rep-tag.st-fixed,.rep-tag.st-nochange{color:var(--ok)}
.rep-tag .rt-note{font-weight:400;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.st-open{background:var(--accent-soft);color:var(--g2)}
.pill.st-unsent{background:var(--bad-soft);color:var(--bad)}
.pill.st-fixed{background:var(--ok-soft);color:var(--ok)}
.pill.st-nochange{background:var(--surface-2);color:var(--muted)}
.pill.new{background:var(--accent);color:var(--accent-ink)}
.rep-list{display:grid;gap:12px;margin-top:1rem}
.rep-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.rep-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.rep-where{font-weight:700}
.rep-snip{margin:.3rem 0 .5rem;color:var(--muted);font-size:.9rem}
.rep-note{margin:.4rem 0;white-space:pre-wrap;overflow-wrap:anywhere}
.rep-reply{border-left:3px solid var(--ok);padding:4px 0 4px 12px;margin:.6rem 0}
.rep-reply p{margin:.2rem 0;white-space:pre-wrap;overflow-wrap:anywhere}
.rep-foot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.88rem;margin-top:.4rem}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.linkbtn.danger{color:var(--bad)}
.rep-box textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:.95rem;resize:vertical}
.fc-q{color:var(--muted);margin:-.2rem 0 .9rem;font-size:1.02rem}
.fc-back{margin-top:.4rem}
.fc-ex,.fc-tip{margin:.55rem 0;line-height:1.5}
.fc-lab{display:inline-block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;margin-right:8px;color:var(--g2)}
.fc-tip .fc-lab{color:var(--bad)}
.fc-ta{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;line-height:1.5;resize:vertical}
.fc-actions{margin-top:10px}
.fc-grade{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:.6rem 0;background:var(--surface-2)}
.fc-grade .verdict{margin-top:0}
.verdict.part{color:var(--g2)}
.fc-foot{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-top:12px;font-size:.88rem}
.rep-ctx{margin:.4rem 0;font-size:.88rem}
.rep-ctx summary{cursor:pointer;color:var(--muted)}
.rep-ctx pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:var(--surface-2);border-radius:8px;padding:8px 10px;margin:.4rem 0 0}
.ce{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.ce-title{font-family:var(--f-display);font-weight:700;margin:0 0 .4rem}
.ce-grid{display:grid;gap:4px}
.ce-grid label{font-size:.88rem;font-weight:600;margin-top:8px}
.ce-grid input,.ce-grid select,.ce-grid textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:.98rem;resize:vertical}
.req,.opt-l{font-weight:400;font-size:.78rem;color:var(--muted);margin-left:4px}
.ce-err{color:var(--bad);margin:.5rem 0;min-height:1em}
.cv-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cv-head h2{font-size:1.1rem}
.cv-rows{display:grid;gap:0;margin-top:.6rem;border-top:1px solid var(--line)}
.cv-row{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.cv-row>.ce{flex:1;min-width:0}
.cv-main{min-width:0}
.cv-act{display:flex;gap:12px;flex:none;font-size:.92rem;align-items:baseline}
.q-tools{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;margin-top:8px}
.q-tools>.xp-slot,.q-tools>.rep-slot,.fc-foot>.xp-slot{display:contents}
.xp{display:contents}
.xp-btn{border:0;background:none;padding:2px 0;color:var(--accent);font-weight:600;font-size:.86rem;display:inline-flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0}
.xp-btn:hover .xp-lab{text-decoration:underline;text-underline-offset:2px}
.xp-ic{width:1.15rem;height:1.15rem;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;line-height:1}
.xp-panel{flex-basis:100%;order:10;width:100%;margin:8px 0 4px;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);border:1px solid var(--line);font-size:.98rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.xp-ans p{margin:.45rem 0}
.xp-ans ul{margin:.4rem 0}
.xp-ans+.xp-ans,.xp-you+.xp-ans{margin-top:.3rem}
.xp-you{font-weight:600;margin:.9rem 0 .2rem;color:var(--muted);font-size:.92rem}
.xp-ctl{margin-top:10px;display:grid;gap:8px}
.xp-ask{display:flex;gap:8px}

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const round = (x,d=2) => Math.round(x*10**d)/10**d;
const fmt = x => { const r = round(x,2); return Number.isInteger(r) ? String(r) : r.toFixed(2).replace(/0$/,''); };
const money = x => (x<0?'-':'') + '$' + Math.abs(x).toLocaleString('en-US',{minimumFractionDigits: Number.isInteger(round(x,2))?0:2, maximumFractionDigits:2});
const DAY = 86400000;
const startOfDay = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const daysFromToday = n => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+n); return d.getTime(); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs={}, parent){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }
function fracParse(s){
  s = String(s).trim().replace(/[\u2212\u2013]/g,'-').replace(/[$,\s]/g,'');
  if(!s) return NaN;
  const m = s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if(m) return parseFloat(m[1])/parseFloat(m[2]);
  return /^-?(\d+\.?\d*|\.\d+)$/.test(s) ? parseFloat(s) : NaN;
}
const term = (t,d) => `<div class="term"><b>${t}</b><span>${d}</span></div>`;
function table(head, rows, hi=[]){
  return `<div class="tbl-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${
    rows.map((r,ri)=>`<tr>${r.map((c,ci)=>`<td${hi.some(([a,b])=>a===ri&&b===ci)?' class="hi"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/* ---------- progress state + storage ---------- */
const LS_KEY = 'micro-workbook-v1';
function blankState(){ return { v:1, updated:0, lessons:{}, quiz:{best:null,last:null,attempts:0}, review:{}, mastered:{}, writing:{}, reports:[] }; }
let S = blankState();
const Store = { mode:'local', ref:null, writing:false, again:false, timer:null };
function setSync(mode, text){ const el=$('#sync'); el.dataset.s=mode; $('#sync-text').textContent=text; }
function loadLocal(){ try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const d=JSON.parse(raw); if(d && d.v===1) return d; } }catch(e){} return null; }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function save(){
  S.updated = Date.now();
  saveLocal();
  if(Store.mode!=='cloud') return;
  setSync('saving','Saving…');
  clearTimeout(Store.timer);
  Store.timer = setTimeout(flush, 700);
}
async function flush(){
  if(!Store.ref) return;
  if(Store.writing){ Store.again = true; return; }
  Store.writing = true;
  try{ await Store.ref.set(JSON.parse(JSON.stringify(S))); setSync('cloud','Progress syncs to your Claude account (phone and computer)'); }
  catch(e){
    if(e && e.code==='unavailable'){ setTimeout(flush, 1500 + Math.random()*1000); }
    else if(e && e.code==='quota_exceeded'){ setSync('none','Progress storage is full. Your latest answers are kept on this device only.'); Store.mode='local'; }
    else { setSync('local','Could not reach your account. Progress is saved on this device for now.'); }
  }
  finally{ Store.writing=false; if(Store.again){ Store.again=false; flush(); } }
}
async function initStore(){
  const local = loadLocal(); if(local) S = normalize(local);
  setSync('local', 'Progress is saved on this device only');
  if(!(window.claude && typeof window.claude.use==='function')){ refreshChrome(); return; }
  try{
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const uid = user ? await user.id() : null;
    if(!db || !uid){ setSync(uid===null && user ? 'none':'local', uid===null && user ? 'Sign in to claude.ai to keep progress across devices. For now it stays on this device.' : 'Progress is saved on this device only'); return; }
    Store.ref = db.collection('data/users/' + uid).doc('micro-workbook');
    const snap = await Store.ref.get();
    const remote = snap.exists ? snap.data() : null;
    Store.mode = 'cloud';
    if(remote && remote.v===1 && (remote.updated||0) >= (S.updated||0)){ S = normalize(JSON.parse(JSON.stringify(remote))); saveLocal(); render(); }
    else if(S.updated){ await flush(); }
    setSync('cloud','Progress syncs to your Claude account (phone and computer)');
    startReports(); startCards();
    Store.ref.onSnapshot(s => {
      if(s.metadata && s.metadata.hasPendingWrites) return;
      const d = s.exists ? s.data() : null;
      if(d && d.v===1 && (d.updated||0) > (S.updated||0)){ S = normalize(JSON.parse(JSON.stringify(d))); saveLocal(); refreshChrome(); if(view==='home'||view==='review') render(); }
    }, () => { setSync('local','Live sync paused. Progress is still saved on this device.'); });
  }catch(e){
    setSync('local','Could not reach your account. Progress is saved on this device for now.');
  }
  refreshChrome();
}

/* spaced review for everything: misses come back after 1 day; right answers after 7.
   Each correct "due" review moves an item up the ladder: 1 → 3 → 7 → 21 → 60 days, then it's mastered. */
const LADDER = [1,3,7,21,60];
function normalize(st){ st.lessons=st.lessons||{}; st.quiz=st.quiz||{best:null,last:null,attempts:0}; st.review=st.review||{}; st.mastered=st.mastered||{}; st.writing=st.writing||{}; st.reports=st.reports||[]; return st; }
function schedule(id, ok, mode){
  const today = startOfDay(Date.now()), r = S.review[id];
  if(!ok){ S.review[id] = { box:0, due: daysFromToday(1), t: Date.now() }; delete S.mastered[id]; return 'missed'; }
  if(mode==='due'){
    if(!r) return 'none';
    if(r.box >= LADDER.length-1){ delete S.review[id]; S.mastered[id] = Date.now(); return 'mastered'; }
    r.box += 1; r.due = daysFromToday(LADDER[r.box]); r.t = Date.now(); return 'moved';
  }
  if(!r && !S.mastered[id]){ S.review[id] = { box:2, due: daysFromToday(LADDER[2]), t: Date.now() }; return 'added'; }
  return 'kept';
}
const reviewable = id => !!(Q[id] || CARDS[id]);
function dueList(){ const now = Date.now(); return Object.keys(S.review).filter(k => reviewable(k) && S.review[k].due <= now).sort((a,b)=>S.review[a].due-S.review[b].due); }
function lessonProgress(L){
  const rec = (S.lessons[L.id]||{}).practice || {};
  const done = L.core.filter(q => rec[q]).length, more = L.more.filter(q => rec[q]).length;
  return { done, total: L.core.length, complete: done === L.core.length, more, moreTotal: L.more.length };
}
function recordPractice(qid, ok){
  const lid = Q[qid].lesson;
  const L = S.lessons[lid] || (S.lessons[lid] = { practice:{} });
  L.practice = L.practice || {};
  const prev = L.practice[qid];
  L.practice[qid] = { ok: ok || !!(prev && prev.ok) };
  schedule(qid, ok, 'practice');
  save(); refreshChrome();
}

/* ---------- questions ---------- */
/* Style follows College Board's official CLEP samples: five choices (A-E), short "Which of the following" stems,
   some paired or reason-giving choices, and a mix of terms, graphs, data tables and simple models. All questions are original. */
const Q = {};
function mc(id, lesson, prompt, options, answer, explain, kind){ Q[id] = { lesson, type:'mc', kind: kind||'mc', prompt, options, answer, explain }; }
function tf(id, lesson, statement, truth, explain){ Q[id] = { lesson, type:'mc', kind:'tf', keepOrder:true, prompt:`True or false: ${statement}`, options:['True','False'], answer: truth?0:1, explain }; }
function gen(id, lesson, fn, kind){ Q[id] = { lesson, gen: fn, kind: kind||'num' }; }
function lazy(id, lesson, fn, kind){ Q[id] = { lesson, build: fn, kind: kind||'graph' }; }

/* graph helpers: return SVG markup strings for question prompts */
function gchart({xmax,ymax,xlab,ylab,xt=[],yt=[],body}){
  const x0=46,y0=176,pw=236,ph=156; const X=v=>x0+pw*v/xmax, Y=v=>y0-ph*v/ymax;
  let s='';
  yt.forEach(t=>{ const y=Y(t); s+=`<line x1="${x0}" x2="${x0+pw}" y1="${y}" y2="${y}" class="gl"/><text x="${x0-6}" y="${y+4}" text-anchor="end" class="lbl">${t}</text>`; });
  xt.forEach(t=>{ const x=X(t); s+=`<line x1="${x}" x2="${x}" y1="${y0}" y2="${y0-ph}" class="gl"/><text x="${x}" y="${y0+15}" text-anchor="middle" class="lbl">${t}</text>`; });
  s+=`<line x1="${x0}" x2="${x0+pw}" y1="${y0}" y2="${y0}" class="ax"/><line x1="${x0}" x2="${x0}" y1="${y0}" y2="${y0-ph}" class="ax"/>`;
  s+=`<text x="${x0+pw/2}" y="${y0+32}" text-anchor="middle" class="lbl-ink">${xlab}</text><text x="14" y="${y0-ph/2}" text-anchor="middle" class="lbl-ink" transform="rotate(-90 14 ${y0-ph/2})">${ylab}</text>`;
  s+=body(X,Y);
  return `<div class="qg"><svg viewBox="0 0 300 215" role="img" aria-label="Graph: ${esc(ylab)} on the vertical axis, ${esc(xlab)} on the horizontal axis">${s}</svg></div>`;
}
const gline = (pts,X,Y,stroke='var(--accent)',dash='',w=2.6) => `<path d="M${pts.map(([x,y])=>X(x).toFixed(1)+','+Y(y).toFixed(1)).join('L')}" fill="none" stroke="${stroke}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:''}/>`;
const bowedPts = (xi,yi,n=40) => Array.from({length:n+1},(_,i)=>{ const x=xi*i/n; return [x, yi*Math.sqrt(Math.max(0,1-(x/xi)**2))]; });
const onBowed = (xi,yi,x) => yi*Math.sqrt(Math.max(0,1-(x/xi)**2));
const gdot = (X,Y,x,y,label,fill='var(--accent)') => `<circle cx="${X(x).toFixed(1)}" cy="${Y(y).toFixed(1)}" r="5" fill="${fill}"/><text x="${(X(x)+8).toFixed(1)}" y="${(Y(y)-8).toFixed(1)}" class="lbl-ink halo">${label}</text>`;
const gtext = (x,y,t,fill='var(--ink)',anchor='start') => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" class="lbl-ink halo" style="fill:${fill}">${t}</text>`;
function mbBars(mb, price){
  const ym = Math.ceil(Math.max(...mb, price)+1);
  return gchart({xmax:mb.length, ymax:ym, xlab:'Unit', ylab:'Dollars', yt:[0,Math.round(ym/2),ym], body:(X,Y)=>{
    let s=''; const bw=(X(1)-X(0));
    mb.forEach((v,i)=>{ const x=X(i)+bw*0.15, w=bw*0.7; s+=`<rect x="${x.toFixed(1)}" y="${Y(v).toFixed(1)}" width="${w.toFixed(1)}" height="${(Y(0)-Y(v)).toFixed(1)}" rx="2" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="${(x+w/2).toFixed(1)}" y="${(Y(0)+14).toFixed(1)}" text-anchor="middle" class="lbl">${i+1}</text><text x="${(x+w/2).toFixed(1)}" y="${(Y(v)-4).toFixed(1)}" text-anchor="middle" class="lbl halo">${money(v)}</text>`; });
    s+=`<line x1="${X(0)}" x2="${X(mb.length)}" y1="${Y(price)}" y2="${Y(price)}" stroke="var(--g2)" stroke-width="2.4" stroke-dasharray="6 4"/>`+gtext(X(mb.length)-2,Y(price)-6,'price '+money(price),'var(--g2)','end');
    return s; }});
}
function cfMini(hi){
  const A=[
    ['M318 128 C318 70 300 46 268 42','real'],['M112 42 C80 46 62 70 62 128','real'],['M62 176 C62 230 80 254 112 258','real'],['M268 258 C300 254 318 230 318 176','real'],
    ['M92 128 C96 92 110 74 132 64','money'],['M248 64 C270 74 284 92 288 128','money'],['M288 176 C284 208 270 226 248 236','money'],['M132 236 C110 226 96 208 92 176','money']];
  const lab={0:[338,84],1:[42,84],2:[42,224],3:[338,224],4:[112,104],5:[268,104],6:[268,204],7:[112,204]};
  const mid='m'+Math.random().toString(36).slice(2,7);
  let s=`<defs><marker id="${mid}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--g2)"/></marker><marker id="${mid}g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs><g transform="translate(30,0)">`;
  s+=`<ellipse cx="190" cy="42" rx="84" ry="26" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="190" y="41" text-anchor="middle" class="lbl-ink">Goods &amp; services market</text>`;
  s+=`<ellipse cx="190" cy="258" rx="84" ry="26" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="190" y="262" text-anchor="middle" class="lbl-ink">Factor market</text>`;
  s+=`<rect x="22" y="128" width="100" height="48" rx="8" fill="var(--surface)" stroke="var(--ink)"/><text x="72" y="157" text-anchor="middle" class="lbl-ink">Households</text>`;
  s+=`<rect x="258" y="128" width="100" height="48" rx="8" fill="var(--surface)" stroke="var(--ink)"/><text x="308" y="157" text-anchor="middle" class="lbl-ink">Firms</text>`;
  A.forEach(([d],i)=>{ const on=i===hi; s+=`<path d="${d}" fill="none" stroke="${on?'var(--g2)':'var(--muted)'}" stroke-width="${on?3:1.4}" opacity="${on?1:.45}" marker-end="url(#${mid}${on?'':'g'})"/>`; });
  const [lx,ly]=lab[hi]; s+=`<text x="${lx}" y="${ly}" text-anchor="middle" class="halo" style="fill:var(--g2);font-weight:700;font-size:18px">?</text></g>`;
  return `<div class="qg"><svg viewBox="0 0 440 300" role="img" aria-label="Circular flow diagram with one arrow marked with a question mark">${s}</svg></div>`;
}

/* ===== Lesson 1: Scarcity and opportunity cost ===== */
mc('l1-def','l1','Which of the following best defines <b>opportunity cost</b>?',
  ['The value of the next best alternative given up when a choice is made','The total amount of money spent on a good','The sum of every alternative that could have been chosen','The price of a good after taxes','The price paid minus any discount received'],0,
  '<p>Opportunity cost is the value of your <b>single next best</b> alternative, not the total of every option you passed on. Money spent is often part of it, but time and other options count too.</p>');
mc('l1-shift','l1','A free concert is tonight. Your next best option was a 4-hour shift that pays $15 an hour. What is the opportunity cost of going to the concert?',
  ['$60 in wages given up','$0, because the concert is free','$15, one hour of wages','The concert itself','$60 plus the value of the concert'],0,
  '<p>The ticket price is $0, but going still costs you something. You give up the shift: 4 × $15 = <b>$60</b>. "Free" things can still have a real opportunity cost.</p>');
mc('l1-capital','l1','In economics, which of the following is an example of <b>capital</b>?',
  ['A delivery van owned by a bakery','$5,000 in the bakery\'s savings account','The wheat field the flour comes from','The baker\'s hours of work','Shares of stock the baker owns'],0,
  '<p><b>Capital</b> means tools, machines and buildings used to make other goods, like the van. Money and stocks are <i>financial</i> capital, not a factor of production. The field is <b>land</b>; the baker\'s work is <b>labor</b>.</p>');
tf('l1-tf-free','l1','If something is free to buy, it has no opportunity cost.',false,
  '<p>False. A free concert still uses your time, and that time has a next best use. Opportunity cost is about what you give up, not only what you pay.</p>');
gen('l1-g-budget','l1',()=>{
  const pa = pick([2,3,4,5,6]), pb = pick([0.5,1]), B = pa*pick([4,5,6]);
  const ans = pa/pb;
  return { type:'num', kind:'num', prompt:`You have ${money(B)} a week to spend on coffee (${money(pa)} each) and bus rides (${money(pb)} each). What is the opportunity cost of <b>one more coffee</b>, measured in bus rides?`,
    answer:ans, unit:'bus rides',
    explain:`<p>One coffee uses ${money(pa)}. That same money buys ${money(pa)} ÷ ${money(pb)} = <b>${fmt(ans)} bus rides</b>.</p><p>Shortcut: opportunity cost = price of the good you choose ÷ price of the other good. The ${money(B)} budget does not change the trade-off rate; only the prices do.</p>` };
});
tf('l1-tf-rich','l1','Scarcity would disappear if everyone had a lot more money.',false,
  '<p>False. Money is a claim on resources, not a resource. Land, workers, machines and hours in the day would still be limited, so people would still face trade-offs.</p>');
mc('l1-land','l1','Which of the following counts as <b>land</b> as a factor of production?',
  ['Crude oil still in the ground','A drilling rig','The oil company\'s engineers','The company\'s bank loan','The founder\'s idea to drill in a new spot'],0,
  '<p><b>Land</b> means all natural resources, not just soil: oil, minerals, water, forests. The rig is capital, the engineers are labor, the loan is financial, and the founder\'s risky idea is entrepreneurship.</p>');
gen('l1-g-lunch','l1',()=>{
  const x = pick([9,10,11,12,13]), y = pick([3,4,5]), d = pick([200,220,240,250]);
  const ans = (x-y)*d;
  return { type:'num', kind:'num', prompt:`Buying lunch near work costs ${money(x)}. Packing lunch at home costs ${money(y)}. If you buy lunch ${d} workdays a year, what is the yearly opportunity cost of buying instead of packing?`,
    answer:ans, unit:'dollars',
    explain:`<p>Each day you give up ${money(x)} − ${money(y)} = ${money(x-y)}. Over ${d} days: ${money(x-y)} × ${d} = <b>${money(ans)}</b>.</p><p>This is the textbook\'s point: "${money(x-y)} a day" feels small, but "${money(ans)} a year" might change your choice.</p>` };
});
lazy('l1-gr-outside','l1',()=>({ type:'mc', kind:'graph',
  prompt:`Alphonso has $10 a week. Burgers cost $2 and bus tickets cost $0.50. His budget line is shown.${gchart({xmax:24,ymax:6,xlab:'Bus tickets',ylab:'Burgers',xt:[0,4,8,12,16,20,24],yt:[0,1,2,3,4,5,6],body:(X,Y)=>gline([[0,5],[20,0]],X,Y)+gdot(X,Y,12,2,'A')+gdot(X,Y,6,1,'B','var(--g1)')+gdot(X,Y,16,3,'C','var(--g2)')})}Which point can Alphonso <b>not</b> afford?`,
  options:['Point C','Point A','Point B','Points A and C','None of them; all three are affordable'], answer:0,
  explain:'<p>Point C is 3 burgers and 16 tickets: 3 × $2 + 16 × $0.50 = $14, more than $10. It sits <b>outside</b> the budget line.</p><p>A (2 burgers, 12 tickets) costs exactly $10, on the line. B (1 burger, 6 tickets) costs $5, inside: affordable with money left over.</p>' }));
mc('l1-positive','l1','Which of the following is a <b>positive</b> statement?',
  ['Raising the minimum wage will reduce the number of jobs for teenagers.','The minimum wage should be raised to $20.','It is unfair that some workers earn so little.','Teenagers ought to work fewer hours.','Teenagers deserve higher pay than they get.'],0,
  '<p>A <b>positive</b> statement describes how the world is or will be. It can be tested with data, even if it turns out false. The others say what <i>should</i> happen or what is fair, so they are <b>normative</b>.</p>');
mc('l1-micro','l1','Which question is <b>microeconomic</b>?',
  ['How will higher coffee-bean prices change what a café charges for a latte?','What causes the national unemployment rate to rise?','Why did the overall price level rise 3% last year?','How fast is the country\'s total output growing?','What happens to total U.S. exports when the dollar strengthens?'],0,
  '<p>Microeconomics looks at individual decision makers: households, workers, firms and single markets, like one café. The other four are about the whole economy, which is <b>macroeconomics</b>.</p>');
gen('l1-g-college','l1',()=>{
  const T=pick([8000,12000,20000]), B=pick([1000,1500]), W=pick([18000,25000,30000]); const ans=T+B+W;
  return { type:'num', kind:'num', prompt:`A year of full-time college costs ${money(T)} in tuition and ${money(B)} in books. If you didn't enroll, you'd work and earn ${money(W)}. Ignoring housing and food (you'd pay those either way), what is the full opportunity cost of the year?`,
    answer:ans, unit:'dollars',
    explain:`<p>Add what you pay and what you give up: ${money(T)} + ${money(B)} + ${money(W)} = <b>${money(ans)}</b>.</p><p>The lost wages are often the biggest piece, and the one people forget.</p>` };
});
/* L1 more */
mc('l1-normative2','l1','Which of the following is a <b>normative</b> statement?',
  ['College should be free for everyone.','Tuition rose faster than inflation last decade.','Free college would raise enrollment.','Most students borrow to pay for college.','Graduates earn more on average than non-graduates.'],0,
  '<p>"Should" signals a value judgment: normative. The other four are claims that data could check, so they are positive (even if some are disputed).</p>');
tf('l1-tf-positive-true','l1','A positive statement has to be true.',false,
  '<p>False. "Positive" means it can be tested against facts, not that it passes the test. "The moon is made of cheese" is a (false) positive statement.</p>');

gen('l2-g-ppf','l2',()=>{
  const k = pick([1,2,3,4]);
  const xs = [0,10,20,30,40], losses = [5*k,10*k,15*k,20*k];
  const ys = [50*k]; losses.forEach(l => ys.push(ys[ys.length-1]-l));
  const i = pick([0,1,2,3]); const L = 'ABCDE';
  const ans = losses[i]/10;
  const tbl = table(['Point',...L.split('')], [['Tablets',...xs],['Bikes',...ys]]);
  return { type:'num', kind:'num', prompt:`A country can make tablets and bikes:${tbl}Moving from point ${L[i]} to point ${L[i+1]}, what is the opportunity cost of <b>each</b> additional tablet, in bikes?`,
    answer:ans, unit:'bikes per tablet',
    explain:`<p>Tablets rise by 10 (${xs[i]} → ${xs[i+1]}). Bikes fall by ${losses[i]} (${ys[i]} → ${ys[i+1]}).</p><p>Per tablet: ${losses[i]} ÷ 10 = <b>${fmt(ans)} bikes</b>. Notice the bike loss grows each step (${losses.join(', ')}): increasing opportunity cost.</p>` };
});

gen('l3-g-oc','l3',()=>{
  const a1 = pick([6,8,10,12]), a2 = pick([2,3,4,6]);
  const ans = a2/a1;
  return { type:'num', kind:'num', prompt:`In one day, Ari can bake <b>${a1} cakes</b> or <b>${a2} pies</b>. What is Ari\'s opportunity cost of <b>one cake</b>, in pies? (Decimals or fractions like 1/3 both work.)`,
    answer:ans, unit:'pies',
    explain:`<p>${a1} cakes take the same day as ${a2} pies. Divide both by ${a1}: 1 cake = ${a2}/${a1} pies = <b>${fmt(ans)} ${ans===1?'pie':'pies'}</b>.</p><p>Output rule: <b>"Other goes Over."</b> Opportunity cost of a cake = pies (the other good) ÷ cakes.</p>` };
});
gen('l3-g-ca','l3',()=>{
  let a1,a2,b1,b2;
  do{ a1=pick([6,8,10,12,16]); a2=pick([2,3,4,6,8]); b1=pick([4,6,9,12]); b2=pick([2,3,4,6]); } while(Math.abs(a2/a1 - b2/b1) < 0.05);
  const ari = a2/a1, bea = b2/b1; const ans = ari < bea ? 0 : 1;
  const tbl = table(['Per day','Cakes','Pies'], [['Ari',a1,a2],['Bea',b1,b2]]);
  return { type:'mc', kind:'mc', prompt:`${tbl}Who has the <b>comparative advantage in cakes</b>?`,
    options:['Ari','Bea','Both of them','Neither of them','It depends on the price of cakes'], answer:ans, keepOrder:true,
    explain:`<p>Opportunity cost of 1 cake (in pies): Ari ${a2}/${a1} = ${fmt(ari)}, Bea ${b2}/${b1} = ${fmt(bea)}.</p><p><b>${ans===0?'Ari':'Bea'}</b> gives up fewer pies per cake, so ${ans===0?'Ari':'Bea'} has the comparative advantage in cakes, no matter who bakes more in total. Prices don\'t decide it.</p>` };
},'mc');

function twoLines(){

  return {ax,ay,bx,by,svg};

gen('l5-g-mb','l5',()=>{
  const start = pick([8,9,10,12]); const mb=[start];
  while(mb.length<6){ const nx = mb[mb.length-1]-pick([1,1.5,2]); if(nx<=0.5) break; mb.push(nx); }
  const idx = Math.max(1, Math.min(mb.length-1, Math.floor(Math.random()*(mb.length-1))+1));
  const price = round((mb[idx-1]+mb[idx])/2,2);
  const ans = mb.filter(v => v >= price).length;
  const tbl = table(['Smoothie',...mb.map((_,i)=>i+1)], [['Extra benefit to you',...mb.map(money)]]);
  return { type:'num', kind:'num', prompt:`Smoothies cost <b>${money(price)}</b> each. Here is how much each extra smoothie this week is worth to you:${tbl}How many smoothies should you buy?`,
    answer:ans, unit:'smoothies',
    explain:`<p>Buy each smoothie whose extra benefit is at least its extra cost of ${money(price)}. ${ans===1?'Only smoothie 1 is':`Smoothies 1 to ${ans} are`} worth ${money(mb[ans-1])} or more; smoothie ${ans+1} is worth only ${money(mb[ans])}.</p><p>So buy <b>${ans}</b>. Stop where marginal benefit drops below marginal cost.</p>` };
});

gen('l5-g-sunk','l5',()=>{

    answer:ans, unit:'dollars', explain:`<p>Ignore the ${money(Sx)}: it\'s sunk. Looking ahead: ${money(R)} − ${money(C)} = <b>${money(ans)}</b>. ${ans>0?'Finish it.':'Stop, even though so much has been spent.'}</p>` };

gen('l5-g-firm','l5',()=>{

    answer:ans, unit:'dollars',
    explain:`<p>Marginal benefit: ${units.toLocaleString()} × ${money(price)} = ${money(rev)}. Marginal cost: ${money(cost)}.</p><p>Net: ${money(rev)} − ${money(cost)} = <b>${money(ans)}</b>. ${ans>0?'The extra benefit beats the extra cost, so add the shift.':'The extra cost is bigger than the extra benefit, so skip the shift.'}</p>` };
});

    ['Point inside the PPF','What does a point inside the PPF mean, and what typically causes it?','Inefficient production: some resources are idle or misused. The economy could produce more of at least one good, often both, without giving anything up. Common causes are unemployment, a recession or idle factories.','Making 30 boots and 50 jackets when 40 and 70 are possible.','Putting idle workers back to work moves the economy toward the curve. It doesn\'t shift the curve.'],

    ['Shift of the PPF','What are the only two things that shift the whole PPF?','A change in the quantity or quality of resources (workers, capital, land), or a change in technology. More or better shifts it out; less shifts it in.','Out: immigration grows the labor force, or a new technology. In: an earthquake destroys factories.','Lower unemployment, choosing a different mix, and price changes do NOT shift the PPF.'],

    ['Allocative efficiency','What is allocative efficiency, and how is it different from productive efficiency?','Producing the mix of goods that society values most. It is one particular point on the PPF. Being on the curve (productive efficiency) is necessary but not enough.','A country making only tanks and no food is on its PPF (productively efficient) but almost certainly not allocatively efficient.',''],

    ['Capital goods and growth','How does choosing capital goods over consumer goods today affect the PPF in the future?','Capital goods (machines, factories) are used to make other goods. Producing more of them now means fewer consumer goods today, which is the opportunity cost, but more productive capacity later, so the PPF shifts out faster.','Country A builds factories while Country B makes more TVs now. In ten years, A\'s PPF has most likely shifted out further.','']

    ['Specialization','What is specialization, and why does it raise total output?','Focusing on producing one good or task and trading for the rest. Total output rises when each producer specializes in what they make at the lowest opportunity cost.','The seamstress makes only sweaters, the baker makes only bread, and they trade.',''],
    ['Absolute advantage','What is absolute advantage, and how do you find it?','Being able to produce more of a good than someone else with the same time or resources. Compare the raw output numbers directly.','The baker makes 24 bread a day versus the seamstress\'s 8, so he has the absolute advantage in bread. He also has it in sweaters (8 versus 4).','Absolute advantage does not decide who should make what.'],

    ['Division of labor','What is the division of labor, and what example did Adam Smith use?','Splitting production into separate specialized tasks, each done by different workers. It raises output per worker through practice, less switching between tasks and better tools. Smith\'s example was a pin factory.','In Smith\'s pin factory, a team where each worker did one step made far more pins per person than workers each making whole pins alone.',''],

const CARDS = {}, BASE_CARDS = {};
Object.entries(CARD_LIST).forEach(([lid,list])=>list.forEach(([t,q,d,ex,tip],i)=>{ BASE_CARDS[`c-${lid}-${i}`] = { lesson:lid, t, q, d, ex, tip }; }));

/* Your own cards and your edits to built-in cards, kept per person:
     data/users/<id>/micro-workbook/cards/<cardId>  { lesson, t, q, d, ex, tip, custom: true|false, at }
   custom:true = a card you made (id "u-..."); custom:false = your edit of a built-in card (same id as the built-in).
   While signed out, changes wait in this device's localStorage and upload when the account connects. */
const CARDSTORE = { col:null, docs:{} };
const LOCAL_CARDS_KEY = 'micro-cards-local';
function loadLocalCards(){ try{ const v=JSON.parse(localStorage.getItem(LOCAL_CARDS_KEY)); return v && typeof v==='object' ? v : {}; }catch(e){ return {}; } }
function saveLocalCards(v){ try{ localStorage.setItem(LOCAL_CARDS_KEY, JSON.stringify(v)); }catch(e){} }
function rebuildCards(){
  Object.keys(CARDS).forEach(k=>delete CARDS[k]);
  const mine = { ...CARDSTORE.docs, ...loadLocalCards() };
  Object.entries(BASE_CARDS).forEach(([id,c])=>{ const o = mine[id]; CARDS[id] = (o && !o.custom && !o.deleted) ? { ...c, ...pickCard(o), lesson:c.lesson, edited:true } : { ...c }; });
  Object.entries(mine).sort((a,b)=>(a[1].at||0)-(b[1].at||0)).forEach(([id,o])=>{ if(o && o.custom && !o.deleted && LBYID_SAFE(o.lesson) && o.t && o.d) CARDS[id] = { ...pickCard(o), lesson:o.lesson, custom:true }; });
}
const LBYID_SAFE = lid => !!CARD_LIST[lid];
const pickCard = o => ({ t:String(o.t||'').slice(0,200), q:String(o.q||'').slice(0,400), d:String(o.d||'').slice(0,2000), ex:String(o.ex||'').slice(0,1000), tip:String(o.tip||'').slice(0,600) });
const cardsFor = lid => Object.keys(CARDS).filter(k=>CARDS[k].lesson===lid);
async function saveCard(id, data){
  const body = { ...pickCard(data), lesson:data.lesson, custom:!!data.custom, at:Date.now() };
  if(CARDSTORE.col){
    CARDSTORE.docs[id] = body; rebuildCards();
    try{ await CARDSTORE.col.doc(id).set(body); return 'saved'; }catch(e){ delete CARDSTORE.docs[id]; }
  }
  const loc = loadLocalCards(); loc[id] = body; saveLocalCards(loc); rebuildCards(); return 'local';
}
async function removeCardDoc(id){
  /* removing your record deletes a card you made, or resets a built-in card to the original */
  const loc = loadLocalCards();
  if(loc[id]){ delete loc[id]; saveLocalCards(loc); }
  if(CARDSTORE.col){ delete CARDSTORE.docs[id]; rebuildCards(); try{ await CARDSTORE.col.doc(id).delete(); }catch(e){} }
  rebuildCards();
}
function startCards(){
  if(CARDSTORE.col || !Store.ref) return;
  CARDSTORE.col = Store.ref.collection('cards');
  CARDSTORE.col.onSnapshot(snap => {
    const docs = {}; snap.docs.forEach(d => { docs[d.id] = d.data(); }); CARDSTORE.docs = docs;
    rebuildCards(); onCardsChanged();
  }, () => {});
  (async () => {
    const loc = loadLocalCards(), left = {};
    for(const [id,o] of Object.entries(loc)){
      try{ if(o.deleted) await CARDSTORE.col.doc(id).delete(); else await CARDSTORE.col.doc(id).set(o); }catch(e){ left[id]=o; }
    }
    saveLocalCards(left);
  })();
}
rebuildCards();

    checklist:['Correctly explains a point on the curve (efficient, full use of resources)','Correctly explains a point inside (inefficient) with a cause such as unemployment or recession','Correctly explains a point outside (unattainable now)','Says what could make an outside point reachable (more resources, better technology, or trade for consumption)']},
  'w-l2-3':{lesson:'l2',prompt:'How does a country\'s choice between producing capital goods and consumer goods today affect its PPF in the future?',
    model:'Capital goods, such as machines and factories, are used to make other goods. If a country puts more resources into capital goods today, it gives up some consumer goods now, which is the opportunity cost. In exchange, it will have more productive capacity later, so its PPF will tend to shift outward faster than that of a country that consumes more today. It\'s a trade-off between consumption now and growth later.',
    checklist:['Defines or correctly describes capital goods','Notes the opportunity cost today (fewer consumer goods now)','Explains that more capital shifts the PPF outward in the future','Frames it as a trade-off between now and later']},
  'w-l3-1':{lesson:'l3',prompt:'The baker is better than the seamstress at making both bread and sweaters. Explain why he still gains from trading with her.',
    model:'The baker has an absolute advantage in both goods, but trade depends on comparative advantage, which is about opportunity cost. For the baker, a sweater costs 3 bread; for the seamstress it costs only 2. So she has the comparative advantage in sweaters and he has it in bread (his bread costs 1/3 sweater versus her 1/2). If each specializes and they trade at a price between 2 and 3 bread per sweater, both can consume more than alone. With 2 sweaters for 5 bread, he ends with 19 bread and 2 sweaters, which beats the 18 bread he could make alongside 2 sweaters on his own.',
    checklist:['Distinguishes absolute advantage from comparative advantage','Computes or states the opportunity costs (3 vs 2 bread per sweater, or 1/3 vs 1/2 sweater per bread)','Explains who should specialize in what','Shows both gain, such as consuming outside the PPF or the price being between their costs']},
  'w-l3-2':{lesson:'l3',prompt:'Explain why the trade price must fall between the two producers\' opportunity costs for both of them to gain.',
    model:'Each producer compares the trade price with what the good would cost to make themselves. The seamstress can make a sweater for 2 bread, so she will only sell one for more than 2 bread. The baker would give up 3 bread to make a sweater himself, so he will only buy one for less than 3 bread. Any price between 2 and 3 makes both better off than producing alone. Outside that range, one side would rather not trade.',
    checklist:['States that each producer compares the price with their own opportunity cost','Explains the seller\'s lower limit (won\'t accept less than their own cost)','Explains the buyer\'s upper limit (won\'t pay more than their own cost)','Uses numbers or an example to illustrate the range']},
  'w-l4-1':{lesson:'l4',prompt:'Compare how a market economy and a command economy answer the question "what should be produced?" Give one strength of each.',
    model:'In a market economy, what gets produced is decided by many buyers and sellers: firms make what customers are willing to pay for, and prices signal what people want. In a command economy, a central authority decides what to produce and sets prices. A strength of the market approach is that it responds quickly to what people actually want and encourages new products. A strength of the command approach is that the government can direct resources quickly toward a chosen goal, like building infrastructure or providing basic necessities to everyone.',
    checklist:['Correctly describes how a market economy decides (buyers, sellers, prices, demand)','Correctly describes how a command economy decides (central authority or plan)','Gives a reasonable strength of a market economy','Gives a reasonable strength of a command economy']},
  'w-l4-2':{lesson:'l4',prompt:'Walk through the circular flow model by following one dollar from a household, around the loop, and back.',
    model:'A household spends a dollar buying something in the goods and services market. That dollar becomes revenue for the firm that sold it. The firm uses its revenue to pay for resources in the factor market, for example wages to a worker. The worker belongs to a household, so the dollar comes back to a household as income, which it can spend again. Goods and resources flow the opposite way: the firm sends the product to the household, and the household sends labor to the firm.',
    checklist:['Household spending in the goods and services market becomes firm revenue','Firm pays for resources in the factor market (wages, rent, interest, profit)','The payment returns to households as income','Notes that goods or resources flow in the opposite direction to money']},
  'w-l5-1':{lesson:'l5',prompt:'Explain the rule "keep going while marginal benefit is at least marginal cost" using an everyday example of your own.',
    model:'Marginal benefit is the extra benefit of one more unit and marginal cost is the extra cost. Say I\'m studying for an exam. The first hour helps a lot; by the fourth hour I\'m tired and learn less, so the marginal benefit falls. The marginal cost of each hour is what I give up, like sleep or work. I should keep studying while the next hour is worth at least what it costs me and stop once it\'s worth less. Looking at the total hours wouldn\'t tell me when to stop; looking at the next hour does.',
    checklist:['Defines marginal benefit and marginal cost','Gives an original everyday example','Applies the rule: continue while MB ≥ MC, stop when MB &lt; MC','Shows that MB falls or explains why the decision is made unit by unit']},
  'w-l5-2':{lesson:'l5',prompt:'What is a sunk cost, and why should it be ignored when making a decision? Give an example.',
    model:'A sunk cost is money or time already spent that you can\'t get back. Because it\'s gone no matter what you choose next, it can\'t make one option better than another. Only future costs and benefits matter. Example: you paid $8 for a movie that turns out to be terrible. The $8 is gone whether you stay or leave, so the real choice is whether the next 90 minutes of the movie are worth more than anything else you could do. Staying "to get your money\'s worth" is the sunk cost fallacy.',
    checklist:['Defines a sunk cost as already spent and unrecoverable','Explains why it should not affect the decision (it\'s the same under every option)','Says to compare future or marginal costs and benefits','Gives a correct example']},
  'w-l5-3':{lesson:'l5',prompt:'Pick an incentive or disincentive from the news or your own life. Explain how it changes the costs or benefits of a choice, and what people are likely to do.',
    model:'The UK put a tax on high-sugar soft drinks in 2018. That is a disincentive: it raised the cost of making and selling sugary drinks. Companies responded at the margin by cutting the sugar in many drinks so they no longer owed the tax. Researchers found the share of drinks liable for the tax fell from 52% to 15%. By changing the cost side of the decision, the tax changed what firms chose to produce.',
    checklist:['Correctly identifies it as an incentive or a disincentive','Explains whether it raises benefits or raises costs','Predicts or describes how behavior changes','Links the change to marginal costs and benefits or opportunity cost']}
};

/* ---------- report a problem ----------
   Each report is its own document, separate from progress, so a progress sync can never erase it:
     data/users/<id>/micro-workbook/reports/<reportId>
     { where: "question:<qid>" | "lesson:<lid>", note, at (ms), status: "open" | "fixed" | "nochange", reply: "", fixedAt: 0 }
   Claude reads open reports with ArtifactData, fixes the page, then sets status, reply (one line on what changed) and fixedAt.
   Reports made while signed out or offline wait on this device (localStorage) and are sent once the account connects. */
const REP = { col:null, list:[], live:false };
const REP_PENDING_KEY = 'micro-reports-pending', REP_FILTER_KEY = 'micro-rep-filter';
const RESOLVED = s => s==='fixed' || s==='nochange';
function loadPending(){ try{ const v=JSON.parse(localStorage.getItem(REP_PENDING_KEY)); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function savePending(v){ try{ localStorage.setItem(REP_PENDING_KEY, JSON.stringify(v)); }catch(e){} }
const newRepId = at => 'r' + at + '-' + Math.random().toString(36).slice(2,6);
function allReports(){
  const sent = new Set(REP.list.map(r=>r.id));
  const pend = loadPending().filter(r=>!sent.has(r.id)).map(r=>({ ...r, status:'unsent', reply:'', fixedAt:0 }));
  return [...pend, ...REP.list].sort((a,b)=>(b.at||0)-(a.at||0));
}
const repBody = r => ({ where:String(r.where), note:String(r.note).slice(0,1000), ctx:String(r.ctx||'').slice(0,4000), at:r.at, status:'open', reply:'', fixedAt:0 });
async function addReport(where, note, ctx){
  const r = { id:newRepId(Date.now()), where, note:note.slice(0,1000), ctx:String(ctx||'').slice(0,4000), at:Date.now() };
  if(REP.col){
    try{ await REP.col.doc(r.id).set(repBody(r)); return 'sent'; }
    catch(e){ if(e && e.code==='quota_exceeded'){ /* fall through to local */ } }
  }
  const p = loadPending(); p.push(r); savePending(p.slice(-100)); updateRepUI(); return 'local';
}
async function flushPending(){
  if(!REP.col) return;
  const legacy = (S.reports||[]).map(r=>({ id:'r'+(r.at||0)+'-old', where:r.where, note:r.note, at:r.at||Date.now() }));
  const queue = [...loadPending(), ...legacy]; if(!queue.length) return;
  const left = [];
  for(const r of queue){ try{ await REP.col.doc(r.id).set(repBody(r)); }catch(e){ left.push(r); } }
  savePending(left.filter(r=>!String(r.id).endsWith('-old')));
  if(legacy.length && !left.some(r=>String(r.id).endsWith('-old'))){ S.reports = []; save(); }
  updateRepUI();
}
function startReports(){
  if(REP.col || !Store.ref) return;
  REP.col = Store.ref.collection('reports');
  REP.col.onSnapshot(snap => {
    REP.list = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    REP.live = true; updateRepUI();
  }, () => { REP.live = false; });
  flushPending();
}
async function removeReport(r){
  if(r.status==='unsent'){ savePending(loadPending().filter(x=>x.id!==r.id)); updateRepUI(); return; }
  if(REP.col){ try{ await REP.col.doc(r.id).delete(); }catch(e){} }
}
function describeWhere(where){
  where = String(where);
  if(where.startsWith('explain:')){ const inner = describeWhere(where.slice(8)); return { title: inner.title + ' · Claude\'s explanation', snip: inner.snip, href: inner.href }; }
  const ci = where.indexOf(':'), kind = where.slice(0, ci), id = where.slice(ci+1);
  if(kind==='section' || kind==='widget'){ const [lid, name] = id.split('|'); const L = LBYID[lid];
    if(L) return { title: kind==='section' ? `Lesson ${L.n} · "${name}" section` : `Lesson ${L.n} · interactive: ${name}`, snip:'', href:'#'+lid }; }
  if(kind==='writing' && WRITE[id]){ const w = WRITE[id]; return { title:`Lesson ${LBYID[w.lesson].n} · Writing prompt`, snip:w.prompt, href:'#'+w.lesson }; }
  if(kind==='lesson' && LBYID[id]) return { title:`Lesson ${LBYID[id].n} · lesson page`, snip:LBYID[id].title, href:'#'+id };
  if((kind==='card' || kind==='cardgrade')){
    const c = CARDS[id]; if(!c) return { title:'Flashcard (since deleted)', snip:'', href:null };
    return { title:`Lesson ${LBYID[c.lesson].n} · ${kind==='card'?'Flashcard':'Claude\'s check of your flashcard answer'}${c.custom?' (yours)':''}`, snip:c.t, href:'#fc-'+id };
  }
  if(kind==='grade' && WRITE[id]){ const w = WRITE[id]; return { title:`Lesson ${LBYID[w.lesson].n} · Claude's grading of your writing`, snip:w.prompt, href:'#'+w.lesson }; }
  if(kind==='question' && Q[id]){
    const q = Q[id], L = LBYID[q.lesson];
    const place = q.quiz ? 'Unit quiz question' : L.core.includes(id) ? `Practice question ${L.core.indexOf(id)+1}` : L.more.includes(id) ? `Extra question ${L.more.indexOf(id)+1}` : 'Question';
    let snip = '';
    try{ const tmp=document.createElement('div'); tmp.innerHTML = instance(id).prompt; tmp.querySelectorAll('svg,.tbl-wrap,.qg').forEach(n=>n.replaceWith(' … ')); snip = tmp.textContent.replace(/\s+/g,' ').trim(); }catch(e){}
    if(snip.length>120) snip = snip.slice(0,117).trimEnd()+'…';
    return { title: q.quiz ? `Unit quiz · from Lesson ${L.n}` : `Lesson ${L.n} · ${place}`, snip, href:'#q-'+id };
  }
  return { title:String(where), snip:'', href:null };
}
const shortDay = t => new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const STATUS_LABEL = { open:'Open', unsent:'Not sent yet', fixed:'Fixed', nochange:'No change needed' };
function fillTag(tag){
  const mine = allReports().filter(r=>r.where===tag.dataset.rep);
  const r = mine[0]; tag.className = 'rep-tag'; tag.innerHTML = '';
  if(!r) return;
  tag.classList.add('st-'+r.status);
  if(RESOLVED(r.status)){
    const note = r.reply ? (r.reply.length>140 ? r.reply.slice(0,137)+'…' : r.reply) : '';
    tag.innerHTML = `${r.status==='fixed'?'Fixed':'Checked'} ${shortDay(r.fixedAt||r.at)}${note?` <span class="rt-note">· ${esc(note)}</span>`:''}`;
  } else tag.textContent = r.status==='unsent' ? 'Reported (not sent yet)' : `Reported ${shortDay(r.at)} · open`;
}
function updateRepUI(){
  $$('.rep-tag[data-rep]').forEach(fillTag);
  refreshChrome();
  if(view==='reports' && !REPV.busy) renderReports();
}
function mountReport(where, host, ctxFn){
  host.appendChild(reportLink(where, host, ctxFn));
  const tag = document.createElement('span'); tag.dataset.rep = where; host.appendChild(tag); fillTag(tag);
}
function reportLink(where, host, ctxFn){
  const b = document.createElement('button'); b.type='button'; b.className='rep-link'; b.textContent='Report a problem';
  b.onclick = () => {
    if(host.querySelector('.rep-box')) return;
    const box = document.createElement('div'); box.className='rep-box';
    box.innerHTML = `<label class="small muted" for="rep-${esc(where)}">What's wrong? (wrong answer, typo, confusing, broken...)</label><textarea id="rep-${esc(where)}" rows="3" maxlength="1000"></textarea><div class="row" style="margin-top:6px"><button class="btn sm" type="button">Send</button><button class="btn ghost sm" type="button">Cancel</button></div>`;
    const [send, cancel] = box.querySelectorAll('button'), ta = box.querySelector('textarea');
    cancel.onclick = () => box.remove();
    send.onclick = async () => {
      const note = ta.value.trim(); if(!note){ ta.focus(); return; }
      send.disabled = true; cancel.disabled = true;
      let ctx=''; try{ ctx = ctxFn ? ctxFn() : ''; }catch(e){}
      const how = await addReport(where, note, ctx);
      box.innerHTML = how==='sent'
        ? '<p class="small" style="margin:0">Sent. Track it under <a href="#reports">Reports</a>; Claude adds a note there when it\'s handled.</p>'
        : '<p class="small" style="margin:0">Saved on this device. It will be sent when you\'re signed in to Claude and online.</p>';
      setTimeout(()=>box.remove(), 4000);
    };
    host.appendChild(box); ta.focus();
  };
  return b;
}

/* ---------- question card ---------- */
function instance(qid){ const b = Q[qid]; return b.gen ? b.gen() : b.build ? b.build() : b; }
const KIND_LABEL = { mc:'Multiple choice', tf:'True or false', graph:'Graph', num:'Worked problem' };
function qCard(qid, { ctx, label, onAnswer, onNext, nextLabel }){
  const el = document.createElement('div'); el.className='q';
  let inst = instance(qid), chosen = null, shown = null;
  const draw = () => {
    const kind = inst.kind || Q[qid].kind || (inst.type==='num'?'num':'mc');
    const opts = inst.type==='mc' ? (inst.keepOrder ? inst.options.map((t,i)=>({t,i})) : shuffle(inst.options.map((t,i)=>({t,i})))) : null;
    const letters = 'ABCDE';
    el.innerHTML = `<div class="q-meta"><span>${label||''}</span><span>${KIND_LABEL[kind]||'Question'}${Q[qid].gen?' · new numbers each time':''}</span></div>
      <div class="q-prompt">${inst.prompt}</div>
      ${opts ? `<div class="opts${kind==='tf'?' tf':''}">${opts.map((o,k)=>`<button class="opt" data-i="${o.i}">${kind==='tf'?'':`<span class="ol">${letters[k]}</span>`}<span>${o.t}</span></button>`).join('')}</div>`
             : `<form class="numrow"><input id="in-${qid}-${ctx}" aria-label="Your answer" inputmode="decimal" autocomplete="off" placeholder="Your answer"><span class="muted small">${inst.unit||''}</span><button class="btn sm" type="submit">Check</button></form>`}
      <div class="fb" aria-live="polite"></div><div class="q-tools"><span class="xp-slot"></span><span class="rep-slot"></span></div>`;
    chosen = null; shown = opts;
    $('.xp-slot', el).appendChild(explainBox('question:'+qid, () => {
      let s = `${Q[qid].quiz?'Unit quiz question':'Practice question'} (${KIND_LABEL[kind]||'question'}):\n${textOf($('.q-prompt', el))}`;
      if(shown) s += '\n\nChoices:\n' + shown.map((o,k)=>`${kind==='tf'?'':letters[k]+'. '}${textOf(Object.assign(document.createElement('div'),{innerHTML:o.t}))}`).join('\n');
      else s += `\n\n(The student types a number${inst.unit?' in '+inst.unit:''}.)`;
      if(chosen){
        const pickTxt = shown ? (()=>{ const k=shown.findIndex(o=>o.i===chosen.i); return `${kind==='tf'?'':letters[k]+'. '}${textOf(Object.assign(document.createElement('div'),{innerHTML:shown[k].t}))}`; })() : chosen.v;
        const right = shown ? (()=>{ const k=shown.findIndex(o=>o.i===inst.answer); return `${kind==='tf'?'':letters[k]+'. '}${textOf(Object.assign(document.createElement('div'),{innerHTML:shown[k].t}))}`; })() : `${inst.unit==='dollars'?money(inst.answer):fmt(inst.answer)} ${inst.unit||''}`;
        s += `\n\nThe student answered: ${pickTxt} (${chosen.ok?'correct':'incorrect'}).\nCorrect answer: ${right}\nExplanation shown in the workbook: ${textOf($('.explain', el))}`;
      }
      return s;
    }, () => chosen ? 'full' : 'hint', 'Explain this'));
    mountReport('question:'+qid, $('.q-tools > .rep-slot', el));
    if(opts){
      $$('.opt', el).forEach(b => b.addEventListener('click', () => {
        const i = +b.dataset.i, ok = i === inst.answer;
        $$('.opt', el).forEach(x => { x.disabled = true; if(+x.dataset.i===inst.answer) x.classList.add('right'); });
        if(!ok) b.classList.add('wrong');
        chosen = { i, ok };
        finish(ok);
      }));
    } else {
      const form = $('form', el), input = $('input', el);
      form.addEventListener('submit', e => {
        e.preventDefault();
        const v = fracParse(input.value);
        const fb = $('.fb', el);
        if(isNaN(v)){ fb.innerHTML = '<p class="verdict bad">Enter a number, like 1.5 or 1/3.</p>'; return; }
        const ok = Math.abs(v - inst.answer) <= (inst.unit==='dollars' ? 0.011 : Math.max(0.011, Math.abs(inst.answer)*0.005));
        input.disabled = true; $('button', form).disabled = true;
        chosen = { v: input.value.trim(), ok };
        finish(ok, v);
      });
    }
  };
  const finish = (ok) => {
    const fb = $('.fb', el);
    const ansTxt = inst.type==='num' ? `<p class="muted small">Answer: ${inst.unit==='dollars'?money(inst.answer):fmt(inst.answer)+' '+(inst.unit||'')}</p>` : '';
    fb.innerHTML = `<p class="verdict ${ok?'good':'bad'}">${ok?pick(['Correct.','Right.','Yes, that\'s it.']):'Not quite. Here\'s how it works:'}</p>${ok?'':ansTxt}<div class="explain">${inst.explain}</div><div class="q-foot row"></div>`;
    const foot = $('.q-foot', fb);
    if(Q[qid].gen && ctx==='practice'){ const b=document.createElement('button'); b.className='btn ghost sm'; b.textContent='Try new numbers'; b.onclick=()=>{ inst = instance(qid); draw(); }; foot.appendChild(b); }
    if(onNext){ const b=document.createElement('button'); b.className='btn sm'; b.textContent=nextLabel||'Next'; b.onclick=onNext; foot.appendChild(b); b.focus({preventScroll:true}); }
    onAnswer && onAnswer(ok);
  };
  draw();
  return el;
}

function cardGradePrompt(c, text){

Term: ${c.t}

${c.ex ? 'Reference example: ' + c.ex : ''}
${c.tip ? 'Common mistake to watch for: ' + c.tip : ''}

Student's answer:

const VERDICT = { correct:['Correct','good'], partial:['Partly right','part'], incorrect:['Not yet','bad'] };

function flashCard(cid, { label, onAnswer, onNext, standalone }){

      <p class="small muted" style="margin:.2rem 0">Your answer: <i>${esc(typed)}</i></p>
      ${graded.got?`<p class="small"><b>What you got:</b> ${esc(graded.got)}</p>`:''}

    }

      if(back && graded && !graded.err) s += `\n\nThe student typed: ${typed}\nClaude's check: ${graded.verdict}. Got: ${graded.got} Missing: ${graded.missing}${graded.error?' Error: '+graded.error:''}`;
      return s;
    }, () => back ? 'full' : 'hint', back ? 'Explain this card' : 'Explain the question'));
    mountReport('card:'+cid, $('.cslot', el), () => { const x = CARDS[cid]; return x ? `Card as shown:\nFront: ${x.t}\nQuestion: ${x.q}\nAnswer: ${x.d}\nExample: ${x.ex}\nWatch out: ${x.tip}` : ''; });

        go.disabled = true; stop.hidden = false; ctl = new AbortController();

          graded = { verdict:r.verdict, got:String(r.got||'').slice(0,400), missing:String(r.missing||'').slice(0,500), error:String(r.error||'').slice(0,300) };

      const gs = $('.gslot', el);
      if(gs) mountReport('cardgrade:'+cid, gs, () => `Card: ${CARDS[cid]?CARDS[cid].t:cid}\nQuestion: ${CARDS[cid]?CARDS[cid].q:''}\nMy answer: ${typed}\nClaude's verdict: ${graded.verdict}\nWhat you got: ${graded.got}\nMissing: ${graded.missing}${graded.error?`\nCheck this: ${graded.error}`:''}`);
      const done = ok => { $$('.fc-actions button', el).forEach(b=>b.disabled=true); onAnswer && onAnswer(ok); if(onNext) onNext(); };
      const no=$('.no',el), yes=$('.yes',el);

    }
  };
  draw();
  return el;
}

/* ---------- "Explain this": Claude explains any part of the page in plain language ----------
   explainBox(key, getCtx, mode) → a button + panel. getCtx() returns the text the student is looking at;
   mode() returns 'full', 'hint' (unanswered question: never reveal the answer) or 'feedback' (explain a grade).
   Each tap uses a little of the viewer's Claude usage; answers are reused while the page stays open. */
const XP_CACHE = new Map();
function textOf(node){
  if(!node) return '';
  const c = node.cloneNode(true);
  c.querySelectorAll('.xp,.rep-slot,.rep-box,script,style,.q-foot').forEach(n=>n.remove());
  c.querySelectorAll('svg').forEach(s=>{ const t=[...s.querySelectorAll('text')].map(x=>x.textContent.trim()).filter(Boolean).join(' · '); s.replaceWith(document.createTextNode(` [graph${t?': '+t.slice(0,400):''}] `)); });
  c.querySelectorAll('input').forEach(i=>{ if(i.type==='range'||i.type==='number'||i.type==='text'||!i.type) i.replaceWith(document.createTextNode(i.value?` ${i.value} `:' ')); else i.remove(); });
  c.querySelectorAll('select').forEach(s=>{ const o=s.options[s.selectedIndex]; s.replaceWith(document.createTextNode(o?` ${o.text} `:' ')); });
  c.querySelectorAll('textarea').forEach(t=>t.remove());
  c.querySelectorAll('[aria-pressed="true"]').forEach(b=>b.replaceWith(document.createTextNode(` [selected: ${b.textContent.trim()}] `)));
  c.querySelectorAll('button').forEach(b=>b.remove());
  c.querySelectorAll('p,li,div,h1,h2,h3,tr,br,summary').forEach(n=>n.after(document.createTextNode('\n')));
  c.querySelectorAll('td,th').forEach(n=>n.after(document.createTextNode(' | ')));
  return c.textContent.replace(/[ \t ]+/g,' ').replace(/ *\n[ \n]*/g,'\n').trim();
}
function mdLite(s){
  const lines = esc(s).split('\n'); let html='', list=false, para=[];
  const flushP = () => { if(para.length){ html += `<p>${para.join(' ')}</p>`; para=[]; } };
  for(const ln of lines){
    const t = ln.trim();
    if(/^[-*•] /.test(t)){ flushP(); if(!list){ html+='<ul>'; list=true; } html += `<li>${t.slice(2)}</li>`; continue; }
    if(list){ html+='</ul>'; list=false; }
    if(!t){ flushP(); continue; }
    if(/^\d+[.)] /.test(t)){ flushP(); html += `<p>${t}</p>`; continue; }
    para.push(t.replace(/^#+\s*/,''));
  }
  flushP(); if(list) html += '</ul>';
  return html.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}
function xpPrompt(ctx, mode){
  const rule = mode==='hint'
    ? 'IMPORTANT: The student has NOT answered this yet. Explain what is being asked and the idea or method they need, but do not reveal, eliminate or hint at which choice is correct, and do not work out the final number or write their answer for them. If they ask for the answer in a follow-up, encourage them to try first, then explain.'
    : mode==='feedback'
    ? 'The student wrote an answer and got the grade shown. Explain the feedback: what each missed point means, why it matters, and a short example sentence showing how they could add it. Be encouraging and specific.'
    : '';
  return `You are a patient, encouraging tutor for a beginner studying for the CLEP Principles of Microeconomics exam. The student is using a study workbook and tapped "Explain this" because they don't fully understand the part shown below.

Explain it in plain language:
- Start with the core idea in one or two sentences.
- Then give one concrete, everyday example or analogy, with real numbers when it helps.
- If there is a calculation, walk through it step by step.
- If they got something wrong, explain why their choice was tempting and where the reasoning breaks.
- End with one sentence on how this shows up on the exam or why it matters.
Define any economics term the first time you use it. Keep it under about 200 words. Use short paragraphs; you may use **bold** for key terms and lines starting with "- " for lists. No headings, emojis or tables. ${rule}

What the student is looking at:
"""
${String(ctx).slice(0,6000)}
"""`;
}
/* Explanations and writing grades run on Opus with low thinking (Eli's choice). If Opus can't answer, the platform falls back to the complex tier. */
const OPUS_LOW = { model:'claude-opus-5-5', modelTier:'complex', effort:'low' };
function explainBox(key, getCtx, mode=()=>'full', label='Explain this'){
  const wrap = document.createElement('div'); wrap.className='xp';
  const u = 'xp' + Math.random().toString(36).slice(2,7);

        <form class="xp-ask"><label class="sr" for="${u}-in">Ask Claude a follow-up</label><input id="${u}-in" maxlength="500" placeholder="Ask a follow-up question…" autocomplete="off"><button class="btn sm" type="submit">Ask</button></form>
        <div class="row xp-foot"><button type="button" class="linkbtn xp-stop" hidden>Stop</button><span class="rep-slot xslot"></span></div>
      </div></div>`;
  const btn=$('.xp-btn',wrap), lab=$('.xp-lab',wrap), panel=$('.xp-panel',wrap), thread=$('.xp-thread',wrap), ctl=$('.xp-ctl',wrap), stop=$('.xp-stop',wrap), form=$('.xp-ask',wrap), input=$('input',form);
  let T = null, ac = null, busy = false;  // T = { sig, msgs }
  const drawThread = (live) => {
    if(!T) return;
    thread.innerHTML = T.msgs.map((m,i) => i===0 ? '' : m.role==='user' ? `<p class="xp-you">You asked: ${esc(m.content)}</p>` : `<div class="xp-ans">${mdLite(m.content)}</div>`).join('') + (live!==undefined ? `<div class="xp-ans">${live ? mdLite(live) : '<p class="muted">Claude is thinking…</p>'}</div>` : '');
  };
  const run = async () => {
    const sample = await getSample();

    busy = true; ac = new AbortController(); stop.hidden = false; $$('button,input', ctl).forEach(x=>{ if(x!==stop) x.disabled=true; });
    drawThread('');

      T.msgs.push({ role:'assistant', content: r.text || '' });

    }catch(e){
      const code = e && e.code;
      if(code==='cancelled' && e.text){ T.msgs.push({ role:'assistant', content: e.text + ' …' }); }
      else T.msgs.pop();
      drawThread();
      thread.insertAdjacentHTML('beforeend', `<p class="msg ${code==='cancelled'?'':'bad'}">${code==='cancelled'?'Stopped.':esc(sampleErrorMsg(code).replace('Compare your answer with the card below.','Try again in a moment.'))}</p>`);
    }finally{
      busy = false; ac = null; stop.hidden = true; ctl.hidden = false; $$('button,input', ctl).forEach(x=>x.disabled=false);
      drawThread();
    }
  };
  const open = () => {
    const m = mode(), ctx = getCtx(), sig = key + '|' + m + '|' + ctx;
    panel.hidden = false; btn.setAttribute('aria-expanded','true'); lab.textContent = 'Hide explanation';
    if(T && T.sig === sig) return;
    if(XP_CACHE.has(sig)){ T = XP_CACHE.get(sig); drawThread(); ctl.hidden = false; return; }

  };

  stop.onclick = () => ac && ac.abort();
  mountReport('explain:'+key, $('.xslot', wrap), () => T ? `What I was looking at:\n${T.msgs[0].content.split('"""')[1]||''}\n\nClaude's explanation:\n${T.msgs.slice(1).map(m=>(m.role==='user'?'Me: ':'Claude: ')+m.content).join('\n\n')}` : '');
  return wrap;
}

      const clean = { points: w.checklist.map((_,i)=>({ met: !!(r.points[i]&&r.points[i].met), note: String((r.points[i]&&r.points[i].note)||'').slice(0,300) })), strength:String(r.strength||'').slice(0,400), fix:String(r.fix||'').slice(0,500), error:String(r.error||'').slice(0,300) };
